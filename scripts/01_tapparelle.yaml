    - repeat:
        for_each:
          - cover.tapparella_sala
          - cover.tapparella_cucina
          - cover.tapparella_camera
          - cover.tapparella_cameretta
          - cover.tapparella_bagno
          - cover.tapparella_bagnetto
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ not (repeat.item == 'cover.tapparella_cameretta' and is_state('input_boolean.modalita_ospiti_cameretta', 'on')) }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ repeat.item }}"
