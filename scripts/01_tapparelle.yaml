# ==============================================================================
# 01 — TAPPARELLE, LUCI GLOBALI & SCENARI STAGIONALI / METEO
# ==============================================================================

spegni_tutte_le_luci:
  alias: "Spegni Tutte le Luci"
  icon: "mdi:lightbulb-off"
  mode: restart
  sequence:
    - variables:
        escludi_cameretta: "{{ is_state('input_boolean.modalita_ospiti_cameretta', 'on') }}"
        luci_candidati: >-
          {% set base = [
            'light.luce_sala_2',
            'light.luce_ambiente_sala',
            'light.luce_mensole_camino',
            'light.luce_mobiletto_camino',
            'light.luce_cucina',
            'light.luce_applique',
            'light.faretti_cucina',
            'light.luce_camera',
            'light.luce_comodino_1_camera',
            'light.luce_comodino_2_camera',
            'light.luce_specchio_camera',
            'light.luce_bagno',
            'light.luce_specchio_bagno',
            'light.luce_bagnetto',
            'light.luce_specchio_bagnetto',
            'light.luce_corridoio',
            'light.luce_terrazzo',
            'light.luce_terrazzo_2',
            'light.luce_porta_terrazzo',
            'light.luce_balcone_sala',
            'light.luce_balcone_cucina',
            'light.luce_balcone_camera',
            'light.luce_locale_tecnico'
          ] %}
          {% if not escludi_cameretta %}
            {% set base = base + ['light.luce_cameretta', 'light.luce_balcone_cameretta'] %}
          {% endif %}
          {{ base }}
        luci_accese: >-
          {{ expand(luci_candidati) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
    - if:
        - condition: template
          value_template: "{{ luci_accese | length > 0 }}"
      then:
        - action: light.turn_off
          target:
            entity_id: "{{ luci_accese }}"
          continue_on_error: true

scenario_entra_casa:
  alias: "🏠 Scenario Entra in Casa (Tasto Entra)"
  icon: "mdi:home-import-outline"
  mode: restart
  sequence:
    - action: script.apri_tutte_le_tapparelle
      continue_on_error: true

scenario_esci_casa:
  alias: "🚪 Scenario Esci di Casa (Tasto Esci)"
  icon: "mdi:home-export-outline"
  mode: restart
  sequence:
    - variables:
        finestre_aperte_list: >-
          {{ (state_attr('binary_sensor.sicurezza_infissi_aperti', 'elenco_aperti') | default([], true))
             | reject('in', ['Porta Ingresso', 'Portoncino', 'Ingresso Portoncino', 'Porta Giorno/Notte', 'Porta Camera']) | list }}
        tutte_finestre_aperte: >-
          {{ (states('sensor.numero_finestre_aperte') | int(0) >= 6) or
             ((finestre_aperte_list | select('in', ['Finestra Sala', 'Finestra Cucina', 'Finestra Camera', 'Finestra Cameretta', 'Finestra Bagno', 'Finestra Bagnetto']) | list | length) >= 6) }}
        finestre_aperte_str: >-
          {% if tutte_finestre_aperte %}
            tutte le finestre
          {% else %}
            {{ finestre_aperte_list | join(', ') }}
          {% endif %}
        piove: >-
          {{ states('weather.casa') in ['rainy', 'pouring', 'lightning', 'lightning-rainy'] or
             states('weather.meteoam_home') in ['rainy', 'pouring', 'lightning', 'lightning-rainy'] }}
        messaggio_uscita_veloce: >-
          {% if tutte_finestre_aperte %}
            Attenzione prima di uscire: tutte le finestre sono ancora aperte! Chiudo tapparelle e luci, a dopo!
          {% elif finestre_aperte_list | length > 1 %}
            Attenzione prima di uscire: {{ finestre_aperte_str }} ancora aperte! Chiudo tapparelle e luci, a dopo!
          {% elif finestre_aperte_list | length == 1 %}
            Attenzione prima di uscire: {{ finestre_aperte_str }} ancora aperta! Chiudo tapparelle e luci, a dopo!
          {% elif piove %}
            Tapparelle in chiusura e luci spente. Occhio che piove, prendete l'ombrello! A dopo!
          {% else %}
            Tapparelle in chiusura e luci spente. Buona uscita ragazzi, a dopo!
          {% endif %}
    - parallel:
        - sequence:
            - action: media_player.volume_mute
              target:
                entity_id: media_player.nest_hub_sala
              data:
                is_volume_muted: false
              continue_on_error: true
            - action: media_player.volume_set
              target:
                entity_id: media_player.nest_hub_sala
              data:
                volume_level: 0.80
              continue_on_error: true
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
                  sequence:
                    - action: tts.speak
                      target:
                        entity_id: tts.home_assistant_cloud
                      data:
                        media_player_entity_id: media_player.nest_hub_sala
                        message: "{{ messaggio_uscita_veloce }}"
                        language: "it-IT"
                        options:
                          voice: "it-IT-Wavenet-A"
                      continue_on_error: true
              default:
                - action: tts.speak
                  target:
                    entity_id: tts.google_translate_it_lt
                  data:
                    media_player_entity_id: media_player.nest_hub_sala
                    message: "{{ messaggio_uscita_veloce }}"
                    language: "it"
                    options:
                      tld: "it"
                  continue_on_error: true
        - sequence:
            - action: script.spegni_tutte_le_luci
              continue_on_error: true
        - sequence:
            - action: script.chiusura_standard_tapparelle
              continue_on_error: true

stop_tutte_le_tapparelle:
  alias: "Stop Tutte le Tapparelle"
  icon: "mdi:stop-circle"
  mode: restart
  sequence:
    - action: cover.stop_cover
      target:
        entity_id:
          - cover.tapparella_sala
          - cover.tapparella_cucina
          - cover.tapparella_camera
          - cover.tapparella_cameretta
          - cover.tapparella_bagno
          - cover.tapparella_bagnetto

applica_percentuale_tapparelle:
  alias: "Applica Percentuale a Tutte le Tapparelle"
  icon: "mdi:window-shutter-cog"
  mode: restart
  sequence:
    - repeat:
        for_each:
          - entity_id: cover.tapparella_sala
            min_pos: 8
          - entity_id: cover.tapparella_camera
            min_pos: 6
          - entity_id: cover.tapparella_cameretta
            min_pos: 7
          - entity_id: cover.tapparella_cucina
            min_pos: 7
          - entity_id: cover.tapparella_bagno
            min_pos: 6
          - entity_id: cover.tapparella_bagnetto
            min_pos: 6
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ not (repeat.item.entity_id == 'cover.tapparella_cameretta' and is_state('input_boolean.modalita_ospiti_cameretta', 'on')) }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ repeat.item.entity_id }}"
                data:
                  position: >-
                    {% set target = states('input_number.target_percentuale_tapparelle') | int(50) %}
                    {{ [repeat.item.min_pos, target] | max }}
                continue_on_error: true
              - delay:
                  milliseconds: 250

chiusura_totale_tapparelle:
  alias: "Chiudi Tutte le Tapparelle (Fessure Aperte)"
  icon: "mdi:window-shutter"
  mode: restart
  sequence:
    - repeat:
        for_each:
          - entity_id: cover.tapparella_sala
            pos: 8
          - entity_id: cover.tapparella_camera
            pos: 6
          - entity_id: cover.tapparella_cameretta
            pos: 7
          - entity_id: cover.tapparella_cucina
            pos: 7
          - entity_id: cover.tapparella_bagno
            pos: 6
          - entity_id: cover.tapparella_bagnetto
            pos: 6
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ not (repeat.item.entity_id == 'cover.tapparella_cameretta' and is_state('input_boolean.modalita_ospiti_cameretta', 'on')) and
                     (is_state(repeat.item.entity_id, 'closed') or
                      (state_attr(repeat.item.entity_id, 'current_position') | int(100)) > (repeat.item.pos + 2) or
                      (state_attr(repeat.item.entity_id, 'current_position') | int(100)) < (repeat.item.pos - 1)) }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ repeat.item.entity_id }}"
                data:
                  position: "{{ repeat.item.pos }}"
                continue_on_error: true
              - delay:
                   milliseconds: 350

