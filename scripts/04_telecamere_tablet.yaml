          - delay:
              milliseconds: 350
    - delay:
        seconds: 1

    - action: ai_task.generate_data
      data:
        entity_id: ai_task.google_ai_task_3
        task_name: "Ricerca Auto PTZ - Fase 3 Sinistra"
        instructions: >-
          Sei l'assistente visivo intelligente di casa.
          La telecamera Terrazzo 3 è stata ruotata verso SINISTRA per cercare: {{ veicolo_cercato | default('i veicoli residenti dello stabile (Auto Utente 1 (SUV) di Utente 1 nell uliveto, Jeep di zia, Auto Ospite 1 di Familiare 4, Auto Utente 2 di Utente 2, Crossover Ospite di zia, Camper di zia)') }}.
          Ospite attualmente in attesa in domotica: {{ states('input_text.ospite_in_attesa') }}.

          MEMORIA VISIVA VEICOLI E REGOLA ANTI-FALSI POSITIVI:
          - Residenti abituali: "Auto Utente 1 (SUV) di Utente 1" (nell'uliveto privato oltre il cancello su Via Secondaria), "Jeep di zia" (grigia 3 porte con ruota posteriore su Via Secondaria), "Auto Ospite 1 di Familiare 4" (station wagon scura su Via Secondaria), "Auto Utente 2 di Utente 2" (Auto Utente 2 (Utilitaria) su Via Secondaria), "Camper di zia" e "Crossover Ospite di zia" (nel parcheggio sottostante con cancello verso Via Principale).
          - Ospiti non residenti (Auto Familiare 1 di Mamma, Auto Familiare 2 / Auto Familiare 3 di Coppia Familiari 1, Auto Familiare 4 di Familiare 6/Familiare 7, Auto Familiare 5 / Auto Familiare 6 di Coppia Familiari 2, Auto Familiare 7 di Coppia Familiari 3, Auto Ospite di Familiare 13, SUV Amici / Berlina Amici di Coppia Amici 1, Berlina Amici 2 / Utilitaria Amici di Coppia Amici 2): poiché Via Secondaria e Via Principale sono strade pubbliche, non dare mai per certa al 100% un'auto comune vista in strada, ma indicala solo come compatibile per modello/colore specificando che su strada pubblica potrebbe essere di un passante/vicino.

          REGOLE DI RISPOSTA:
          - DIVIETO ASSOLUTO DI COGNOMI: Non pronunciare MAI alcun cognome (non dire MAI "Famiglia" né "Eco Home").
          - Se vedi chiaramente il veicolo cercato, rispondi iniziando con "TROVATA:" e descrivi cosa vedi.
          - Se il veicolo cercato NON è presente, rispondi con "NON_PRESENTE:".
        attachments:
          - media_content_id: "media-source://camera/camera.terrazzo_3"
            media_content_type: "image/jpeg"
      response_variable: r3

    - if:
        - condition: template
          value_template: "{{ 'TROVAT' in (r3.data | upper) if (r3 is defined and r3 is mapping and 'data' in r3) else false }}"
      then:
        - variables:
            esito_trovata_sinistra:
              descrizione: >-
                Ho trovato il veicolo orientando la telecamera a sinistra: {{ r3.data | replace('TROVATA:', '') | replace('**TROVATA:**', '') | replace('TROVATA', '') | replace('Eco Home', 'casa') | replace('Eco Home', 'casa') | replace('Famiglia', '') | replace('Famiglia', '') | trim }}
              esito: "trovata"
              posizione: "sinistra"
        - stop: "Auto individuata verso sinistra"
          response_variable: esito_trovata_sinistra

    # -------------------------------------------------------------
    # FASE 4: Ripristino posizione centrale se non trovata
    # -------------------------------------------------------------
    - repeat:
        count: 3
        sequence:
          - action: button.press
            target:
              entity_id: button.terrazzo_3_ptz_destra
          - delay:
              milliseconds: 350
    - delay:
        milliseconds: 500
    - variables:
        esito_non_trovata:
          descrizione: >-
            Ho scandagliato la strada, l'uliveto e il parcheggio sottostanti muovendo autonomamente la telecamera tra centro, destra e sinistra, ma al momento {{ veicolo_cercato | default("il veicolo") }} non è visibile. Ho quindi riposizionato la telecamera al centro.
          esito: "non_trovata"
          posizione: "riportata_al_centro"
    - stop: "Ricerca autonoma conclusa senza riscontro"
      response_variable: esito_non_trovata

verifica_fiamma_camino_ai:
  alias: "🔥 Camino: Verifica Visiva Fiamma e Stato con AI (Zoom)"
  description: "Acquisisce uno snapshot ad alta definizione da camera.sala con zoom diretto sul Termocamino a pellet Klover, analizza la fiamma con Gemini Vision e aggiorna la scheda del popup #camino più notifica su smartphone."
  icon: "mdi:fireplace"
  mode: restart
  sequence:
    - action: gemini_vision.analizza_telecamera
      data:
        camera: "camino"
        question: >-
          Osserva attentamente questo zoom ravvicinato sul Termocamino a pellet Klover in Sala: la fiamma dentro il vetro del braciere è visibile e accesa (viva, debole o assente)? Il vetro è pulito? C'è qualcuno o una delle gatte (Gatto 1 rossa o Gatto 2 nera) proprio davanti al camino? Rispondi in 2 frasi chiare e concise.
      response_variable: ai_camino_res
      continue_on_error: true
    - variables:
        stato_klover: "{{ states('sensor.camino_status') }}"
        temp_fiamma: "{{ states('sensor.camino_flame_temperature') | float(0) | round(0) | int }}"
        temp_acqua: "{{ states('sensor.camino_water_temperature') | float(0) | round(0) | int }}"
        pellet_oggi: "{{ states('sensor.camino_pellet_consumato_oggi') }}"
        sacchi_pellet: "{{ states('input_number.sacchi_pellet_rimanenti') | int(0) }}"
        descrizione_visiva: >-
          {% if ai_camino_res is defined and ai_camino_res is mapping and 'descrizione' in ai_camino_res %}
            {{ ai_camino_res.descrizione }}
          {% elif ai_camino_res is defined and ai_camino_res is mapping and 'response' in ai_camino_res %}
            {{ ai_camino_res.response }}
          {% elif states('sensor.gemini_vision_ultimo_responso') not in ['unknown', 'unavailable', ''] %}
            {{ state_attr('sensor.gemini_vision_ultimo_responso', 'descrizione') | default(states('sensor.gemini_vision_ultimo_responso'), true) }}
          {% else %}
            Snapshot acquisito da Telecamera Sala.
          {% endif %}
    - action: persistent_notification.create
      data:
        notification_id: "verifica_camino_ai"
        title: "🔥 Verifica Visiva Termocamino Klover ({{ now().strftime('%H:%M') }})"
        message: >-
          **👁️ AI Sala:** {{ descrizione_visiva }}

          **📊 Stato:** `{{ stato_klover }}` · **Fiamma:** `{{ temp_fiamma }}°C` · **Acqua Termosifoni:** `{{ temp_acqua }}°C` · **Pellet oggi:** `{{ pellet_oggi }} kg` (Scorta: `{{ sacchi_pellet }}` sacchi)

          ![Telecamera Sala](/local/cam_snapshots/camino_sala.jpg?t={{ now().timestamp() | int }})
      continue_on_error: true
    - action: script.notifica_smart
      data:
        titolo: "🔥 Verifica Visiva Termocamino Klover"
        messaggio: >-
          👁️ AI Sala: {{ descrizione_visiva }}
          📊 Stato: {{ stato_klover }} | Fiamma: {{ temp_fiamma }}°C | Acqua Termosifoni: {{ temp_acqua }}°C
          🪵 Pellet oggi: {{ pellet_oggi }} kg (Scorta: {{ sacchi_pellet }} sacchi)
        priorita: "critica"
        categoria: "clima"
        immagine: "/local/cam_snapshots/camino_sala.jpg?t={{ now().timestamp() | int }}"
        tag: "verifica_camino_ai"
      continue_on_error: true

riconosci_auto_ospiti_ai:
  alias: "🚗 Parcheggio: Riconosci Auto Familiari e Amici con AI"
  description: "Scatta uno snapshot da camera.terrazzo_3 e usa Gemini Vision per verificare i veicoli residenti (Auto Utente 1 nell'uliveto, Auto Utente 2, Jeep, Auto Ospite 1) ed eventuali auto parcheggiate compatibili con ospiti attesi, applicando il filtro anti-falsi positivi sulla strada pubblica."
  icon: "mdi:car-connected"
  mode: single
  sequence:
    - variables:
        ospite_atteso: "{{ states('input_text.ospite_in_attesa') }}"
        sospensione_ospiti: "{{ is_state('binary_sensor.sicurezza_sospensione_attiva', 'on') }}"
    - action: camera.snapshot
      target:
        entity_id: camera.terrazzo_3
      data:
        filename: "/config/www/cam_snapshots/parcheggio_ospiti.jpg"
      continue_on_error: true
    - action: gemini_vision.analizza_telecamera
      data:
        camera: "terrazzo_3"
        question: >-
          Analizza i veicoli fermi/parcheggiati distinguendo rigorosamente:
          1) VEICOLI RESIDENTI ABITUALI DELLO STABILE: Auto Utente 1 (SUV) di Utente 1 (nell'uliveto privato oltre il cancello in Via Secondaria), Auto Utente 2 (Utilitaria) di Utente 2, Jeep grigia 3 porte di Zia (Piano Superiore) (con ruota di scorta esterna) e VW Auto Ospite 1 SW scura di Familiare 4 nei posti fissi lungo Via Secondaria sotto casa (o Camper e Crossover Ospite di Zia (Piano Superiore) se inquadrato il parcheggio con cancello sul lato di Via Principale).
          2) STRADA PUBBLICA E FILTRO ANTI-FALSI POSITIVI (Ospite attualmente in attesa: {{ ospite_atteso }}; Sospensione allarme ospiti: {{ 'attiva' if sospensione_ospiti else 'non attiva' }}): poiché Via Secondaria (inquadrata da terrazzo_3) e Via Principale (sul lato sinistro di balcone_camera) sono strade pubbliche dove passano e parcheggiano anche estranei o vicini, ignora qualsiasi auto in transito. Se vedi altre auto ferme parcheggiate lungo la strada che coincidono per modello/colore con quelle di familiari/amici non residenti (Auto Familiare 1 di Mamma, Auto Familiare 2 o Auto Familiare 3 di Coppia Familiari 1, Auto Ospite di Familiare 13, Auto Familiare 4 di Familiare 6/Familiare 7, Auto Familiare 5 o Auto Familiare 6 di Coppia Familiari 2, Auto Familiare 7 di Coppia Familiari 3, SUV Amici o Berlina Amici di Coppia Amici 1, Berlina Amici 2 o Utilitaria Amici di Coppia Amici 2), NON attribuirle MAI con certezza assoluta, ma indicale solo come "compatibili per modello/colore con..." specificando sempre che trattandosi di strada pubblica senza lettura targa potrebbe trattarsi dell'auto di un passante o vicino.
      response_variable: ai_auto_res
      continue_on_error: true
    - variables:
        descrizione_auto: >-
          {% if ai_auto_res is defined and ai_auto_res is mapping and 'descrizione' in ai_auto_res %}
            {{ ai_auto_res.descrizione }}
          {% elif ai_auto_res is defined and ai_auto_res is mapping and 'response' in ai_auto_res %}
            {{ ai_auto_res.response }}
          {% else %}
            Analisi completata (Stato attuale: {{ states('sensor.stato_parcheggio_auto') }}).
          {% endif %}
    - action: script.notifica_smart
      data:
        titolo: "🚗 Verifica Parcheggio & Auto (Filtro Strada Pubblica)"
        messaggio: "{{ descrizione_auto }}"
        priorita: "normale"
        categoria: "sicurezza"
        immagine: "/local/cam_snapshots/parcheggio_ospiti.jpg?t={{ now().timestamp() | int }}"
        tag: "riconosci_auto_ospiti"
      continue_on_error: true

