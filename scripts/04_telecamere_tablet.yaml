          - media_content_id: "media-source://camera/camera.terrazzo_3"
            media_content_type: "image/jpeg"
      response_variable: r2

    - if:
        - condition: template
          value_template: "{{ 'TROVAT' in (r2.data | upper) if (r2 is defined and r2 is mapping and 'data' in r2) else false }}"
      then:
        - variables:
            esito_trovata_destra:
              descrizione: >-
                Ho trovato il veicolo orientando la telecamera a destra: {{ r2.data | replace('TROVATA:', '') | replace('**TROVATA:**', '') | replace('TROVATA', '') | replace('Eco Home', 'casa') | replace('Eco Home', 'casa') | replace('Famiglia', '') | replace('Famiglia', '') | trim }}
              esito: "trovata"
              posizione: "destra"
