acquario_buio_24h:
  alias: "Acquario: Buio 24h"
  icon: "mdi:weather-night"
  mode: restart
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.acquario_buio_24h
    - action: light.turn_off
      target:
        entity_id: light.fzone_acquario
    - delay:
        hours: 24
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.acquario_buio_24h
    - action: automation.trigger
      target:
        entity_id: automation.acquario_luce_naturale_e_fotoperiodo_anti_alghe
      data:
        skip_condition: true

acquario_dai_cibo_pesci:
  alias: "Acquario: Dai Cibo Pesci"
  icon: "mdi:shaker"
  mode: restart
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.presa_ossigenatore_acquario
      continue_on_error: true
    - action: light.turn_on
      target:
        entity_id: light.fzone_acquario
      data:
        brightness_pct: 70
        rgbw_color: [255, 240, 230, 255]
        transition: 3
      continue_on_error: true
    - action: button.press
      target:
        entity_id: button.mangiatoia_acquario_eroga_cibo
    - delay: '00:10:00'
    - action: switch.turn_on
      target:
        entity_id: switch.presa_ossigenatore_acquario
      continue_on_error: true
    - if:
        - condition: state
          entity_id: input_boolean.acquario_buio_24h
          state: 'off'
      then:
        - action: automation.trigger
          target:
            entity_id: automation.acquario_luce_naturale_e_fotoperiodo_anti_alghe
          data:
            skip_condition: true

acquario_ammira_ospiti_10min:
  alias: "Acquario: Ammira per Ospiti (10 min)"
  icon: "mdi:sparkles"
  description: "Accende la plafoniera dell'acquario al 75% con spettro vivo per 10 minuti per far ammirare l'acquario agli ospiti, dopodiché ripristina automaticamente il fotoperiodo biologico regolare"
  mode: restart
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.acquario_modalita_ospiti
          state: 'on'
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.acquario_modalita_ospiti
        - if:
            - condition: state
              entity_id: input_boolean.acquario_buio_24h
              state: 'off'
          then:
            - action: automation.trigger
              target:
                entity_id: automation.acquario_luce_naturale_e_fotoperiodo_anti_alghe
              data:
                skip_condition: true
          else:
            - action: light.turn_off
              target:
                entity_id: light.fzone_acquario
              data:
                transition: 3
        - stop: "Modalità ospiti terminata anticipatamente dall'utente"
      else:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.acquario_modalita_ospiti
        - action: light.turn_on
          target:
            entity_id: light.fzone_acquario
          data:
            brightness_pct: 75
            rgbw_color: [255, 235, 220, 255]
            transition: 3
          continue_on_error: true
        - delay: '00:10:00'
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.acquario_modalita_ospiti
        - if:
            - condition: state
              entity_id: input_boolean.acquario_buio_24h
              state: 'off'
          then:
            - action: automation.trigger
              target:
                entity_id: automation.acquario_luce_naturale_e_fotoperiodo_anti_alghe
              data:
                skip_condition: true
          else:
            - action: light.turn_off
              target:
                entity_id: light.fzone_acquario
              data:
                transition: 3

gatte_dai_cibo:
  alias: "Gatte: Dai Cibo (1 dose Serbatoio 1 + 1 dose Serbatoio 2)"
  icon: "mdi:bowl-mix"
  mode: restart
  sequence:
    - action: text.set_value
      target:
        entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_1
      data:
        value: "1"
      continue_on_error: true
    - delay: "00:00:10"
    - action: text.set_value
      target:
        entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_2
      data:
        value: "1"
      continue_on_error: true
    - action: button.press
      target:
        entity_id: button.dispenser_crocchette_play_sound
      continue_on_error: true

lettiera_pulisci:
  alias: "Lettiera: Pulisci"
  icon: "mdi:sparkles"
  mode: restart
  sequence:
    - action: button.press
      target:
        entity_id: button.petkit_puramax_2_pulisci
      continue_on_error: true

dobby_avvia_modalita:
  alias: "Dobby: Avvia Modalità"
  icon: "mdi:robot-vacuum"
  mode: restart
  fields:
    mode:
      description: "Modalità di avvio ('genius' per CleanGenius Routine, 'deep' per CleanGenius Profondo, 'standard' per Pulizia Standard)"
      example: "genius"
      selector:
        select:
          options:
            - label: "CleanGenius Routine (Aspira & Lava)"
              value: "genius"
            - label: "CleanGenius Profondo"
              value: "deep"
            - label: "Solo Aspirazione (Standard)"
              value: "sweep"
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ mode == 'genius' }}"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.dobby_cleangenius
              data:
                option: routine_cleaning
              continue_on_error: true
            - action: vacuum.start
              target:
                entity_id: vacuum.dobby
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: "{{ mode == 'deep' }}"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.dobby_cleangenius
              data:
                option: deep_cleaning
              continue_on_error: true
            - action: vacuum.start
              target:
                entity_id: vacuum.dobby
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: "{{ mode == 'sweep' }}"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.dobby_cleangenius
              data:
                option: "off"
              continue_on_error: true
            - action: vacuum.set_fan_speed
              target:
                entity_id: vacuum.dobby
              data:
                fan_speed: strong
              continue_on_error: true
            - action: vacuum.start
              target:
                entity_id: vacuum.dobby
              continue_on_error: true
      default:
        - action: vacuum.start
          target:
            entity_id: vacuum.dobby
          continue_on_error: true

dobby_pulizia_base:
  alias: "Dobby: Pulizia Stazione Base"
  description: "Avvia la procedura automatica di pulizia della stazione di ricarica e lavaggio moci di Dobby."
  icon: "mdi:car-wash"
  mode: restart
  sequence:
    - action: dreame_vacuum.vacuum_call_action
      target:
        entity_id: vacuum.dobby
      data:
        key: "start_station_cleaning"
    - action: script.notifica_smart
      data:
        titolo: "🧼 Dobby: Pulizia Base Avviata"
        messaggio: "Dobby è uscito dalla base per consentire la pulizia della stazione di lavaggio. Seguire la procedura della stazione."
        priorita: "normale"
        categoria: "elettrodomestici"
        tag: "dobby_pulizia_base"

stato_gatte_vocale:
  alias: "🐱 Gatte Vocale: Dove sono Gatto 1 e Gatto 2 e Stato Petkit"
  description: "Legge sui Nest Hub se Gatto 1 e Gatto 2 sono in casa o fuori, le visite a dispenser/fontanella e lo stato della lettiera PuraMax 2."
  icon: "mdi:cat"
  mode: single
  sequence:
    - variables:
        piccola_in: "{{ is_state('binary_sensor.gatto_1', 'on') }}"
        luna_in: "{{ is_state('binary_sensor.gatto_2', 'on') }}"
        pasti_oggi: "{{ states('sensor.dispenser_crocchette_volte_mangiato') | int(0) }}"
        bevute_oggi: "{{ states('sensor.fontanella_volte_bevuto') | int(0) }}"
        usi_lettiera: "{{ states('sensor.petkit_puramax_2_volte_usato') | int(0) }}"
        sabbia_pct: "{{ states('sensor.petkit_puramax_2_livello_lettiera') | int(0) }}"
        cestino_pieno: "{{ is_state('binary_sensor.petkit_puramax_2_cestino_pieno', 'on') }}"
        messaggio_gatte: >-
          {% if piccola_in and luna_in %}
            Sia Gatto 1 che Gatto 2 sono in casa al sicuro.
          {% elif piccola_in and not luna_in %}
            Gatto 1 è in casa, mentre Gatto 2 in questo momento è fuori.
          {% elif not piccola_in and luna_in %}
            Gatto 2 è in casa, mentre Gatto 1 in questo momento è fuori.
          {% else %}
            In questo momento sia Gatto 1 che Gatto 2 sono fuori casa.
          {% endif %}
          Oggi hanno mangiato {{ pasti_oggi }} volte dal dispenser, bevuto {{ bevute_oggi }} volte dalla fontanella e usato la lettiera {{ usi_lettiera }} volte.
          {% if cestino_pieno %}
            Attenzione: il cestino della lettiera è pieno ed è da svuotare.
          {% else %}
            La sabbia nella lettiera è al {{ sabbia_pct }} per cento.
          {% endif %}
    - action: script.audio_annuncio_prepara
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_sala
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
        message: "{{ messaggio_gatte }}"
        language: "it"
        options:
          tld: "it"
      continue_on_error: true
    - delay:
        seconds: 12
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

