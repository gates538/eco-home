# ==============================================================================
# GESTIONE ANIMALI: GATTE (LUNA & PICCOLA) E ACQUARIO — CASA MANCINI
# ==============================================================================
# Comandi presenza gatte in/out, erogazione pasti PetKit e gestione manuale luci/pasti/cambio acqua acquario.
# Script inclusi in questo modulo: 14
# ==============================================================================

imposta_luna_in_casa:
  alias: Imposta Luna In Casa
  icon: mdi:home-heart
  sequence:
    - action: surepetcare.set_pet_location
      data:
        pet_name: Luna
        location: Inside
