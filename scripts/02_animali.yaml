eroga_crocchette_manuale:
  alias: Eroga Crocchette Manuale
  icon: mdi:bowl-mix
  sequence:
    - if:
        - condition: template
          value_template: '{{ states(''input_number.dispenser_manuale_tramoggia_1'') | int(0) > 0 }}'
      then:
        - action: text.set_value
          target:
            entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_1
          data:
            value: '{{ states(''input_number.dispenser_manuale_tramoggia_1'') | int(1) | string }}'
    - if:
        - condition: template
          value_template: '{{ states(''input_number.dispenser_manuale_tramoggia_2'') | int(0) > 0 }}'
      then:
        - action: text.set_value
          target:
            entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_2
          data:
            value: '{{ states(''input_number.dispenser_manuale_tramoggia_2'') | int(1) | string }}'
    - action: button.press
      target:
        entity_id: button.dispenser_crocchette_play_sound
      continue_on_error: true
