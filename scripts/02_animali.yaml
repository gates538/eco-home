# ==============================================================================
# 02 — ANIMALI DOMESTICI (ACQUARIO, GATTI PETKIT & ROBOT ASPIRAPOLVERE)
# ==============================================================================

notifica_acquario:
  alias: "Notifica Acquario Eco Home"
  icon: "mdi:fish"
  mode: parallel
  max: 10
  fields:
    titolo:
      description: "Titolo della notifica"
      required: true
    messaggio:
      description: "Messaggio della notifica"
      required: true
    priorita:
      description: "Priorità (alta, normale)"
      default: normale
  sequence:
    - action: notify.mobile_app_smartphone_utente_1
      data:
        title: "{{ titolo }}"
        message: "{{ messaggio }}"
        data:
          channel: "Acquario"
          priority: "{% if priorita == 'alta' %}high{% else %}normal{% endif %}"
          importance: "{% if priorita == 'alta' %}high{% else %}normal{% endif %}"
          tag: "acquario_alert"
      continue_on_error: true
    - action: notify.mobile_app_smartphone_utente_2
      data:
        title: "{{ titolo }}"
        message: "{{ messaggio }}"
        data:
          channel: "Acquario"
          priority: "{% if priorita == 'alta' %}high{% else %}normal{% endif %}"
          importance: "{% if priorita == 'alta' %}high{% else %}normal{% endif %}"
          tag: "acquario_alert"
      continue_on_error: true
    - action: notify.persistent_notification
      data:
        title: "{{ titolo }}"
        message: "{{ messaggio }}"
      continue_on_error: true

