camino_notifica_pranzo_utente_1:
  alias: "🔥 Camino: Chiedi a Utente 1 se Accendere per Pranzo (Ore 12:50)"
  description: "Invia solo sul telefono di Utente 1 la notifica interattiva per chiedere se torna a pranzo e se vuole accendere subito il Termocamino Klover (20 min di avvio) oppure posticipare di 10/15/20 minuti."
  icon: "mdi:fireplace"
  mode: restart
  sequence:
    - action: script.notifica_smart
      data:
        titolo: "🔥 Pranzo a Casa: Accendiamo il Camino?"
        messaggio: >-
          Ste, sono le {{ now().strftime('%H:%M') }} e sei a lavoro. Torni a casa per pranzo?
          In Sala ci sono {{ states('sensor.temperatura_media_sala') }}°C (acqua camino {{ states('sensor.camino_water_temperature') }}°C) e il Termocamino impiega ~20 minuti per andare a regime.
        canale: "utente_1"
        priorita: "alta"
        categoria: "clima"
        tag: "camino_pranzo_utente_1"
        azioni:
          - action: "CAMINO_PRANZO_ACCENDI_ORA"
            title: "🔥 Accendi Subito"
          - action: "CAMINO_PRANZO_SCEGLI_POSTICIPO"
            title: "⏱️ Posticipa (10/15/20m)"
          - action: "CAMINO_PRANZO_IGNORA"
            title: "❌ Oggi No"

camino_pranzo_gestisci_posticipo:
  alias: "⏱️ Camino Pranzo: Gestione Posticipo 10/15/20 Minuti (Utente 1)"
  description: "Gestisce il conto alla rovescia di 10, 15 o 20 minuti scelto da Utente 1 dalla notifica delle 12:50, supportando sia il promemoria posticipato sia l'auto-accensione programmata allo scadere."
  icon: "mdi:timer-sand"
  mode: restart
  fields:
    minuti:
      description: "Minuti di posticipo (10, 15 o 20)"
      default: 15
      selector:
        number:
          min: 5
          max: 60
    auto_accendi:
      description: "Se true, accende automaticamente il camino allo scadere invece di richiedere conferma"
      default: false
      selector:
        boolean:
  sequence:
    - variables:
        min_scelti: "{{ minuti | default(15) | int(15) }}"
        accensione_auto: "{{ auto_accendi | default(false) }}"
        ora_target: "{{ (now() + timedelta(minutes=min_scelti)).strftime('%H:%M') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ accensione_auto }}"
          sequence:
            - action: script.notifica_smart
              data:
                titolo: "🤖 Accensione Camino Programmata ({{ ora_target }})"
                messaggio: >-
                  Perfetto Ste! Il Termocamino Klover si accenderà automaticamente tra {{ min_scelti }} minuti (alle {{ ora_target }}), così sarà a regime per le {{ (now() + timedelta(minutes=min_scelti + 20)).strftime('%H:%M') }} circa.
                canale: "utente_1"
                priorita: "normale"
                categoria: "clima"
                tag: "camino_pranzo_utente_1"
                azioni:
                  - action: "CAMINO_PRANZO_ACCENDI_ORA"
                    title: "🔥 Accendi Subito Ora"
                  - action: "CAMINO_PRANZO_SCEGLI_POSTICIPO"
                    title: "⏱️ Cambia Orario"
                  - action: "CAMINO_PRANZO_IGNORA"
                    title: "❌ Annulla"
            - delay:
                minutes: "{{ min_scelti }}"
            - condition: template
              value_template: "{{ is_state('binary_sensor.camino_in_funzione', 'off') and not is_state('climate.camino_water', 'heat') }}"
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.camino_water
              data:
                hvac_mode: "heat"
            - action: script.notifica_smart
              data:
                titolo: "🔥 Camino Avviato (Posticipo {{ min_scelti }}m completato)"
                messaggio: >-
                  Sono passati i {{ min_scelti }} minuti: ho acceso ora il Termocamino Klover per il pranzo (sarà caldo intorno alle {{ (now() + timedelta(minutes=20)).strftime('%H:%M') }}).
                canale: "utente_1"
                priorita: "alta"
                categoria: "clima"
                tag: "camino_pranzo_utente_1"
                azioni:
                  - action: "SPEGNI_CAMINO"
                    title: "🛑 Spegni Camino"
                  - action: "URI"
                    title: "🔥 Apri Camino"
                    uri: "/eco-home/panoramica#camino"
      default:
        - action: script.notifica_smart
          data:
            titolo: "⏳ Camino Posticipato di {{ min_scelti }} Minuti (fino alle {{ ora_target }})"
            messaggio: >-
              Ok Ste, ti ricorderò alle {{ ora_target }} se vuoi accendere il camino per pranzo. Se invece vuoi che si accenda da solo tra {{ min_scelti }} minuti, tocca "Auto-Accendi tra {{ min_scelti }}m".
            canale: "utente_1"
            priorita: "normale"
            categoria: "clima"
            tag: "camino_pranzo_utente_1"
            azioni:
              - action: "CAMINO_PRANZO_AUTO_{{ min_scelti }}"
                title: "🤖 Auto-Accendi tra {{ min_scelti }}m"
              - action: "CAMINO_PRANZO_ACCENDI_ORA"
                title: "🔥 Accendi Subito"
              - action: "CAMINO_PRANZO_IGNORA"
                title: "❌ Annulla"
        - delay:
            minutes: "{{ min_scelti }}"
        - condition: template
          value_template: "{{ is_state('binary_sensor.camino_in_funzione', 'off') and not is_state('climate.camino_water', 'heat') }}"
        - action: script.notifica_smart
          data:
            titolo: "⏰ Promemoria Camino Pranzo (+{{ min_scelti }} min)"
            messaggio: >-
              Ste, sono passati i {{ min_scelti }} minuti (in Sala ci sono {{ states('sensor.temperatura_media_sala') }}°C). Vuoi accendere adesso il Termocamino (~20 min per andare a regime) o posticipare ancora?
            canale: "utente_1"
            priorita: "alta"
            categoria: "clima"
            tag: "camino_pranzo_utente_1"
            azioni:
              - action: "CAMINO_PRANZO_ACCENDI_ORA"
                title: "🔥 Accendi Subito"
              - action: "CAMINO_PRANZO_SCEGLI_POSTICIPO"
                title: "⏱️ Posticipa (10/15/20m)"
              - action: "CAMINO_PRANZO_IGNORA"
                title: "❌ Oggi No"

stato_finestre_porte_aperte:
  alias: "🪟 Infissi Vocale: Controllo Finestre e Porte Aperte"
  description: "Legge sui Nest Hub (Sala, Camera, Cameretta) quali finestre e porte sono attualmente aperte in casa."
  icon: "mdi:window-open-variant"
  mode: single
  sequence:
    - variables:
        finestre_aperte: >-
          {% set ns = namespace(items=[]) %}
          {% set map_f = [
            ('binary_sensor.finestra_sala_contact', 'Finestra della Sala'),
            ('binary_sensor.finestra_cucina_contact', 'Finestra della Cucina'),
            ('binary_sensor.finestra_camera_contact', 'Finestra della Camera'),
            ('binary_sensor.finestra_cameretta_contact', 'Finestra della Cameretta'),
            ('binary_sensor.finestra_bagno_contact', 'Finestra del Bagno'),
            ('binary_sensor.finestra_bagnetto_contact', 'Finestra del Bagnetto')
          ] %}
          {% for eid, label in map_f %}
            {% if is_state(eid, 'on') %}
              {% set ns.items = ns.items + [label] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
        porte_esterne_aperte: >-
          {% set ns = namespace(items=[]) %}
          {% set map_pe = [
            ('binary_sensor.porta_terrazzo_contact', 'Porta della Terrazza'),
            ('binary_sensor.porta_ingresso_contact', 'Portone d''ingresso')
          ] %}
          {% for eid, label in map_pe %}
            {% if is_state(eid, 'on') %}
              {% set ns.items = ns.items + [label] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
        porte_interne_aperte: >-
          {% set ns = namespace(items=[]) %}
          {% set map_pi = [
            ('binary_sensor.portagiorno_notte_contact', 'Porta Giorno Notte'),
            ('binary_sensor.portacamera_contact', 'Porta della Camera')
          ] %}
          {% for eid, label in map_pi %}
            {% if is_state(eid, 'on') %}
              {% set ns.items = ns.items + [label] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
        messaggio_infissi: >-
          {% set nf = finestre_aperte | count %}
          {% set npe = porte_esterne_aperte | count %}
          {% set npi = porte_interne_aperte | count %}
          {% if nf == 0 and npe == 0 %}
            Tutte le finestre e le porte verso l'esterno sono ben chiuse.
            {% if npi == 1 %}
              In casa è aperta solo la {{ porte_interne_aperte[0] }}.
            {% elif npi > 1 %}
              In casa sono aperte le porte interne: {{ porte_interne_aperte | join(' e ') }}.
            {% endif %}
          {% else %}
            {% if nf == 1 %}
              In questo momento c'è una sola finestra aperta: la {{ finestre_aperte[0] }}.
            {% elif nf > 1 %}
              In questo momento ci sono {{ nf }} finestre aperte: {{ finestre_aperte[:-1] | join(', ') }} e {{ finestre_aperte[-1] }}.
            {% else %}
              Tutte le 6 finestre sono chiuse.
            {% endif %}
            {% if npe == 1 %}
              Inoltre è aperta la {{ porte_esterne_aperte[0] }}.
            {% elif npe > 1 %}
              Inoltre sono aperte: {{ porte_esterne_aperte | join(' e ') }}.
            {% endif %}
          {% endif %}
    - action: script.audio_annuncio_prepara
      continue_on_error: true
