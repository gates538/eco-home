# ==============================================================================
# 03 — COMFORT, CLIMA, TERMOCAMINO, ACS, MODALITÀ OSPITI & INTERROGAZIONI VOCALI
# ==============================================================================

buongiorno_sospendi_per_giorni:
  alias: "Sospendi Buongiorno per N Giorni"
  icon: "mdi:calendar-clock"
  mode: single
  fields:
    giorni:
      description: "Numero di giorni di sospensione (default da helper)"
      example: 2
  sequence:
    - variables:
        giorni_tot: >-
          {% if giorni is defined and (giorni | int(0)) > 0 %}
            {{ giorni | int }}
          {% else %}
            {{ states('input_number.buongiorno_giorni_sospensione') | int(1) }}
          {% endif %}
        target_date_str: "{{ (now() + timedelta(days=giorni_tot)).strftime('%Y-%m-%d 23:59:59') }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.buongiorno_sospeso_fino_al
      data:
        datetime: "{{ target_date_str }}"
    - action: persistent_notification.create
      data:
        title: "🛌 Sveglia Buongiorno Sospesa"
        message: "L'automazione del buongiorno su Nest Hub Camera è sospesa per {{ giorni_tot }} giorni (fino al {{ target_date_str }})."
        notification_id: buongiorno_sospensione
      continue_on_error: true

buongiorno_ripristina_sveglia:
  alias: "Ripristina Sveglia Buongiorno"
  icon: "mdi:alarm-check"
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.buongiorno_attivo
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.buongiorno_modalita_ferie
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.buongiorno_sospeso_fino_al
      data:
        datetime: "1970-01-01 00:00:00"
    - action: persistent_notification.dismiss
      data:
        notification_id: buongiorno_sospensione
      continue_on_error: true

buongiorno_pausa_1_giorno:
  alias: "Sospendi Buongiorno per 1 Giorno"
  icon: "mdi:calendar-clock"
  mode: single
  sequence:
    - action: script.buongiorno_sospendi_per_giorni
      data:
        giorni: 1

buongiorno_pausa_2_giorni:
  alias: "Sospendi Buongiorno per 2 Giorni"
  icon: "mdi:calendar-clock"
  mode: single
  sequence:
    - action: script.buongiorno_sospendi_per_giorni
      data:
        giorni: 2

buongiorno_pausa_7_giorni:
  alias: "Sospendi Buongiorno per 7 Giorni"
  icon: "mdi:calendar-clock"
  mode: single
  sequence:
    - action: script.buongiorno_sospendi_per_giorni
      data:
        giorni: 7

buongiorno_annulla_pausa:
  alias: "Annulla Pausa Sveglia Buongiorno"
  icon: "mdi:alarm-check"
  mode: single
  sequence:
    - action: script.buongiorno_ripristina_sveglia

buonanotte_scenario_notte:
  alias: "🌙 Buonanotte (Annuncio Vocale & Scenario Notte)"
  icon: "mdi:bed-clock"
  mode: single
  sequence:
    # --------------------------------------------------------------------------
    # FASE 1: ATTIVAZIONE FISICA DELLO SCENARIO NOTTE
    # --------------------------------------------------------------------------
    # 1. CHIUSURA DI TUTTE LE TAPPARELLE APERTE CON FESSURE APERTE CALIBRATE
    - action: script.chiusura_standard_tapparelle
      continue_on_error: true
    # 2. SPEGNIMENTO OSSIGENATORE ACQUARIO
    - action: switch.turn_off
      target:
        entity_id: switch.presa_ossigenatore_acquario
      continue_on_error: true
    # 3. SPEGNIMENTO PROTETTO TV SALA E DISPOSITIVI MULTIMEDIALI
    - if:
        - condition: template
          value_template: >-
            {{ states('media_player.tv_sala_principale') in ['on', 'playing', 'paused'] or
               states('remote.tv_sala_ue85du7170uxzt') == 'on' }}
      then:
        - action: remote.send_command
          target:
            entity_id: remote.tv_sala_ue85du7170uxzt
          data:
            command: KEY_POWEROFF
          continue_on_error: true
        - action: media_player.turn_off
          target:
            entity_id: media_player.tv_sala_principale
          continue_on_error: true
    - if:
        - condition: state
          entity_id: media_player.sala_ultra_slim_soundbar
          state: 'on'
      then:
        - action: media_player.turn_off
          target:
            entity_id: media_player.sala_ultra_slim_soundbar
          continue_on_error: true
    - action: media_player.turn_off
      target:
        entity_id:
          - media_player.chromecast_camera
          - media_player.chromecast_camera_2
          - media_player.filodiffusione
      continue_on_error: true
    # 4. SPEGNIMENTO DI TUTTE LE LUCI RIMASTE ACCESE
    - action: script.spegni_tutte_le_luci
      continue_on_error: true
    # 5. SPEGNIMENTO CAMINO (SOLO SE ACCESO, EVITA CRASH SU STATO UNKNOWN)
    - if:
        - condition: state
          entity_id: climate.camino_water
          state: 'heat'
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.camino_water
          data:
            hvac_mode: 'off'
          continue_on_error: true
    # 6. ATTIVAZIONE ALLARME PERIMETRALE NOTTURNO
    - if:
        - condition: template
          value_template: >-
            {{ (now().hour >= 21 or now().hour < 7) and
               not is_state('alarm_control_panel.sicurezza_eco_home', 'armed_away') }}
      then:
        - action: script.sicurezza_attiva_notte
          continue_on_error: true
    # 7. NOTIFICA CONFERMA SCENARIO NOTTE
    - action: persistent_notification.create
      data:
        title: "🌙 Scenario Buonanotte Attivato"
        message: "Eco Home è in modalità notte: tapparelle a fessure aperte, luci, ossigenatore e TV spenti, allarme perimetrale inserito."
        notification_id: buonanotte_notifica
      continue_on_error: true

    # --------------------------------------------------------------------------
    # FASE 2: ANNUNCIO VOCALE INTELLIGENTE NEURALE AI SU NEST HUB CAMERA
    # --------------------------------------------------------------------------
    - if:
        - condition: template
          value_template: >-
            {{ is_state('input_boolean.annunci_vocali_buonanotte', 'on') or states('input_boolean.annunci_vocali_buonanotte') in ['unknown', 'unavailable', None] }}
      then:
        - action: weather.get_forecasts
          target:
            entity_id:
              - weather.meteoam_home
              - weather.casa
          data:
            type: daily
          response_variable: meteo_daily
          continue_on_error: true
        - action: weather.get_forecasts
          target:
            entity_id:
              - weather.meteoam_home
              - weather.casa
          data:
            type: hourly
          response_variable: meteo_hourly
          continue_on_error: true
        - variables:
            fc_daily: >-
              {{ meteo_daily['weather.casa'].forecast if meteo_daily is defined and 'weather.casa' in meteo_daily and meteo_daily['weather.casa'].forecast | length > 0
              else (meteo_daily['weather.meteoam_home'].forecast if meteo_daily is defined and 'weather.meteoam_home' in meteo_daily and meteo_daily['weather.meteoam_home'].forecast | length > 0
              else (meteo_daily.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([]))) if meteo_daily is defined else [] }}
            fc_hourly: >-
              {{ meteo_hourly['weather.casa'].forecast if meteo_hourly is defined and 'weather.casa' in meteo_hourly and meteo_hourly['weather.casa'].forecast | length > 0
              else (meteo_hourly['weather.meteoam_home'].forecast if meteo_hourly is defined and 'weather.meteoam_home' in meteo_hourly and meteo_hourly['weather.meteoam_home'].forecast | length > 0
              else (meteo_hourly.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([]))) if meteo_hourly is defined else [] }}
            cond_map: >-
              {{ {
                'sunny': 'soleggiato',
                'clear-night': 'sereno',
                'partlycloudy': 'parzialmente nuvoloso',
                'cloudy': 'nuvoloso',
                'rainy': 'piovoso',
                'pouring': 'pioggia battente',
                'lightning': 'temporalesco',
                'lightning-rainy': 'temporale con pioggia',
                'fog': 'nebbioso',
                'windy': 'ventoso',
                'windy-variant': 'molto ventoso',
                'snowy': 'nevoso',
                'snowy-rainy': 'misto pioggia e neve',
                'hail': 'grandine'
              } }}
            tomorrow_fc: "{{ fc_daily[1] if fc_daily | length > 1 else (fc_daily[0] if fc_daily | length > 0 else {}) }}"
            t_max_val: "{{ (tomorrow_fc.temperature | default(20)) | round(0) }}"
            t_min_val: "{{ (tomorrow_fc.templow if tomorrow_fc.templow is defined else (tomorrow_fc.temperature | default(15))) | round(0) }}"
            t_app_val: "{{ (tomorrow_fc.apparent_temperature if tomorrow_fc.apparent_temperature is defined else (tomorrow_fc.temperature | default(20))) | round(0) }}"
            cond_raw: "{{ tomorrow_fc.condition | default('sunny') }}"
            cond_val: "{{ cond_map.get(cond_raw, cond_raw) }}"
            prob_pioggia_domani: "{{ (tomorrow_fc.precipitation_probability | default(0)) | round(0) }}"
            vento_domani: "{{ (tomorrow_fc.wind_speed | default(5)) | round(0) }}"
            raffiche_domani: "{{ (tomorrow_fc.wind_gust_speed | default(10)) | round(0) }}"
            umidita_domani: "{{ (tomorrow_fc.humidity | default(65)) | round(0) }}"
            temp_esterna_ora: "{{ states('sensor.meteo_temperatura_esterna_effettiva') | default(states('sensor.terrazza_stazione_meteo_modulo_esterno_temperature'), true) | float(16) | round(0) | int }}"
            umidita_esterna_ora: "{{ states('sensor.terrazza_stazione_meteo_modulo_esterno_humidity') | default('70') | float(70) | round(0) | int }}"
            night_hours: "{{ fc_hourly[:8] if fc_hourly is defined and fc_hourly is iterable else [] }}"
            day_hours: "{{ fc_hourly[8:22] if fc_hourly is defined and fc_hourly is iterable and fc_hourly | length > 8 else [] }}"
            cond_mattina: >-
              {% set m_raw = (fc_hourly[9].condition if fc_hourly | length > 9 else cond_raw) %}
              {{ cond_map.get(m_raw, m_raw) }}
            cond_pomeriggio: >-
              {% set p_raw = (fc_hourly[15].condition if fc_hourly | length > 15 else cond_raw) %}
              {{ cond_map.get(p_raw, p_raw) }}
            cond_sera: >-
              {% set s_raw = (fc_hourly[20].condition if fc_hourly | length > 20 else cond_raw) %}
              {{ cond_map.get(s_raw, s_raw) }}
            min_notte: >-
              {{ (night_hours | selectattr('temperature', 'defined') | map(attribute='temperature') | min | default(t_min_val)) | round(0) | int }}
            rain_night: >-
              {{ (night_hours | selectattr('condition', 'in', ['pouring', 'lightning', 'lightning-rainy']) | list | length > 0)
                 or (night_hours | selectattr('precipitation', 'defined') | selectattr('precipitation', 'gt', 1.0) | list | length > 0)
                 or (night_hours | selectattr('precipitation_probability', 'defined') | selectattr('precipitation_probability', 'ge', 65) | list | length > 0)
                 or (night_hours | selectattr('condition', 'in', ['rainy']) | list | length >= 2) }}
            ice_night: >-
              {{ night_hours | selectattr('condition', 'in', ['snowy', 'snowy-rainy', 'hail']) | list | length > 0
                 or night_hours | selectattr('temperature', 'defined') | selectattr('temperature', 'le', 0.5) | list | length > 0 }}
            finestre_aperte: >-
              {{ (state_attr('binary_sensor.sicurezza_infissi_aperti', 'elenco_aperti') | default([], true)) | join(', ')
                 if is_state('binary_sensor.sicurezza_infissi_aperti', 'on') else '' }}
            luna_fuori: "{{ is_state('binary_sensor.gatto_2', 'off') }}"
            piccola_fuori: "{{ is_state('binary_sensor.gatto_1', 'off') }}"
            asciugatrice_on: "{{ is_state('binary_sensor.asciugatrice_in_funzione', 'on') }}"
            tempo_asciugatrice: "{{ states('sensor.asciugatrice_tempo_residuo') }}"
            stefano_charging: >-
              {{ is_state('binary_sensor.smartphone_utente_1_is_charging', 'on') or states('sensor.smartphone_utente_1_battery_state') in ['charging', 'full'] or (states('sensor.smartphone_utente_1_charger_type') not in ['none', 'unavailable', 'unknown', '']) }}
            laura_charging: >-
              {{ is_state('binary_sensor.smartphone_utente_2_is_charging', 'on') or states('sensor.smartphone_utente_2_battery_state') in ['charging', 'full'] or (states('sensor.smartphone_utente_2_charger_type') not in ['none', 'unavailable', 'unknown', '']) }}
            stefano_batt: "{{ states('sensor.smartphone_utente_1_battery_level') }}"
            laura_batt: "{{ states('sensor.smartphone_utente_2_battery_level') }}"
            spunto_buonanotte: >-
              {{ [
                "Fai una battuta sul fatto che la casa ha attivato gli scudi spaziali notturni e Dobby fa la guardia silenziosa dalla sua base in camera.",
                "Scherza su Gatto 2 e Gatto 1 che stanno già calcolando matematicamente come occupare tre quarti del letto lasciando a voi due solo il bordino.",
                "Prendili in giro sulla guerra delle coperte tra Utente 1 che è una stufa vivente e Utente 2 che cerca sempre il calduccio.",
                "Scherza sul fatto che persino i sedici pesciolini dell'acquario in sala hanno spento l'ossigenatore e si sono messi il pigiama per dormire.",
                "Fai una battuta dicendo che il divano della sala vi ringrazia per averlo finalmente liberato e vi augura sogni d'oro.",
                "Scherza sul fatto che tutti i sensori e i router veglieranno sul vostro sonno mentre voi contate le pecore."
              ] | random }}
            buonanotte_ai_prompt: >-
              Sei l'assistente vocale di casa.
              Genera un messaggio di buonanotte allegro, spiritoso, vario e affettuoso per Utente 1 e Utente 2 (in coppia usa "Utente 1 e Utente 2", "Utente 1 e Utente 2", "Cù e Pì" oppure "Pì e Cù"; VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste" perché nella sintesi vocale suona come "stela" o "laste"!).
              SPUNTO CREATIVO PER IL SALUTO DI QUESTA SERA: {{ spunto_buonanotte }}
              Contesto:
              - Orario: sono le {{ now().strftime('%H:%M') }}. {% if now().hour >= 18 and (now().hour < 22 or (now().hour == 22 and now().minute < 30)) %}Vanno a dormire presto da veri campioni del relax!{% elif now().hour == 23 and now().minute >= 35 %}Siete arrivati quasi a mezzanotte, evento storico visto che di solito andate a letto presto e difficilmente arrivate a mezzanotte!{% elif now().hour < 6 %}È passata la mezzanotte, state facendo le ore piccole (evento rarissimo per voi che andate sempre a letto prima di mezzanotte)!{% endif %}
              - Bollettino meteo completo (cita tutti i dettagli usando SOLO numeri interi per i gradi, senza MAI virgole):
                * Fuori in terrazza adesso: {{ temp_esterna_ora }} gradi con il {{ umidita_esterna_ora }}% di umidità.
                * Stanotte: temperatura minima in discesa fino a {{ min_notte }} gradi{% if rain_night %}, attenzione perché è prevista pioggia nella notte{% else %}, notte asciutta senza pioggia{% endif %}.
                * Domani: cielo prevalentemente {{ cond_val }} (al mattino {{ cond_mattina }}, nel pomeriggio {{ cond_pomeriggio }}, in serata {{ cond_sera }}). Temperature tra {{ t_min_val }} gradi di minima e {{ t_max_val }} gradi di massima (percepita {{ t_app_val }} gradi), probabilità di pioggia del {{ prob_pioggia_domani }}%, vento intorno a {{ vento_domani }} km/h con raffiche fino a {{ raffiche_domani }} km/h.
              {%- if rain_night %}
              - Allerta pioggia stanotte: è prevista pioggia durante la notte, avvisali di controllare finestre o panni stesi.
              {%- endif %}
              {%- if ice_night %}
              - Allerta gelo: stanotte le temperature vanno vicino allo zero con rischio ghiaccio domattina.
              {%- endif %}
              - Gatte domestiche: {% if luna_fuori and piccola_fuori %}le due gattine domestiche Gatto 2 e Gatto 1 sono ancora in giardino, fatele rientrare prima di dormire!{% elif luna_fuori %}la gattina Gatto 2 è ancora fuori in terrazza!{% elif piccola_fuori %}la gattina Gatto 1 è ancora fuori in terrazza!{% else %}le due gattine domestiche Gatto 2 e Gatto 1 sono già rientrate in casa pronte per le fusa sul letto.{% endif %}
              {%- if asciugatrice_on and tempo_asciugatrice not in ['unavailable','unknown','Spenta','spenta',''] %}
              - Asciugatrice: ancora in funzione (mancano {{ tempo_asciugatrice }}).
              {%- endif %}
              {%- if finestre_aperte and finestre_aperte not in ['', 'Tutto Chiuso e Sigillato'] and rain_night %}
              - Infissi aperti con pioggia in arrivo: {{ finestre_aperte }}.
              {%- endif %}
              - Smartphone:
                {%- set l_need = not laura_charging and laura_batt not in ['unavailable', 'unknown', ''] and (laura_batt | int(100) < 90) -%}
                {%- set s_need = not stefano_charging and stefano_batt not in ['unavailable', 'unknown', ''] and (stefano_batt | int(100) < 90) -%}
                {%- if l_need and s_need -%}
                sia il cellulare di Utente 2 ({{ laura_batt }}%) che quello di Utente 1 ({{ stefano_batt }}%) non sono collegati al caricabatterie, ricorda a entrambi di metterli in carica.
                {%- elif l_need -%}
                il cellulare di Utente 2 è al {{ laura_batt }}% e non è collegato al caricabatterie, ricordale con simpatia di metterlo in carica (quello di Utente 1 è già in carica).
                {%- elif s_need -%}
                il cellulare di Utente 1 è al {{ stefano_batt }}% e non è collegato al caricabatterie, ricordagli di metterlo in carica (quello di Utente 2 è già in carica).
                {%- else -%}
                entrambi i telefoni sono già carichi, non menzionare telefoni o caricatori.
                {%- endif %}
              Scrivi un testo scorrevole in italiano da leggere ad alta voce di circa 90-110 parole, dedicando almeno due frasi ricche a tutti i dettagli del meteo di stanotte e domani, usando SOLO numeri interi per i gradi (niente virgole e niente "e mezzo gradi"), senza MAI citare il lavoro o ricorrenze, non racchiudere il testo tra doppi apici, niente emoticon e usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'aria, c'è, d'oro; NON scrivere MAI "l acqua" staccato senza apostrofo!).
        - action: ai_task.generate_data
          data:
            entity_id: ai_task.google_ai_task_3
            task_name: "buonanotte"
            instructions: "{{ buonanotte_ai_prompt }}"
          response_variable: ai_buonanotte_res
          continue_on_error: true
        - variables:
            ai_buonanotte_text: >-
              {% if ai_buonanotte_res is defined and ai_buonanotte_res is mapping and 'data' in ai_buonanotte_res and (ai_buonanotte_res.data | trim | length > 20) %}
                {{ ai_buonanotte_res.data | trim }}
              {% else %}
                {{ '' }}
              {% endif %}
            h: "{{ now().hour | int(0) }}"
            m: "{{ now().minute | int(0) }}"
            fallback_buonanotte: >-
              Buonanotte Utente 1 e Utente 2, sono le {{ now().strftime('%H:%M') }}! Fuori in terrazza ci sono {{ temp_esterna_ora }} gradi con il {{ umidita_esterna_ora }} percento di umidità, e stanotte la temperatura scenderà fino a {{ min_notte }} gradi. Per domani è previsto cielo {{ cond_val }}, con {{ cond_mattina }} al mattino e {{ cond_pomeriggio }} nel pomeriggio, temperature comprese tra {{ t_min_val }} e {{ t_max_val }} gradi, probabilità di pioggia del {{ prob_pioggia_domani }} percento e vento a {{ vento_domani }} chilometri orari. Sogni d'oro a tutti e due!
            testo_voce: >-
              {{ (ai_buonanotte_text if ai_buonanotte_text | length > 20 else fallback_buonanotte)
                 | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
                 | replace('Famiglia', '') | replace('Famiglia', '')
                 | replace('"', '')
                 | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
                 | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
                 | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
                 | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
                 | regex_replace('(\\d+)\\s+e\\s+mezzo\\s+gradi', '\\1 gradi')
                 | regex_replace('(\\d+)\\s*(?:virgola|\\.|,)\\s*\\d+', '\\1')
                 | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
                 | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
                 | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
                 | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
                 | trim }}
        - action: media_player.turn_on
          target:
            entity_id: media_player.nest_hub_camera
          continue_on_error: true
        - delay:
            milliseconds: 500
        - action: media_player.volume_mute
          target:
            entity_id: media_player.nest_hub_camera
          data:
            is_volume_muted: false
          continue_on_error: true
        - action: media_player.volume_set
          target:
            entity_id: media_player.nest_hub_camera
          data:
            volume_level: 0.75
          continue_on_error: true
        - delay:
            milliseconds: 600
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: tts.home_assistant_cloud
                  data:
                    media_player_entity_id: media_player.nest_hub_camera
                    message: "{{ testo_voce }}"
                    language: "it-IT"
                    options:
                      voice: "it-IT-Wavenet-A"
                  continue_on_error: true
          default:
            - action: tts.speak
              target:
                entity_id: tts.google_translate_it_lt
              data:
                media_player_entity_id: media_player.nest_hub_camera
                message: "{{ testo_voce }}"
                language: "it"
                options:
                  tld: "it"
              continue_on_error: true
        - wait_template: "{{ states('media_player.nest_hub_camera') == 'playing' }}"
          timeout: "00:00:10"
          continue_on_timeout: true
        - delay: "00:00:02"
        - wait_template: "{{ states('media_player.nest_hub_camera') in ['idle', 'off', 'standby', 'unavailable', 'unknown'] }}"
          timeout: "00:02:00"
          continue_on_timeout: true
        - delay: "00:00:02"
        - action: media_player.turn_off
          target:
            entity_id: media_player.nest_hub_camera
          continue_on_error: true
      else:
        - action: media_player.turn_off
          target:
            entity_id: media_player.nest_hub_camera
          continue_on_error: true

buongiorno_weekend_ai:
  alias: "Annuncio Buongiorno Weekend AI (Manuale)"
  icon: "mdi:weather-sunny"
  mode: single
  fields:
    altoparlante:
      description: "Entità altoparlante per l'annuncio vocale"
      example: "media_player.nest_hub_camera"
      default: "media_player.nest_hub_camera"
  sequence:
    # 0. Riattivazione Ossigenatore Acquario al Buongiorno
    - action: switch.turn_on
      target:
        entity_id: switch.presa_ossigenatore_acquario
      continue_on_error: true
    # 0b. Recupero Previsioni Meteo Giornaliere e Orarie per il Meteo di Oggi
    - action: weather.get_forecasts
      target:
        entity_id:
          - weather.meteoam_home
          - weather.casa
      data:
        type: daily
      response_variable: meteo_daily
      continue_on_error: true
    - action: weather.get_forecasts
      target:
        entity_id:
          - weather.meteoam_home
          - weather.casa
      data:
        type: hourly
      response_variable: meteo_hourly
      continue_on_error: true
    - variables:
        target_speaker: "{{ altoparlante | default('media_player.nest_hub_camera') }}"
        stefano_home: "{{ is_state('binary_sensor.utente_1_a_casa', 'on') }}"
        laura_home: "{{ is_state('binary_sensor.utente_2_a_casa', 'on') }}"
        profilo: >-
          {% if stefano_home and not laura_home %}
            Utente 1
          {% elif laura_home and not stefano_home %}
            Utente 2
          {% elif stefano_home and laura_home %}
            Coppia
          {% else %}
            Nessuno
          {% endif %}
        giorno_settimana: "{{ ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'][now().weekday()] }}"
        fc_daily: >-
          {{ meteo_daily['weather.casa'].forecast if meteo_daily is defined and 'weather.casa' in meteo_daily and meteo_daily['weather.casa'].forecast | length > 0
          else (meteo_daily['weather.meteoam_home'].forecast if meteo_daily is defined and 'weather.meteoam_home' in meteo_daily and meteo_daily['weather.meteoam_home'].forecast | length > 0
          else (meteo_daily.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([]))) if meteo_daily is defined else [] }}
        fc_hourly: >-
          {{ meteo_hourly['weather.casa'].forecast if meteo_hourly is defined and 'weather.casa' in meteo_hourly and meteo_hourly['weather.casa'].forecast | length > 0
          else (meteo_hourly['weather.meteoam_home'].forecast if meteo_hourly is defined and 'weather.meteoam_home' in meteo_hourly and meteo_hourly['weather.meteoam_home'].forecast | length > 0
          else (meteo_hourly.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([]))) if meteo_hourly is defined else [] }}
        cond_map: >-
          {{ {
            'sunny': 'soleggiato',
            'clear-night': 'sereno',
            'partlycloudy': 'parzialmente nuvoloso',
            'cloudy': 'nuvoloso',
            'rainy': 'piovoso',
            'pouring': 'pioggia battente',
            'lightning': 'temporalesco',
            'lightning-rainy': 'temporale con pioggia',
            'fog': 'nebbioso',
            'windy': 'ventoso',
            'windy-variant': 'molto ventoso',
            'snowy': 'nevoso',
            'snowy-rainy': 'misto pioggia e neve',
            'hail': 'grandine',
            'exceptional': 'allerta meteo'
          } }}
        temp_est: "{{ states('sensor.meteo_temperatura_esterna_effettiva') | default('18') }}"
        temp_est_tts: "{{ temp_est | float(18) | round(0) | int }}"
        temp_int: "{{ states('sensor.temperatura_media') | default('21') }}"
        temp_int_tts: "{{ temp_int | float(21) | round(0) | int }}"
        condizione_raw: "{{ states('sensor.meteo_condizione_effettiva') | default('sunny') }}"
        condizione: "{{ cond_map.get(condizione_raw, condizione_raw) }}"
        today_fc: "{{ fc_daily[0] if fc_daily | length > 0 else {} }}"
        t_max_oggi: "{{ (today_fc.temperature if today_fc.temperature is defined else (states('sensor.meteo_previsione_temperatura_massima') | float(20))) | round(0) | int }}"
        t_min_oggi: "{{ (today_fc.templow if today_fc.templow is defined else (states('sensor.meteo_previsione_temperatura_minima') | float(12))) | round(0) | int }}"
        cond_oggi_raw: "{{ today_fc.condition | default(condizione_raw) }}"
        cond_oggi: "{{ cond_map.get(cond_oggi_raw, cond_oggi_raw) }}"
        prob_pioggia_oggi: "{{ (today_fc.precipitation_probability | default(0)) | round(0) | int }}"
        mattina_slice: "{{ fc_hourly[0:4] if fc_hourly is defined and fc_hourly is iterable and fc_hourly | length >= 4 else (fc_hourly if fc_hourly is defined and fc_hourly is iterable else []) }}"
        pomeriggio_slice: "{{ fc_hourly[4:10] if fc_hourly is defined and fc_hourly is iterable and fc_hourly | length >= 10 else [] }}"
        sera_slice: "{{ fc_hourly[10:15] if fc_hourly is defined and fc_hourly is iterable and fc_hourly | length >= 15 else [] }}"
        cond_mattina: >-
          {% set r_m = mattina_slice | selectattr('condition', 'defined') | map(attribute='condition') | select('in', ['pouring', 'lightning-rainy', 'lightning', 'hail', 'rainy']) | list %}
          {% set m_raw = r_m[0] if r_m | length > 0 else (fc_hourly[1].condition if fc_hourly | length > 1 else cond_oggi_raw) %}
          {{ cond_map.get(m_raw, m_raw) }}
        cond_pomeriggio: >-
          {% set r_p = pomeriggio_slice | selectattr('condition', 'defined') | map(attribute='condition') | select('in', ['pouring', 'lightning-rainy', 'lightning', 'hail', 'rainy']) | list %}
          {% set p_raw = r_p[0] if r_p | length > 0 else (fc_hourly[6].condition if fc_hourly | length > 6 else cond_oggi_raw) %}
          {{ cond_map.get(p_raw, p_raw) }}
        cond_sera: >-
          {% set r_s = sera_slice | selectattr('condition', 'defined') | map(attribute='condition') | select('in', ['pouring', 'lightning-rainy', 'lightning', 'hail', 'rainy']) | list %}
          {% set s_raw = r_s[0] if r_s | length > 0 else (fc_hourly[12].condition if fc_hourly | length > 12 else cond_oggi_raw) %}
          {{ cond_map.get(s_raw, s_raw) }}
        piove_oggi: >-
          {{ cond_oggi_raw in ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'hail']
             or cond_mattina in ['piovoso', 'pioggia battente', 'temporalesco', 'temporale con pioggia']
             or cond_pomeriggio in ['piovoso', 'pioggia battente', 'temporalesco', 'temporale con pioggia']
             or cond_sera in ['piovoso', 'pioggia battente', 'temporalesco', 'temporale con pioggia']
             or prob_pioggia_oggi >= 45 }}
        pluvio_raw: "{{ states('sensor.terrazza_pulvirometro_precipitazioni_oggi') }}"
        pluvio_mm: "{{ (pluvio_raw | float(0) | round(1)) if pluvio_raw not in ['unavailable', 'unknown', 'none', ''] else 0.0 }}"
        pluvio_mm_tts: "{{ [1, (pluvio_mm | float(0) | round(0) | int)] | max }}"
        ha_piovuto: "{{ (pluvio_mm | float(0)) > 0.1 or is_state('input_boolean.meteo_pioggia_notturna_rilevata', 'on') }}"
        ricorrenza_oggi: "{{ state_attr('sensor.ricorrenze_e_compleanni_oggi', 'ricorrenza_vocale_oggi') | default('', true) }}"
        spunto_buongiorno_weekend: >-
          {{ [
            "Scherza sul sacro diritto di restare in pigiama fino a pomeriggio inoltrato, celebrando il campionato mondiale di lancio del cuscino e ozio olimpico.",
            "Fai una battuta su Gatto 2 e Gatto 1 che reclamano la colazione reale e vi usano come materasso riscaldato umano.",
            "Prendili in giro chiedendo se il programma estremo di oggi prevede il trasferimento di ben cinque metri dal letto al divano in sala per guardare serie TV.",
            "Scherza sul fatto che i sedici pesciolini dell'acquario sono già svegli che nuotano mentre voi due avete battuto ogni record di sonno.",
            "Fai una battuta chiedendo se oggi è giornata da spedizione relax alla SPA a Località Termale oppure da fortino inespugnabile in salotto.",
            "Scherza sulla colazione lenta della domenica/sabato, magari con un bel dolce o un Babà (cita il Babà solo in questo spunto).",
            "Prendili in giro dicendo che persino l'aspirapolvere Dobby nel weekend vorrebbe restare sotto le coperte invece di pulire."
          ] | random }}
        ai_prompt: >-
          Sei l'assistente vocale di casa su Google Nest Hub.
          EVENTO: Buongiorno del WEEKEND (sabato/domenica o giorno di riposo totale), oggi è {{ giorno_settimana }}.
          DESTINATARI: {{ 'Utente 1 e Utente 2 (in coppia chiamali Utente 1 e Utente 2, Cù e Pì, Pì e Cù oppure Utente 1 e Utente 2; VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste" perché nella sintesi vocale suona come "stela" o "laste"!)' if profilo == 'Coppia' else (profilo ~ ' (puoi usare anche il suo nomignolo affettuoso: Ste o Cù per Utente 1; La, Utente 2 o Pì per Utente 2)') }}.
          SPUNTO CREATIVO DA USARE PER LA BATTUTA DI APERTURA: {{ spunto_buongiorno_weekend }}
          METEO ATTUALE IN TERRAZZA: {{ temp_est_tts }} gradi, cielo {{ condizione }}.
          PIOGGIA DI QUESTA NOTTE: {{ ('QUESTA NOTTE HA PIOVUTO! Il pluviometro in terrazza ha registrato circa ' ~ pluvio_mm_tts ~ " millimetri di pioggia e l'asfalto è bagnato.") if (ha_piovuto and (pluvio_mm | float(0)) > 0.1) else ("QUESTA NOTTE HA PIOVUTO! Il pluviometro ha rilevato pioggia notturna e l'asfalto è bagnato." if ha_piovuto else 'NESSUNA pioggia questa notte (notte asciutta).') }}
          PREVISIONI METEO COMPLETE DI OGGI:
          - Evoluzione della giornata: al mattino cielo {{ cond_mattina }}, nel pomeriggio {{ cond_pomeriggio }}, in serata {{ cond_sera }} (quadro generale: {{ cond_oggi }}).
          - Temperature previste oggi: minima {{ t_min_oggi }} gradi, massima {{ t_max_oggi }} gradi.
          - Pioggia prevista oggi: probabilità del {{ prob_pioggia_oggi }} percento{{ ' (è prevista pioggia durante la giornata di oggi)' if piove_oggi else ' (non sono previste piogge significative oggi)' }}.
          COMPAGNIA: Le gatte Gatto 2 e Gatto 1 già in agguato per fusa, coccole o colazione.
          {%- if ricorrenza_oggi != '' %}
          RICORRENZA O COMPLEANNO DI OGGI: {{ ricorrenza_oggi }}.
          {%- endif %}

          OBIETTIVO:
          Genera un annuncio di buongiorno comico, sarcastico, caloroso, vario e rilassante per il fine settimana (NON nominare Gricia, Carbonara o Babà a meno che non siano richiesti nello spunto!):
          1. Dai il buongiorno a {{ 'Utente 1 e Utente 2 (oppure Cù e Pì, Pì e Cù, o Utente 1 e Utente 2 — NON dire MAI "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste"!)' if profilo == 'Coppia' else (profilo ~ ' (o usando il suo nomignolo affettuoso)') }} sviluppando con originalità lo SPUNTO CREATIVO indicato sopra.
          2. REGOLA TASSATIVA PIOGGIA NOTTURNA: {{ ('Di\' esplicitamente con le parole "questa notte ha piovuto", indicando che il pluviometro ha registrato circa ' ~ pluvio_mm_tts ~ " millimetri di pioggia e l'asfalto è bagnato.") if (ha_piovuto and (pluvio_mm | float(0)) > 0.1) else ('Di\' esplicitamente con le parole "questa notte ha piovuto" e che l\'asfalto è bagnato.' if ha_piovuto else 'NON nominare affatto la pioggia notturna poiché questa notte non ha piovuto.') }}
          3. REGOLA TASSATIVA METEO ATTUALE E PREVISIONI DI OGGI: Indica la temperatura attuale fuori ({{ temp_est_tts }} gradi, cielo {{ condizione }}) e racconta OBBLIGATORIAMENTE le previsioni meteo di oggi ({{ cond_mattina }} al mattino, {{ cond_pomeriggio }} nel pomeriggio e {{ cond_sera }} in serata, con massima di {{ t_max_oggi }} gradi e probabilità di pioggia del {{ prob_pioggia_oggi }} percento).
          4. REGOLA ASSOLUTA E INDEROGABILE SUL LAVORO:
              DIVIETO ASSOLUTO DI NOMINARE IL LAVORO O LE AUTO! Nessun accenno a ufficio, colleghi, pendolari, tragitti, traffico, automobili o doveri. Oggi è weekend, relax assoluto!
          {%- if ricorrenza_oggi != '' %}
          5. REGOLA TASSATIVA RICORRENZA DI OGGI: Ricorda con entusiasmo che {{ ricorrenza_oggi }}!
          {%- endif %}

          REGOLE DI FORMATO:
          - DIVIETO ASSOLUTO DI COGNOMI: Non pronunciare MAI alcun cognome (non dire MAI "Famiglia" né "Eco Home", di' semplicemente "a casa"). Usa solo il nome di battesimo o i nomignoli affettuosi.
          - Temperature e numeri: Usa SOLO numeri interi per i gradi ({{ temp_est_tts }} gradi), MAI cifre con la virgola e MAI "e mezzo gradi".
          - Lunghezza: tra 65 e 95 parole.
          - Tono sarcastico, spiritoso e rilassante.
          - Niente emoji, non racchiudere la frase tra doppi apici, usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'asfalto, l'aria, c'è; NON scrivere MAI "l acqua" staccato senza apostrofo!), parlato naturale per sintesi vocale.

    - action: ai_task.generate_data
      data:
        entity_id: ai_task.google_ai_task_3
        task_name: "annuncio_buongiorno_weekend"
        instructions: "{{ ai_prompt }}"
      response_variable: ai_weekend_resp
      continue_on_error: true

    - variables:
        ai_battuta: >-
          {% if ai_weekend_resp is defined and ai_weekend_resp is mapping and 'data' in ai_weekend_resp and (ai_weekend_resp.data | trim | length) > 20 %}
            {{ ai_weekend_resp.data | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        frase_pioggia: >-
          {% if ha_piovuto and (pluvio_mm | float(0)) > 0.1 %}
             Questa notte ha piovuto: il pluviometro ha registrato circa {{ pluvio_mm_tts }} millimetri di pioggia, ottimo pretesto per restare sotto il piumone.
          {% elif ha_piovuto %}
             Questa notte ha piovuto e l'asfalto è bagnato, ottimo pretesto per restare sotto il piumone.
          {% else %}
            {{ '' }}
          {% endif %}
        frase_meteo_oggi: >-
           Per il meteo di oggi sono previsti cielo {{ cond_mattina }} al mattino, {{ cond_pomeriggio }} nel pomeriggio e {{ cond_sera }} in serata, con temperature tra {{ t_min_oggi }} e {{ t_max_oggi }} gradi e probabilità di pioggia del {{ prob_pioggia_oggi }} percento.
        frase_ricorrenza: "{{ ' Vi ricordo inoltre che ' ~ ricorrenza_oggi ~ '!' if ricorrenza_oggi != '' else '' }}"
        fallback_battuta: >-
          {% if profilo == 'Utente 1' %}
            Buongiorno Ste! È il weekend: fuori ci sono {{ temp_est_tts }} gradi con cielo {{ condizione }}.{{ frase_pioggia }}{{ frase_meteo_oggi }}{{ frase_ricorrenza }} Solo caffè, divano e pigrizia autorizzata: goditi il meritato riposo!
          {% elif profilo == 'Utente 2' %}
            Buongiorno La! Il weekend ti accoglie con {{ temp_est_tts }} gradi e cielo {{ condizione }}.{{ frase_pioggia }}{{ frase_meteo_oggi }}{{ frase_ricorrenza }} Gatto 2 e Gatto 1 approvano la colazione lenta e il meritato relax!
          {% else %}
            Buongiorno Utente 1 e Utente 2! È il weekend: fuori abbiamo {{ temp_est_tts }} gradi e cielo {{ condizione }}.{{ frase_pioggia }}{{ frase_meteo_oggi }}{{ frase_ricorrenza }} Sveglia disattivata, relax obbligatorio e coccole sul divano con Gatto 2 e Gatto 1!
          {% endif %}
        testo_finale: >-
          {{ (ai_battuta if ai_battuta | length > 20 else fallback_battuta)
             | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
             | replace('Famiglia', '') | replace('Famiglia', '')
             | replace('"', '')
             | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
             | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
             | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
             | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
             | regex_replace('(\\d+)\\s+e\\s+mezzo\\s+gradi', '\\1 gradi')
             | regex_replace('(\\d+)\\s*(?:virgola|\\.|,)\\s*\\d+', '\\1')
             | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
             | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
             | trim }}

    # 1. NOTIFICHE SMARTPHONE
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo in ['Utente 1', 'Coppia'] }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "☀️ Buongiorno Weekend!"
                message: "{{ testo_finale }}"
                data:
                  tag: "buongiorno_weekend"
                  channel: "Relax"
              continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo in ['Utente 2', 'Coppia'] }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "☀️ Buongiorno Weekend!"
                message: "{{ testo_finale }}"
                data:
                  tag: "buongiorno_weekend"
                  channel: "Relax"
              continue_on_error: true

    # 2. ANNUNCIO VOCALE SU NEST HUB
    - action: media_player.turn_on
      target:
        entity_id: "{{ target_speaker }}"
      continue_on_error: true
    - delay:
        milliseconds: 500
    - action: media_player.volume_mute
      target:
        entity_id: "{{ target_speaker }}"
      data:
        is_volume_muted: false
      continue_on_error: true
    - action: media_player.volume_set
      target:
        entity_id: "{{ target_speaker }}"
      data:
        volume_level: 0.70
      continue_on_error: true
    - delay:
        milliseconds: 600
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
          sequence:
            - action: tts.speak
              target:
                entity_id: tts.home_assistant_cloud
              data:
                media_player_entity_id: "{{ target_speaker }}"
                message: "{{ testo_finale }}"
                language: "it-IT"
                options:
                  voice: "it-IT-Wavenet-A"
              continue_on_error: true
      default:
        - action: tts.speak
          target:
            entity_id: tts.google_translate_it_lt
          data:
            media_player_entity_id: "{{ target_speaker }}"
            message: "{{ testo_finale }}"
            language: "it"
            options:
              tld: "it"
          continue_on_error: true

buonanotte_silenziosa:
  alias: "Buonanotte Silenziosa (Senza Annuncio Vocale)"
  icon: "mdi:sleep"
  mode: single
  sequence:
    # 1. Chiusura standard tapparelle (fessure aperte)
    - action: script.chiusura_standard_tapparelle
      continue_on_error: true
    # 2. Spegnimento ossigenatore acquario
    - action: switch.turn_off
      target:
        entity_id: switch.presa_ossigenatore_acquario
      continue_on_error: true
    # 3. Spegnimento di tutte le luci
    - action: script.spegni_tutte_le_luci
      continue_on_error: true
    # 4. Spegnimento protetto TV Sala e dispositivi multimediali
    - if:
        - condition: template
          value_template: >-
            {{ states('media_player.tv_sala_principale') in ['on', 'playing', 'paused'] or
               states('remote.tv_sala_ue85du7170uxzt') == 'on' }}
      then:
        - action: remote.send_command
          target:
            entity_id: remote.tv_sala_ue85du7170uxzt
          data:
            command: KEY_POWEROFF
          continue_on_error: true
        - action: media_player.turn_off
          target:
            entity_id: media_player.tv_sala_principale
          continue_on_error: true
    - if:
        - condition: state
          entity_id: media_player.sala_ultra_slim_soundbar
          state: 'on'
      then:
        - action: media_player.turn_off
          target:
            entity_id: media_player.sala_ultra_slim_soundbar
          continue_on_error: true
    - action: media_player.turn_off
      target:
        entity_id:
          - media_player.chromecast_camera
          - media_player.chromecast_camera_2
          - media_player.filodiffusione
          - media_player.nest_hub_camera
      continue_on_error: true
    # 5. Spegnimento camino (solo se acceso, evita errore su stato unknown)
    - if:
        - condition: state
          entity_id: climate.camino_water
          state: 'heat'
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.camino_water
          data:
            hvac_mode: 'off'
          continue_on_error: true
    # 6. Attivazione allarme perimetrale notturno
    - if:
        - condition: template
          value_template: >-
            {{ (now().hour >= 21 or now().hour < 7) and
               not is_state('alarm_control_panel.sicurezza_eco_home', 'armed_away') }}
      then:
        - action: script.sicurezza_attiva_notte
          continue_on_error: true
    # 7. Notifica di conferma silenziosa (senza TTS)
    - action: persistent_notification.create
      data:
        title: "🌙 Buonanotte Silenziosa"
        message: "Modalità notte attivata senza annuncio vocale: tapparelle posizionate con fessure aperte, luci, ossigenatore e TV spenti."
        notification_id: buonanotte_notifica
      continue_on_error: true

attiva_scena_cinema:
  alias: "Attiva Scena Cinema"
  description: "Spegne tutte le luci di casa ed accende la luce ambiente sala e le luci mensole camino entrambe al 20%."
  icon: "mdi:movie-open"
  mode: restart
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.modalita_cinema_attiva
      continue_on_error: true
    - action: script.spegni_tutte_le_luci
      continue_on_error: true
    - action: light.turn_on
      target:
        entity_id:
          - light.luce_ambiente_sala
          - light.luce_mensole_camino
      data:
        brightness_pct: 20
      continue_on_error: true
    - action: scene.turn_on
      target:
        entity_id: scene.cinema
      continue_on_error: true

stato_pioggia_pluviometro:
  alias: "Meteo Vocale: Stato Pioggia dal Pluviometro"
  icon: "mdi:weather-pouring"
  mode: single
  sequence:
    - variables:
        attuale_mm: "{{ states('sensor.terrazza_pulvirometro_precipitazione') | float(0) | round(1) }}"
        ora_mm: "{{ states('sensor.sala_pulvirometro_precipitazioni_ultima_ora') | float(0) | round(1) }}"
        oggi_mm: "{{ states('sensor.terrazza_pulvirometro_precipitazioni_oggi') | float(0) | round(1) }}"
        attuale_tts: "{{ (attuale_mm | string).replace('.0', '').replace('.', ' virgola ') }}"
        ora_tts: "{{ (ora_mm | string).replace('.0', '').replace('.', ' virgola ') }}"
        oggi_tts: "{{ (oggi_mm | string).replace('.0', '').replace('.', ' virgola ') }}"
        messaggio_pioggia: >-
          {% if attuale_mm | float(0) > 0.05 %}
          Dal pluviometro in terrazza sta piovendo proprio ora, con {{ attuale_tts }} millimetri attuali, {{ ora_tts }} millimetri nell'ultima ora e {{ oggi_tts }} millimetri caduti oggi.
          {% elif ora_mm | float(0) > 0.05 %}
          Dal pluviometro in terrazza in questo istante ha smesso di piovere, ma nell'ultima ora sono caduti {{ ora_tts }} millimetri e oggi in totale {{ oggi_tts }} millimetri.
          {% elif oggi_mm | float(0) > 0.05 %}
          Dal pluviometro in terrazza adesso non piove. Oggi sono comunque caduti {{ oggi_tts }} millimetri di pioggia.
          {% else %}
          Dal pluviometro in terrazza fuori non piove: zero millimetri rilevati oggi.
          {% endif %}
    - action: script.audio_annuncio_prepara
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_sala
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
        message: "{{ messaggio_pioggia }}"
        language: "it"
        options:
          tld: "it"
      continue_on_error: true
    - delay:
        seconds: 10
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

stato_vento_anemometro:
  alias: "Meteo Vocale: Stato Vento dall'Anemometro"
  icon: "mdi:weather-windy"
  mode: single
  sequence:
    - variables:
        vento_kmh: "{{ states('sensor.terrazza_anemometro_velocita_del_vento') | float(0) | round(0) | int }}"
        raffica_kmh: "{{ states('sensor.sala_anemometro_gust_strength') | float(0) | round(0) | int }}"
        dir_raw: "{{ states('sensor.terrazza_anemometro_direzione_del_vento') | lower }}"
        dir_map: >-
          {{ {
            'n': 'nord', 'ne': 'nord-est', 'e': 'est', 'se': 'sud-est',
            's': 'sud', 'sw': 'sud-ovest', 'w': 'ovest', 'nw': 'nord-ovest'
          } }}
        direzione: "{{ dir_map.get(dir_raw, dir_raw) }}"
        messaggio_vento: >-
          {% if vento_kmh | int > 15 or raffica_kmh | int > 25 %}
          Dall'anemometro in terrazza c'è vento sostenuto da {{ direzione }}: velocità attuale {{ vento_kmh }} chilometri orari con raffiche a {{ raffica_kmh }} chilometri orari.
          {% elif vento_kmh | int > 4 or raffica_kmh | int > 8 %}
          Dall'anemometro in terrazza c'è una brezza leggera da {{ direzione }}: vento a {{ vento_kmh }} chilometri orari con raffiche fino a {{ raffica_kmh }} chilometri orari.
          {% else %}
          Dall'anemometro in terrazza l'aria è quasi ferma: vento a {{ vento_kmh }} chilometri orari e raffiche a {{ raffica_kmh }} chilometri orari.
          {% endif %}
    - action: script.audio_annuncio_prepara
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_sala
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
        message: "{{ messaggio_vento }}"
        language: "it"
        options:
          tld: "it"
      continue_on_error: true
    - delay:
        seconds: 10
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

