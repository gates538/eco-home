stato_acqua_calda_vocale:
  alias: "🚿 Acqua Calda Vocale: Stato Pompa di Calore Atlantic Calypso"
  description: "Legge sui Nest Hub la temperatura dell'acqua calda sanitaria, le docce disponibili, i litri V40 e se il Boost è attivo."
  icon: "mdi:water-boiler"
  mode: single
  sequence:
    - variables:
        temp_acqua: "{{ states('sensor.calypso_split_hot_water_available') | float(states('sensor.calypso_split_tank_middle_temperature') | float(50)) | round(0) | int }}"
        docce: "{{ states('sensor.pdc_atlantic_docce_disponibili') | int(5) }}"
        litri_v40: "{{ states('sensor.pdc_atlantic_acqua_calda_v40_disponibile') | int(203) }}"
        boost_on: "{{ is_state('switch.calypso_split_boost_mode', 'on') or is_state('input_boolean.pdc_boost_acqua_calda_ospiti', 'on') }}"
        messaggio_pdc: >-
          La pompa di calore dell'acqua calda è a {{ temp_acqua }} gradi, in modalità {{ 'Boost rapido per ospiti' if boost_on else 'Eco ad alta efficienza' }}.
          Sono disponibili circa {{ litri_v40 }} litri di acqua calda miscelata, sufficienti per {{ docce }} docce.
    - action: script.audio_annuncio_prepara
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_sala
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
        message: "{{ messaggio_pdc }}"
        language: "it"
        options:
          tld: "it"
      continue_on_error: true
    - delay:
        seconds: 10
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

stato_elettrodomestici_energia_vocale:
  alias: "⚡ Energia & Elettrodomestici Vocale: Consumi e Apparati Attivi"
  description: "Legge sui Nest Hub il consumo elettrico istantaneo di casa, il margine sul contatore da 6 kW e quali elettrodomestici sono in funzione."
  icon: "mdi:flash"
  mode: single
  sequence:
    - variables:
        watt_casa: "{{ states('sensor.potenza_totale_istantanea_casa') | float(0) | round(0) | int }}"
        watt_disp: "{{ states('sensor.potenza_disponibile_contatore') | float(0) | round(0) | int }}"
        attivi: >-
          {% set ns = namespace(items=[]) %}
          {% if is_state('binary_sensor.lavatrice_in_funzione', 'on') %}
            {% set ns.items = ns.items + ['la Lavatrice'] %}
          {% endif %}
          {% if is_state('binary_sensor.asciugatrice_in_funzione', 'on') or is_state('binary_sensor.esterno_asciugatrice_potenza', 'on') %}
            {% set ns.items = ns.items + ['l''Asciugatrice'] %}
          {% endif %}
          {% if is_state('binary_sensor.lavastoviglie_in_funzione', 'on') %}
            {% set ns.items = ns.items + ['la Lavastoviglie'] %}
          {% endif %}
          {% if states('sensor.cucina_forno_machine_state') == 'run' or (states('sensor.cucina_forno_temperatura') | float(0) > 50) %}
            {% set ns.items = ns.items + ['il Forno'] %}
          {% endif %}
          {% if is_state('binary_sensor.cucina_piano_cottura_potenza', 'on') %}
            {% set ns.items = ns.items + ['il Piano Cottura'] %}
          {% endif %}
          {{ ns.items }}
        messaggio_energia: >-
          In questo momento la casa sta assorbendo {{ watt_casa }} watt, con {{ watt_disp }} watt ancora disponibili sul contatore.
          {% if attivi | count == 0 %}
            Tutti i grandi elettrodomestici sono spenti.
          {% elif attivi | count == 1 %}
            È attualmente in funzione solo {{ attivi[0] }}.
          {% else %}
            Sono attualmente in funzione: {{ attivi[:-1] | join(', ') }} e {{ attivi[-1] }}.
          {% endif %}
    - action: script.audio_annuncio_prepara
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_sala
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
        message: "{{ messaggio_energia }}"
        language: "it"
        options:
          tld: "it"
      continue_on_error: true
    - delay:
        seconds: 10
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

stato_camino_vocale:
  alias: "🔥 Camino Vocale: Stato Termocamino Klover e Scorta Pellet"
  description: "Legge sui Nest Hub lo stato del Termocamino Klover, la temperatura dell'acqua dei termosifoni, la fiamma, il pellet consumato oggi e i sacchi di scorta."
  icon: "mdi:fireplace"
  mode: single
  sequence:
    - variables:
        in_funzione: "{{ is_state('binary_sensor.camino_in_funzione', 'on') or is_state('climate.camino_water', 'heat') }}"
        temp_acqua: "{{ states('sensor.camino_water_temperature') | float(0) | round(0) | int }}"
        temp_fiamma: "{{ states('sensor.camino_flame_temperature') | float(0) | round(0) | int }}"
        potenza: "{{ states('sensor.camino_real_power') | int(1) }}"
        kg_oggi: "{{ (states('sensor.camino_pellet_consumato_oggi') | float(0) | round(1) | string).replace('.0', '').replace('.', ' virgola ') }}"
        sacchi: "{{ states('input_number.sacchi_pellet_rimanenti') | int(0) }}"
        messaggio_camino: >-
          {% if in_funzione %}
            Il termocamino è acceso a potenza {{ potenza }} su 5: l'acqua dei termosifoni è a {{ temp_acqua }} gradi e la fiamma è a {{ temp_fiamma }} gradi.
          {% else %}
            Il termocamino in questo momento è spento, con l'acqua dell'impianto a {{ temp_acqua }} gradi.
          {% endif %}
          Oggi ha consumato {{ kg_oggi }} chili di pellet e in scorta restano {{ sacchi }} sacchi.
    - action: script.audio_annuncio_prepara
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_sala
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
        message: "{{ messaggio_camino }}"
        language: "it"
        options:
          tld: "it"
      continue_on_error: true
    - delay:
        seconds: 11
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

