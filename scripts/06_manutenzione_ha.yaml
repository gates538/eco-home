aggiorna_integrazioni_home_assistant:
  alias: "🧩 Aggiorna Integrazioni e Componenti Home Assistant (HACS)"
  icon: "mdi:puzzle-edit-outline"
  description: "Controlla e installa automaticamente tutti gli aggiornamenti disponibili per le integrazioni custom, card Lovelace e temi gestiti da HACS, riavviando Home Assistant se necessario."
  mode: single
  fields:
    silenzioso_se_aggiornato:
      description: "Se true, non invia notifiche quando tutte le integrazioni sono già aggiornate (utile per le automazioni notturne)"
      default: false
      selector:
        boolean:
    riavvia_se_necessario:
      description: "Se true, riavvia automaticamente Home Assistant dopo aver installato gli aggiornamenti delle integrazioni"
      default: true
      selector:
        boolean:
  sequence:
    - variables:
        entita_hacs: "{{ integration_entities('hacs') | select('match', '^update\\.') | list }}"
    - if:
        - condition: template
          value_template: "{{ entita_hacs | count > 0 }}"
      then:
        - action: homeassistant.update_entity
          target:
            entity_id: "{{ entita_hacs }}"
          continue_on_error: true
        - delay:
            seconds: 5
    - variables:
        totale_hacs: "{{ integration_entities('hacs') | select('match', '^update\\.') | list | count }}"
        da_aggiornare: "{{ integration_entities('hacs') | select('match', '^update\\.') | select('is_state', 'on') | list }}"
        conteggio: "{{ da_aggiornare | count }}"
        elenco_aggiornati: >-
          {% set ns = namespace(items=[]) %}
          {% for eid in da_aggiornare %}
            {% set nome = (state_attr(eid, 'friendly_name') | default(eid, true)) | replace(' Update', '') %}
            {% set old_v = state_attr(eid, 'installed_version') | default('?', true) %}
            {% set new_v = state_attr(eid, 'latest_version') | default('?', true) %}
            {% set ns.items = ns.items + [nome ~ ' (' ~ old_v ~ ' ➔ ' ~ new_v ~ ')'] %}
          {% endfor %}
          {{ ns.items | join(', ') }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ conteggio | int(0) > 0 }}"
          sequence:
            - repeat:
                for_each: "{{ da_aggiornare }}"
                sequence:
                  - action: update.install
                    target:
                      entity_id: "{{ repeat.item }}"
                    continue_on_error: true
                  - delay:
                      seconds: 3
            - delay:
                seconds: 3
            - action: script.notifica_smart
              data:
                titolo: "🧩 Integrazioni Home Assistant Aggiornate"
                messaggio: >-
                  Aggiornati {{ conteggio }} componenti HACS: {{ elenco_aggiornati }}.{{ ' Riavvio automatico di Home Assistant in corso per applicare le modifiche...' if (riavvia_se_necessario | default(true)) else '' }}
                canale: utente_1
                priorita: bassa
                categoria: generale
                tag: hacs_auto_update
              continue_on_error: true
            - if:
                - condition: template
                  value_template: "{{ riavvia_se_necessario | default(true) }}"
              then:
                - delay:
                    seconds: 5
                - action: homeassistant.restart
                  continue_on_error: true
      default:
        - if:
            - condition: template
              value_template: "{{ not (silenzioso_se_aggiornato | default(false)) }}"
          then:
            - action: script.notifica_smart
              data:
                titolo: "🧩 Integrazioni Home Assistant"
                messaggio: "Tutte le {{ totale_hacs }} integrazioni e card HACS sono già aggiornate all'ultima versione disponibile."
                canale: utente_1
                priorita: bassa
                categoria: generale
                tag: hacs_auto_update
              continue_on_error: true

