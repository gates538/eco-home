- id: 'scenario_notte_allineamento_dispositivi'
  alias: 'Scenario Notte: Spegnimento Protetto TV e Dispositivi'
  description: 'Garantisce che all''attivazione dello Scenario Notte (ad es. da Google Assistant o routine) venga eseguito lo script completo Buonanotte (chiusura tapparelle aperte a fessure aperte, spegnimento protetto TV/luci/ossigenatore/camino, allarme notturno e annuncio vocale AI).'
  mode: single
  trigger:
    - trigger: state
      entity_id:
        - scene.scenario_notte
        - scene.buonanotte
      id: scenario_notte
      not_from:
        - unavailable
      not_to:
        - unavailable
        - unknown
    - trigger: state
      entity_id: scene.tapparelle_chiuse_con_fessure_aperte
      id: solo_tapparelle
      not_from:
        - unavailable
      not_to:
        - unavailable
        - unknown
    - trigger: state
      entity_id: scene.preparazione_notte
      id: preparazione_notte
      not_from:
        - unavailable
      not_to:
        - unavailable
        - unknown
  condition:
    - condition: template
      value_template: >-
        {{ trigger.from_state is defined and trigger.to_state is defined and
           trigger.to_state.state not in ['unavailable', 'unknown'] and
           trigger.from_state.state != trigger.to_state.state and
           (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) | abs < 15 }}
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: solo_tapparelle
          sequence:
            - action: script.chiusura_standard_tapparelle
              continue_on_error: true
        - conditions:
            - condition: trigger
              id: scenario_notte
          sequence:
            - action: script.buonanotte_scenario_notte
              continue_on_error: true
        - conditions:
            - condition: trigger
              id: preparazione_notte
          sequence:
            - action: script.preparazione_notte
              continue_on_error: true

- id: 'telecomando_divano_cinema_tv_tapparella'
  alias: "Telecomando Divano: Cinema, TV & Tapparella Sala"
  description: "Tasto 1 singolo: Scena Cinema + Accendi TV. Tasto 2 singolo: Spegni TV + Luce Mensole + Luce Ambiente. Tasto 1 doppio: Alza tutta la tapparella sala. Tasto 2 doppio: Abbassa tapparella sala a fessure aperte."
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/Telecomando Divano/action
    - trigger: mqtt
      topic: zigbee2mqtt/0x00124b0000000001/action
    - trigger: mqtt
      topic: zigbee2mqtt/TelecomandoDivano/action
  actions:
    - choose:
        # ----------------------------------------------------------------------
        # TASTO 1: ON (SINGOLO = SCENA CINEMA + TV / DOPPIO = ALZA TAPPARELLA)
        # ----------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ trigger.payload in ['on', 'on_double', 'double_on'] }}"
          sequence:
            - choose:
                # Caso A: payload esplicito di doppio click
                - conditions:
                    - condition: template
                      value_template: "{{ trigger.payload in ['on_double', 'double_on'] }}"
                  sequence:
                    - action: cover.set_cover_position
                      target:
                        entity_id: cover.tapparella_sala
                      data:
                        position: 100
              # Caso B: payload standard 'on' -> attesa 450ms per secondo click
              default:
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: zigbee2mqtt/Telecomando Divano/action
                      payload: 'on'
                    - trigger: mqtt
                      topic: zigbee2mqtt/0x00124b0000000001/action
                      payload: 'on'
                    - trigger: mqtt
                      topic: zigbee2mqtt/TelecomandoDivano/action
                      payload: 'on'
                  timeout:
                    milliseconds: 450
                  continue_on_timeout: true
                - choose:
                    # 1. Secondo click ricevuto -> DOPPIA PRESSIONE (Alza tutta la tapparella)
                    - conditions:
                        - condition: template
                          value_template: "{{ wait.trigger is not none }}"
                      sequence:
                        - action: cover.set_cover_position
                          target:
                            entity_id: cover.tapparella_sala
                          data:
                            position: 100
                  # 2. Nessun secondo click -> PRESSIONE SINGOLA (Scena Cinema + Accendi TV)
                  default:
                    - action: script.attiva_scena_cinema
                    - action: media_player.turn_on
                      target:
                        entity_id:
                          - media_player.sala_tv_sala
                          - media_player.tv_sala
                          - media_player.tv_sala_principale
                      continue_on_error: true

        # ----------------------------------------------------------------------
        # TASTO 2: OFF (SINGOLO = SPEGNI TV & LUCI / DOPPIO = FESSURE APERTE)
        # ----------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ trigger.payload in ['off', 'off_double', 'double_off'] }}"
          sequence:
            - choose:
                # Caso A: payload esplicito di doppio click
                - conditions:
                    - condition: template
                      value_template: "{{ trigger.payload in ['off_double', 'double_off'] }}"
                  sequence:
                    - action: cover.set_cover_position
                      target:
                        entity_id: cover.tapparella_sala
                      data:
                        position: 8
              # Caso B: payload standard 'off' -> attesa 450ms per secondo click
              default:
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: zigbee2mqtt/Telecomando Divano/action
                      payload: 'off'
                    - trigger: mqtt
                      topic: zigbee2mqtt/0x00124b0000000001/action
                      payload: 'off'
                    - trigger: mqtt
                      topic: zigbee2mqtt/TelecomandoDivano/action
                      payload: 'off'
                  timeout:
                    milliseconds: 450
                  continue_on_timeout: true
                - choose:
                    # 1. Secondo click ricevuto -> DOPPIA PRESSIONE (Fessure aperte)
                    - conditions:
                        - condition: template
                          value_template: "{{ wait.trigger is not none }}"
                      sequence:
                        - action: cover.set_cover_position
                          target:
                            entity_id: cover.tapparella_sala
                          data:
                            position: 8
                  # 2. Nessun secondo click -> PRESSIONE SINGOLA (Spegni TV, mensole e ambiente)
                  default:
                    - action: light.turn_off
                      target:
                        entity_id:
                          - light.luce_mensole_camino
                          - light.luce_ambiente_sala
                      continue_on_error: true
                    - action: media_player.turn_off
                      target:
                        entity_id:
                          - media_player.sala_tv_sala
                          - media_player.tv_sala
                          - media_player.tv_sala_principale
                      continue_on_error: true

- id: 'tv_sala_wakeup_cloud_smartthings'
  alias: 'TV Sala: Wake-up Automatico SmartThings Cloud su Accensione'
  description: 'Quando viene richiesto media_player.turn_on su TV Sala locale o Cast, invia automaticamente anche il comando di risveglio via SmartThings Cloud (necessario in standby Wi-Fi)'
  mode: single
  trigger:
    - trigger: event
      event_type: call_service
      event_data:
        domain: media_player
        service: turn_on
  condition:
    - condition: template
      value_template: >-
        {% set target = trigger.event.data.service_data.entity_id | default([]) %}
        {% set targets = [target] if target is string else target %}
        {{ 'media_player.tv_sala_principale' in targets or 'media_player.tv_sala' in targets }}
  action:
    - action: media_player.turn_on
      target:
        entity_id: media_player.sala_tv_sala
      continue_on_error: true

- id: tapparelle_lampeggio_led_in_movimento
  alias: "Tapparelle - Lampeggio LED Blu durante il Movimento"
  description: "Fa lampeggiare il LED blu del pulsante BTicino quando la rispettiva tapparella è in movimento e lo riporta fisso blu appena si ferma."
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.tapparella_sala_moving
        - binary_sensor.tapparella_cucina_moving
        - binary_sensor.tapparella_camera_moving
        - binary_sensor.tapparella_cameretta_moving
        - binary_sensor.tapparella_bagno_moving
        - binary_sensor.tapparella_bagnetto_moving
      to:
        - 'on'
        - 'off'
  variables:
    z2m_map:
      binary_sensor.tapparella_sala_moving: "Tapparella Sala"
      binary_sensor.tapparella_cucina_moving: "Tapparella Cucina"
      binary_sensor.tapparella_camera_moving: "Tapparella Camera"
      binary_sensor.tapparella_cameretta_moving: "Tapparella Cameretta"
      binary_sensor.tapparella_bagno_moving: "Tapparella Bagno"
      binary_sensor.tapparella_bagnetto_moving: "Tapparella Bagnetto"
    z2m_device: "{{ z2m_map.get(trigger.entity_id, '') }}"
  conditions:
    - condition: template
      value_template: "{{ z2m_device != '' }}"
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.to_state.state == 'on' }}"
      then:
        - delay:
            milliseconds: 2200
        - if:
            - condition: template
              value_template: "{{ is_state(trigger.entity_id, 'on') }}"
          then:
            - action: mqtt.publish
              data:
                topic: "zigbee2mqtt/{{ z2m_device }}/set"
                payload: '{"command":{"cluster":"genIdentify","command":"identify","payload":{"identifytime":25}}}'
              continue_on_error: true
      else:
        - action: mqtt.publish
          data:
            topic: "zigbee2mqtt/{{ z2m_device }}/set"
            payload: '{"command":{"cluster":"genIdentify","command":"identify","payload":{"identifytime":0}}}'
          continue_on_error: true
  mode: parallel
  max: 12

