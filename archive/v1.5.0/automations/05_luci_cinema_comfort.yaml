        - switch.presa_entrata_sx_led_if_on
        - switch.presa_mensola_bagno_led_in_dark
        - switch.presa_mensola_bagno_led_if_on
        - switch.presa_scrivania_cameretta_led_in_dark
        - switch.presa_scrivania_cameretta_led_if_on
        - switch.presa_sotto_lavandino_bagno_led_in_dark
        - switch.presa_sotto_lavandino_bagno_led_if_on
        - switch.presa_sx_2_corridoio_led_in_dark
        - switch.presa_sx_2_corridoio_led_if_on
        - switch.presa_sx_corridoio_led_in_dark
        - switch.presa_sx_corridoio_led_if_on
        - switch.presa_terrazzo_led_in_dark
        - switch.presa_terrazzo_led_if_on
        - switch.presa_tv_cameretta_led_in_dark
        - switch.presa_tv_cameretta_led_if_on
      to: 'off'
      for:
        seconds: 3
    - trigger: state
      entity_id: *bticino_led_entities
      from:
        - 'unavailable'
        - 'unknown'
      to:
        - 'on'
        - 'off'
      for:
        seconds: 5
  actions:
    - action: switch.turn_on
      target:
        entity_id: "{{ trigger.entity_id }}"
      continue_on_error: true
  mode: parallel
  max: 25

- id: comando_entra_esci_zigbee_scenari
  alias: "Comando Entra/Esci Zigbee - Scenari Entra e Esci"
  description: "Gestisce il pulsante generale Entra/Esci (BTicino 064873): Entra alza tutte le tapparelle; Esci abbassa tutte le tapparelle a fessure aperte, spegne tutte le luci rimaste accese ed esegue un annuncio vocale istantaneo alla porta."
  triggers:
    - trigger: mqtt
      topic: "zigbee2mqtt/Comando entra/esci/action"
      payload: "enter"
      id: "entra"
    - trigger: mqtt
      topic: "zigbee2mqtt/Comando entra/esci/action"
      payload: "wakeup"
      id: "entra"
    - trigger: mqtt
      topic: "zigbee2mqtt/Comando entra/esci/action"
      payload: "leave"
      id: "esci"
    - trigger: mqtt
      topic: "zigbee2mqtt/Comando entra/esci/action"
      payload: "sleep"
      id: "esci"
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: "entra"
          sequence:
            - action: script.scenario_entra_casa
        - conditions:
            - condition: trigger
              id: "esci"
          sequence:
            - action: script.scenario_esci_casa
  mode: restart

- id: zigbee_legrand_064873_ember_multicast_init
  alias: "Zigbee2MQTT - Registra Gruppi Multicast Comando Entra/Esci (Ember)"
  description: "Registra nella Multicast Table del coordinatore Ember i gruppi 65527 (enter), 65526 (leave), 65525 (wakeup) e 65524 (sleep) usati dal modulo BTicino/Legrand 064873 ad ogni avvio di Zigbee2MQTT."
  triggers:
    - trigger: mqtt
      topic: "zigbee2mqtt/bridge/state"
      value_template: "{{ value_json.state if value_json is defined else value }}"
      payload: "online"
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
      to: "on"
  actions:
    - delay: "00:00:12"
    - repeat:
        for_each:
          - "legrand_enter_65527"
          - "legrand_leave_65526"
          - "legrand_wakeup_65525"
          - "legrand_sleep_65524"
        sequence:
          - action: mqtt.publish
            data:
              topic: "zigbee2mqtt/bridge/request/group/members/add"
              payload: '{"group":"{{ repeat.item }}","device":"Faretto Cucina 1","endpoint":11}'
          - delay: "00:00:02"
          - action: mqtt.publish
            data:
              topic: "zigbee2mqtt/{{ repeat.item }}/set"
              payload: '{"scene_recall":99}'
          - delay: "00:00:02"
          - action: mqtt.publish
            data:
              topic: "zigbee2mqtt/bridge/request/group/members/remove"
              payload: '{"group":"{{ repeat.item }}","device":"Faretto Cucina 1","endpoint":11}'
          - delay: "00:00:02"
  mode: restart

- id: gestione_stato_scena_cinema
  alias: "Cinema — Tracciamento Automatico Stato Scena Cinema"
  description: "Attiva input_boolean.modalita_cinema_attiva quando viene lanciata scene.cinema e lo disattiva quando si accendono le luci principali o si esce dalla modalità cinema."
  triggers:
    - trigger: state
      entity_id: scene.cinema
      id: cinema_on
    - trigger: state
      entity_id:
        - scene.buonanotte
        - scene.scenario_notte
        - scene.preparazione_notte
      id: cinema_off
    - trigger: state
      entity_id:
        - light.luce_sala_2
        - light.luce_cucina
        - light.faretti_cucina
      to: "on"
      id: cinema_off
    - trigger: state
      entity_id:
        - light.luce_ambiente_sala
        - light.luce_mensole_camino
      to: "off"
      id: cinema_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: cinema_on
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.modalita_cinema_attiva
      default:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.modalita_cinema_attiva
  mode: single

- id: tapparelle_chiusura_sempre_fessure_aperte
  alias: "🪟 Tapparelle: Chiusura Sempre con Fessure Aperte (UI, Voce e Pulsanti Fisici)"
  description: >-
    Garantisce che ogni comando di chiusura delle tapparelle (pulsante Chiudi in plancia/pop-up/more-info,
    slider portato a 0%, assistenti vocali o pulsanti fisici a muro BTicino Living Now) fermi e mantenga
    sempre le tapparelle con le fessure aperte calibrate (Sala 8%, Cucina 7%, Cameretta 7%, Camera 6%, Bagno 6%, Bagnetto 6%).
  triggers:
    - trigger: event
      event_type: call_service
      event_data:
        domain: cover
        service: close_cover
      id: close_service
    - trigger: event
      event_type: call_service
      event_data:
        domain: cover
        service: set_cover_position
      id: set_position_service
    - trigger: state
      entity_id:
        - cover.tapparella_sala
        - cover.tapparella_cucina
        - cover.tapparella_camera
        - cover.tapparella_cameretta
        - cover.tapparella_bagno
        - cover.tapparella_bagnetto
      to: "closed"
      id: closed_fallback
    - trigger: state
      entity_id:
        - binary_sensor.tapparella_sala_moving
        - binary_sensor.tapparella_cucina_moving
        - binary_sensor.tapparella_camera_moving
        - binary_sensor.tapparella_cameretta_moving
        - binary_sensor.tapparella_bagno_moving
        - binary_sensor.tapparella_bagnetto_moving
      to: "off"
      id: moving_stopped
  conditions:
    - condition: state
      entity_id: script.scenario_temporale
      state: "off"
  variables:
    fessure_map:
      cover.tapparella_sala: 8
      cover.tapparella_cucina: 7
      cover.tapparella_cameretta: 7
      cover.tapparella_camera: 6
      cover.tapparella_bagno: 6
      cover.tapparella_bagnetto: 6
    moving_to_cover:
      binary_sensor.tapparella_sala_moving: cover.tapparella_sala
      binary_sensor.tapparella_cucina_moving: cover.tapparella_cucina
      binary_sensor.tapparella_cameretta_moving: cover.tapparella_cameretta
      binary_sensor.tapparella_camera_moving: cover.tapparella_camera
      binary_sensor.tapparella_bagno_moving: cover.tapparella_bagno
      binary_sensor.tapparella_bagnetto_moving: cover.tapparella_bagnetto
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: close_service
          sequence:
            - variables:
                raw_target: "{{ trigger.event.data.service_data.entity_id | default([], true) }}"
                target_list: >-
                  {{ ['cover.tapparella_sala', 'cover.tapparella_cucina', 'cover.tapparella_cameretta', 'cover.tapparella_camera', 'cover.tapparella_bagno', 'cover.tapparella_bagnetto']
                     if raw_target == 'all'
                     else ([raw_target] if raw_target is string else (raw_target | list if raw_target is iterable else [])) }}
            - delay:
                milliseconds: 150
            - repeat:
                for_each: "{{ target_list }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ repeat.item in fessure_map }}"
                    then:
                      - action: cover.set_cover_position
                        target:
                          entity_id: "{{ repeat.item }}"
                        data:
                          position: "{{ fessure_map[repeat.item] }}"
                        continue_on_error: true

        - conditions:
            - condition: trigger
              id: set_position_service
            - condition: template
              value_template: >-
                {{ (trigger.event.data.service_data.position | default(100) | int(100)) < 5 }}
          sequence:
            - variables:
                raw_target: "{{ trigger.event.data.service_data.entity_id | default([], true) }}"
                target_list: >-
                  {{ ['cover.tapparella_sala', 'cover.tapparella_cucina', 'cover.tapparella_cameretta', 'cover.tapparella_camera', 'cover.tapparella_bagno', 'cover.tapparella_bagnetto']
                     if raw_target == 'all'
                     else ([raw_target] if raw_target is string else (raw_target | list if raw_target is iterable else [])) }}
            - delay:
                milliseconds: 150
            - repeat:
                for_each: "{{ target_list }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ repeat.item in fessure_map }}"
                    then:
                      - action: cover.set_cover_position
                        target:
                          entity_id: "{{ repeat.item }}"
                        data:
                          position: "{{ fessure_map[repeat.item] }}"
                        continue_on_error: true

        - conditions:
            - condition: trigger
              id: closed_fallback
          sequence:
            - variables:
                target_cover: "{{ trigger.entity_id }}"
                target_pos: "{{ fessure_map.get(target_cover, 7) }}"
            - delay:
                milliseconds: 300
            - action: cover.set_cover_position
              target:
                entity_id: "{{ target_cover }}"
              data:
                position: "{{ target_pos }}"
              continue_on_error: true

        - conditions:
            - condition: trigger
              id: moving_stopped
          sequence:
            - variables:
                target_cover: "{{ moving_to_cover.get(trigger.entity_id, '') }}"
                target_pos: "{{ fessure_map.get(target_cover, 7) }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ target_cover != '' and (
                         is_state(target_cover, 'closed') or
                         (state_attr(target_cover, 'current_position') | int(100)) < 4
                       ) }}
              then:
                - delay:
                    milliseconds: 300
                - action: cover.set_cover_position
                  target:
                    entity_id: "{{ target_cover }}"
                  data:
                    position: "{{ target_pos }}"
                  continue_on_error: true
  mode: parallel
  max: 15

