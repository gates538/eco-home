- id: 'luci_accensione_predefinita_4000k'
  alias: 'Luci: Accensione Predefinita 4000K'
  description: 'Imposta automaticamente la temperatura colore a 4000K (bianco naturale, 250 mireds) all accensione delle luci con bianco dinamico.'
  mode: parallel
  max: 10
  trigger:
    - trigger: state
      entity_id:
        - light.faretti_cucina
        - light.luce_ambiente_sala
        - light.luce_mensole_camino
        - light.luce_mobiletto_camino
      from: 'off'
      to: 'on'
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state.attributes.color_mode in ['color_temp', None]
           and trigger.to_state.attributes.color_temp_kelvin is defined
           and trigger.to_state.attributes.color_temp_kelvin is not none
           and ((trigger.to_state.attributes.color_temp_kelvin | int(4000)) - 4000) | abs > 20 }}
  action:
    - action: light.turn_on
      target:
        entity_id: '{{ trigger.entity_id }}'
      data:
        color_temp_kelvin: 4000

- id: 'telecomando_faretti_cucina_controllo'
  alias: 'Cucina: Telecomando Faretti (Hue Tap Dial)'
  description: 'Controllo reattivo e ultra-fluido faretti cucina da telecomando Philips Hue Tap Dial: Tasto 1 (100%), Tasto 2 (75%), Tasto 3 (50%), Tasto 4 (25%), spegnimento su pressione prolungata, rotella con stepping hardware nativo Zigbee2MQTT e transizioni sovrapposte.'
  mode: queued
  max: 50
  max_exceeded: silent
  trigger:
    - trigger: mqtt
      topic: zigbee2mqtt/Telecomando Faretti Cucina/action
  variables:
    action_val: >-
      {% if trigger.payload is defined and trigger.payload != '' %}
        {% if trigger.payload.startswith('{') %}
          {{ (trigger.payload | from_json).get('action', '') }}
        {% else %}
          {{ trigger.payload }}
        {% endif %}
      {% else %}
        ''
      {% endif %}
  action:
    - choose:
        # --- SPEGNIMENTO SU PRESSIONE PROLUNGATA (QUALSIASI TASTO) ---
        - conditions:
            - condition: template
              value_template: "{{ action_val in ['button_1_hold', 'button_2_hold', 'button_3_hold', 'button_4_hold'] }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/Faretti Cucina/set
                payload: '{"state": "OFF", "transition": 0.4}'

        # --- TASTO 1: 100% (al rilascio del tocco breve, evita doppio invio e flash su hold) ---
        - conditions:
            - condition: template
              value_template: "{{ action_val == 'button_1_press_release' }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/Faretti Cucina/set
                payload: '{"state": "ON", "brightness": 254, "color_temp": 250, "transition": 0.4}'

        # --- TASTO 2: 75% ---
        - conditions:
            - condition: template
              value_template: "{{ action_val == 'button_2_press_release' }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/Faretti Cucina/set
                payload: '{"state": "ON", "brightness": 191, "color_temp": 250, "transition": 0.4}'

        # --- TASTO 3: 50% ---
        - conditions:
            - condition: template
              value_template: "{{ action_val == 'button_3_press_release' }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/Faretti Cucina/set
                payload: '{"state": "ON", "brightness": 127, "color_temp": 250, "transition": 0.4}'

        # --- TASTO 4: 25% ---
        - conditions:
            - condition: template
              value_template: "{{ action_val == 'button_4_press_release' }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/Faretti Cucina/set
                payload: '{"state": "ON", "brightness": 64, "color_temp": 250, "transition": 0.4}'

        # --- ROTELLA: ROTAZIONE A DESTRA (STEPPING HARDWARE NATIVO FLUIDO) ---
        - conditions:
            - condition: template
              value_template: "{{ action_val in ['dial_rotate_right_step', 'dial_rotate_right_slow', 'dial_rotate_right_fast', 'dial_rotate_right'] }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/Faretti Cucina/set
                payload: >-
                  {% set step_up = 56 if action_val == 'dial_rotate_right_fast' else (32 if action_val == 'dial_rotate_right_slow' else 18) %}
                  {% set trans = 0.3 if action_val == 'dial_rotate_right_step' else 0.4 %}
                  {{ {'brightness_step_onoff': step_up, 'transition': trans} | to_json }}

        # --- ROTELLA: ROTAZIONE A SINISTRA (STEPPING HARDWARE NATIVO FLUIDO) ---
        - conditions:
            - condition: template
              value_template: "{{ action_val in ['dial_rotate_left_step', 'dial_rotate_left_slow', 'dial_rotate_left_fast', 'dial_rotate_left'] }}"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.faretti_cucina
                      state: 'on'
                    - condition: template
                      value_template: "{{ state_attr('light.faretti_cucina', 'brightness') | default(254, true) | int <= 8 }}"
                  sequence:
                    - action: mqtt.publish
                      data:
                        topic: zigbee2mqtt/Faretti Cucina/set
                        payload: '{"state": "OFF", "transition": 0.35}'
              default:
                - action: mqtt.publish
                  data:
                    topic: zigbee2mqtt/Faretti Cucina/set
                    payload: >-
                      {% set step_down = -56 if action_val == 'dial_rotate_left_fast' else (-32 if action_val == 'dial_rotate_left_slow' else -18) %}
                      {% set trans = 0.3 if action_val == 'dial_rotate_left_step' else 0.4 %}
                      {{ {'brightness_step': step_down, 'transition': trans} | to_json }}

