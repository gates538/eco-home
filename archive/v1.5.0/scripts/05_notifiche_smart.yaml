              "Scherza dicendo che fissare i ripiani a lungo non farà cucinare la cena da sola, neanche con un incantesimo di Harry Potter.",
              "Fai una battuta su Gatto 2 e Gatto 1 che stanno già pianificando un furto con destrezza tra formaggi e affettati.",
              "Prendila in giro dicendo che i pinguini stanno per bussare alla porta del terrazzo per chiedere ospitalità in cucina.",
