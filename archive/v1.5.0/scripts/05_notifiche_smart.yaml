              "Chiedile con ironia se sta facendo l'inventario dettagliato dei ripiani o se si è persa nei suoi pensieri davanti allo sportello.",
              "Scherza chiedendole se sta cercando un dolcetto o un Babà nascosto (cita il Babà solo in questo spunto)."
            ] | random }}
          {% elif profilo == 'Coppia' %}
