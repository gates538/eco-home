          {% if ospiti_attivi %}
            {{ [
              "Piccolo promemoria dalla cucina: " ~ nome_dispositivo ~ " è rimasta socchiusa da un minuto, prima che Gatto 2 e Gatto 1 vadano a curiosare!",
              "Scusate l'interruzione: " ~ nome_dispositivo ~ " in cucina è ancora aperta da sessanta secondi, potete accompagnarla? Grazie mille!"
            ] | random }}
          {% elif rip_count > 1 %}
            {{ [
              "Sollecito numero " ~ rip_count ~ ": " ~ nome_dispositivo ~ " è ancora aperta! Il compressore sta chiedendo asilo politico, chiudetela subito!",
              "Insisto energicamente: " ~ nome_dispositivo ~ " è spalancata da vari minuti. Pietà per i surgelati e per il contatore elettrico!",
              "Ulteriore avviso per " ~ nome_dispositivo ~ " aperta. Non si richiuderà con la forza del pensiero, andate a chiuderla!"
            ] | random }}
          {% elif p_norm == 'freezer' %}
            {% if profilo == 'Utente 1' %}
              {{ [
                "Ste, la porta del congelatore è aperta da oltre un minuto. Stai tentando di overcloccare i surgelati a meno diciannove gradi?",
                "Allarme freezer per Utente 1! Guardare i ghiaccioli non risolverà i tuoi script, chiudi quello sportello prima del disgelo.",
                "Cù, congelatore spalancato da sessanta secondi. O trovi il gelato al volo o chiudi la porta, le gatte ringraziano."
              ] | random }}
            {% elif profilo == 'Utente 2' %}
              {{ [
                "Regina Utente 2, la porta del congelatore è spalancata da oltre un minuto. I surgelati chiedono aiuto prima di trasformarsi in zuppa.",
                "La, attenzione al freezer aperto. Il freddo polare sta invadendo la cucina e le bollette stanno piangendo.",
                "Utente 2, congelatore aperto da oltre sessanta secondi. Gatto 2 e Gatto 1 sono già pronte all'assalto dei bastoncini di pesce."
              ] | random }}
            {% elif profilo == 'Coppia' %}
              {{ [
                "Pì e Cù, la porta del freezer è aperta da oltre un minuto. Chi di voi due ha deciso di climatizzare la casa col ghiaccio?",
                "Allarme congelatore per Utente 1 e Utente 2! Chiudete quello sportello prima che la cucina si trasformi in una pista di pattinaggio.",
                "Utente 1 e Utente 2, la porta del freezer è spalancata da sessanta secondi. Chiudete prima del collasso termico!"
              ] | random }}
            {% else %}
              {{ [
                "Attenzione, congelatore aperto da un minuto e casa vuota. Le gatte Gatto 2 e Gatto 1 stanno organizzando un raid sottozero?",
                "Allarme freezer aperto con casa vuota! I surgelati rischiano il disgelo, verificare tempestivamente la cucina."
              ] | random }}
            {% endif %}
          {% elif p_norm == 'entrambi' %}
            {{ [
              "Attenzione generale: sia frigo che freezer sono spalancati da oltre un minuto! La cucina non è una cella frigorifera industriale.",
              "Incredibile in cucina, tutte le porte del frigo aperte contemporaneamente. Stiamo preparando una tormenta di neve in salotto?",
              "Allarme rosso in cucina: frigorifero e congelatore spalancati da sessanta secondi. Chiudete quegli sportelli immediatamente!"
            ] | random }}
          {% else %}
            {% if profilo == 'Utente 1' %}
              {{ [
                "Ste, la porta del frigo è aperta da oltre un minuto. Guardare i ripiani non farà comparire magicamente una pizza.",
                "Utente 1, chiudi quel frigorifero! I server si raffreddano con le ventole, non dissipando l'aria fredda dello yogurt.",
                "Cù, la porta del frigo è spalancata. O prendi la birra al volo o Gatto 2 e Gatto 1 organizzano un buffet clandestino."
              ] | random }}
            {% elif profilo == 'Utente 2' %}
              {{ [
                "Utente 2, la porta del frigorifero è aperta da oltre sessanta secondi. La dispensa del fresco reclama la chiusura immediata.",
                "La, contemplare i ripiani del frigo fa solo lievitare la bolletta. Chiudi lo sportello prima che il latte vada a male.",
                "Attenzione Pì, porta del frigo spalancata. Gatto 2 e Gatto 1 hanno già avvistato i formaggi e sono pronte all'attacco."
              ] | random }}
            {% elif profilo == 'Coppia' %}
              {{ [
                "Pì e Cù, la porta del frigorifero è aperta da oltre un minuto. Chiudete prima che il formaggio prenda vita e scappi sul divano.",
                "Utente 1 e Utente 2, chi di voi due ha scambiato il frigorifero per un condizionatore d'aria? Chiudete subito quello sportello!",
                "La sala chiama la cucina: Utente 1 e Utente 2, porta del frigo aperta da sessanta secondi. Decidete il menu e richiudete, grazie."
              ] | random }}
            {% else %}
              {{ [
                "Allarme frigo aperto e casa vuota! Gatto 2 e Gatto 1 sono ufficialmente entrate nel buffet dei formaggi senza permesso.",
                "Porta del frigorifero spalancata da oltre un minuto a casa vuota. Qualcuno ha dimenticato di chiudere lo sportello."
              ] | random }}
            {% endif %}
          {% endif %}
        testo_finale: >-
          {{ (ai_battuta if ai_battuta | length > 15 else fallback_battuta)
             | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
             | replace('Famiglia', '') | replace('Famiglia', '')
             | replace('"', '')
             | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
             | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
             | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
             | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
             | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
             | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
             | trim }}
        tv_on: "{{ is_state('media_player.tv_sala', 'on') }}"
        is_notte: "{{ now().hour >= 23 or now().hour < 7 }}"
        volume_target: "{{ 0.35 if is_notte else 0.70 }}"
        titolo_notifica: >-
          {% if p_norm == 'freezer' %}
            ❄️ Freezer Aperto da >60s!
          {% elif p_norm == 'entrambi' %}
            🚨 Frigo e Freezer Aperti!
          {% else %}
            🧊 Frigo Aperto da >60s!
          {% endif %}

    # 1. NOTIFICHE SMART SU SMARTPHONE
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo == 'Nessuno' }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "⚠️ Allarme: {{ titolo_notifica }} (Casa Vuota)"
                message: "{{ testo_finale }}"
                data:
                  priority: high
                  ttl: 0
                  tag: "porta_frigo_aperta"
              continue_on_error: true
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "⚠️ Allarme: {{ titolo_notifica }} (Casa Vuota)"
                message: "{{ testo_finale }}"
                data:
                  priority: high
                  ttl: 0
                  tag: "porta_frigo_aperta"
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: "{{ profilo == 'Ospiti' }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "{{ titolo_notifica }} (Ospiti in Casa)"
                message: "{{ testo_finale }}"
                data:
                  tag: "porta_frigo_aperta"
                  channel: "Cucina"
              continue_on_error: true
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "{{ titolo_notifica }} (Ospiti in Casa)"
                message: "{{ testo_finale }}"
                data:
                  tag: "porta_frigo_aperta"
                  channel: "Cucina"
              continue_on_error: true
      default:
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ profilo in ['Utente 1', 'Coppia'] }}"
              sequence:
                - action: notify.mobile_app_smartphone_utente_1
                  data:
                    title: "{{ titolo_notifica }}"
                    message: "{{ testo_finale }}"
                    data:
                      tag: "porta_frigo_aperta"
                      channel: "Cucina"
                  continue_on_error: true
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ profilo in ['Utente 2', 'Coppia'] }}"
              sequence:
                - action: notify.mobile_app_smartphone_utente_2
                  data:
                    title: "{{ titolo_notifica }}"
                    message: "{{ testo_finale }}"
                    data:
                      tag: "porta_frigo_aperta"
                      channel: "Cucina"
                  continue_on_error: true

    # 2. ANNUNCIO VOCALE SU NEST HUB SALA (SE ABILITATO)
    - if:
        - condition: template
          value_template: "{{ is_state('input_boolean.annunci_vocali_frigo', 'on') }}"
      then:
        # 1. Prepara audio sala: alza Nest Hub all'80%, mette in pausa o abbassa/muta TV
        - action: script.audio_annuncio_prepara
          continue_on_error: true
        # 2. Riproduzione sintesi vocale su Nest Hub Sala
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: tts.home_assistant_cloud
                  data:
                    media_player_entity_id: media_player.nest_hub_sala
                    message: "{{ testo_finale }}"
                    language: "it-IT"
                    options:
                      voice: "it-IT-Wavenet-A"
                  continue_on_error: true
          default:
            - action: tts.speak
              target:
                entity_id: tts.google_translate_it_lt
              data:
                media_player_entity_id: media_player.nest_hub_sala
                message: "{{ testo_finale }}"
                language: "it"
                options:
                  tld: "it"
              continue_on_error: true
        # 3. Attesa fine annuncio
        - delay:
            seconds: "{{ [7, ((testo_finale | length) / 10) | round(0, 'ceil') | int + 2] | max }}"
        # 4. Ripristino audio sala: rimette play se era in pausa, ripristina volume TV precedente
        - action: script.audio_annuncio_ripristina
          continue_on_error: true

annuncio_buongiorno_ai:
  alias: "Annuncio Buongiorno AI Feriale"
  icon: "mdi:weather-sunset-up"
  mode: single
  sequence:
    # 0. Riattivazione Ossigenatore Acquario al Buongiorno
    - action: switch.turn_on
      target:
        entity_id: switch.presa_ossigenatore_acquario
      continue_on_error: true
    # 0a. Aggiornamento on-demand Traffico Utente 2 (solo se Utente 2 è a casa)
    - if:
        - condition: state
          entity_id: binary_sensor.utente_2_a_casa
          state: "on"
      then:
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.tempo_viaggio_laura_no_autostrada
          continue_on_error: true
        - delay:
            seconds: 2
    # 0b. Recupero Previsioni Meteo Giornaliere e Orarie per il Meteo di Oggi
    - action: weather.get_forecasts
      target:
        entity_id:
          - weather.meteoam_home
          - weather.casa
      data:
        type: daily
      response_variable: meteo_daily
      continue_on_error: true
    - action: weather.get_forecasts
      target:
        entity_id:
          - weather.meteoam_home
          - weather.casa
      data:
        type: hourly
      response_variable: meteo_hourly
      continue_on_error: true
    - variables:
        stefano_home: "{{ is_state('binary_sensor.utente_1_a_casa', 'on') }}"
        laura_home: "{{ is_state('binary_sensor.utente_2_a_casa', 'on') }}"
        profilo: >-
          {% if stefano_home and not laura_home %}
            Utente 1
          {% elif laura_home and not stefano_home %}
            Utente 2
          {% elif stefano_home and laura_home %}
            Coppia
          {% else %}
            Nessuno
          {% endif %}
        giorno_settimana: "{{ ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'][now().weekday()] }}"
        fc_daily: >-
          {{ meteo_daily['weather.casa'].forecast if meteo_daily is defined and 'weather.casa' in meteo_daily and meteo_daily['weather.casa'].forecast | length > 0
          else (meteo_daily['weather.meteoam_home'].forecast if meteo_daily is defined and 'weather.meteoam_home' in meteo_daily and meteo_daily['weather.meteoam_home'].forecast | length > 0
          else (meteo_daily.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([]))) if meteo_daily is defined else [] }}
        fc_hourly: >-
          {{ meteo_hourly['weather.casa'].forecast if meteo_hourly is defined and 'weather.casa' in meteo_hourly and meteo_hourly['weather.casa'].forecast | length > 0
          else (meteo_hourly['weather.meteoam_home'].forecast if meteo_hourly is defined and 'weather.meteoam_home' in meteo_hourly and meteo_hourly['weather.meteoam_home'].forecast | length > 0
          else (meteo_hourly.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([]))) if meteo_hourly is defined else [] }}
        cond_map: >-
          {{ {
            'sunny': 'soleggiato',
            'clear-night': 'sereno',
            'partlycloudy': 'parzialmente nuvoloso',
            'cloudy': 'nuvoloso',
            'rainy': 'piovoso',
            'pouring': 'pioggia battente',
            'lightning': 'temporalesco',
            'lightning-rainy': 'temporale con pioggia',
            'fog': 'nebbioso',
            'windy': 'ventoso',
            'windy-variant': 'molto ventoso',
            'snowy': 'nevoso',
            'snowy-rainy': 'misto pioggia e neve',
            'hail': 'grandine',
            'exceptional': 'allerta meteo'
          } }}
        temp_est: "{{ states('sensor.meteo_temperatura_esterna_effettiva') | default('16') }}"
        temp_est_tts: "{{ temp_est | float(16) | round(0) | int }}"
        temp_int: "{{ states('sensor.temperatura_media') | default('21') }}"
        temp_int_tts: "{{ temp_int | float(21) | round(0) | int }}"
        condizione_raw: "{{ states('sensor.meteo_condizione_effettiva') | default('cloudy') }}"
        condizione: "{{ cond_map.get(condizione_raw, condizione_raw) }}"
        today_fc: "{{ fc_daily[0] if fc_daily | length > 0 else {} }}"
        t_max_oggi: "{{ (today_fc.temperature if today_fc.temperature is defined else (states('sensor.meteo_previsione_temperatura_massima') | float(20))) | round(0) | int }}"
        t_min_oggi: "{{ (today_fc.templow if today_fc.templow is defined else (states('sensor.meteo_previsione_temperatura_minima') | float(12))) | round(0) | int }}"
        cond_oggi_raw: "{{ today_fc.condition | default(condizione_raw) }}"
        cond_oggi: "{{ cond_map.get(cond_oggi_raw, cond_oggi_raw) }}"
        prob_pioggia_oggi: "{{ (today_fc.precipitation_probability | default(0)) | round(0) | int }}"
        vento_oggi: "{{ (today_fc.wind_speed | default(5)) | round(0) | int }}"
        mattina_slice: "{{ fc_hourly[0:5] if fc_hourly is defined and fc_hourly is iterable and fc_hourly | length >= 5 else (fc_hourly if fc_hourly is defined and fc_hourly is iterable else []) }}"
        pomeriggio_slice: "{{ fc_hourly[5:11] if fc_hourly is defined and fc_hourly is iterable and fc_hourly | length >= 11 else [] }}"
        sera_slice: "{{ fc_hourly[11:16] if fc_hourly is defined and fc_hourly is iterable and fc_hourly | length >= 16 else [] }}"
        cond_mattina: >-
          {% set r_m = mattina_slice | selectattr('condition', 'defined') | map(attribute='condition') | select('in', ['pouring', 'lightning-rainy', 'lightning', 'hail', 'rainy']) | list %}
          {% set m_raw = r_m[0] if r_m | length > 0 else (fc_hourly[2].condition if fc_hourly | length > 2 else cond_oggi_raw) %}
          {{ cond_map.get(m_raw, m_raw) }}
        cond_pomeriggio: >-
          {% set r_p = pomeriggio_slice | selectattr('condition', 'defined') | map(attribute='condition') | select('in', ['pouring', 'lightning-rainy', 'lightning', 'hail', 'rainy']) | list %}
          {% set p_raw = r_p[0] if r_p | length > 0 else (fc_hourly[7].condition if fc_hourly | length > 7 else cond_oggi_raw) %}
          {{ cond_map.get(p_raw, p_raw) }}
        cond_sera: >-
          {% set r_s = sera_slice | selectattr('condition', 'defined') | map(attribute='condition') | select('in', ['pouring', 'lightning-rainy', 'lightning', 'hail', 'rainy']) | list %}
          {% set s_raw = r_s[0] if r_s | length > 0 else (fc_hourly[13].condition if fc_hourly | length > 13 else cond_oggi_raw) %}
          {{ cond_map.get(s_raw, s_raw) }}
        piove_oggi: >-
          {{ cond_oggi_raw in ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'hail']
             or cond_mattina in ['piovoso', 'pioggia battente', 'temporalesco', 'temporale con pioggia']
             or cond_pomeriggio in ['piovoso', 'pioggia battente', 'temporalesco', 'temporale con pioggia']
             or cond_sera in ['piovoso', 'pioggia battente', 'temporalesco', 'temporale con pioggia']
             or prob_pioggia_oggi >= 45 }}
        pluvio_raw: "{{ states('sensor.terrazza_pulvirometro_precipitazioni_oggi') }}"
        pluvio_mm: "{{ (pluvio_raw | float(0) | round(1)) if pluvio_raw not in ['unavailable', 'unknown', 'none', ''] else 0.0 }}"
        pluvio_mm_tts: "{{ [1, (pluvio_mm | float(0) | round(0) | int)] | max }}"
        ha_piovuto: "{{ (pluvio_mm | float(0)) > 0.1 or is_state('input_boolean.meteo_pioggia_notturna_rilevata', 'on') }}"
        t_val: "{{ temp_est | float(16) }}"
        rischio_gelo: "{{ t_val <= 3.0 }}"
        rischio_neve: "{{ condizione_raw in ['snowy', 'snowy-rainy', 'hail'] or cond_oggi_raw in ['snowy', 'snowy-rainy', 'hail'] }}"
        dur_no_toll: "{{ states('sensor.tempo_viaggio_laura_no_autostrada') | float(0) | round(0) | int }}"
        dur_std_no_toll: 68
        diff_traffico: "{{ [0, dur_no_toll - dur_std_no_toll] | max }}"
        extra_traffico: "{{ diff_traffico >= 7 }}"
        ricorrenza_oggi: "{{ state_attr('sensor.ricorrenze_e_compleanni_oggi', 'ricorrenza_vocale_oggi') | default('', true) }}"
        spunto_buongiorno_feriale: >-
          {{ [
            "Scherza sul contrasto mattutino delle 7:00: Utente 2 si alza subito scattante mentre Utente 1 fa resistenza passiva sotto le coperte fino alle sette e venti.",
            "Fai una battuta su Gatto 2 e Gatto 1 che hanno dormito appiccicate a Utente 1 tutta la notte e ora vi guardano alzarsi per poi riprendersi tutto il letto per sé.",
            "Prendili in giro sul trauma del distacco dal piumone caldo, proponendo una petizione per abolire la sveglia mattutina.",
            "Scherza sul robot Dobby che è parcheggiato nella sua base lì in camera e vi osserva in silenzio con aria di sfida mentre cercate di aprire gli occhi.",
            "Fai una battuta sulla macchina del caffè in cucina che sta già scaldando i motori per compiere il miracolo quotidiano della rianimazione.",
            "Prendili in giro sul fatto che Utente 2 è freddolosa e vorrebbe uscire avvolta direttamente nel piumone, mentre Utente 1 è caloroso anche appena sveglio.",
            "Fai una battuta spiritosa sul giorno della settimana (" ~ giorno_settimana ~ ") e sul conto alla rovescia psicologico verso il divano di stasera."
          ] | random }}
        ai_prompt: >-
          Sei l'assistente vocale di casa su Google Nest Hub Camera.
          EVENTO: Sveglia mattutina feriale delle ore 07:00, oggi è {{ giorno_settimana }}.
          DESTINATARI: {{ 'Utente 1 e Utente 2 (in coppia chiamali Utente 1 e Utente 2, Cù e Pì, Pì e Cù oppure Utente 1 e Utente 2; VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste" perché nella sintesi vocale suona come "stela" o "laste"!)' if profilo == 'Coppia' else ('Utente 2 (nomignoli affettuosi: La, Utente 2, Pì o Lau)' if profilo == 'Utente 2' else 'Utente 1 (nomignoli affettuosi: Ste o Cù)') }}.
          SPUNTO CREATIVO PER LA BATTUTA INIZIALE DI OGGI: {{ spunto_buongiorno_feriale }}
          METEO ATTUALE IN TERRAZZA: {{ temp_est_tts }} gradi, cielo {{ condizione }}.
          PIOGGIA DI QUESTA NOTTE: {{ ('QUESTA NOTTE HA PIOVUTO! Il pluviometro in terrazza ha registrato circa ' ~ pluvio_mm_tts ~ ' millimetri di pioggia e le strade sono bagnate.') if (ha_piovuto and (pluvio_mm | float(0)) > 0.1) else ("QUESTA NOTTE HA PIOVUTO! Il pluviometro ha rilevato pioggia notturna e l'asfalto è bagnato." if ha_piovuto else 'NESSUNA pioggia questa notte (notte asciutta).') }}
          PREVISIONI METEO COMPLETE DI OGGI:
          - Evoluzione della giornata: al mattino cielo {{ cond_mattina }}, nel pomeriggio {{ cond_pomeriggio }}, in serata {{ cond_sera }} (quadro generale: {{ cond_oggi }}).
          - Temperature previste oggi: minima {{ t_min_oggi }} gradi, massima {{ t_max_oggi }} gradi.
          - Pioggia prevista oggi: probabilità del {{ prob_pioggia_oggi }} percento{{ " (è prevista pioggia nel corso della giornata di oggi, ricorda di prendere l'ombrello!)" if piove_oggi else ' (non sono previste piogge significative oggi)' }}.
          RISCHIO GHIACCIO O NEVE: {{ 'Segnalato rischio di neve' if rischio_neve else ('Rischio ghiaccio con temperatura a ' ~ temp_est_tts ~ ' gradi' if rischio_gelo else 'NESSUN rischio ghiaccio o neve') }}.
          TRAFFICO GOOGLE MAPS VERSO Via Ufficio Centrale (Roma): {{ ("C'è più traffico del solito verso Via Ufficio Centrale: previsti " ~ dur_no_toll ~ ' minuti (' ~ diff_traffico ~ ' minuti di rallentamento rispetto al solito)') if extra_traffico else 'Traffico regolare, nessun ritardo anomalo' }}.
          {%- if ricorrenza_oggi != '' %}
          RICORRENZA O COMPLEANNO DI OGGI: {{ ricorrenza_oggi }}.
          {%- endif %}

          OBIETTIVO:
          Genera un annuncio di buongiorno sarcastico, spiritoso, brillante, sempre diverso e mai ripetitivo che includa TUTTI questi punti nell'ordine (NON citare mai le professioni o i luoghi di lavoro, e NON nominare Gricia, Carbonara o Babà!):
          1. Dai il buongiorno a {{ 'Utente 1 e Utente 2 (oppure Cù e Pì, Pì e Cù, o Utente 1 e Utente 2 — NON dire MAI "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste"!)' if profilo == 'Coppia' else (profilo ~ ' (o usando il suo nomignolo affettuoso)') }} sviluppando con originalità lo SPUNTO CREATIVO indicato sopra.
          2. REGOLA TASSATIVA PIOGGIA NOTTURNA: {{ ('Di\' esplicitamente con le parole "questa notte ha piovuto", indicando che il pluviometro ha registrato circa ' ~ pluvio_mm_tts ~ " millimetri di pioggia e l'asfalto è bagnato.") if (ha_piovuto and (pluvio_mm | float(0)) > 0.1) else ('Di\' esplicitamente con le parole "questa notte ha piovuto" e che l\'asfalto è bagnato.' if ha_piovuto else 'NON menzionare pioggia notturna poiché questa notte non ha piovuto.') }}
          3. REGOLA TASSATIVA METEO ATTUALE E PREVISIONI DI OGGI: Indica la temperatura attuale fuori ({{ temp_est_tts }} gradi, cielo {{ condizione }}) e descrivi OBBLIGATORIAMENTE il meteo previsto per oggi (come sarà il tempo stamattina, oggi pomeriggio e stasera: {{ cond_mattina }} al mattino, {{ cond_pomeriggio }} nel pomeriggio e {{ cond_sera }} in serata, con massima di {{ t_max_oggi }} gradi e probabilità di pioggia del {{ prob_pioggia_oggi }} percento{{ ", avvisando di portare l'ombrello" if piove_oggi else '' }}).
          4. REGOLA TASSATIVA GHIACCIO/NEVE: {{ 'Avvisa del rischio ghiaccio o neve per chi deve guidare.' if (rischio_gelo or rischio_neve) else 'NON menzionare affatto ghiaccio o neve.' }}
          5. REGOLA TASSATIVA TRAFFICO: {{ 'Avvisa che Google Maps rileva più traffico del solito per Utente 2 verso Via Ufficio Centrale con ' ~ dur_no_toll ~ ' minuti stimati.' if extra_traffico else 'NON menzionare affatto il traffico o Via Ufficio Centrale poiché il tragitto è regolare.' }}
          {%- if ricorrenza_oggi != '' %}
          6. REGOLA TASSATIVA RICORRENZA DI OGGI: Ricorda con entusiasmo che {{ ricorrenza_oggi }}!
          {%- endif %}

          REGOLE TASSATIVE DI FORMATO:
          - DIVIETO ASSOLUTO DI COGNOMI: Non pronunciare MAI alcun cognome (non dire MAI "Famiglia" né "Eco Home", di' semplicemente "a casa"). Usa solo il nome di battesimo o i nomignoli affettuosi.
          - NUMERI INTERI: Usa SOLO numeri interi per i gradi (es. "{{ temp_est_tts }} gradi"), MAI virgole e MAI "e mezzo gradi".
          - Lunghezza: tra 65 e 100 parole (dedica almeno due frasi ricche alla pioggia di questa notte e alle previsioni meteo di oggi).
          - Tono sarcastico, frizzante ma affettuoso.
          - Niente emoji, niente elenchi puntati né asterischi, non racchiudere la frase tra doppi apici.
          - APOSTROFI OBBLIGATORI: Usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'ombrello, l'asfalto, l'aria, c'è; NON scrivere MAI "l acqua" o "l ombrello" staccato senza apostrofo!). Italiano parlato naturale per sintesi vocale su Nest Hub Camera.

    - action: ai_task.generate_data
      data:
        entity_id: ai_task.google_ai_task_3
        task_name: "annuncio_buongiorno_feriale"
        instructions: "{{ ai_prompt }}"
      response_variable: ai_bg_resp
      continue_on_error: true

    - variables:
        ai_battuta: >-
          {% if ai_bg_resp is defined and ai_bg_resp is mapping and 'data' in ai_bg_resp and (ai_bg_resp.data | trim | length) > 20 %}
            {{ ai_bg_resp.data | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        frase_pioggia: >-
          {% if ha_piovuto and (pluvio_mm | float(0)) > 0.1 %}
             Questa notte ha piovuto: il pluviometro in terrazza ha registrato circa {{ pluvio_mm_tts }} millimetri di pioggia e l'asfalto è bagnato.
          {% elif ha_piovuto %}
             Questa notte ha piovuto e l'asfalto è bagnato.
          {% else %}
            {{ '' }}
          {% endif %}
        frase_meteo_oggi: >-
           Per il meteo di oggi sono previsti cielo {{ cond_mattina }} al mattino, {{ cond_pomeriggio }} nel pomeriggio e {{ cond_sera }} in serata, con temperature tra {{ t_min_oggi }} e {{ t_max_oggi }} gradi e probabilità di pioggia del {{ prob_pioggia_oggi }} percento{{ ", quindi tenete l'ombrello a portata di mano" if piove_oggi else '' }}.
        frase_gelo: "{{ ' Attenzione al possibile ghiaccio sulle strade con ' ~ temp_est_tts ~ ' gradi.' if rischio_gelo else (' Attenzione alla neve.' if rischio_neve else '') }}"
        frase_traffico: "{{ ' Utente 2, Google Maps segnala traffico intenso verso Via Ufficio Centrale: ' ~ dur_no_toll ~ ' minuti stimati.' if extra_traffico else '' }}"
        frase_ricorrenza: "{{ ' Vi ricordo inoltre che ' ~ ricorrenza_oggi ~ '!' if ricorrenza_oggi != '' else '' }}"
        fallback_battuta: >-
          {% if profilo == 'Utente 1' %}
            Buongiorno Ste, è {{ giorno_settimana }}! Fuori in terrazza ci sono {{ temp_est_tts }} gradi con cielo {{ condizione }}.{{ frase_pioggia }}{{ frase_meteo_oggi }}{{ frase_gelo }}{{ frase_traffico }}{{ frase_ricorrenza }} Buona giornata!
          {% elif profilo == 'Utente 2' %}
            Buongiorno La, benvenuta nel tuo {{ giorno_settimana }}! Fuori ci sono {{ temp_est_tts }} gradi e cielo {{ condizione }}.{{ frase_pioggia }}{{ frase_meteo_oggi }}{{ frase_gelo }}{{ frase_traffico }}{{ frase_ricorrenza }} Buona giornata!
          {% else %}
            Buongiorno Utente 1 e Utente 2, è {{ giorno_settimana }}! Fuori in terrazza ci sono {{ temp_est_tts }} gradi con cielo {{ condizione }}, e il piumone vi saluta con rimpianto.{{ frase_pioggia }}{{ frase_meteo_oggi }}{{ frase_gelo }}{{ frase_traffico }}{{ frase_ricorrenza }} Buona giornata a entrambi!
          {% endif %}
        testo_finale: >-
          {{ (ai_battuta if ai_battuta | length > 20 else fallback_battuta)
             | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
             | replace('Famiglia', '') | replace('Famiglia', '')
             | replace('"', '')
             | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
             | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
             | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
             | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
             | regex_replace('(\\d+)\\s+e\\s+mezzo\\s+gradi', '\\1 gradi')
             | regex_replace('(\\d+)\\s*(?:virgola|\\.|,)\\s*\\d+', '\\1')
             | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
             | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
             | trim }}

    # Imposta flag traffico segnalato per abilitare gli aggiornamenti delle 07:20 e 07:40
    - if:
        - condition: template
          value_template: "{{ extra_traffico }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.buongiorno_traffico_segnalato
          continue_on_error: true
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.buongiorno_traffico_segnalato
          continue_on_error: true

    # 1. NOTIFICHE PUSH SMARTPHONE
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo in ['Utente 1', 'Coppia'] }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "🌅 Buongiorno {{ giorno_settimana }}!"
                message: "{{ testo_finale }}"
                data:
                  tag: "buongiorno_mancini"
                  channel: "Sveglia"
              continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo in ['Utente 2', 'Coppia'] }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "🌅 Buongiorno {{ giorno_settimana }}!"
                message: "{{ testo_finale }}"
                data:
                  tag: "buongiorno_mancini"
                  channel: "Sveglia"
              continue_on_error: true

    # 2. ANNUNCIO VOCALE SU NEST HUB CAMERA
    - action: media_player.turn_on
      target:
        entity_id: media_player.nest_hub_camera
      continue_on_error: true
    - delay:
        milliseconds: 500
    - action: media_player.volume_mute
      target:
        entity_id: media_player.nest_hub_camera
      data:
        is_volume_muted: false
      continue_on_error: true
    - action: media_player.volume_set
      target:
        entity_id: media_player.nest_hub_camera
      data:
        volume_level: 0.70
      continue_on_error: true
    - delay:
        milliseconds: 600
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
          sequence:
            - action: tts.speak
              target:
                entity_id: tts.home_assistant_cloud
              data:
                media_player_entity_id: media_player.nest_hub_camera
                message: "{{ testo_finale }}"
                language: "it-IT"
                options:
                  voice: "it-IT-Wavenet-A"
              continue_on_error: true
      default:
        - action: tts.speak
          target:
            entity_id: tts.google_translate_it_lt
          data:
            media_player_entity_id: media_player.nest_hub_camera
            message: "{{ testo_finale }}"
            language: "it"
            options:
              tld: "it"
          continue_on_error: true

annuncio_buonanotte_ai:
  alias: "Annuncio Buonanotte AI (Avvia Buonanotte)"
  icon: "mdi:bed-clock"
  mode: single
  sequence:
    - action: script.buonanotte_scenario_notte

annuncio_rifiuti_ore_21_ai:
  alias: "Annuncio Promemoria Spazzatura Ore 21 AI"
  icon: "mdi:trash-can"
  mode: single
  sequence:
    - variables:
        cal_summary: "{{ state_attr('calendar.raccolta_rifiuti', 'message') | default('') }}"
        sensor_state: "{{ states('sensor.raccolta_rifiuti') | default('') }}"
        types: "{{ state_attr('sensor.raccolta_rifiuti', 'collection_types') }}"
        days_rem: "{{ state_attr('sensor.raccolta_rifiuti', 'days_remaining') | int(0) }}"
        ha_ritiro: >-
          {{ (is_state('calendar.raccolta_rifiuti', 'on') and days_rem == 0) or (sensor_state not in ['unknown', 'unavailable', 'none', '', 'Nessun Ritiro', 'Nessuna raccolta programmata'] and days_rem == 0) }}

    # Se stasera non ci sono bidoni da esporre, interrompi subito senza annunci o notifiche
    - condition: template
      value_template: "{{ ha_ritiro }}"

    - variables:
        nome_bidone: >-
          {% if types is defined and types is iterable and types | length > 0 %}
            {{ types | join(' e ') }}
          {% elif cal_summary != '' %}
            {{ cal_summary }}
          {% else %}
            {{ sensor_state }}
          {% endif %}
        stefano_home: "{{ is_state('binary_sensor.utente_1_a_casa', 'on') }}"
        laura_home: "{{ is_state('binary_sensor.utente_2_a_casa', 'on') }}"
        profilo: >-
          {% if stefano_home and not laura_home %}
            Utente 1
          {% elif laura_home and not stefano_home %}
            Utente 2
          {% elif stefano_home and laura_home %}
            Coppia
          {% else %}
            Nessuno
          {% endif %}
        temp_est: "{{ states('sensor.meteo_temperatura_esterna_effettiva') | default('16') }}"
        t_val: "{{ temp_est | float(16) }}"
        temp_est_tts: "{{ t_val | round(0) | int }}"
        fa_freddo: "{{ t_val <= 12.0 }}"
        piove_ora: "{{ is_state('binary_sensor.meteo_piove_ora', 'on') or (states('sensor.meteo_pioggia_attuale_effettiva') | float(0) > 0.05) }}"
        vento_val: "{{ states('sensor.meteo_vento_attuale_effettivo') | default('0') | float(0) | round(0) | int }}"
        molto_vento: "{{ vento_val >= 18 }}"
        spunto_rifiuti: >-
          {% if profilo == 'Coppia' %}
            {{ [
              "Proponi una sfida all'ultimo sangue a morra cinese tra Utente 1 e Utente 2 per decidere chi dei due deve alzarsi dal divano per portare fuori il mastello.",
              "Prendili in giro dicendo che fare finta di dormire sul divano o mimetizzarsi con i cuscini non farà sparire magicamente il bidone.",
              "Scherza sul fatto che nemmeno i poteri magici di Harry Potter o le automazioni domotiche di Utente 1 possono teletrasportare la spazzatura in strada.",
              "Fai una battuta dicendo che Gatto 2 e Gatto 1 hanno già votato all'unanimità: tocca agli umani uscire al fresco mentre loro presidiano il divano.",
              "Scherza chiedendo chi dei due farà l'eroe della serata affrontando le scale con il sacchetto in mano."
            ] | random }}
          {% elif profilo == 'Utente 1' %}
            {{ [
              "Prendilo in giro dicendo che ha automatizzato tutta la casa ma non ha ancora costruito una catapulta smart o un drone per lanciare il mastello.",
              "Scherza dicendogli di staccarsi un attimo dagli schermi e fare questi trenta secondi di cardio serale giù per le scale.",
              "Fai una battuta dicendo che Dobby si rifiuta categoricamente di portare giù i bidoni, quindi tocca a lui."
            ] | random }}
          {% else %}
            {{ [
              "Prendila in giro chiedendole se vorrebbe usare l'incantesimo Wingardium Leviosa per far volare il bidone giù dalle scale senza uscire.",
              "Scherza dicendo che una micro-passeggiata serale per esporre il mastello renderà il ritorno sotto la copertina sul divano ancora più bello.",
              "Fai una battuta dicendo che Gatto 2 e Gatto 1 le fanno il tifo dalla finestra mentre compie la missione differenziata."
            ] | random }}
          {% endif %}
        ai_prompt: >-
          Sei l'assistente vocale di casa su Google Nest Hub Sala.
          EVENTO: Ore 21:00 serali, promemoria raccolta differenziata spazzatura.
          DESTINATARI: {{ 'Utente 1 e Utente 2 (in coppia chiamali Utente 1 e Utente 2, Cù e Pì, Pì e Cù oppure Utente 1 e Utente 2; VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste" perché nella sintesi vocale suona come "stela" o "laste"!)' if profilo == 'Coppia' else ('Utente 2 (nomignoli affettuosi: La, Utente 2 o Pì)' if profilo == 'Utente 2' else 'Utente 1 (nomignoli affettuosi: Ste o Cù)') }}.
          STATO BIDONE STASERA: Stasera va esposto il bidone di: {{ nome_bidone }}.
          SPUNTO CREATIVO DA USARE STASERA: {{ spunto_rifiuti }}
          METEO ATTUALE FUORI:
          - Temperatura: {{ temp_est_tts }} gradi ({{ 'FA FREDDO: avvisa di coprirsi bene!' if fa_freddo else 'Clima mite' }}).
          - Pioggia: {{ "STA PIOVENDO IN QUESTO MOMENTO: avvisa di prendere l'ombrello per uscire!" if piove_ora else 'NON piove' }}.
          - Vento: {{ 'TIRA MOLTO VENTO (' ~ vento_val ~ ' km/h): occhio che il bidone non voli via!' if molto_vento else 'Vento calmo' }}.

          OBIETTIVO:
          Genera un annuncio comico, sarcastico, vivace, vario ma utile:
          1. Ricorda quale bidone va portato fuori stasera ({{ nome_bidone }}) sviluppando con brio lo SPUNTO CREATIVO indicato sopra (usa i nomi/nomignoli corretti; NON dire MAI "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste", e NON nominare cibo come Gricia, Carbonara o Babà!).
          2. CONDIZIONI METEO TASSATIVE:
          - {{ "Avvisa obbligatoriamente che fuori sta piovendo e serve l'ombrello." if piove_ora else 'NON menzionare la pioggia.' }}
          - {{ 'Avvisa obbligatoriamente che tira molto vento (occhio ai bidoni che volano).' if molto_vento else 'NON menzionare il vento.' }}
          - {{ 'Avvisa obbligatoriamente che fuori fa freddo e bisogna coprirsi bene.' if fa_freddo else 'NON menzionare il freddo.' }}

          REGOLE TASSATIVE:
          - DIVIETO ASSOLUTO DI COGNOMI: Non pronunciare MAI alcun cognome (non dire MAI "Famiglia" né "Eco Home", di' semplicemente "a casa"). Usa solo il nome di battesimo o i nomignoli affettuosi.
          - Temperature e numeri: Usa SOLO numeri interi per i gradi, MAI cifre con la virgola e MAI "e mezzo gradi".
          - Lunghezza: tra 25 e 36 parole.
          - Tono sarcastico, scherzoso ed energico.
          - Niente emoji, non racchiudere la frase tra doppi apici, usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'ombrello, l'aria, c'è, all'aperto; NON scrivere MAI "l acqua" o "l ombrello" staccato senza apostrofo!), parlato naturale italiano per sintesi vocale su Nest Hub Sala.

    - action: ai_task.generate_data
      data:
        entity_id: ai_task.google_ai_task_3
        task_name: "annuncio_rifiuti_sera"
        instructions: "{{ ai_prompt }}"
      response_variable: ai_rifiuti_resp
      continue_on_error: true

    - variables:
        ai_battuta: >-
          {% if ai_rifiuti_resp is defined and ai_rifiuti_resp is mapping and 'data' in ai_rifiuti_resp and (ai_rifiuti_resp.data | trim | length) > 20 %}
            {{ ai_rifiuti_resp.data | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        meteo_warn: >-
          {% set parts = [] %}
          {% if piove_ora %}{% set parts = parts + ["sta piovendo quindi prendete l'ombrello"] %}{% endif %}
          {% if molto_vento %}{% set parts = parts + ['tira molto vento'] %}{% endif %}
          {% if fa_freddo %}{% set parts = parts + ['fa parecchio freddo con ' ~ temp_est_tts ~ ' gradi'] %}{% endif %}
          {% if parts | length > 0 %}
            Fuori {{ parts | join(' e ') }}.
          {% else %}
            Fuori il clima è tranquillo.
          {% endif %}
        fallback_battuta: >-
          {% if profilo == 'Coppia' %}
            Ore ventuno: Utente 1 e Utente 2, stasera va esposto il bidone di {{ nome_bidone }}. {{ meteo_warn }} Chi dei due si sacrifica stasera per la missione bidone? Non fate finta di dormire!
          {% elif profilo == 'Utente 1' %}
            Ste, promemoria delle ventuno: stasera tocca al bidone di {{ nome_bidone }}. {{ meteo_warn }} Stacca gli occhi dagli schermi e vai a conferire prima che sia tardi!
          {% else %}
            La, promemoria delle ventuno: stasera c'è da portare fuori {{ nome_bidone }}. {{ meteo_warn }} Una veloce missione all'aperto prima del meritato relax serale!
          {% endif %}
        testo_finale: >-
          {{ (ai_battuta if ai_battuta | length > 20 else fallback_battuta)
             | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
             | replace('Famiglia', '') | replace('Famiglia', '')
             | replace('"', '')
             | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
             | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
             | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
             | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
             | regex_replace('(\\d+)\\s+e\\s+mezzo\\s+gradi', '\\1 gradi')
             | regex_replace('(\\d+)\\s*(?:virgola|\\.|,)\\s*\\d+', '\\1')
             | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
             | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
             | trim }}
        tv_on: "{{ is_state('media_player.tv_sala', 'on') }}"

    # 1. NOTIFICHE PUSH SMARTPHONE
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo in ['Utente 1', 'Coppia', 'Nessuno'] }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "🗑️ Promemoria Spazzatura: {{ nome_bidone }}"
                message: "{{ testo_finale }}"
                data:
                  tag: "promemoria_rifiuti"
                  channel: "Casa"
              continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo in ['Utente 2', 'Coppia', 'Nessuno'] }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "🗑️ Promemoria Spazzatura: {{ nome_bidone }}"
                message: "{{ testo_finale }}"
                data:
                  tag: "promemoria_rifiuti"
                  channel: "Casa"
              continue_on_error: true

    # 2. ANNUNCIO VOCALE SU NEST HUB SALA (SE QUALCUNO È IN CASA)
    - if:
        - condition: template
          value_template: "{{ profilo != 'Nessuno' }}"
      then:
        # 1. Prepara audio sala: alza Nest Hub all'80%, mette in pausa o abbassa/muta TV
        - action: script.audio_annuncio_prepara
          continue_on_error: true
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: tts.home_assistant_cloud
                  data:
                    media_player_entity_id: media_player.nest_hub_sala
                    message: "{{ testo_finale }}"
                    language: "it-IT"
                    options:
                      voice: "it-IT-Wavenet-A"
                  continue_on_error: true
          default:
            - action: tts.speak
              target:
                entity_id: tts.google_translate_it_lt
              data:
                media_player_entity_id: media_player.nest_hub_sala
                message: "{{ testo_finale }}"
                language: "it"
                options:
                  tld: "it"
              continue_on_error: true
        - delay:
            seconds: "{{ [7, ((testo_finale | length) / 10) | round(0, 'ceil') | int + 2] | max }}"
        # 2. Ripristino audio sala: rimette play se era in pausa, ripristina volume TV precedente
        - action: script.audio_annuncio_ripristina
          continue_on_error: true

notifica_smart:
  alias: "Notifica Smart Eco Home"
  icon: "mdi:bell-badge"
  description: Motore unificato per l'invio intelligente di notifiche push prioritario sull'App Companion (Utente 1 & Utente 2)
  mode: parallel
  max: 20
  fields:
    titolo:
      description: Titolo della notifica con eventuale emoji
      example: ⚡ Allerta Blackout
      required: true
    messaggio:
      description: Corpo del messaggio
      example: Assorbimento oltre 6 kW! Spegnere i carichi pesanti.
      required: true
    canale:
      description: "Canale di destinazione: 'tutti', 'tutti_telefoni', 'utente_1', 'utente_2'"
      default: tutti
    priorita:
      description: "Livello di priorità: 'critica', 'alta', 'normale', 'bassa'"
      default: normale
    categoria:
      description: "Categoria: 'sicurezza', 'energia', 'elettrodomestici', 'meteo', 'rifiuti', 'pet', 'generale'"
      default: generale
    immagine:
      description: URL o percorso immagine / snapshot telecamera
      example: /api/camera_proxy/camera.scale
    azioni:
      description: Pulsanti interattivi per smartphone (Actionable notifications)
    tag:
      description: Identificativo univoco facoltativo per raggruppamento o sostituzione (omettere per notifiche distinte)
      example: blackout_alert
  sequence:
    - variables:
        target_channel: >-
          {% if canale is defined and canale not in ['', none] %}
            {{ canale }}
          {% else %}
            tutti_telefoni
          {% endif %}
        cat: "{{ categoria | default('generale') }}"
        prio: "{{ priorita | default('normale') }}"
        is_critical: "{{ prio == 'critica' }}"
        cat_enabled: >-
          {% if is_critical %}true
          {% elif states('input_boolean.notifiche_' ~ cat) in ['on', 'off'] %}
            {{ is_state('input_boolean.notifiche_' ~ cat, 'on') }}
          {% else %}true{% endif %}
        should_send: "{{ cat_enabled }}"
        click_target: >-
          {% if url is defined and url not in ['', none] %}
            {{ url }}
          {% elif clickAction is defined and clickAction not in ['', none] %}
            {{ clickAction }}
          {% elif cat == 'sicurezza' %}
            /eco-home/sicurezza
          {% elif cat == 'meteo' %}
            /eco-home/meteo
          {% else %}
            /eco-home/panoramica
          {% endif %}
        final_actions: >-
          {% set ns = namespace(acts=[]) %}
          {% if azioni is defined and azioni is iterable and azioni | length > 0 %}
            {% for a in azioni %}
              {% if a.uri is defined or a.url is defined or a.action in ['URI', 'APRI_SICUREZZA', 'APRI_METEO'] %}
                {% set u = a.uri | default(a.url | default('/eco-home/sicurezza')) %}
                {% set ns.acts = ns.acts + [{'action': 'URI', 'title': a.title, 'uri': u, 'url': u}] %}
              {% else %}
                {% set ns.acts = ns.acts + [{'action': a.action, 'title': a.title}] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.acts }}
    - condition: template
      value_template: "{{ should_send }}"
    - parallel:
        - sequence:
            - condition: template
              value_template: "{{ target_channel in ['tutti', 'tutti_telefoni', 'utente_1'] }}"
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "{{ titolo }}"
                message: "{{ messaggio }}"
                data:
                  tag: "{{ tag if tag is defined and tag not in ['', none] else none }}"
                  ttl: 0
                  priority: "{% if is_critical or prio == 'alta' or cat in ['pet', 'sicurezza', 'energia', 'meteo', 'clima', 'elettrodomestici', 'pompa_calore'] %}high{% else %}normal{% endif %}"
                  importance: "{% if is_critical or prio == 'alta' or cat in ['pet', 'sicurezza', 'energia', 'meteo', 'clima', 'elettrodomestici', 'pompa_calore'] %}high{% else %}high{% endif %}"
                  channel: "{% if is_critical %}Allarmi Critici{% elif cat == 'meteo' %}Allerte Meteo{% elif cat == 'pet' %}Gattaiola e Pet Care{% elif cat == 'sicurezza' %}Sicurezza Casa{% elif cat in ['clima', 'pompa_calore', 'pdc'] %}Clima e Riscaldamento{% elif cat in ['elettrodomestici', 'elettrodomestico'] %}Elettrodomestici{% elif prio == 'alta' %}Importanti{% else %}Generale{% endif %}"
                  alert_once: false
                  image: "{{ immagine | default('') }}"
                  clickAction: "{{ click_target }}"
                  url: "{{ click_target }}"
                  actions: "{{ final_actions }}"
              continue_on_error: true
        - sequence:
            - condition: template
              value_template: "{{ target_channel in ['tutti', 'tutti_telefoni', 'utente_2'] }}"
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "{{ titolo }}"
                message: "{{ messaggio }}"
                data:
                  tag: "{{ tag if tag is defined and tag not in ['', none] else none }}"
                  ttl: 0
                  priority: "{% if is_critical or prio == 'alta' or cat in ['pet', 'sicurezza', 'energia', 'meteo', 'clima', 'elettrodomestici', 'pompa_calore'] %}high{% else %}normal{% endif %}"
                  importance: "{% if is_critical or prio == 'alta' or cat in ['pet', 'sicurezza', 'energia', 'meteo', 'clima', 'elettrodomestici', 'pompa_calore'] %}high{% else %}high{% endif %}"
                  channel: "{% if is_critical %}Allarmi Critici{% elif cat == 'meteo' %}Allerte Meteo{% elif cat == 'pet' %}Gattaiola e Pet Care{% elif cat == 'sicurezza' %}Sicurezza Casa{% elif cat in ['clima', 'pompa_calore', 'pdc'] %}Clima e Riscaldamento{% elif cat in ['elettrodomestici', 'elettrodomestico'] %}Elettrodomestici{% elif prio == 'alta' %}Importanti{% else %}Generale{% endif %}"
                  alert_once: false
                  image: "{{ immagine | default('') }}"
                  clickAction: "{{ click_target }}"
                  url: "{{ click_target }}"
                  actions: "{{ final_actions }}"
              continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: "{{ (titolo ~ ': ' ~ messaggio) | truncate(250, true, '') }}"
      continue_on_error: true
    - action: logbook.log
      data:
        name: "{{ titolo }}"
        message: "{{ messaggio }}"
        entity_id: script.notifica_smart
      continue_on_error: true

seleziona_accoglienza_ospite:
  alias: "Ospiti: Seleziona Accoglienza One-Shot"
  description: "Attiva o disattiva l'accoglienza personalizzata con toni dolci per l'ospite selezionato o personalizzato."
  mode: single
  fields:
    ospite:
      description: "Nome dell'ospite (Zia (Piano Superiore), Mamma, Familiare 2, Familiare 4, Familiare 5, Coppia Familiari 1, Familiare 6, Familiare 7, Coppia Familiari 2, Coppia Familiari 3, Familiare 13, Coppia Amici 1, Coppia Amici 2, Coppia Colleghi 1, Coppia Colleghi 2, Gruppo Ospiti Famiglia, Coppia Ospiti 1, Nessuno, Personalizzato)"
      example: "Zia (Piano Superiore)"
  sequence:
    - variables:
        attuale: "{{ states('input_text.ospite_in_attesa') }}"
        target_name_raw: >-
          {% if ospite == 'Personalizzato' %}
            {{ states('input_text.ospite_personalizzato_nome') | trim }}
          {% else %}
            {{ ospite | trim }}
          {% endif %}
        target_name: >-
          {% set cleaned = target_name_raw
             | regex_replace('(?i)\\bde\\s+santis\\b', '')
             | regex_replace('(?i)\\bserioli\\b', '')
             | regex_replace('(?i)\\bmancini\\b', '')
             | regex_replace('\\s+', ' ')
             | trim %}
          {% set parts = cleaned.split() %}
          {% if parts | length == 0 %}
            {{ '' }}
          {% elif ',' in cleaned %}
            {{ cleaned }}
          {% elif parts | length >= 3 and parts[1] | lower == 'e' %}
            {{ parts[0] ~ ' e ' ~ parts[2] }}
          {% elif parts[0] | lower in ['zia', 'zio', 'nonna', 'nonno'] and parts | length >= 2 %}
            {{ parts[0] ~ ' ' ~ parts[1] }}
          {% else %}
            {{ parts[0] }}
          {% endif %}
        nuovo: "{{ 'Nessuno' if (target_name == attuale or target_name in ['Nessuno', '']) else target_name }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.ospite_in_attesa
      data:
        value: "{{ nuovo }}"
    - if:
        - condition: template
          value_template: "{{ nuovo in ['Nessuno', 'Zia (Piano Superiore)', 'Mamma', 'Familiare 2', 'Familiare 4', 'Familiare 5', 'Coppia Familiari 1', 'Familiare 6', 'Familiare 7', 'Coppia Familiari 2', 'Coppia Familiari 3', 'Familiare 13', 'Coppia Amici 1', 'Coppia Amici 2', 'Coppia Colleghi 1', 'Coppia Colleghi 2', 'Gruppo Ospiti Famiglia', 'Coppia Ospiti 1'] }}"
      then:
        - action: input_select.select_option
          target:
            entity_id: input_select.accoglienza_ospite_one_shot
          data:
            option: "{{ nuovo }}"
          continue_on_error: true
      else:
        - action: input_select.select_option
          target:
            entity_id: input_select.accoglienza_ospite_one_shot
          data:
            option: "Nessuno"
          continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ nuovo != 'Nessuno' }}"
      then:
        - action: timer.start
          target:
            entity_id: timer.accoglienza_ospite_timeout
          data:
            duration: "02:00:00"
      else:
        - action: timer.cancel
          target:
            entity_id: timer.accoglienza_ospite_timeout
          continue_on_error: true

annuncio_ospite_ai:
  alias: "Ospiti: Annuncio Vocale AI di Benvenuto su Nest Hub"
  description: "Genera e riproduce tramite Google Gemini un benvenuto a toni dolcissimi, affettuosi e calorosi per l'ospite selezionato."
  mode: single
  fields:
    ospite:
      description: "Nome dell'ospite (Zia (Piano Superiore), Mamma, Familiare 2, Familiare 4, Familiare 5, Coppia Familiari 1, Familiare 6, Familiare 7, Coppia Familiari 2, Coppia Familiari 3, Familiare 13, Coppia Amici 1, Coppia Amici 2, Coppia Colleghi 1, Coppia Colleghi 2, Gruppo Ospiti Famiglia, Coppia Ospiti 1)"
      example: "Zia (Piano Superiore)"
  sequence:
    - variables:
        ospite_raw: "{{ (ospite | default('Ospite', true)) | trim }}"
        ospite_nome: >-
          {% set cleaned = ospite_raw
             | regex_replace('(?i)\\bde\\s+santis\\b', '')
             | regex_replace('(?i)\\bserioli\\b', '')
             | regex_replace('(?i)\\bmancini\\b', '')
             | regex_replace('\\s+', ' ')
             | trim %}
          {% set parts = cleaned.split() %}
          {% if parts | length == 0 %}
            Ospite
          {% elif ',' in cleaned %}
            {{ cleaned }}
          {% elif parts | length >= 3 and parts[1] | lower == 'e' %}
            {{ parts[0] ~ ' e ' ~ parts[2] }}
          {% elif parts[0] | lower in ['zia', 'zio', 'nonna', 'nonno'] and parts | length >= 2 %}
            {{ parts[0] ~ ' ' ~ parts[1] }}
          {% else %}
            {{ parts[0] }}
          {% endif %}
        temp_int: "{{ (states('sensor.temperatura_media') | default(states('sensor.temperatura_media_sala'), true) | float(21.0)) | round(0) | int }}"
        temp_int_pronuncia: "{{ temp_int }}"
        in_casa_ste_laura: "{{ is_state('person.utente_1', 'home') or is_state('person.utente_2', 'home') }}"
        usa_nick_domenico: "{{ [false, false, true] | random }}"
        desc_ospite: >-
          {% if ospite_nome == 'Zia (Piano Superiore)' %}
            Zia (Piano Superiore), la carissima zia di famiglia che abita al piano superiore ed è appena scesa a trovarci a casa nostra (e che il 29 ottobre 2026 si sposa con Familiare 4!).
          {% elif ospite_nome == 'Mamma' %}
            La Mamma (Familiare 1), persona speciale e dolcissima di casa, che amiamo tantissimo{% if not in_casa_ste_laura %} e che mentre Utente 1 e Utente 2 sono via è passata con tanto amore a dare un'occhiata a casa, alle gattine Gatto 1 e Gatto 2 e all'acquario{% else %} e che è venuta a trovarci{% endif %}.
          {% elif ospite_nome == 'Familiare 2' %}
            Familiare 2, il fratello di Utente 1, accolto con grandissimo affetto familiare a casa nostra{% if not in_casa_ste_laura %}, passato mentre Utente 1 e Utente 2 sono via a dare un'occhiata a casa, alle gattine Gatto 1 e Gatto 2 e all'acquario{% endif %}.
          {% elif ospite_nome == 'Familiare 4' %}
            Familiare 4, lo zio acquisito compagno di Zia (Piano Superiore) (che si sposano il 29 ottobre 2026!), accolto con grandissimo affetto familiare.
          {% elif ospite_nome == 'Familiare 5' %}
            Familiare 5, la carissima fidanzata di Familiare 2, accolta con grandissimo affetto familiare a casa nostra.
          {% elif ospite_nome == 'Coppia Familiari 1' %}
            Familiare 2 (il fratello di Utente 1) e la sua fidanzata Familiare 5, accolti con grandissimo affetto familiare a casa nostra{% if not in_casa_ste_laura %}, passati mentre Utente 1 e Utente 2 sono via a dare un'occhiata a casa, alle gattine Gatto 1 e Gatto 2 e all'acquario{% endif %}.
          {% elif ospite_nome == 'Familiare 6' %}
            Familiare 6, la dolcissima mamma di Utente 2, venuta da Roma a trovarci con tanto affetto.
          {% elif ospite_nome == 'Familiare 7' %}
            Familiare 7, il fratello minore di Utente 2, accolto a braccia aperte e con tantissimo affetto a casa nostra.
          {% elif ospite_nome == 'Coppia Familiari 2' %}
            Familiare 8 (la sorella di Utente 2) e suo marito Familiare 9, accolti con grandissima gioia e affetto familiare a casa nostra.
          {% elif ospite_nome == 'Coppia Familiari 3' %}
            Familiare 10 (il papà di Utente 2) e la sua compagna Familiare 11, venuti da Roma a trovarci e accolti con grandissimo affetto.
          {% elif ospite_nome == 'Familiare 13' %}
            Familiare 13, il cugino di Utente 1 e Familiare 2, accolto con grande piacere a casa nostra.
          {% elif ospite_nome == 'Coppia Amici 1' %}
            Coppia Amici 1, gli amici del cuore di Utente 1 e Utente 2 (Amico 1 ha anche celebrato ufficialmente il matrimonio di Utente 1 e Utente 2, e sono i genitori dei piccoli Bimbo 1 e Bimbo 2!), accolti con gioia immensa.
          {% elif ospite_nome == 'Coppia Amici 2' %}
            Amico 2 (testimone di nozze e amico fraterno di Utente 1) e Amica 2 (genitori della gatto_1 Bimba 1), venuti da lontano a trovarci e accolti con gioia immensa.
          {% elif ospite_nome == 'Coppia Colleghi 1' %}
            Coppia Colleghi 1, persone carissime e di famiglia, accolti con grandissimo affetto e stima a casa nostra.
          {% elif ospite_nome == 'Coppia Colleghi 2' %}
            Coppia Colleghi 2 (genitori del piccolo Bimbo 3 e della gatto_1 Bimba 2 nata da pochissimo il 14 ottobre 2026!), accolti con grandissimo affetto e gioia a casa nostra.
          {% elif ospite_nome == 'Gruppo Ospiti Famiglia' %}
            Ospite 1{% if usa_nick_domenico %} (chiamato con simpatia e affetto anche "il Ospite del Nord": nel saluto chiamalo pure "Ospite 1, il nostro Ospite del Nord"){% endif %} (figlio di zia Luciana sorella di nonno Sergio e di zio Antonio, cugino di primo grado di Mamma e di Zia (Piano Superiore)), sua moglie Ospite 2 e i loro figli Ospite 3 e Ospite 4, i carissimi parenti scesi dal Nord Italia (da Città Ospiti, in provincia di Brescia) dopo un lungo viaggio come nostri ospiti a casa (anche per festeggiare il matrimonio di Zia (Piano Superiore) e Familiare 4!), accolti a braccia aperte e con grandissima gioia nella casa che era di nonno Sergio e nonna Anna.
          {% elif ospite_nome == 'Coppia Ospiti 1' %}
            Ospite 1{% if usa_nick_domenico %} (chiamato con simpatia e affetto anche "il Ospite del Nord": nel saluto chiamalo pure "Ospite 1, il nostro Ospite del Nord"){% endif %} (cugino di Mamma e di Zia (Piano Superiore), figlio di zia Luciana sorella di nonno Sergio) e sua moglie Ospite 2, scesi da Città Ospiti (Brescia) come nostri carissimi parenti ospiti a casa nostra insieme a Ospite 3 e Ospite 4, accolti con grandissimo affetto e calore familiare.
          {% elif ospite_nome == 'Ospite 1' %}
            Ospite 1{% if usa_nick_domenico %} (chiamato con simpatia e affetto anche "il Ospite del Nord": nel saluto chiamalo pure "Ospite 1, il nostro Ospite del Nord"){% endif %} (cugino di Mamma e di Zia (Piano Superiore), figlio di zia Luciana sorella di nonno Sergio), venuto da Città Ospiti (Brescia) come carissimo parente ospite a casa nostra insieme a Ospite 2, Ospite 3 e Ospite 4, accolto con grandissimo affetto familiare.
          {% elif ospite_nome == 'Ospite 2' %}
            Ospite 2 (moglie di Ospite 1), venuta da Città Ospiti (Brescia) come carissima parente ospite a casa nostra insieme a Ospite 1, Ospite 3 e Ospite 4, accolta con grandissimo affetto familiare.
          {% elif ospite_nome == 'Ospite 3' %}
            Ospite 3 (figlia di Coppia Ospiti 1), venuta da Città Ospiti (Brescia) come carissima ospite di famiglia a casa nostra insieme a Ospite 1, Ospite 2 e Ospite 4, accolta con tantissimo affetto e simpatia.
          {% elif ospite_nome == 'Ospite 4' %}
            Ospite 4 (figlio di Coppia Ospiti 1), venuto da Città Ospiti (Brescia) come carissimo ospite di famiglia a casa nostra insieme a Ospite 1, Ospite 2 e Ospite 3, accolto con tantissimo affetto e simpatia.
          {% else %}
            {{ ospite_nome }}, carissimo ospite benvenuto a casa nostra.
          {% endif %}
        ai_prompt: >-
          Sei l'assistente vocale di casa su Google Nest Hub Sala.
          Chi è appena entrato dalla porta: {{ ospite_nome }} ({{ desc_ospite }}).
          SITUAZIONE IN CASA:
          {% if in_casa_ste_laura -%}
          - Utente 1 e Utente 2 sono a casa pronti ad accoglierla/o/li.
          - Le gattine Gatto 2 e Gatto 1 sono tranquille.
          {% elif ospite_nome in ['Mamma', 'Familiare 2', 'Coppia Familiari 1'] -%}
          - Utente 1 e Utente 2 in questo momento sono fuori casa / via, e {{ ospite_nome }} è passata/o/i a dare un'occhiata a casa, alle gattine Gatto 1 e Gatto 2 e ai pesciolini dell'acquario.
          {% else -%}
          - Le gattine Gatto 2 e Gatto 1 sono a casa tranquille.
          {% endif %}
          OBIETTIVO:
          Formula un annuncio vocale di benvenuto ESTREMAMENTE DOLCE, CALOROSO, AFFETTUOSO E PREMUROSO per {{ ospite_nome }}:
          1. Tono TASSATIVO: dolcissimo, gentile, pieno di affetto, accogliente e familiare. NESSUN sarcasmo, nessuna presa in giro.
          2. Saluta calorosamente SOLO per nome ("{{ ospite_nome }}"{% if usa_nick_domenico and 'Ospite 1' in ospite_nome %}, chiamando con affetto Ospite 1 anche "il nostro Ospite del Nord"{% endif %}), {% if not in_casa_ste_laura and ospite_nome in ['Mamma', 'Familiare 2', 'Coppia Familiari 1'] %}ringraziando di cuore da parte di Utente 1 e Utente 2 per essere passati a prendersi cura di casa, di Gatto 1 e Gatto 2 e dell'acquario{% else %}esprimendo quanto sia bello e piacevole averla/o/li qui a casa con noi{% endif %}.
          3. Invita con dolcezza a mettersi comoda/o/i e a sentirsi a casa.
          
          REGOLE TASSATIVE:
          - DIVIETO ASSOLUTO DI COGNOMI: Non pronunciare MAI alcun cognome (non dire MAI "Famiglia", "Eco Home", "Famiglia" o "Famiglia", né alcun cognome dell'ospite; di' semplicemente "a casa" o "qui con noi").
          - NON citare gradi o temperature.
          - Lunghezza massima: tra 18 e 28 parole.
          - Niente emoji, niente elenchi, niente preamboli, non racchiudere la frase tra doppi apici.
          - APOSTROFI OBBLIGATORI: Usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'acquario, un'occhiata, c'è; NON scrivere MAI "l acquario" o "l acqua" staccato senza apostrofo!).
          - Italiano parlato naturale, dolce e melodico per Nest Hub Sala.
    - action: ai_task.generate_data
      target: {}
      data:
        entity_id: ai_task.google_ai_task_3
        task_name: "annuncio_ospite_dolce"
        instructions: "{{ ai_prompt }}"
      response_variable: ai_resp
      continue_on_error: true
    - variables:
        ai_text: >-
          {% if ai_resp is defined and ai_resp is mapping and 'data' in ai_resp and (ai_resp.data | trim | length) > 15 %}
            {{ ai_resp.data | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        fallback_text: >-
          {% if ospite_nome == 'Zia (Piano Superiore)' %}
            {{ [
              'Benvenuta Zia (Piano Superiore)! Che gioia averti qui con noi. Mettiti comoda e sentiti a casa tua.',
              'Ciao Zia (Piano Superiore), benvenuta! È sempre un piacere immenso quando passi a trovarci. Entra pure, mettiti comoda.',
              'Carissima Zia (Piano Superiore), benvenuta a casa! Ci fa sempre tantissimo piacere vederti. Ben arrivata!'
            ] | random }}
          {% elif ospite_nome == 'Mamma' and not in_casa_ste_laura %}
            {{ "Benvenuta mamma! Grazie di cuore da parte di Utente 1 e Utente 2 per essere passata a dare un'occhiata a casa, a Gatto 1, a Gatto 2 e all'acquario. Sentiti a casa tua!" }}
          {% elif ospite_nome == 'Mamma' %}
            {{ [
              'Benvenuta mamma! Che bello averti qui con noi. Mettiti comoda e rilassati.',
              'Ciao mamma, benvenuta! È una gioia grandissima vederti. Ti accogliamo a casa con tutto il cuore.',
              'Ben arrivata mamma! Sentiti come sempre a casa tua. È sempre una festa averti qui.'
            ] | random }}
          {% elif ospite_nome == 'Familiare 2' and not in_casa_ste_laura %}
            {{ "Ciao Familiare 2, benvenuto! Grazie di cuore da parte di Utente 1 e Utente 2 per essere passato a controllare casa, Gatto 1, Gatto 2 e l'acquario. Fai come fossi a casa tua!" }}
          {% elif ospite_nome == 'Familiare 2' %}
            {{ [
              'Ciao Familiare 2, benvenuto a casa! È sempre un piacere enorme averti qui. Mettiti comodo e rilassati.',
              'Benvenuto Familiare 2! Ti accogliamo a braccia aperte. Mettiti comodo, sei a casa tua.',
              'Ciao Familiare 2, ben arrivato! È un piacere averti qui con noi oggi. Mettiti pure a tuo agio.'
            ] | random }}
          {% elif ospite_nome == 'Familiare 4' %}
            {{ [
              'Ciao Familiare 4, benvenuto a casa! È un vero piacere averti qui con noi. Mettiti comodo e fai come fossi a casa tua.',
              'Benvenuto Familiare 4! Ti accogliamo con grandissimo affetto. Mettiti comodo e rilassati.',
              'Ciao Familiare 4, ben arrivato! Felici di averti qui. Sentiti assolutamente a casa.'
