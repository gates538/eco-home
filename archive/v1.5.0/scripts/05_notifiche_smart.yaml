  sequence:
    - action: weather.get_forecasts
      target:
        entity_id:
          - weather.meteoam_home
          - weather.casa
      data:
        type: daily
      response_variable: meteo_daily
      continue_on_error: true
    - variables:
        giorno_settimana: "{{ ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'][now().weekday()] }}"
        fc_daily: >-
          {{ meteo_daily['weather.casa'].forecast if meteo_daily is defined and 'weather.casa' in meteo_daily and meteo_daily['weather.casa'].forecast | length > 0
          else (meteo_daily['weather.meteoam_home'].forecast if meteo_daily is defined and 'weather.meteoam_home' in meteo_daily and meteo_daily['weather.meteoam_home'].forecast | length > 0
          else []) if meteo_daily is defined else [] }}
        cond_map: >-
          {{ {
            'sunny': 'soleggiato',
            'clear-night': 'sereno',
            'partlycloudy': 'parzialmente nuvoloso',
            'cloudy': 'nuvoloso',
            'rainy': 'piovoso',
            'pouring': 'pioggia battente',
            'lightning': 'temporalesco',
            'lightning-rainy': 'temporale con pioggia',
            'fog': 'nebbioso',
            'windy': 'ventoso',
            'windy-variant': 'molto ventoso',
            'snowy': 'nevoso',
            'snowy-rainy': 'misto pioggia e neve',
            'hail': 'grandine'
          } }}
        temp_est: "{{ states('sensor.meteo_temperatura_esterna_effettiva') | default('16') }}"
        temp_est_tts: "{{ temp_est | float(16) | round(0) | int }}"
        condizione_raw: "{{ states('sensor.meteo_condizione_effettiva') | default('cloudy') }}"
        condizione: "{{ cond_map.get(condizione_raw, condizione_raw) }}"
        today_fc: "{{ fc_daily[0] if fc_daily | length > 0 else {} }}"
        prev_max: "{{ (today_fc.temperature if today_fc.temperature is defined else (states('sensor.meteo_previsione_temperatura_massima') | float(20))) | round(0) | int }}"
        prev_min: "{{ (today_fc.templow if today_fc.templow is defined else (states('sensor.meteo_previsione_temperatura_minima') | float(12))) | round(0) | int }}"
        cond_oggi_raw: "{{ today_fc.condition | default(condizione_raw) }}"
        cond_oggi: "{{ cond_map.get(cond_oggi_raw, cond_oggi_raw) }}"
        prob_pioggia: "{{ (today_fc.precipitation_probability | default(0)) | round(0) | int }}"
        pluvio_raw: "{{ states('sensor.terrazza_pulvirometro_precipitazioni_oggi') }}"
        pluvio_mm: "{{ (pluvio_raw | float(0) | round(1)) if pluvio_raw not in ['unavailable', 'unknown', 'none', ''] else 0.0 }}"
        pluvio_mm_tts: "{{ [1, (pluvio_mm | float(0) | round(0) | int)] | max }}"
        ha_piovuto: "{{ (pluvio_mm | float(0)) > 0.1 or is_state('input_boolean.meteo_pioggia_notturna_rilevata', 'on') }}"
        frase_pioggia_notte: >-
          {% if ha_piovuto and (pluvio_mm | float(0)) > 0.1 %}
             Questa notte ha piovuto, con circa {{ pluvio_mm_tts }} millimetri registrati dal pluviometro.
          {% elif ha_piovuto %}
             Questa notte ha piovuto e l'asfalto è bagnato.
          {% else %}
            {{ '' }}
          {% endif %}
        usa_nick_domenico: "{{ [false, false, true] | random }}"
        saluto_sveglia: >-
          {% if is_state('input_boolean.modalita_ospiti_cameretta', 'on') %}
            {{ 'Buongiorno a Ospite 1 il Ospite del Nord, e a Ospite 2, Ospite 3 e Ospite 4!' if usa_nick_domenico else 'Buongiorno Gruppo Ospiti Famiglia!' }}
          {% else %}
            Buongiorno!
          {% endif %}
        frase_ospiti_matrimonio: >-
          {% if now().month == 10 and now().day == 29 %}
             Oggi è il grande giorno del matrimonio di Zia (Piano Superiore) e Familiare 4, auguri di cuore e buona festa a tutti!
          {% elif is_state('input_boolean.modalita_ospiti_cameretta', 'on') %}
             Speriamo abbiate riposato benissimo, fate come se foste a casa vostra!
          {% else %}
            {{ '' }}
          {% endif %}
        testo_sveglia: >-
          {{ saluto_sveglia }} Sono le {{ now().strftime('%H:%M') }} di {{ giorno_settimana }}. Fuori ci sono attualmente {{ temp_est_tts }} gradi con cielo {{ condizione }}.{{ frase_pioggia_notte }} Per la giornata di oggi è previsto cielo {{ cond_oggi }}, con temperature tra i {{ prev_min }} e i {{ prev_max }} gradi e probabilità di pioggia del {{ prob_pioggia }} percento.{{ frase_ospiti_matrimonio }} Buona giornata!
    - action: media_player.turn_on
      target:
        entity_id: media_player.nest_hub_cameretta
      continue_on_error: true
    - action: media_player.volume_mute
      target:
        entity_id: media_player.nest_hub_cameretta
      data:
        is_volume_muted: false
      continue_on_error: true
    - action: media_player.volume_set
      target:
        entity_id: media_player.nest_hub_cameretta
      data:
        volume_level: 0.65
      continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
          sequence:
            - action: tts.speak
              target:
                entity_id: tts.home_assistant_cloud
              data:
                media_player_entity_id: media_player.nest_hub_cameretta
                message: "{{ testo_sveglia }}"
                language: "it-IT"
                options:
                  voice: "it-IT-Wavenet-A"
              continue_on_error: true
      default:
        - action: tts.speak
          target:
            entity_id: tts.google_translate_it_lt
          data:
            media_player_entity_id: media_player.nest_hub_cameretta
            message: "{{ testo_sveglia }}"
            language: "it"
            options:
              tld: "it"
          continue_on_error: true

pillola_sarcastica_nesthub:
  alias: "Pillole Sarcastiche Random su Nest Hub (Voce Femminile)"
  description: "Riproduce pillole vocali spontanee, random e sarcastiche sui Nest Hub con voce femminile (silenzio in sala, buio e tapparelle chiuse, TV accesa da ore, TV spenta da ore, ora di andare a letto alle 23, o presa in giro spontanea)."
  icon: "mdi:emoticon-devil-outline"
  mode: single
  fields:
    tema:
      description: "Tema della pillola (auto, silenzio_sala, buio_vampiri, tv_maratona, tv_spenta, ora_nanna_23, random_spontaneo)"
      example: "auto"
      default: "auto"
  sequence:
    - variables:
        wd: "{{ now().weekday() }}"
        ora: "{{ now().hour }}"
        minuto: "{{ now().minute }}"
        finestra_oraria_valida: >-
          {% if ora >= 23 %}
            false
          {% elif wd in [5, 6] and ora < 11 %}
            false
          {% elif wd in [0, 1, 2, 3, 4] and ora < 9 %}
            false
          {% else %}
            true
          {% endif %}
        cinema_attivo: >-
          {{ is_state('input_boolean.modalita_cinema_attiva', 'on') or
             (is_state('light.luce_ambiente_sala', 'on') and
              is_state('light.luce_mensole_camino', 'on') and
              (state_attr('light.luce_ambiente_sala', 'brightness') | int(255) <= 65) and
              (state_attr('light.luce_mensole_camino', 'brightness') | int(255) <= 65) and
              is_state('light.luce_sala_2', 'off') and
              is_state('light.luce_cucina', 'off')) }}
        stefano_home: "{{ is_state('binary_sensor.utente_1_a_casa', 'on') }}"
        laura_home: "{{ is_state('binary_sensor.utente_2_a_casa', 'on') }}"
        almeno_uno_in_casa: "{{ stefano_home or laura_home }}"

    - condition: template
      value_template: >-
        {{ finestra_oraria_valida and
           (not cinema_attivo) and
           almeno_uno_in_casa and
           is_state('input_boolean.pillole_sarcastiche_nesthub', 'on') and
           is_state('input_boolean.modalita_ospiti_cameretta', 'off') }}

    - variables:
        chi_in_casa: >-
          {% if stefano_home and laura_home %}
            Coppia
          {% elif stefano_home %}
            Utente 1
          {% else %}
            Utente 2
          {% endif %}
        nomi_target: >-
          {% if chi_in_casa == 'Coppia' %}
            Utente 1 e Utente 2 (chiamali affettuosamente Utente 1 e Utente 2, Cù e Pì, Pì e Cù oppure Utente 1 e Utente 2; VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La", "La, Ste" o "Cù e Là" perché nella sintesi vocale suona come "stela" o "laste"!)
          {% elif chi_in_casa == 'Utente 1' %}
            Utente 1 (chiamalo affettuosamente Ste, Cù oppure Utente 1; è in casa da solo mentre Utente 2 è fuori)
          {% else %}
            Utente 2 (chiamala affettuosamente La, Utente 2, Pì oppure Utente 2; è in casa da sola mentre Utente 1 è fuori)
          {% endif %}
        saluto_fallback: >-
          {% if chi_in_casa == 'Coppia' %}
            {{ ['Ehi Cù e Pì', 'Ohi Utente 1 e Utente 2', 'Ehi voi due', 'Ehi Pì e Cù'][range(0, 4) | random] }}
          {% elif chi_in_casa == 'Utente 1' %}
            {{ ['Ehi Utente 1', 'Ohi Cù', 'Ehi Utente 1'][range(0, 3) | random] }}
          {% else %}
            {{ ['Ehi Utente 2', 'Ohi Pì', 'Ehi Utente 2', 'Ehi Utente 2'][range(0, 4) | random] }}
          {% endif %}
        noise_db: "{{ states('sensor.sala_stazione_meteo_sala_noise_2') | int(45) }}"
        luci_accese: "{{ states('sensor.numero_luci_accese') | int(0) }}"
        tapparelle_aperte: "{{ states('sensor.numero_tapparelle_aperte') | int(0) }}"
        tv_on: "{{ is_state('media_player.tv_sala_principale', 'on') or is_state('media_player.tv_sala_principale', 'playing') or not is_state('media_player.tv_sala', 'off') }}"
        tv_ore_stato: >-
          {% if states.media_player.tv_sala_principale is defined and states.media_player.tv_sala_principale.last_changed is defined %}
            {{ ((now() - states.media_player.tv_sala_principale.last_changed).total_seconds() / 3600) | round(1) }}
          {% else %}
            1.0
          {% endif %}
        tema_scelto: >-
          {% set t = tema | default('auto') %}
          {% if t != 'auto' %}
            {{ t }}
          {% elif ora == 22 and minuto >= 40 and is_state('input_boolean.pillola_ora_nanna_23', 'on') %}
            ora_nanna_23
          {% elif luci_accese == 0 and tapparelle_aperte == 0 and is_state('input_boolean.pillola_buio_tapparelle', 'on') %}
            buio_vampiri
          {% elif tv_on and (tv_ore_stato | float(0)) >= 3.0 and is_state('input_boolean.pillola_tv_maratona', 'on') %}
            tv_maratona
          {% elif noise_db <= 41 and is_state('input_boolean.pillola_silenzio_sala', 'on') %}
            silenzio_sala
          {% elif (not tv_on) and (tv_ore_stato | float(0)) >= 4.0 and is_state('input_boolean.pillola_tv_spenta', 'on') %}
            tv_spenta
          {% else %}
            random_spontaneo
          {% endif %}
        tema_abilitato: >-
          {% if tema_scelto == 'silenzio_sala' %}
            {{ is_state('input_boolean.pillola_silenzio_sala', 'on') }}
          {% elif tema_scelto == 'buio_vampiri' %}
            {{ is_state('input_boolean.pillola_buio_tapparelle', 'on') }}
          {% elif tema_scelto == 'tv_maratona' %}
            {{ is_state('input_boolean.pillola_tv_maratona', 'on') }}
          {% elif tema_scelto == 'tv_spenta' %}
            {{ is_state('input_boolean.pillola_tv_spenta', 'on') }}
          {% elif tema_scelto == 'ora_nanna_23' %}
            {{ is_state('input_boolean.pillola_ora_nanna_23', 'on') }}
          {% else %}
            {{ is_state('input_boolean.pillola_random_spontanea', 'on') }}
          {% endif %}

    - condition: template
      value_template: "{{ tema_abilitato }}"

    - variables:
        spunto_pillola: >-
          {% if tema_scelto == 'silenzio_sala' %}
            {{ [
              "Scherza sul fatto che fanno più rumore i 7 neon, le 7 rasbore e i 2 Corydoras nell'acquario che loro due: chiedi se stanno comunicando telepaticamente.",
              "Prendili in giro chiedendo se Gatto 2 e Gatto 1 li hanno presi in ostaggio sul divano vietando loro di parlare.",
              "Fai una battuta chiedendo se si stanno scrivendo messaggini dal divano come ai tempi delle chat su MSN nel 2008 invece di parlare a voce.",
              "Scherza dicendo che c'è talmente tanto silenzio che i sensori della casa si stavano chiedendo se foste diventati due statue di cera.",
              "Prendili in giro chiedendo se stanno giocando a chi resiste più a lungo senza muovere un muscolo sul divano.",
              "Chiedi con ironia se sono crollati in un pisolino sincronizzato sul divano."
            ] | random }}
          {% elif tema_scelto == 'buio_vampiri' %}
            {{ [
              "Prendili in giro chiedendo se si sono ufficialmente trasformati in pipistrelli o vampiri nella bat-caverna.",
              "Scherza chiedendo se stanno cercando di risparmiare cinquanta centesimi sulla bolletta della luce o se fanno fotosintesi al contrario.",
              "Fai una battuta dicendo che a questo livello di buio solo Gatto 2 (che è tutta nera) riesce a mimetizzarsi perfettamente.",
              "Prendili in giro chiedendo se devo ordinare dei visori notturni militari nella lista della spesa Conad per farvi muovere in casa.",
              "Scherza chiedendo se state evocando gli spiriti al buio o se semplicemente nessuno dei due aveva voglia di allungare un dito per accendere le luci."
            ] | random }}
          {% elif tema_scelto == 'tv_maratona' %}
            {{ [
              "Prendili in giro dicendo che la TV da 85 pollici sta chiedendo pietà, ferie retribuite e l'intervento del sindacato degli schermi.",
              "Scherza sul fatto che il divano ha ormai preso il loro calco anatomico perfetto e tra poco diventeranno parte dell'arredamento.",
              "Fai una battuta chiedendo se stanno cercando di finire tutto il catalogo mondiale di Netflix in un solo giorno.",
              "Prendili in giro dicendo che persino il telecomando ha chiesto il cambio per sfinimento.",
              "Scherza dicendo che siete incollati lì da più tempo di quanto ci avete messo nel traffico da incubo del viaggio di nozze a Località Costiera!",
              "Fai una battuta dicendo che i pesciolini dell'acquario ormai stanno seguendo la trama della serie TV insieme a voi."
            ] | random }}
          {% elif tema_scelto == 'tv_spenta' %}
            {% if wd == 5 and is_state('light.luce_cameretta', 'on') %}
              {{ [
                "Prendi in giro Utente 1 che sicuramente si è barricato al PC in cameretta a smanettare con server, script e domotica invece di accendere il cinema in salotto.",
                "Scherza dicendo che la TV in sala è spenta perché Utente 1 è chiuso in cameretta a creare qualche nuovo progetto al computer o a fare un record a Pac-Man!",
                "Fai una battuta sul fatto che la luce in cameretta è accesa: chiedi a Utente 1 quale nuovo sensore o automazione sta inventando stasera."
              ] | random }}
            {% else %}
              {{ [
                "Prendili in giro con finto stupore: avete un cinema da 85 pollici appeso al muro e lo tenete spento per conversare amabilmente come nell'Ottocento?",
                "Scherza dicendo che la TV da 85 pollici si sente trascurata e sta pensando di accendersi da sola per farvi compagnia.",
                "Fai una battuta chiedendo se avete perso il telecomando tra i cuscini del divano o se oggi c'è sciopero generale degli schermi."
              ] | random }}
            {% endif %}
          {% elif tema_scelto == 'ora_nanna_23' %}
            {% if wd == 5 %}
              {{ [
                "Salutali con ironia dicendo che per me scatta il silenzio stampa delle 23, ma so già che essendo sabato sera farete le ore piccole tra serie TV e Utente 1 al PC in cameretta!",
                "Fai una battuta dicendo che alle 23 io spengo il microfono, mentre per voi inizia la vera notte brava casalinga tra salotto e progetti al computer in cameretta."
              ] | random }}
            {% else %}
              {{ [
                "Prendili in giro dicendo che, visto che in settimana andate sempre a letto presto e non arrivate mai a mezzanotte, è ora di schiodarsi dal divano!",
                "Scherza dicendo che Dobby e le gatte vi stanno già aspettando in camera da letto e tra poco scatta il mio silenzio stampa delle 23.",
                "Fai una battuta dicendo che se non vi alzate subito dal divano rischiate di addormentarvi lì fino a domattina."
              ] | random }}
            {% endif %}
          {% else %}
            {{ [
              "Scherza sul fatto che in questa casa ci sono più router, sensori e telecamere che nella centrale operativa della NASA, ma le vere padrone restano Gatto 2 e Gatto 1.",
              "Prendili in giro sulla differenza termica di coppia: Utente 1 sempre caloroso a maniche corte e Utente 2 sempre freddolosa pronta a coprirsi.",
              "Fai una battuta sull'acquario in sala: chiedi se avete mai notato che i 7 neon, le 7 rasbore e i 2 Corydoras vi giudicano in silenzio mentre state sul divano.",
              "Scherza su Dobby (l'elfo domestico aspirapolvere in camera) che lavora più di tutti in questa casa e prima o poi chiederà un calzino per essere liberato come in Harry Potter.",
              "Prendili in giro chiedendo chi dei due ha il controllo supremo del telecomando in questo momento.",
              "Fai una battuta nostalgica e divertente ricordando che vi siete conosciuti in chat su MSN nel 2008 e oggi vivete circondati da assistenti vocali che vi prendono in giro.",
              "Scherza sul vostro matrimonio celebrato dall'amico Amico 1 a Location Evento: chiedi se anche allora avevate firmato una clausola sul diritto al divano!",
              "Fai una battuta chiedendo se state già sognando il prossimo weekend di relax alla SPA Silva Splendid a Località Termale.",
              "Scherza sul loro debole per i dolci chiedendo se per caso c'è un Babà nascosto da qualche parte in cucina.",
              "Prendi in giro Utente 1 chiedendo se sta già pensando a quale prossimo dispositivo smart aggiungere alla rete di casa.",
              "Scherza su Gatto 1 e Gatto 2 chiedendo dove si sono spaparanzate adesso (sul divano, sul letto o nel lavandino del bagnetto)."
            ] | random }}
          {% endif %}
        contesto_tema: >-
          {% if tema_scelto == 'silenzio_sala' %}
            Il rilevatore di rumore della stazione meteo in sala segna appena {{ noise_db }} decibel da un bel po' di tempo (silenzio tombale in casa).
          {% elif tema_scelto == 'buio_vampiri' %}
            In questo momento tutte le luci di casa sono spente (0 luci accese) e tutte le tapparelle sono chiuse (0 tapparelle aperte).
          {% elif tema_scelto == 'tv_maratona' %}
            La TV da 85 pollici in sala è accesa ininterrottamente da circa {{ tv_ore_stato }} ore!
          {% elif tema_scelto == 'tv_spenta' %}
            La TV da 85 pollici in sala è spenta da oltre {{ tv_ore_stato }} ore mentre sono in casa!
          {% elif tema_scelto == 'ora_nanna_23' %}
            Sono le {{ now().strftime('%H:%M') }}, quasi le 23:00 (orario in cui per l'assistente vocale scatta il silenzio notturno)!
          {% else %}
            È un'incursione vocale completamente spontanea e random alle {{ now().strftime('%H:%M') }} (rumore in sala {{ noise_db }} dB, {{ luci_accese }} luci accese, TV {{ 'accesa' if tv_on else 'spenta' }}{% if is_state('binary_sensor.camino_in_funzione', 'on') %}, Termocamino Klover acceso in sala{% endif %}).
          {% endif %}
        fallback_msg: >-
          {% if tema_scelto == 'silenzio_sala' %}
            {{ [
              saluto_fallback ~ '... colpo di tosse! Il rilevatore di rumore in sala segna appena ' ~ noise_db ~ ' decibel. Siete diventati due statue di cera o state comunicando col pensiero?',
              saluto_fallback ~ ", ci siete ancora? C'è un silenzio così assurdo in sala che tra poco sento pure i pensieri delle gatte Gatto 2 e Gatto 1. Battete un colpo!",
              saluto_fallback ~ ", calma piatta sul fonometro della sala! Fanno più rumore i neon e le rasbore nell'acquario che voi due!"
            ] | random }}
          {% elif tema_scelto == 'buio_vampiri' %}
            {{ [
              saluto_fallback ~ ', tutte le luci spente e tutte le tapparelle chiuse... vi siete ufficialmente trasferiti nella caverna di Batman o siete diventati vampiri?',
              saluto_fallback ~ ', ma ci vedete qualcosa lì dentro? Zero luci accese e tapparelle giù: neanche le talpe vivono così al buio!',
              saluto_fallback ~ ', complimenti per il risparmio energetico estremo: tapparelle chiuse e luci tutte spente. Vi mando i visori notturni?'
            ] | random }}
          {% elif tema_scelto == 'tv_maratona' %}
            {{ [
              saluto_fallback ~ ', quella povera TV da ottantacinque pollici è accesa da ore e sta chiedendo ferie sindacali. Il divano ha ufficialmente preso la vostra forma!',
              saluto_fallback ~ ', maratona olimpica di divano oggi? La televisione è accesa da così tante ore che i pixel stanno chiedendo pietà!',
              saluto_fallback ~ ", staccate gli occhi dallo schermo per cinque secondi! La TV è accesa da ore, tra poco vi chiede l'affitto del salotto!"
            ] | random }}
          {% elif tema_scelto == 'tv_spenta' %}
            {{ [
              saluto_fallback ~ ', tutto bene? La TV in sala è spenta da ore! Avete un cinema da ottantacinque pollici e lo usate come quadro da parete?',
              saluto_fallback ~ ', incredibile ma vero: siete in casa e la televisione è spenta da ore. State parlando tra di voi come nel milleottocento?',
              saluto_fallback ~ ", la TV si sente trascurata, è spenta da un'eternità! Che succede, sciopero del telecomando oggi?"
            ] | random }}
          {% elif tema_scelto == 'ora_nanna_23' %}
            {% if wd == 5 %}
              {{ [
                saluto_fallback ~ ', sono quasi le ventitré di sabato sera! Io vado in silenzio stampa, ma so già che tra film sul divano e Utente 1 al PC in cameretta a smanettare con la domotica farete le ore piccole!',
                saluto_fallback ~ ', scatta il mio coprifuoco delle ventitré! Buon sabato sera casalingo tra maratona serie TV e sessione notturna di progetti e Pac-Man al computer in cameretta!',
                saluto_fallback ~ ', sono quasi le undici! Io spengo il microfono per la notte, voi godetevi il vostro sabato sera tra cinema in salotto e PC in cameretta fino a tardi!'
              ] | random }}
            {% else %}
              {{ [
                saluto_fallback ~ ', sono quasi le ventitré! È ora di staccarsi dal divano e andare a letto, prima che vi debbano raccogliere col cucchiaino!',
                saluto_fallback ~ ', avviso di sfratto dal salotto: sono quasi le undici di sera, filate a nanna che alle ventitré io vado in silenzio stampa!',
                saluto_fallback ~ ', tic tac, sono quasi le ventitré! Il letto vi chiama e il divano vi implora di lasciarlo respirare: tutti a nanna!'
              ] | random }}
            {% endif %}
          {% else %}
            {{ [
              saluto_fallback ~ "! Volevo solo ricordarvi che vi tengo d'occhio e che in questa casa le vere padrone restano comunque Gatto 2 e Gatto 1!",
              saluto_fallback ~ ', controllo qualità del relax in corso! Tutto regolare o avete già messo radici sul divano?',
              saluto_fallback ~ ", incursione a sorpresa! Tra tutti questi sensori e router sembra di stare alla NASA, ma almeno sul divano si sta comodi!",
              saluto_fallback ~ "! Dobby mi ha appena confidato dalla camera che se fate cadere un'altra briciola chiede ufficialmente le ferie sindacali!"
            ] | random }}
          {% endif %}

    - action: ai_task.generate_data
      data:
        entity_id: ai_task.google_ai_task_3
        task_name: "pillola_sarcastica_{{ tema_scelto }}"
        instructions: >-
          Sei l'assistente vocale femminile di casa su Google Nest Hub.
          Chi c'è in casa adesso: {{ nomi_target }}.
          Situazione in casa: {{ contesto_tema }}
          SPUNTO CREATIVO SPECIFICO DA USARE ADESSO: {{ spunto_pillola }}
          REGOLE TASSATIVE:
          1. Parla sempre al femminile se ti riferisci a te stessa (es. "sono curiosa", "sono stanca").
          2. Tono: spontaneo, pungente, sarcastico, ironico, creativo e divertente, ma affettuoso.
          3. SEGUI ESCLUSIVAMENTE LO SPUNTO CREATIVO SPECIFICO indicato sopra: NON citare Gricia, Carbonara o Babà (a meno che non sia scritto nello spunto sopra) e NON citare mai il lavoro, l'ufficio o le professioni!
          4. Chiama per nome o soprannome chi è in casa all'inizio della frase (se c'è solo Utente 1: Ste, Cù o Utente 1; se c'è solo Utente 2: La, Utente 2, Pì o Utente 2; se sono in coppia insieme: usa "Utente 1 e Utente 2", "Cù e Pì", "Pì e Cù" oppure "Utente 1 e Utente 2" — VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste" perché nella sintesi vocale suona come "stela" o "laste"!).
          5. DIVIETO ASSOLUTO DI COGNOMI: Non dire MAI "Famiglia" né "Eco Home" (di' solo "in casa" o "qui").
          6. Contesto abitativo: abitano in un paese (non dire mai "in città" o "nel quartiere").
          7. Restituisci SOLO la frase da pronunciare (massimo 25-32 parole), non racchiudere la frase tra doppi apici, senza emoji e senza preamboli. Usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'acquario, l'affitto, c'è, d'occhio; NON scrivere MAI "l acqua" staccato senza apostrofo!).
      response_variable: ai_pillola_res
      continue_on_error: true

    - variables:
        ai_pillola_text: >-
          {% if ai_pillola_res is defined and ai_pillola_res is mapping and 'data' in ai_pillola_res %}
            {{ ai_pillola_res.data
               | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
               | replace('Famiglia', '') | replace('Famiglia', '')
               | replace('"', '')
               | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
               | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
               | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
               | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
               | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
               | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
               | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
               | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
               | regex_replace('^[.\\s…,-]+', '')
               | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        messaggio_pillola: "{{ (ai_pillola_text if (ai_pillola_text | length > 15) else fallback_msg) | regex_replace('^[.\\s…,-]+', '') | trim }}"
        target_speakers: >-
          {% set spk = ['media_player.nest_hub_sala'] %}
          {% if is_state('light.luce_cameretta', 'on') %}
            {% set spk = spk + ['media_player.nest_hub_cameretta'] %}
          {% endif %}
          {% if is_state('light.luce_camera', 'on') %}
            {% set spk = spk + ['media_player.nest_hub_camera'] %}
          {% endif %}
          {{ spk }}

    - condition: template
      value_template: >-
        {{ is_state('input_boolean.audio_annuncio_in_corso', 'off') and
           is_state('script.annuncio_rifiuti_ore_21_ai', 'off') and
           is_state('script.annuncio_rientro_ai', 'off') and
           is_state('script.annuncio_cucina_ai', 'off') }}

    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ultima_pillola_sarcastica
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      continue_on_error: true

    - action: script.audio_annuncio_prepara
      continue_on_error: true

    - if:
        - condition: template
          value_template: "{{ is_state('light.luce_cameretta', 'on') }}"
      then:
        - action: media_player.turn_on
          target:
            entity_id: media_player.nest_hub_cameretta
          continue_on_error: true
        - action: media_player.volume_set
          target:
            entity_id: media_player.nest_hub_cameretta
          data:
            volume_level: 0.75
          continue_on_error: true

    - if:
        - condition: template
          value_template: "{{ is_state('light.luce_camera', 'on') }}"
      then:
        - action: media_player.turn_on
          target:
            entity_id: media_player.nest_hub_camera
          continue_on_error: true
        - action: media_player.volume_set
          target:
            entity_id: media_player.nest_hub_camera
          data:
            volume_level: 0.75
          continue_on_error: true

    - delay:
        milliseconds: 600

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
          sequence:
            - action: tts.speak
              target:
                entity_id: tts.home_assistant_cloud
              data:
                media_player_entity_id: "{{ target_speakers }}"
                message: "{{ messaggio_pillola }}"
                language: "it-IT"
                options:
                  voice: "it-IT-Wavenet-A"
              continue_on_error: true
      default:
        - action: tts.speak
          target:
            entity_id: tts.google_translate_it_lt
          data:
            media_player_entity_id: "{{ target_speakers }}"
            message: "{{ messaggio_pillola }}"
            language: "it"
            options:
              tld: "it"
          continue_on_error: true

    - delay:
        seconds: "{{ [8, ((messaggio_pillola | length) / 10) | round(0, 'ceil') | int + 2] | max }}"

    - action: script.audio_annuncio_ripristina
      continue_on_error: true

spesa_leggi_lista_vocale:
  alias: "Spesa Vocale: Leggi ed Elenca Lista Conad"
  icon: "mdi:cart-voice"
  mode: single
  sequence:
    - variables:
        num_articoli: "{{ states('sensor.spesa_conad_riepilogo') | int(0) }}"
        totale_eur: "{{ state_attr('sensor.spesa_conad_riepilogo', 'totale_stimato_euro') | float(0) | round(0) | int }}"
        elenco: "{{ state_attr('sensor.spesa_conad_riepilogo', 'riepilogo_testo') | default('Nessun articolo') }}"
        messaggio_spesa: >-
          {% if num_articoli == 0 %}
          La lista della spesa Conad in questo momento è vuota!
          {% elif num_articoli == 1 %}
          Nella lista della spesa Conad c'è un solo articolo da comprare: {{ elenco }}, per circa {{ totale_eur }} euro.
          {% else %}
          Nella lista della spesa Conad ci sono {{ num_articoli }} articoli da comprare, per una spesa stimata di circa {{ totale_eur }} euro: {{ elenco }}.
          {% endif %}
    - action: script.audio_annuncio_prepara
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_sala
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
        message: "{{ messaggio_spesa }}"
        language: "it"
        options:
          tld: "it"
      continue_on_error: true
    - delay:
        seconds: 12
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

spesa_svuota_acquistati:
  alias: "Spesa Conad: Svuota Prodotti Acquistati"
  icon: "mdi:cart-Remove"
  mode: single
  sequence:
    - action: gemini_vision.spesa_svuota_acquistati
      data:
        lista: "conad"

