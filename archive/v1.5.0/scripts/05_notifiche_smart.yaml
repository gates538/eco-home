              "Fai una battuta dicendo che siete rimasti imbambolati in due davanti ai ripiani come se trasmettessero una serie Netflix dentro il frigo.",
              "Prendili in giro dicendo che Gatto 2 e Gatto 1 ringraziano sentitamente gli umani per aver aperto il self-service gratuito in cucina.",
