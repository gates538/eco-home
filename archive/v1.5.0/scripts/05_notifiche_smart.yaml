# ==============================================================================
# 05 — NOTIFICHE SMART, MOTORE VOCALE AI, PILLOLE SARCASTICHE & SPESA VOCALE
# ==============================================================================

annuncio_rientro_ai:
  alias: "Annuncio Rientro AI & Notifica Incrociata"
  icon: "mdi:account-voice"
  mode: single
  fields:
    profilo:
      description: "Profilo del rientro: Utente 1, Utente 2 oppure Coppia"
      example: "Utente 1"
      default: "Utente 1"
    invia_notifica_foto:
      description: "Invia notifica incrociata con foto telecamera SALA 2"
      default: true
    riproduci_voce:
      description: "Riproduci annuncio vocale sarcastico/dolce su Nest Hub"
      default: true
  sequence:
    # 1. SCATTO FOTO TELECAMERA SALA 2
    # Viene eseguito solo se esplicitamente richiesto (es. esecuzione manuale dello script),
    # in modo da preservare lo scatto perfetto eseguito dall'automazione all'ingresso.
    - if:
        - condition: template
          value_template: "{{ scatta_foto | default(false) }}"
      then:
        - action: camera.snapshot
          target:
            entity_id: camera.sala_2
          data:
            filename: /config/www/cam_snapshots/sala_2.jpg
          continue_on_error: true

    # 2. NOTIFICA INCROCIATA SULLO SMARTPHONE DELL'ALTRO CON SCREEN SALA 2
    - if:
        - condition: template
          value_template: "{{ invia_notifica_foto | default(true) }}"
      then:
        - choose:
            # --- RIENTRO STEFANO -> Notifica a Utente 2 ---
            - conditions:
                - condition: template
                  value_template: "{{ (profilo | default('Utente 1')) == 'Utente 1' }}"
              sequence:
                - action: notify.mobile_app_smartphone_utente_2
                  data:
                    title: "🏠 Utente 1 è rientrato a casa!"
                    message: "Rilevato il rientro di Utente 1 a Eco Home."
                    data:
                      image: "/local/cam_snapshots/sala_2.jpg?t={{ now().timestamp() | int }}"
                      channel: "Presenza"
                      tag: "rientro_presenza"
                      actions:
                        - action: "URI"
                          title: "👁️ Live Sala 2"
                          uri: "entityId:camera.sala_2"
                        - action: "URI"
                          title: "📹 Scale"
                          uri: "entityId:camera.scale"
                  continue_on_error: true

            # --- RIENTRO LAURA -> Notifica a Utente 1 ---
            - conditions:
                - condition: template
                  value_template: "{{ profilo == 'Utente 2' }}"
              sequence:
                - action: notify.mobile_app_smartphone_utente_1
                  data:
                    title: "🏠 Utente 2 è rientrata a casa!"
                    message: "Rilevato il rientro di Utente 2 a Eco Home."
                    data:
                      image: "/local/cam_snapshots/sala_2.jpg?t={{ now().timestamp() | int }}"
                      channel: "Presenza"
                      tag: "rientro_presenza"
                      actions:
                        - action: "URI"
                          title: "👁️ Live Sala 2"
                          uri: "entityId:camera.sala_2"
                        - action: "URI"
                          title: "📹 Scale"
                          uri: "entityId:camera.scale"
                  continue_on_error: true

            # --- RIENTRO COPPIA -> Notifica a entrambi ---
            - conditions:
                - condition: template
                  value_template: "{{ profilo == 'Coppia' }}"
              sequence:
                - action: notify.mobile_app_smartphone_utente_1
                  data:
                    title: "🏠 Bentornati a casa!"
                    message: "Rientro di coppia rilevato a Eco Home."
                    data:
                      image: "/local/cam_snapshots/sala_2.jpg?t={{ now().timestamp() | int }}"
                      channel: "Presenza"
                      tag: "rientro_presenza"
                      actions:
                        - action: "URI"
                          title: "👁️ Live Sala 2"
                          uri: "entityId:camera.sala_2"
                        - action: "URI"
                          title: "📹 Scale"
                          uri: "entityId:camera.scale"
                  continue_on_error: true
                - action: notify.mobile_app_smartphone_utente_2
                  data:
                    title: "🏠 Bentornati a casa!"
                    message: "Rientro di coppia rilevato a Eco Home."
                    data:
                      image: "/local/cam_snapshots/sala_2.jpg?t={{ now().timestamp() | int }}"
                      channel: "Presenza"
                      tag: "rientro_presenza"
                      actions:
                        - action: "URI"
                          title: "👁️ Live Sala 2"
                          uri: "entityId:camera.sala_2"
                        - action: "URI"
                          title: "📹 Scale"
                          uri: "entityId:camera.scale"
                  continue_on_error: true

    # 3. ANNUNCIO VOCALE AI SU NEST HUB (SE ABILITATO E PRIMA DELLE 23:00)
    - if:
        - condition: template
          value_template: "{{ (riproduci_voce | default(true)) and is_state('input_boolean.annunci_vocali_rientro', 'on') and not (now().hour >= 23 or now().hour < 7) }}"
      then:
        # 3.1. CALCOLO STATO CASA E CONTESTO RIENTRO
        - variables:
            temp_int_pronuncia: "{{ states('sensor.temperatura_media') | float(20) | round(0) | int }}"
            dobby_state: "{{ states('vacuum.dobby') }}"
            dobby_area: >-
              {% set hist_attrs = states.sensor.dobby_cleaning_history.attributes | default({}) %}
              {% set ns = namespace(max_area=0) %}
              {% for k, v in hist_attrs.items() if v is mapping and v.timestamp is defined %}
                {% set dt = as_datetime(v.timestamp) %}
                {% if dt and dt.date() == now().date() %}
                  {% set a = v.cleaned_area | replace(" m²", "") | int(0) %}
                  {% if a > ns.max_area %}
                    {% set ns.max_area = a %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% if ns.max_area > 0 %}{{ ns.max_area }}{% else %}{{ states('sensor.dobby_cleaned_area') | default('0') }}{% endif %}
            dobby_report: >-
              {% if dobby_state in ['cleaning', 'sweeping', 'mopping'] %}Dobby sta pulendo in questo momento{% elif dobby_area | int(0) > 0 %}Dobby ha già pulito {{ dobby_area }} metri quadri oggi ed è tornato alla sua base in camera{% else %}Dobby è riposato alla sua base in camera{% endif %}
            finestre_aperte_list: >-
              {{ states.binary_sensor | selectattr('entity_id', 'in', ['binary_sensor.finestra_sala_contact', 'binary_sensor.finestra_cucina_contact', 'binary_sensor.finestra_camera_contact', 'binary_sensor.finestra_cameretta_contact', 'binary_sensor.finestra_bagno_contact', 'binary_sensor.finestra_bagnetto_contact']) | selectattr('state', 'eq', 'on') | map(attribute='name') | list }}
            finestre_report: >-
              {% if finestre_aperte_list | length > 0 %}Ci sono finestre aperte: {{ finestre_aperte_list | join(', ') }}{% else %}Tutte le finestre sono chiuse{% endif %}
            desc_target: >-
              {% if profilo == 'Utente 1' %}Utente 1 (soprannomi affettuosi: Ste o Cù; caloroso, amante del divano e della tecnologia){% elif profilo == 'Utente 2' %}Utente 2 (soprannomi affettuosi: La, Utente 2, Pì o Lau; freddolosa, amante del relax e delle serie TV){% else %}la Coppia (Utente 1 e Utente 2, soprannomi affettuosi insieme: Utente 1 e Utente 2, Cù e Pì, Pì e Cù oppure Utente 1 e Utente 2; VIETATO abbinare "Ste" e "La" insieme){% endif %}
            spunto_rientro: >-
              {% if profilo == 'Utente 1' %}
                {{ [
                  "Prendilo in giro dicendo che il cuscino sul divano ha sentito la sua mancanza e aveva già perso la sua impronta.",
                  "Scherza sul fatto che Gatto 2 e Gatto 1 lo stavano aspettando solo per farsi aprire i croccantini o rubargli il posto migliore sul divano.",
                  "Fai una battuta sul fatto che è finalmente tornato nel suo regno tecnologico, ma prima di toccare qualsiasi configurazione o sensore deve rilassarsi.",
                  "Scherza sul fatto che lui è sempre caloroso: chiedigli se ha già caldo appena varcata la soglia di casa.",
                  "Prendilo in giro dicendo che persino i pesciolini dell'acquario hanno fatto la ola vedendolo entrare dalla porta.",
                  "Fai una battuta spiritosa su Dobby che ha tenuto d'occhio la casa al posto suo e ora pretende le ferie.",
                  "Scherza sul fatto che il telecomando della TV da 85 pollici si stava annoiando senza di lui.",
                  "Accoglilo come se fosse appena rientrato da una spedizione sulla Gatto 2, quando in realtà non vedeva l'ora di mettersi in pantofole."
                ] | random }}
              {% elif profilo == 'Utente 2' %}
                {{ [
                  "Prendila in giro sul fatto che, essendo freddolosa, sta già cercando con lo sguardo la copertina o il plaid più caldo della casa.",
                  "Scherza dicendo che Gatto 2 e Gatto 1 hanno tenuto d'occhio il salotto tutto il giorno ma ora cedono il trono alla vera regina di casa.",
                  "Fai una battuta sul fatto che può finalmente lanciare la borsa, mettersi comoda e inaugurare la modalità relax totale.",
                  "Prendila in giro chiedendole se ha usato un incantesimo di Materializzazione alla Harry Potter per arrivare finalmente a casa.",
                  "Scherza su Dobby (l'elfo domestico aspirapolvere) che si inchina al rientro della sua padrona.",
                  "Fai una battuta sul divano e su Netflix che stavano facendo il conto alla rovescia aspettando il suo ritorno.",
                  "Prendila in giro dicendo che la casa senza di lei era troppo silenziosa, persino i pesci nell'acquario sbadigliavano.",
                  "Scherza dicendo che le pantofole si stavano già scaldando i motori vicino all'ingresso per accoglierla."
                ] | random }}
              {% else %}
                {{ [
                  "Prendili in giro chiedendo chi dei due si tufferà per primo sul divano per conquistare l'angolo migliore e il telecomando.",
                  "Scherza sul fatto che Gatto 2 e Gatto 1 vi guardavano dalla porta come a dire: era ora, avevamo quasi finito le coccole di scorta.",
                  "Fai una battuta sull'eterna lotta climatica di coppia: Utente 1 che ha già caldo e Utente 2 che cerca già una coperta.",
                  "Prendili in giro dicendo che i sensori di movimento stavano per andare in pensione per noia, meno male che siete tornati.",
                  "Scherza dicendo che il divano ha tirato un sospiro di gioia vedendovi entrare insieme: serata relax ufficialmente aperta.",
                  "Fai una battuta spiritosa sul fatto che quando rientrate insieme sembrate due complici appena scappati per chiudersi nel loro fortino.",
                  "Prendili in giro dicendo che Dobby e i sedici pesciolini dell'acquario vi danno il bentornato ufficiale nel vostro quartier generale."
                ] | random }}
              {% endif %}
            presenza_altri: >-
              {% if profilo == 'Utente 1' %}
                {% if is_state('binary_sensor.utente_2_a_casa', 'on') %}Utente 2 è già a casa ad aspettarlo.{% else %}Utente 2 non è a casa (è ancora fuori).{% endif %}
              {% elif profilo == 'Utente 2' %}
                {% if is_state('binary_sensor.utente_1_a_casa', 'on') %}Utente 1 è già a casa.{% else %}Utente 1 non è a casa (è ancora fuori).{% endif %}
              {% else %}
                Utente 1 e Utente 2 sono rientrati insieme a casa.
              {% endif %}
        - variables:
            ai_prompt: >-
              Sei l'assistente vocale di casa su Google Nest Hub Sala.
              Chi è appena rientrato: {{ profilo }} ({{ desc_target }}).
              Situazione presenza: {{ presenza_altri }}.
              SPUNTO CREATIVO DA USARE QUESTA VOLTA: {{ spunto_rientro }}
              DATI STATO CASA:
              - Dobby (robot aspirapolvere con base in camera da letto): {{ dobby_report }}.
              - Infissi: {{ finestre_report }}.
              - Termocamino a pellet Klover in sala: {{ 'acceso con la fiamma viva per scaldare tutti i termosifoni' if is_state('binary_sensor.camino_in_funzione', 'on') else 'spento' }}.
              - Gatte Gatto 2 e Gatto 1: monitorate e tranquille.
              - Temperatura interna: {{ temp_int_pronuncia }} gradi (NON citarla a meno che non ci siano finestre aperte col freddo/caldo; NON elencare mai temperatura interna ed esterna come un termometro!).

              OBIETTIVO:
              Genera un annuncio vocale di bentornato brillante, spiritoso, vario e originale seguendo lo SPUNTO CREATIVO indicato sopra:
              1. Tono: sarcastico, vivace, arguto e mai ripetitivo, ma sempre affettuoso e naturale.
              2. DIVIETO DI CLICHÉ RIPETITIVI: NON nominare Gricia, Carbonara o Babà al rientro! Varia il più possibile giocando sullo spunto creativo, sullo stato di casa (Dobby, finestre, camino) o sulle gatte. NON citare mai il lavoro, l'ufficio o le professioni, e NON recitare bollettini di gradi o temperature.
              3. Dai il bentornato personalizzato usando SOLO il nome di battesimo o il nomignolo (per Utente 1 da solo: Utente 1, Ste o Cù; per Utente 2 da sola: Utente 2, La, Utente 2 o Pì; per la coppia insieme: "Utente 1 e Utente 2", "Cù e Pì", "Pì e Cù" oppure "Utente 1 e Utente 2" — VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste" perché nella sintesi vocale suona come "stela" o "laste"!).
              4. DIVIETO ASSOLUTO DI COGNOMI: Non pronunciare MAI alcun cognome (non dire MAI "Famiglia" né "Eco Home", di' semplicemente "a casa").
              5. Se mai nomini un numero di gradi, usa SOLO un numero intero secco (es. "{{ temp_int_pronuncia }} gradi"), MAI "virgola" e MAI "e mezzo gradi".
              REGOLE TASSATIVE:
              - Lunghezza massima: tra 18 e 28 parole.
              - Niente emoji, niente elenchi, niente preamboli, non racchiudere la frase tra doppi apici.
              - APOSTROFI OBBLIGATORI: Usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'aria, l'allarme, c'è, un'occhiata; NON scrivere MAI "l acqua" o "l aria" staccato senza apostrofo!).
              - Italiano parlato naturale per sintesi vocale su Nest Hub Sala.
        - action: ai_task.generate_data
          data:
            entity_id: ai_task.google_ai_task_3
            task_name: "annuncio_rientro_presenza"
            instructions: "{{ ai_prompt }}"
          response_variable: ai_resp
          continue_on_error: true
        - variables:
            ai_text: >-
              {% if ai_resp is defined and ai_resp is mapping and 'data' in ai_resp and (ai_resp.data | trim | length) > 20 %}
                {{ ai_resp.data | trim }}
              {% else %}
                {{ '' }}
              {% endif %}
            fallback_text: >-
              {% if profilo == 'Utente 1' %}
                {{ [
                  'Bentornato a casa Ste! ' ~ dobby_report ~ ' e il tuo posto sul divano ti stava già reclamando.',
                  'Bentornato a casa Utente 1! ' ~ finestre_report ~ '. Prima di toccare qualsiasi sensore, goditi un po\' di relax.',
                  'Eccoti di ritorno Cù! ' ~ dobby_report ~ ' e le gatte dormono beate. Missione pantofole autorizzata.',
                  'Ciao Ste, bentornato! Persino i pesciolini dell\'acquario hanno esultato appena si è aperta la porta.',
                  'Bentornato nel tuo regno Cù! ' ~ finestre_report ~ '. Gatto 2 e Gatto 1 aspettavano giusto te per le coccole.'
                ] | random }}
              {% elif profilo == 'Utente 2' %}
                {{ [
                  'Bentornata a casa Utente 2! ' ~ dobby_report ~ ' e la tua copertina preferita sul divano è già pronta.',
                  'Bentornata a casa La! ' ~ finestre_report ~ '. Lancia la borsa e goditi il meritato relax.',
                  'Benvenuta Pì! ' ~ dobby_report ~ '. Gatto 2 e Gatto 1 ti cedono ufficialmente il trono del salotto.',
                  'Eccoti finalmente Utente 2! Il divano e Netflix stavano facendo il conto alla rovescia aspettandoti.',
                  'Bentornata a casa Pì! ' ~ finestre_report ~ '. L\'elfo domestico Dobby ti dà il benvenuto.'
                ] | random }}
              {% else %}
                {{ [
                  'Bentornati a casa Utente 1 e Utente 2! ' ~ dobby_report ~ ' e ' ~ finestre_report ~ '. Vediamo chi conquista per primo il divano!',
                  'Bentornati Utente 1 e Utente 2! ' ~ dobby_report ~ '. Le gatte vi aspettavano al varco, buon relax a tutti e due.',
                  'Ben ritrovati Cù e Pì! ' ~ dobby_report ~ '. Chiudete il mondo fuori, la serata relax è ufficialmente iniziata.',
                  'Eccovi finalmente insieme Pì e Cù! ' ~ finestre_report ~ '. Il salotto è tutto vostro!'
                ] | random }}
              {% endif %}
            testo_finale: >-
              {{ (ai_text if ai_text | length > 20 else fallback_text)
                 | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
                 | replace('Famiglia', '') | replace('Famiglia', '')
                 | replace('"', '')
                 | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
                 | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
                 | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
                 | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
                 | regex_replace('(\\d+)\\s+e\\s+mezzo\\s+gradi', '\\1 gradi')
                 | regex_replace('(\\d+)\\s*(?:virgola|\\.|,)\\s*\\d+', '\\1')
                 | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
                 | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
                 | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
                 | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
                 | regex_replace('^[.\\s…,-]+', '')
                 | trim }}
        # 1. Prepara audio sala: alza Nest Hub all'80%, mette in pausa o abbassa/muta TV
        - action: script.audio_annuncio_prepara
          continue_on_error: true
        # 2. Riproduzione sintesi vocale su Nest Hub Sala
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: tts.home_assistant_cloud
                  data:
                    media_player_entity_id: media_player.nest_hub_sala
                    message: "{{ testo_finale }}"
                    language: "it-IT"
                    options:
                      voice: "it-IT-Wavenet-A"
                  continue_on_error: true
          default:
            - action: tts.speak
              target:
                entity_id: tts.google_translate_it_lt
              data:
                media_player_entity_id: media_player.nest_hub_sala
                message: "{{ testo_finale }}"
                language: "it"
                options:
                  tld: "it"
              continue_on_error: true
        # 3. Attesa fine annuncio
        - delay:
            seconds: "{{ [8, ((testo_finale | length) / 10) | round(0, 'ceil') | int + 2] | max }}"
        # 4. Ripristino audio sala: rimette play se era in pausa, ripristina volume TV precedente
        - action: script.audio_annuncio_ripristina
          continue_on_error: true

annuncio_cucina_ai:
  alias: "Annuncio Cucina AI Sarcastico"
  icon: "mdi:chef-hat"
  mode: single
  fields:
    dispositivo:
      description: "Dispositivo acceso: piano_cottura o forno"
      example: "piano_cottura"
      default: "piano_cottura"
  sequence:
    - variables:
        dev_label: "{{ 'il piano cottura a induzione' if (dispositivo | default('piano_cottura')) == 'piano_cottura' else 'il forno' }}"
        stefano_home: "{{ is_state('binary_sensor.utente_1_a_casa', 'on') }}"
        laura_home: "{{ is_state('binary_sensor.utente_2_a_casa', 'on') }}"
        ospiti_attivi: "{{ is_state('input_boolean.modalita_ospiti_cameretta', 'on') or is_state('binary_sensor.sicurezza_sospensione_attiva', 'on') }}"
        profilo_cuoco: >-
          {% if stefano_home and not laura_home %}
            Utente 1
          {% elif laura_home and not stefano_home %}
            Utente 2
          {% elif stefano_home and laura_home %}
            Coppia
          {% elif ospiti_attivi %}
            Ospiti
          {% else %}
            Nessuno
          {% endif %}
        usa_nick_domenico: "{{ [false, false, true] | random }}"
        spunto_cucina: >-
          {% if profilo_cuoco == 'Utente 1' %}
            {{ [
              "Scherza sul fatto che Utente 1 in settimana ha sempre poco tempo per cucinare, quindi se ha acceso i fornelli sarà sicuramente un capolavoro da veri gourmet.",
              "Fai una battuta da nerd/chimico in cucina: chiedigli se sta dosando gli ingredienti col bilancino di precisione o se sta facendo un esperimento ad alta temperatura.",
              "Prendilo in giro dicendo che Gatto 2 e Gatto 1 si sono già piazzate sotto la penisola della cucina con gli occhi a cuoricino sperando che cada qualcosa per terra.",
              "Scherza sul fatto che ha lasciato il PC e la domotica per dedicarsi all'arte culinaria: chiedigli se ha automatizzato anche il mestolo.",
              "Prendilo in giro chiedendo se sta preparando un piatto degno di una stella Michelin o se sta solo scaldando l'acqua col turbo dell'induzione.",
              "Fai una battuta chiedendogli se stasera sfodera la sua celebre Gricia (cita la Gricia con ironia solo in questa occasione).",
              "Scherza dicendo che i sensori antincendio e la cappa aspirante sono già in preallarme per lo show culinario di Ste.",
              "Prendilo in giro dicendo che il profumino sta già distraendo anche i sedici pesciolini dell'acquario in sala."
            ] | random }}
          {% elif profilo_cuoco == 'Utente 2' %}
            {{ [
              "Scherza sul fatto che Utente 2 non ama particolarmente cucinare, ma come sempre salva eroicamente la cena in settimana: merita una statua in salotto!",
              "Prendila in giro chiedendole se sta cucinando con la bacchetta magica come a Hogwarts o se vorrebbe un incantesimo per far trovare la cena già pronta.",
              "Fai una battuta su Gatto 2 e Gatto 1 che la fissano dal pavimento come due piccoli avvoltoi pelosi pronti a fare il controllo qualità.",
              "Scherza sul fatto che chi prepara la cena senza amare i fornelli acquisisce automaticamente il diritto sacro di scegliere cosa guardare stasera su Netflix.",
              "Prendila in giro dicendo che ha acceso i fornelli a tempo di record pur di sbrigarsi e buttarsi il prima possibile sul divano.",
              "Fai una battuta chiedendole se stasera prepara la sua famosa Carbonara (cita la Carbonara solo in questo spunto).",
              "Scherza sul fatto che quando cucina lei, Utente 1 al rientro ha l'obbligo morale di sparecchiare e caricare la lavastoviglie senza fiatare.",
              "Prendila in giro chiedendo se è una ricetta gourmet elaborata o un salvacena strategico da cinque minuti."
            ] | random }}
          {% elif profilo_cuoco == 'Coppia' %}
            {{ [
              "Scherza sul fatto che in due ai fornelli c'è sempre uno che cucina davvero e l'altro che ruba gli assaggi direttamente dalla padella.",
              "Prendili in giro dicendo che sembra una puntata di MasterChef in famiglia, con Gatto 2 e Gatto 1 sedute in prima fila come giudici implacabili.",
              "Fai una battuta sulla regola d'oro della casa: chi cucina stasera è esonerato ufficialmente dal caricare la lavastoviglie!",
              "Scherza chiedendo se stanno collaborando in armonia o se stanno già litigando su quanto sale mettere e sui tempi di cottura.",
              "Prendili in giro chiedendo se stasera c'è il grande classico tra la Gricia di Ste e la Carbonara di Utente 2 (cita questi piatti solo qui).",
              "Fai una battuta dicendo che con quattro mani ai fornelli o esce un banchetto reale o suona il contatore elettrico per troppa potenza.",
              "Scherza sul fatto che l'unico vero motivo per cui cucinate insieme è finire prima per fiondarvi sul divano."
            ] | random }}
          {% else %}
            Chiediti con ironia chi stia cucinando se nessuno è a casa (le gatte Gatto 2 e Gatto 1 con il cappello da chef o i fantasmi).
          {% endif %}
        desc_presenza: >-
          {% if is_state('input_boolean.modalita_ospiti_cameretta', 'on') and profilo_cuoco == 'Ospiti' %}
            Ci sono i carissimi parenti ospiti {{ 'Ospite 1 (detto affettuosamente il Ospite del Nord)' if usa_nick_domenico else 'Ospite 1' }}, Ospite 2, Ospite 3 e Ospite 4 in casa (venuti per il matrimonio di Zia (Piano Superiore) e Familiare 4) mentre Utente 1 e Utente 2 sono fuori!
          {% elif is_state('input_boolean.modalita_ospiti_cameretta', 'on') %}
            In casa ci sono Utente 1/Utente 2 insieme ai carissimi parenti ospiti {{ 'Ospite 1 (detto affettuosamente il Ospite del Nord)' if usa_nick_domenico else 'Ospite 1' }}, Ospite 2, Ospite 3 e Ospite 4 (venuti per il matrimonio di Zia (Piano Superiore) e Familiare 4)!
          {% elif ospiti_attivi and profilo_cuoco == 'Ospiti' %}
            Ci sono ospiti o familiari in casa mentre Utente 1 e Utente 2 sono fuori!
          {% elif ospiti_attivi %}
            In casa ci sono Utente 1/Utente 2 insieme agli ospiti!
          {% elif profilo_cuoco == 'Utente 1' %}
            Utente 1 (nomignoli affettuosi: Ste o Cù) è a casa da solo ai fornelli (Utente 2 è fuori). Utente 1 ama cucinare anche se in settimana ha poco tempo.
          {% elif profilo_cuoco == 'Utente 2' %}
            Utente 2 (nomignoli affettuosi: La, Utente 2, Pì o Lau) è a casa da sola ai fornelli (Utente 1 è ancora fuori). Utente 2 non ama cucinare ma in settimana prepara quasi sempre lei la cena perché rientra prima.
          {% elif profilo_cuoco == 'Coppia' %}
            Sia Utente 1 che Utente 2 (in coppia chiamali Utente 1 e Utente 2, Pì e Cù, Cù e Pì oppure Utente 1 e Utente 2; VIETATO abbinare "Ste" e "La" insieme) sono a casa insieme ai fornelli!
          {% else %}
            Attenzione: sia Utente 1 che Utente 2 risultano fuori casa! Non c'è nessuno registrato a casa al momento.
          {% endif %}
        ai_prompt: >-
          Sei l'assistente vocale di casa su Google Nest Hub Sala.
          EVENTO: È appena stato acceso {{ dev_label }} in cucina.
          PRESENZA IN CASA: {{ desc_presenza }}
          COMPAGNIA: Le micie Gatto 2 e Gatto 1 sono sempre in agguato per eventuali bocconcini.

          OBIETTIVO:
          {% if ospiti_attivi %}
          Genera un saluto caloroso, educato, ospitale e sorridente (SENZA sarcasmo pungente, perché ci sono gli ospiti in casa{% if is_state('input_boolean.modalita_ospiti_cameretta', 'on') %}: {{ 'Ospite 1 (che puoi chiamare con simpatia anche il Ospite del Nord)' if usa_nick_domenico else 'Ospite 1' }}, Ospite 2, Ospite 3 e Ospite 4{% endif %}): augura buona preparazione ai fornelli, fai sentire gli ospiti come a casa propria e cita con simpatia le micie Gatto 2 e Gatto 1 curiose dei profumi della cucina. Non pronunciare MAI alcun cognome.
          {% else %}
          Genera una battuta sarcastica, fulminea, scherzosa, originale e creativa strettamente legata a questo spunto (NON citare mai il lavoro, l'ufficio o le professioni, e NON nominare Gricia, Carbonara o Babà a meno che non siano espressamente richiesti nello spunto qui sotto!):
          SPUNTO CREATIVO DA SEGUIRE: {{ spunto_cucina }}
          - Usa il nome o nomignolo corretto (Utente 1/Ste/Cù; Utente 2/La/Utente 2/Pì/Lau; per la coppia insieme: "Utente 1 e Utente 2", "Pì e Cù", "Cù e Pì" oppure "Utente 1 e Utente 2" — VIETATO abbinare "Ste" e "La" insieme come "Utente 1 e Utente 2", "Utente 2 e Utente 1", "Ste, La" o "La, Ste" perché nella sintesi vocale suona come "stela" o "laste"!).
          {% endif %}

          REGOLE TASSATIVE:
          - DIVIETO ASSOLUTO DI COGNOMI: Non pronunciare MAI alcun cognome (non dire MAI "Famiglia" né "Eco Home", di' semplicemente "in casa"). Usa solo il nome di battesimo o i nomignoli affettuosi.
          - Lunghezza: tra 14 e 22 parole.
          - Tono {{ 'caloroso, accogliente ed educato' if ospiti_attivi else 'sarcastico, spiritoso ma dolce e bonario' }}.
          - Niente emoji, niente preamboli, non racchiudere la frase tra doppi apici.
          - APOSTROFI OBBLIGATORI: Usa SEMPRE l'apostrofo normale (') nelle elisioni italiane (es. l'acqua, l'allarme, l'induzione, l'aria, c'è, un'occhiata; NON scrivere MAI "l acqua" o "l allarme" staccato senza apostrofo!).
          - Italiano parlato naturale per sintesi vocale.
    - action: ai_task.generate_data
      data:
        entity_id: ai_task.google_ai_task_3
        task_name: "annuncio_cucina_sarcastico"
        instructions: "{{ ai_prompt }}"
      response_variable: ai_cucina_resp
      continue_on_error: true
    - variables:
        ai_battuta: >-
          {% if ai_cucina_resp is defined and ai_cucina_resp is mapping and 'data' in ai_cucina_resp and (ai_cucina_resp.data | trim | length) > 15 %}
            {{ ai_cucina_resp.data | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        fallback_battuta: >-
          {% if ospiti_attivi %}
            {{ [
              "Cucina attiva con " ~ dev_label ~ "! Fate come se foste a casa vostra e buona preparazione, sotto lo sguardo curioso di Gatto 2 e Gatto 1!",
              "Profumo di buono in cucina! Buon appetito a tutti gli ospiti di casa, Gatto 2 e Gatto 1 sono già in prima fila per annusare!",
              "È acceso " ~ dev_label ~ " in cucina. Buona preparazione e buona permanenza in famiglia!"
            ] | random }}
          {% elif profilo_cuoco == 'Utente 1' %}
            {{ [
              "Chef Ste ai fornelli! Hai mollato il computer per regalarci un capolavoro culinario o stai solo facendo un esperimento chimico?",
              "Utente 1 ha acceso " ~ dev_label ~ ". Gatto 2 e Gatto 1 si sono già piazzate sotto la penisola sperando in un assaggio!",
              "Attenzione in cucina, Cù è ai comandi! Ricetta stellata in arrivo o stai cercando di automatizzare anche le padelle?",
              "Ste ai fornelli! Visto che in settimana hai poco tempo, stasera ci aspettiamo effetti speciali da grande chef!"
            ] | random }}
          {% elif profilo_cuoco == 'Utente 2' %}
            {{ [
              "Utente 2 ha acceso " ~ dev_label ~ "! Anche se non ami stare ai fornelli, salvi sempre la cena: stasera decidi tu cosa vedere in TV!",
              "Pì ai comandi in cucina in attesa di Ste. Le gatte Gatto 2 e Gatto 1 sono già pronte per il controllo qualità ufficiale.",
              "Cottura avviata da Utente 2! Chi si sacrifica ai fornelli acquisisce l'esenzione totale dal caricare la lavastoviglie!",
              "La ha acceso " ~ dev_label ~ ". Vorresti una bacchetta magica alla Harry Potter per far cucinare le pentole da sole, vero?"
            ] | random }}
          {% elif profilo_cuoco == 'Coppia' %}
            {{ [
              "Utente 1 e Utente 2 ai fornelli insieme! Vediamo chi dei due cucina davvero e chi ruba solo gli assaggi dalla padella.",
              "Cucina attiva per Pì e Cù. Cooperazione culinaria in corso, e ricordate la regola d'oro: chi cucina non tocca la lavastoviglie!",
              "Avviata la cottura a quattro mani per Utente 1 e Utente 2. Le micie Gatto 2 e Gatto 1 faranno da severissimi giudici di gara.",
              "Cù e Pì in cucina insieme! Siete in perfetta sintonia o state già contrattando sui tempi di cottura?"
            ] | random }}
          {% else %}
            {{ [
              "Attenzione, " ~ dev_label ~ " è acceso ma nessuno è a casa. Gatto 2 e Gatto 1 stanno preparando la cena da sole?",
              "Allarme cucina, rilevata cottura ma casa vuota. Fantasmi ai fornelli o le gatte hanno imparato a cucinare?"
            ] | random }}
          {% endif %}
        testo_finale: >-
          {{ (ai_battuta if ai_battuta | length > 15 else fallback_battuta)
             | replace('Eco Home', 'casa') | replace('Eco Home', 'casa')
             | replace('Famiglia', '') | replace('Famiglia', '')
             | replace('"', '')
             | regex_replace('(?i)\\bSte\\s*(?:,\\s*|\\s+e\\s+|\\s+)La\\b', 'Utente 1 e Utente 2')
             | regex_replace('(?i)\\bLa\\s*(?:,\\s*|\\s+e\\s+|\\s+)Ste\\b', 'Utente 2 e Utente 1')
             | regex_replace('(?i)\\bC[uù]\\s*(?:,\\s*|\\s+e\\s+|\\s+)L[aà]\\b', 'Cù e Pì')
             | regex_replace('(?i)\\bL[aà]\\s*(?:,\\s*|\\s+e\\s+|\\s+)C[uù]\\b', 'Pì e Cù')
             | regex_replace('\\b([lLdD])\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b(all|dall|dell|nell|sull|All|Dall|Dell|Nell|Sull)\\s+([aAeEiIoOuUàèéìòùÀÈÉÌÒÙ])', "\\1'\\2")
             | regex_replace('\\b([cC])\\s+(è|era|erano)\\b', "\\1'\\2")
             | regex_replace('\\b([uU]n)\\s+(occhiata|eternità|ora|altra|idea|anima|emergenza)\\b', "\\1'\\2")
             | trim }}
        tv_on: "{{ is_state('media_player.tv_sala', 'on') }}"
        is_notte: "{{ now().hour >= 23 or now().hour < 7 }}"

    # 1. NOTIFICA SMART SUGLI SMARTPHONE
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ profilo_cuoco == 'Nessuno' }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "⚠️ Allarme Cucina: Casa Vuota!"
                message: "{{ dev_label | capitalize }} acceso mentre nessuno è in casa! {{ testo_finale }}"
                data:
                  priority: high
                  ttl: 0
              continue_on_error: true
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "⚠️ Allarme Cucina: Casa Vuota!"
                message: "{{ dev_label | capitalize }} acceso mentre nessuno è in casa! {{ testo_finale }}"
                data:
                  priority: high
                  ttl: 0
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: "{{ profilo_cuoco == 'Ospiti' }}"
          sequence:
            - action: notify.mobile_app_smartphone_utente_1
              data:
                title: "🍳 Ospiti ai fornelli in Cucina"
                message: "{{ dev_label | capitalize }} acceso dagli ospiti in casa. {{ testo_finale }}"
                data:
                  channel: "Cucina"
              continue_on_error: true
            - action: notify.mobile_app_smartphone_utente_2
              data:
                title: "🍳 Ospiti ai fornelli in Cucina"
                message: "{{ dev_label | capitalize }} acceso dagli ospiti in casa. {{ testo_finale }}"
                data:
                  channel: "Cucina"
              continue_on_error: true
      default:
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ profilo_cuoco == 'Utente 1' }}"
              sequence:
                - action: notify.mobile_app_smartphone_utente_2
                  data:
                    title: "🍳 Chef Utente 1 ai fornelli!"
                    message: "{{ testo_finale }}"
                    data:
                      channel: "Cucina"
                  continue_on_error: true
            - conditions:
                - condition: template
                  value_template: "{{ profilo_cuoco == 'Utente 2' }}"
              sequence:
                - action: notify.mobile_app_smartphone_utente_1
                  data:
                    title: "👩‍🍳 Chef Utente 2 ai fornelli!"
                    message: "{{ testo_finale }}"
                    data:
                      channel: "Cucina"
                  continue_on_error: true

    # 2. ANNUNCIO VOCALE SU NEST HUB SALA (SE ABILITATO E NON DI NOTTE)
    - if:
        - condition: template
          value_template: "{{ is_state('input_boolean.annunci_vocali_cucina', 'on') and not is_notte }}"
      then:
        # 1. Prepara audio sala: alza Nest Hub all'80%, mette in pausa o abbassa/muta TV
        - action: script.audio_annuncio_prepara
          continue_on_error: true
        # 2. Riproduzione sintesi vocale su Nest Hub Sala
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ states('tts.home_assistant_cloud') not in ['unavailable', 'unknown'] }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: tts.home_assistant_cloud
                  data:
                    media_player_entity_id: media_player.nest_hub_sala
                    message: "{{ testo_finale }}"
                    language: "it-IT"
                    options:
                      voice: "it-IT-Wavenet-A"
                  continue_on_error: true
          default:
            - action: tts.speak
              target:
                entity_id: tts.google_translate_it_lt
              data:
                media_player_entity_id: media_player.nest_hub_sala
                message: "{{ testo_finale }}"
                language: "it"
                options:
                  tld: "it"
              continue_on_error: true
        # 3. Attesa fine annuncio
        - delay:
            seconds: "{{ [7, ((testo_finale | length) / 10) | round(0, 'ceil') | int + 2] | max }}"
        # 4. Ripristino audio sala: rimette play se era in pausa, ripristina volume TV precedente
        - action: script.audio_annuncio_ripristina
          continue_on_error: true

annuncio_frigo_ai:
  alias: "Annuncio Frigo/Freezer AI Sarcastico"
  icon: "mdi:fridge-alert"
  mode: single
  fields:
    porta:
      description: "Porta aperta: frigo, freezer o entrambi"
      example: "frigo"
      default: "frigo"
    ripetizione:
      description: "Numero progressivo del sollecito (1 per il primo avviso dopo 60s)"
      example: 1
      default: 1
  sequence:
    - variables:
        p_norm: "{{ porta | default('frigo') }}"
        rip_count: "{{ ripetizione | default(1) | int }}"
        temp_frigo: "{{ states('sensor.cucina_frigorifero_fridge_temperature') | default('3') }}"
        temp_freezer: "{{ states('sensor.cucina_frigorifero_freezer_temperature') | default('-19') }}"
        nome_dispositivo: >-
          {% if p_norm == 'freezer' %}
            la porta del congelatore
          {% elif p_norm == 'entrambi' %}
            sia la porta del frigorifero che quella del congelatore
          {% else %}
            la porta del frigorifero
          {% endif %}
        stefano_home: "{{ is_state('binary_sensor.utente_1_a_casa', 'on') }}"
        laura_home: "{{ is_state('binary_sensor.utente_2_a_casa', 'on') }}"
        ospiti_attivi: "{{ is_state('input_boolean.modalita_ospiti_cameretta', 'on') or is_state('binary_sensor.sicurezza_sospensione_attiva', 'on') }}"
        profilo: >-
          {% if stefano_home and not laura_home %}
