              "Scherza sul fatto che lui è sempre caloroso: chiedigli se ha aperto lo sportello per farsi una doccia d'aria fredda personalizzata.",
              "Fai una battuta nerd: digli che i server e il NAS si raffreddano in cameretta con le ventole, non lasciando spalancato il frigorifero in cucina!",
              "Scherza su Gatto 2 e Gatto 1 che hanno già messo il casco da spedizione e stanno per saccheggiare il ripiano più basso.",
              "Prendilo in giro dicendo che il compressore del frigo sta chiedendo asilo politico e il contatore da 6 kilowatt sta prendendo appunti.",
              "Chiedigli con ironia se è rimasto ipnotizzato dalla lucina interna del frigo o se sta cercando l'ispirazione per uno spuntino.",
              "Scherza chiedendogli se sta cercando un Babà nascosto in fondo ai ripiani (cita il Babà solo in questo spunto)."
