                options:
                  voice: "it-IT-Wavenet-A"
              continue_on_error: true
      default:
        - action: tts.speak
          target:
            entity_id: tts.google_translate_it_lt
          data:
            media_player_entity_id: media_player.nest_hub_sala
            message: "{{ testo_finale }}"
            language: "it"
            options:
              tld: "it"
          continue_on_error: true
    # 3. Attesa fine annuncio
    - delay:
        seconds: "{{ [8, ((testo_finale | length) / 10) | round(0, 'ceil') | int + 2] | max }}"
    # 4. Ripristino audio sala: rimette play se era in pausa, ripristina volume TV precedente
    - action: script.audio_annuncio_ripristina
      continue_on_error: true

audio_annuncio_prepara:
  alias: "Audio: Prepara Sala per Annuncio (80% + Pausa/Abbassa TV)"
  description: "Alza Nest Hub all'80%, mette in pausa e abbassa/muta la TV Samsung, Soundbar e Cast prima dell'annuncio (solo se Nest Hub Sala è online)."
  mode: single
  sequence:
    # Se Nest Hub Sala è offline/unavailable, NON mutare la TV!
    - condition: template
      value_template: "{{ states('media_player.nest_hub_sala') not in ['unavailable', 'unknown'] }}"
    - variables:
        gia_in_corso: "{{ is_state('input_boolean.audio_annuncio_in_corso', 'on') }}"
        samsung_on: "{{ is_state('media_player.tv_sala_principale', 'on') or is_state('media_player.tv_sala_principale', 'playing') or is_state('media_player.sala_ultra_slim_soundbar', 'on') or is_state('media_player.sala_tv_sala', 'on') }}"
        samsung_tv_on: "{{ is_state('media_player.tv_sala_principale', 'on') or is_state('media_player.tv_sala_principale', 'playing') }}"
        soundbar_on: "{{ is_state('media_player.sala_ultra_slim_soundbar', 'on') }}"
        samsung_playing: "{{ is_state('media_player.tv_sala_principale', 'playing') }}"
        raw_vol: "{{ state_attr('media_player.sala_ultra_slim_soundbar', 'volume_level') | default(state_attr('media_player.tv_sala_principale', 'volume_level'), true) | float(0.13) }}"
        samsung_vol: "{{ raw_vol if raw_vol >= 0.05 else (states('input_number.tv_volume_precedente') | float(0.13)) }}"
        cast_on: "{{ not is_state('media_player.tv_sala', 'off') and not is_state('media_player.tv_sala', 'unavailable') }}"
        cast_playing: "{{ is_state('media_player.tv_sala', 'playing') }}"
        vol_annuncio: "{{ 0.35 if (now().hour >= 23 or now().hour < 7) else 0.80 }}"

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.audio_annuncio_in_corso
      continue_on_error: true

    - if:
        - condition: template
          value_template: "{{ not gia_in_corso }}"
      then:
        - if:
            - condition: template
              value_template: "{{ cast_playing or samsung_playing }}"
          then:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.tv_era_in_riproduzione
              continue_on_error: true
          else:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.tv_era_in_riproduzione
              continue_on_error: true

        - if:
            - condition: template
              value_template: "{{ samsung_on or cast_on }}"
          then:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.tv_era_accesa
              continue_on_error: true
            - action: input_number.set_value
              target:
                entity_id: input_number.tv_volume_precedente
              data:
                value: "{{ samsung_vol }}"
              continue_on_error: true
          else:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.tv_era_accesa
              continue_on_error: true

    # 1. Metti in pausa se possibile (Cast o Samsung TV)
    - if:
        - condition: template
          value_template: "{{ cast_playing }}"
      then:
        - action: media_player.media_pause
          target:
            entity_id: media_player.tv_sala
          continue_on_error: true
      continue_on_error: true

    - if:
        - condition: template
          value_template: "{{ samsung_playing }}"
      then:
        - action: media_player.media_pause
          target:
            entity_id: media_player.tv_sala_principale
          continue_on_error: true
      continue_on_error: true

    # 2. Muta la Soundbar (senza inviare KEY_MUTE toggle a tv_sala_ue85du7170uxzt per evitare rimbalzi CEC)
    - if:
        - condition: template
          value_template: "{{ soundbar_on }}"
      then:
        - action: media_player.volume_mute
          target:
            entity_id: media_player.sala_ultra_slim_soundbar
          data:
            is_volume_muted: true
          continue_on_error: true
      else:
        - if:
            - condition: template
              value_template: "{{ samsung_tv_on and not is_state_attr('media_player.tv_sala_principale', 'is_volume_muted', true) }}"
          then:
            - action: media_player.volume_mute
              target:
                entity_id: media_player.tv_sala_principale
              data:
                is_volume_muted: true
              continue_on_error: true
      continue_on_error: true

    - if:
        - condition: template
          value_template: "{{ cast_on }}"
      then:
        - action: media_player.volume_mute
          target:
            entity_id: media_player.tv_sala
          data:
            is_volume_muted: true
          continue_on_error: true
      continue_on_error: true

    # 3. Accendi Nest Hub Sala, togli mute e imposta volume tassativamente all'80%
    - action: media_player.turn_on
      target:
        entity_id: media_player.nest_hub_sala
      continue_on_error: true
    - action: media_player.volume_mute
      target:
        entity_id: media_player.nest_hub_sala
      data:
        is_volume_muted: false
      continue_on_error: true
    - action: media_player.volume_set
      target:
        entity_id: media_player.nest_hub_sala
      data:
        volume_level: "{{ vol_annuncio }}"
      continue_on_error: true
    - delay:
        milliseconds: 800

audio_annuncio_ripristina:
  alias: "Audio: Ripristina Sala dopo Annuncio"
  description: "Ripristina il volume precedente della Soundbar/TV, toglie il mute e rimette in play se era in pausa."
  mode: single
  sequence:
    - variables:
        annuncio_attivo: "{{ is_state('input_boolean.audio_annuncio_in_corso', 'on') }}"
        era_accesa: "{{ is_state('input_boolean.tv_era_accesa', 'on') }}"
        era_in_play: "{{ is_state('input_boolean.tv_era_in_riproduzione', 'on') }}"
        raw_vol_prec: "{{ states('input_number.tv_volume_precedente') | float(0.13) }}"
        vol_precedente: "{{ raw_vol_prec if raw_vol_prec >= 0.05 else 0.13 }}"
        cast_on: "{{ not is_state('media_player.tv_sala', 'off') and not is_state('media_player.tv_sala', 'unavailable') }}"

    - if:
        - condition: template
          value_template: "{{ annuncio_attivo and era_accesa }}"
      then:
        # 1. Togli il mute e ripristina il volume ESCLUSIVAMENTE sulla Soundbar (evitando KEY_MUTE toggle su tv_sala_ue85du7170uxzt)
        - action: media_player.volume_mute
          target:
            entity_id: media_player.sala_ultra_slim_soundbar
          data:
            is_volume_muted: false
          continue_on_error: true
        - action: media_player.volume_set
          target:
            entity_id: media_player.sala_ultra_slim_soundbar
          data:
            volume_level: "{{ vol_precedente }}"
          continue_on_error: true
        - if:
            - condition: template
              value_template: "{{ cast_on }}"
          then:
            - action: media_player.volume_mute
              target:
                entity_id: media_player.tv_sala
              data:
                is_volume_muted: false
              continue_on_error: true
      continue_on_error: true

    - if:
        - condition: template
          value_template: "{{ annuncio_attivo and era_in_play }}"
      then:
        - action: media_player.media_play
          target:
            entity_id:
              - media_player.tv_sala
              - media_player.tv_sala_principale
          continue_on_error: true
      continue_on_error: true

    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.audio_annuncio_in_corso
          - input_boolean.tv_era_accesa
          - input_boolean.tv_era_in_riproduzione
      continue_on_error: true

