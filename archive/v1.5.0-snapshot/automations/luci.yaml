- id: '1781725137553'
  alias: Comando lampada ambiente
  description: '✔ Rotellina

    rotazione lenta → ±2%

    rotazione veloce → ±10%


    ✔ Qualsiasi pulsante (1, 2, 3, 4)

    se la luce è spenta → accende a 4000K, luminosità 100%

    se la luce è accesa → spegne


    ✔ Temperatura colore

    sempre 4000K, senza eccezioni'
  triggers:
  - topic: zigbee2mqtt/ComandoLuceAmbiente/action
    trigger: mqtt
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.payload in [\n  'dial_rotate_right_fast',\n  'brightness_step_up'\n]
          }}\n"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.luceambiente
        data:
          brightness_step_pct: 10
    - conditions:
      - condition: template
        value_template: "{{ trigger.payload in [\n  'dial_rotate_left_fast',\n  'brightness_step_down'\n]
          }}\n"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.luceambiente
        data:
          brightness_step_pct: -10
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''dial_rotate_right'' }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.luceambiente
        data:
          brightness_step_pct: 2
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''dial_rotate_left'' }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.luceambiente
        data:
          brightness_step_pct: -2
    - conditions:
      - condition: template
        value_template: "{{ trigger.payload in [\n  'button_1_press', 'button_1_press_release',\n
          \ 'button_2_press', 'button_2_press_release',\n  'button_3_press', 'button_3_press_release',\n
          \ 'button_4_press', 'button_4_press_release'\n] }}\n"
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: light.luceambiente
            state: 'on'
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.luceambiente
        - conditions:
          - condition: state
            entity_id: light.luceambiente
            state: 'off'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.luceambiente
            data:
              brightness_pct: 100
              color_temp_kelvin: 4000
  mode: single
- id: '1781874601142'
  alias: Comando Faretti cucina
  description: ''
  triggers:
  - topic: zigbee2mqtt/ComandoFaretti/action
    trigger: mqtt
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''dial_rotate_right_step'' }}'
      sequence:
      - target:
          entity_id: '{{ entity }}'
        data:
          brightness: '{{ (slow_up * 2.55) | int }}'
          transition: 0.12
          color_temp_kelvin: 4000
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''brightness_step_up'' }}'
      sequence:
      - target:
          entity_id: '{{ entity }}'
        data:
          brightness: '{{ (fast_up * 2.55) | int }}'
          transition: 0.12
          color_temp_kelvin: 4000
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''dial_rotate_left_slow'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ current_pct <= 2 }}'
          sequence:
          - target:
              entity_id: '{{ entity }}'
            action: light.turn_off
        default:
        - target:
            entity_id: '{{ entity }}'
          data:
            brightness: '{{ (slow_down * 2.55) | int }}'
            transition: 0.12
            color_temp_kelvin: 4000
          action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''brightness_step_down'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ current_pct <= 10 }}'
          sequence:
          - target:
              entity_id: '{{ entity }}'
            action: light.turn_off
        default:
        - target:
            entity_id: '{{ entity }}'
          data:
            brightness: '{{ (fast_down * 2.55) | int }}'
            transition: 0.12
            color_temp_kelvin: 4000
          action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload in [''button_1_press'',''button_1_press_release'']
          }}'
      sequence:
      - target:
          entity_id: '{{ entity }}'
        data:
          brightness_pct: 100
          transition: 0.2
          color_temp_kelvin: 4000
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload in [''button_2_press'',''button_2_press_release'']
          }}'
      sequence:
      - target:
          entity_id: '{{ entity }}'
        data:
          brightness_pct: 75
          transition: 0.2
          color_temp_kelvin: 4000
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload in [''button_3_press'',''button_3_press_release'']
          }}'
      sequence:
      - target:
          entity_id: '{{ entity }}'
        data:
          brightness_pct: 50
          transition: 0.2
          color_temp_kelvin: 4000
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload in [''button_4_press'',''button_4_press_release'']
          }}'
      sequence:
      - target:
          entity_id: '{{ entity }}'
        data:
          brightness_pct: 25
          transition: 0.2
          color_temp_kelvin: 4000
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ ''hold'' in trigger.payload }}'
      sequence:
      - target:
          entity_id: '{{ entity }}'
        action: light.turn_off
  mode: restart
  variables:
    entity: light.faretti_cucina
    current_brightness: '{{ state_attr(entity, ''brightness'') | int(1) }}'
    current_pct: '{{ (current_brightness / 2.55) | round(0) }}'
    slow_up: '{{ [current_pct + 2, 100] | min }}'
    fast_up: '{{ [current_pct + 10, 100] | min }}'
    slow_down: '{{ [current_pct - 2, 1] | max }}'
    fast_down: '{{ [current_pct - 10, 1] | max }}'
