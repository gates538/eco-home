            last_ann_ts_diag: '{{ as_timestamp(states(''input_datetime.eco_home_ultimo_annuncio''), default=0) }}'
            live_cooldown_ok_diag: '{{ (as_timestamp(now()) - (last_ann_ts_diag | float(0))) > 120 }}'
            has_new_arrival_diag: '{{ has_new_arrival }}'
            diagnostic_reason: '{% if not eco_home_enabled %}Eco Home disattivato {% elif eco_home_silent %}Modalità silenziosa
              attiva {% elif is_state(speaker, ''playing'') %}Annuncio bloccato: Nest Hub in riproduzione {% elif not live_cooldown_ok_diag
              %}Annuncio bloccato dal cooldown {% elif not has_new_arrival_diag %}Nessun nuovo rientro da annunciare {% elif
              trigger_type in [''door_opened'', ''stefano_arrived'', ''laura_arrived''] and not arrival_confirmed_by_person_and_door
              %}In attesa della combinazione presenza e portone {% elif trigger_type == ''dryer_finished_while_away'' and
              not nobody_home %}Asciugatrice terminata con qualcuno già in casa {% elif trigger_from_state in [''unknown'',
              ''unavailable''] %}Stato iniziale non valido {% else %}Trigger ignorato dalle condizioni di sicurezza{% endif
              %}'
        - action: input_text.set_value
          target:
            entity_id: input_text.eco_home_ultimo_esito
          data:
            value: '{{ (diagnostic_reason | trim)[:250] }}'
          continue_on_error: true
        - if:
            - condition: template
              value_template: '{{ debug }}'
          then:
            - action: logbook.log
              data:
                name: Eco Home
                message: 'Trigger ignorato. Tipo: {{ trigger_type }}. Entità: {{ trigger_entity_id }}. Da: {{ trigger_from_state
                  }}. A: {{ trigger_to_state }}. Eco Home attivo: {{ eco_home_enabled }}. Silenzioso: {{ eco_home_silent }}.
                  Rientro confermato: {{ arrival_confirmed_by_person_and_door }}. Esito: {{ diagnostic_reason | trim }}.'
                entity_id: media_player.nest_hub_sala
  mode: queued
  max: 10
  max_exceeded: silent
  trace:
    stored_traces: 20
  variables:
    debug: true
    project_name: Eco Home
    speaker: media_player.nest_hub_sala
    tts_engine: tts.google_translate_it_lt
    light_entity: light.luceambiente
    tv_media_player: media_player.tv_sala_ue85du7170uxzt
    door_sensor: binary_sensor.porta_contact
    dryer_state_sensor: sensor.esterno_asciugatrice_machine_state
    dryer_power_sensor: sensor.esterno_asciugatrice_potenza
    dryer_completion_sensor: sensor.esterno_asciugatrice_completion_time
    camera_entity: camera.sala_2
    stefano_notification_service: notify.mobile_app_samsung_s25_edge_di_stefano
    laura_notification_service: notify.mobile_app_samsung_s22_di_laura
    snapshot_file_path: /config/www/cam_snapshots/sala_2.jpg
    snapshot_access_url: /local/cam_snapshots/sala_2.jpg?t={{ now().timestamp() | int }}
    indoor_temp_sensors:
      - sensor.temperatura_media_sala
      - sensor.temperatura_media_camera
    ac_climate_entities:
      - climate.sala_condizionatore_sala
      - climate.camera_condizionatore_camera
    tracked_people:
      - person.stefano
      - person.laura
    weather_entity: weather.casa
    alert_entity: sensor.dipartimento_protezione_civile_alert
    window_sensors:
      - binary_sensor.finestrasala_contact
      - binary_sensor.finestracamera_contact
    eco_home_enabled: '{{ is_state(''input_boolean.eco_home_attivo'', ''on'') }}'
    eco_home_silent: '{{ is_state(''input_boolean.eco_home_silenzioso'', ''on'') }}'
    eco_home_ospiti: '{{ is_state(''input_boolean.eco_home_ospiti'', ''on'') }}'
    camera_notification_enabled: '{{ is_state(''input_boolean.eco_home_notifiche_foto'', ''on'') }}'
    test_scenario: "{%- set selected = states('input_select.eco_home_scenario_test') -%} {%- if selected in ['Percorso audio',\
      \ 'Rientro Stefano', 'Rientro Laura',\n  'Rientro di coppia', 'Modalità notte', 'Promemoria asciugatrice'] %}\n{{- selected\
      \ -}} {%- else -%} Percorso audio {%- endif -%}"
    nest_available: '{{ states(speaker) not in [''unknown'', ''unavailable''] }}'
    min_away_minutes: 20
    arrival_person_door_window_seconds: 180
    couple_max_interval_seconds: 180
    welcome_cooldown_seconds: 2700
    dryer_announce_valid_hours: 12
    tts_minimum_delay_seconds: 5
    tts_chars_per_second: 11
    base_volume_day: 0.8
    base_volume_evening: 0.8
    base_volume_night: 0.4
    tv_ducking_enabled: true
    tv_duck_debug: false
    tv_ducking_excluded_states:
      - 'off'
      - standby
      - unknown
      - unavailable
    light_brightness_pct: '{% if is_night %} 15 {% else %} 45 {% endif %}'
    light_kelvin: '{% if is_night %} 2200 {% else %} 3500 {% endif %}'
    light_transition_seconds: 0
    trigger_type: '{{ trigger.id | default(''manuale'') }}'
    trigger_entity_id: '{{ trigger.entity_id if trigger is defined and trigger.entity_id is defined else ''unknown'' }}'
    trigger_from_state: '{{ trigger.from_state.state if trigger is defined and trigger.from_state is defined and trigger.from_state
      is not none else ''unknown'' }}'
    trigger_to_state: '{{ trigger.to_state.state if trigger is defined and trigger.to_state is defined and trigger.to_state
      is not none else ''unknown'' }}'
    trigger_person_name: "{% if trigger_type == 'stefano_arrived' %}\n  Stefano\n{% elif trigger_type == 'laura_arrived' %}\n\
      \  Laura\n{% else %}\n  Sconosciuto\n{% endif %}"
    away_minutes_before_arrival: "{% if trigger_type in ['stefano_arrived', 'laura_arrived']\n   and trigger is defined\n\
      \   and trigger.from_state is defined\n   and trigger.from_state is not none\n   and trigger.from_state.last_changed\
      \ is not none %}\n  {{ ((as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed, default=now().timestamp()))\
      \ / 60) | int(0) }}\n{% else %}\n  999\n{% endif %}"
    door_opened_recently: '{% set door_ts = as_timestamp(now()) if trigger_type == ''door_opened'' else as_timestamp(states(''input_datetime.eco_home_ultima_apertura_portone''),
      default=0) %} {{ door_ts > 86400 and (as_timestamp(now()) - door_ts) <= arrival_person_door_window_seconds }}'
    stefano_arr_effective_ts: "{% if trigger_type == 'stefano_arrived' and away_minutes_before_arrival | int(0) >= min_away_minutes\
      \ %}\n  {{ as_timestamp(now()) }}\n{% else %}\n  {{ as_timestamp(states('input_datetime.eco_home_ultimo_arrivo_stefano'),\
      \ default=0) }}\n{% endif %}"
    laura_arr_effective_ts: "{% if trigger_type == 'laura_arrived' and away_minutes_before_arrival | int(0) >= min_away_minutes\
      \ %}\n  {{ as_timestamp(now()) }}\n{% else %}\n  {{ as_timestamp(states('input_datetime.eco_home_ultimo_arrivo_laura'),\
      \ default=0) }}\n{% endif %}"
    last_ann_effective_ts: '{{ as_timestamp(states(''input_datetime.eco_home_ultimo_annuncio''), default=0) }}'
    stefano_has_new_arrival: "{{ (stefano_arr_effective_ts | float(0) > (last_ann_effective_ts | float(0) + 2))\n   and ((as_timestamp(now())\
      \ - (stefano_arr_effective_ts | float(0))) <= arrival_person_door_window_seconds) }}"
    laura_has_new_arrival: "{{ (laura_arr_effective_ts | float(0) > (last_ann_effective_ts | float(0) + 2))\n   and ((as_timestamp(now())\
      \ - (laura_arr_effective_ts | float(0))) <= arrival_person_door_window_seconds) }}"
    arrived_now_couple: "{{ stefano_has_new_arrival\n   and laura_has_new_arrival\n   and (((stefano_arr_effective_ts | float(0)\
      \ - laura_arr_effective_ts | float(0)) | abs) <= couple_max_interval_seconds) }}"
    arrived_stefano: '{{ stefano_has_new_arrival and not arrived_now_couple }}'
    arrived_laura: '{{ laura_has_new_arrival and not arrived_now_couple }}'
    has_new_arrival: '{{ stefano_has_new_arrival or laura_has_new_arrival }}'
    person_arrived_recently: '{{ has_new_arrival }}'
    trigger_person_arrival_valid: "{{\n  trigger_type in ['stefano_arrived', 'laura_arrived']\n  and away_minutes_before_arrival\
      \ | int(0) >= min_away_minutes\n  and door_opened_recently\n}}"
    trigger_door_open_valid: "{{\n  trigger_type == 'door_opened'\n  and trigger_to_state == 'on'\n  and trigger_from_state\
      \ not in ['unknown', 'unavailable']\n  and has_new_arrival\n}}"
    arrival_confirmed_by_person_and_door: '{{ trigger_door_open_valid or trigger_person_arrival_valid }}'
    hour_now: '{{ now().hour }}'
    today_md: '{{ now().strftime(''%m-%d'') }}'
    is_night: '{{ hour_now | int(0) >= 23 or hour_now | int(0) < 6 }}'
    tts_volume_level: "{% if is_night | bool(false) %}\n  {{ base_volume_night }}\n{% elif hour_now | int(0) >= 18 %}\n  {{\
