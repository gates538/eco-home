                                data:
                                  actions:
                                    - action: TURN_ON_HEAT_{{ context.id }}
                                      title: Sì, riscalda
                                      continue_on_error: true
                                    - action: DISMISS_AC
                                      title: No, grazie
                              continue_on_error: true
                        - conditions:
                            - condition: template
