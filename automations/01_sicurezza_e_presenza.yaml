            - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ nest_available }}'
                  sequence:
                    - if:
                        - condition: template
                          value_template: '{{ is_state(''vacuum.dobby'', ''cleaning'') or is_state(''vacuum.dobby'', ''cleaning'')
                            }}'
                      then:
                        - action: vacuum.return_to_base
                          target:
                            entity_id:
                              - vacuum.dobby
                              - vacuum.dobby
                          continue_on_error: true
                    - parallel:
                        - sequence:
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: '{{ tv_should_mute_this_run }}'
                                  sequence:
                                    - action: media_player.volume_mute
                                      target:
                                        entity_id: '{{ tv_media_player }}'
                                      data:
                                        is_volume_muted: true
                                      continue_on_error: true
                        - sequence:
                            - action: media_player.volume_set
                              target:
                                entity_id: '{{ speaker }}'
                              data:
                                volume_level: '{{ tts_volume_level }}'
                              continue_on_error: true
                    - if:
                        - condition: template
                          value_template: '{{ debug }}'
                      then:
                        - action: logbook.log
                          data:
                            name: Eco Home
                            message: 'Rientro confermato. Persone: {{ arrived_now_text }}. Profilo: {{ announced_profile |
                              trim }}. Trigger: {{ trigger_type }}. Messaggio: {{ messaggio_finale }}'
                    - if:
                        - condition: template
                          value_template: '{{ not is_night and not eco_home_ospiti }}'
                      then:
                        - action: tts.speak
                          target:
                            entity_id: '{{ tts_engine }}'
                          data:
                            media_player_entity_id: '{{ speaker }}'
                            message: '{{ messaggio_finale }}'
                            language: it
                            options:
                              tld: it
                            cache: false
                        - delay:
                            seconds: '{{ tts_safe_delay_seconds }}'
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: '{{ nest_volume_before | float(-1) >= 0 }}'
                          sequence:
                            - action: media_player.volume_set
                              target:
                                entity_id: '{{ speaker }}'
                              data:
                                volume_level: '{{ nest_volume_before }}'
                              continue_on_error: true
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.eco_home_ultimo_esito
                      data:
                        value: 'Richiesta TTS inviata: {{ announced_profile | trim }}'
                      continue_on_error: true
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: '{{ dryer_pending_should_announce }}'
                          sequence:
                            - action: input_boolean.turn_off
                              target:
                                entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
