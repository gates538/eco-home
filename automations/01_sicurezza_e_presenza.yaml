# ==============================================================================
# SICUREZZA, ALLARME, GPS & PRESENZA SMART — CASA MANCINI
# ==============================================================================
# Centrale allarme, sensori porte/finestre, tracciamento coordinate Stefano e Laura, simulazione presenza e motore Eco Home benvenuto.
# Automazioni incluse in questo modulo: 12
# ==============================================================================

- id: memoria_posizioni_familiari_stefano_laura
  alias: 📍 Posizione - Memoria Ultime Zone Visitate (Stefano & Laura)
  description: Registra costantemente l'ultima zona visitata fuori casa da Stefano e Laura tramite GPS o rete Wi-Fi (Monica,
    Simone, Palestra, Lavoro Stefano).
  triggers:
    - trigger: state
      entity_id: person.stefano
      id: stefano_gps
    - trigger: state
      entity_id: person.laura
      id: laura_gps
    - trigger: state
      entity_id: sensor.samsung_s25_edge_di_stefano_wi_fi_connection
      id: stefano_wifi
    - trigger: state
      entity_id: sensor.samsung_s22_di_laura_wi_fi_connection
      id: laura_wifi
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: stefano_wifi
            - condition: template
              value_template: '{{ trigger.to_state.state in [''NETSCipioni'', ''NET_Simone'', ''NewSport-Clienti'', ''AGRIFERTIL
                S.R.L.'', ''CX_WIFI2CE04A07F127''] }}'
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.stefano_ultima_zona
              data:
                value: '{% set w = trigger.to_state.state %} {% if w == ''NETSCipioni'' %}Casa Monica {% elif w == ''NET_Simone''
                  %}Casa Simone {% elif w == ''NewSport-Clienti'' %}Palestra {% elif w == ''AGRIFERTIL S.R.L.'' %}Lavoro Stefano
                  {% elif w == ''CX_WIFI2CE04A07F127'' %}In Viaggio {% else %}{{ states(''input_text.stefano_ultima_zona'')
                  }}{% endif %}'
        - conditions:
            - condition: trigger
              id: laura_wifi
            - condition: template
              value_template: '{{ trigger.to_state.state in [''NETSCipioni'', ''NET_Simone'', ''NewSport-Clienti'', ''AGRIFERTIL
                S.R.L.'', ''CX_WIFI2CE04A07F127''] }}'
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.laura_ultima_zona
              data:
                value: '{% set w = trigger.to_state.state %} {% if w == ''NETSCipioni'' %}Casa Monica {% elif w == ''NET_Simone''
                  %}Casa Simone {% elif w == ''NewSport-Clienti'' %}Palestra {% elif w == ''AGRIFERTIL S.R.L.'' %}Lavoro Stefano
                  {% elif w == ''CX_WIFI2CE04A07F127'' %}In Viaggio {% else %}{{ states(''input_text.laura_ultima_zona'')
                  }}{% endif %}'
        - conditions:
            - condition: trigger
              id: stefano_gps
            - condition: template
              value_template: '{{ trigger.to_state.state not in [''home'', ''not_home'', ''unavailable'', ''unknown''] }}'
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.stefano_ultima_zona
              data:
                value: '{{ trigger.to_state.state }}'
        - conditions:
            - condition: trigger
              id: laura_gps
            - condition: template
              value_template: '{{ trigger.to_state.state not in [''home'', ''not_home'', ''unavailable'', ''unknown''] }}'
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.laura_ultima_zona
              data:
                value: '{{ trigger.to_state.state }}'
  mode: queued
- id: rilevamento_rientro_coppia_insieme
  alias: 👥 Posizione - Rilevamento Rientro Coppia Insieme
  description: Rileva se Stefano e Laura sono rientrati a casa insieme registrando lo stato per l'annuncio serale.
  triggers:
    - trigger: state
      entity_id:
        - person.stefano
        - person.laura
      to: home
  conditions:
    - condition: template
      value_template: '{{ is_state(''person.stefano'', ''home'') and is_state(''person.laura'', ''home'') }}'
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ is_state(''sensor.coppia_insieme_fuori_casa'', ''on'') or (states(''sensor.distanza_stefano_e_laura'')
                | float(9999) <= 200) }}'
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.coppia_rientro_insieme
              data:
                value: si
      default:
        - action: input_text.set_value
          target:
            entity_id: input_text.coppia_rientro_insieme
          data:
            value: 'no'
  mode: single
- id: cronologia_posizioni_famiglia_log
  alias: 📍 Posizione - Registrazione Cronologia Spostamenti Famiglia
  description: Registra ogni cambio di posizione descrittiva di Stefano e Laura nello storico cronologia posizioni famiglia.
  triggers:
    - trigger: state
      entity_id:
        - sensor.stefano_posizione_attuale_descrittiva
        - sensor.laura_posizione_attuale_descrittiva
      id: cambio_posizione
    - trigger: homeassistant
      event: start
      id: avvio_ha
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: cambio_posizione
            - condition: template
              value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown', ''] and\n   (trigger.from_state\
                \ is undefined or trigger.from_state.state != trigger.to_state.state) }}"
          sequence:
            - action: python_script.log_posizione
              data:
                persona: '{% if ''stefano'' in trigger.entity_id %}Stefano{% else %}Laura{% endif %}'
                posizione: '{{ trigger.to_state.state }}'
                da_posizione: '{{ trigger.from_state.state if trigger.from_state is defined else '''' }}'
                timestamp: '{{ now().strftime(''%d/%m %H:%M'') }}'
        - conditions:
            - condition: trigger
              id: avvio_ha
          sequence:
            - delay:
                seconds: 20
            - if:
                - condition: template
                  value_template: '{{ states(''sensor.stefano_posizione_attuale_descrittiva'') not in [''unavailable'', ''unknown'',
                    ''''] }}'
              then:
                - action: python_script.log_posizione
                  data:
                    persona: Stefano
                    posizione: '{{ states(''sensor.stefano_posizione_attuale_descrittiva'') }}'
                    timestamp: '{{ now().strftime(''%d/%m %H:%M'') }}'
            - if:
                - condition: template
                  value_template: '{{ states(''sensor.laura_posizione_attuale_descrittiva'') not in [''unavailable'', ''unknown'',
                    ''''] }}'
              then:
                - action: python_script.log_posizione
                  data:
                    persona: Laura
                    posizione: '{{ states(''sensor.laura_posizione_attuale_descrittiva'') }}'
                    timestamp: '{{ now().strftime(''%d/%m %H:%M'') }}'
  mode: queued
  max: 10
- id: annuncio_smart_bentornato_al_rientro
  alias: 👋 Presenza - Annuncio Smart di Bentornato (Disattivato - Gestito da EcoHome)
  description: 'DISATTIVATO: Gestito interamente da EcoHome.yaml con cooldown e rate-limiting per evitare doppioni vocali.'
  initial_state: false
  triggers: []
  conditions: []
  actions: []
  mode: single
- id: '1783777716602'
  alias: Eco home
  description: Eco Home v1.5.0 - Benvenuto intelligente modulare su Nest Hub con gestione code, routine personalizzate, riscaldamento
    e climatizzazione.
  triggers:
    - trigger: state
      entity_id:
        - person.stefano
      to: home
      not_from:
        - home
        - unknown
        - unavailable
      id: stefano_arrived
    - trigger: state
      entity_id:
        - person.laura
      to: home
      not_from:
        - home
        - unknown
        - unavailable
      id: laura_arrived
    - trigger: state
      entity_id: binary_sensor.porta_contact
      to: 'on'
      not_from:
        - unknown
        - unavailable
      id: door_opened
    - trigger: state
      entity_id: sensor.esterno_asciugatrice_machine_state
      to:
        - 'off'
        - idle
        - stop
        - stopped
        - complete
        - completed
        - finish
        - finished
        - end
        - ended
        - none
        - standby
      not_from:
        - 'off'
        - idle
        - stop
        - stopped
        - complete
        - completed
        - finish
        - finished
        - end
        - ended
        - none
        - standby
        - unknown
        - unavailable
      for: 00:02:00
      id: dryer_finished_while_away
    - trigger: state
      entity_id: input_button.eco_home_test_vocale
      id: manual_test
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger_type == ''door_opened'' }}'
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_ultima_apertura_portone
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_evento
              data:
                value: Portone aperto
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: '{{ trigger_type == ''stefano_arrived'' and away_minutes_before_arrival | int(0) >= min_away_minutes
                }}'
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_ultimo_arrivo_stefano
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_ultimo_arrivo
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_ultimo_arrivo_2
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultima_persona
              data:
                value: Stefano
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_evento
              data:
                value: 'Rientro rilevato: Stefano'
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: '{{ trigger_type == ''laura_arrived'' and away_minutes_before_arrival | int(0) >= min_away_minutes
                }}'
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_ultimo_arrivo_laura
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_ultimo_arrivo
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_ultimo_arrivo_2
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultima_persona
              data:
                value: Laura
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_evento
              data:
                value: 'Rientro rilevato: Laura'
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: '{{ trigger_type == ''dryer_finished_while_away'' }}'
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_evento
              data:
                value: Asciugatrice terminata
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: '{{ trigger_type == ''manual_test'' }}'
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_evento
              data:
                value: 'Test manuale: {{ test_scenario | trim }}'
              continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger_type == ''manual_test'' }}'
          sequence:
            - variables:
                test_profile: '{% if test_scenario | trim == ''Rientro Stefano'' %}Stefano {% elif test_scenario | trim ==
                  ''Rientro Laura'' %}Laura {% elif test_scenario | trim == ''Rientro di coppia'' %}Coppia {% elif test_scenario
                  | trim == ''Modalità notte'' %}Notte {% elif test_scenario | trim == ''Promemoria asciugatrice'' %}Asciugatrice
                  {% else %}Percorso audio{% endif %}'
                test_nickname: '{% if test_profile | trim == ''Stefano'' %}{{ stefano_nicknames | random }} {% elif test_profile
                  | trim == ''Laura'' %}{{ laura_nicknames | random }} {% elif test_profile | trim in [''Coppia'', ''Notte'']
                  %}{{ couple_nicknames | random }} {% else %}amici di casa{% endif %}'
                test_volume_level: '{% if test_profile | trim == ''Notte'' %}{{ base_volume_night }} {% else %}{{ tts_volume_level
                  }}{% endif %}'
                nest_volume_before: '{{ state_attr(speaker, ''volume_level'') | float(-1) }}'
            - variables:
                test_message: "{% if test_profile | trim == 'Stefano' %}\n  {{ stefano_phrases | random }}\n{% elif test_profile\
                  \ | trim == 'Laura' %}\n  {{ laura_phrases | random }}\n{% elif test_profile | trim == 'Coppia' %}\n  {{\
                  \ couple_phrases | random }}\n{% elif test_profile | trim == 'Notte' %}\n  Buonanotte {{ test_nickname |\
                  \ trim }}. {{ night_phrases | random }}\n{% elif test_profile | trim == 'Asciugatrice' %}\n  Test promemoria\
                  \ asciugatrice. Il ciclo è terminato e il promemoria vocale funziona correttamente.\n{% elif eco_home_enabled\
                  \ %}\n  Eco Home è attivo. Test del percorso audio completato.\n{% else %}\n  Eco Home è disattivato. Il\
                  \ test audio funziona, ma gli annunci automatici sono spenti.\n{% endif %}"
            - variables:
                test_tts_delay_seconds: '{% set chars = test_message | length %} {{ [tts_minimum_delay_seconds, ((chars /
                  tts_chars_per_second) | round(0, ''ceil'') | int + 4)] | max }}'
                tv_should_mute_this_run: "{{ tv_ducking_enabled\n   and not (is_night | bool(false))\n   and states(tv_media_player)\
                  \ not in tv_ducking_excluded_states\n   and not (state_attr(tv_media_player, 'is_volume_muted') | default(false,\
                  \ true)) }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_profilo
              data:
                value: '{{ test_profile | trim }}'
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_messaggio
              data:
                value: '{{ (test_message | trim)[:250] }}'
              continue_on_error: true
            - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ nest_available }}'
                  sequence:
                    - parallel:
                        - sequence:
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: '{{ tv_should_mute_this_run }}'
                                  sequence:
                                    - action: media_player.volume_mute
                                      target:
                                        entity_id: '{{ tv_media_player }}'
                                      data:
                                        is_volume_muted: true
                                      continue_on_error: true
                        - sequence:
                            - action: media_player.volume_set
                              target:
                                entity_id: '{{ speaker }}'
                              data:
                                volume_level: '{{ test_volume_level }}'
                              continue_on_error: true
                    - action: tts.speak
                      target:
                        entity_id: '{{ tts_engine }}'
                      data:
                        media_player_entity_id: '{{ speaker }}'
                        message: '{{ test_message | trim }}'
                        language: it
                        options:
                          tld: it
                        cache: false
                      continue_on_error: true
                    - delay:
                        seconds: '{{ test_tts_delay_seconds }}'
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: '{{ tv_should_mute_this_run }}'
                          sequence:
                            - action: media_player.volume_mute
                              target:
                                entity_id: '{{ tv_media_player }}'
                              data:
                                is_volume_muted: false
                              continue_on_error: true
                    - action: media_player.media_stop
                      target:
                        entity_id: '{{ speaker }}'
                      continue_on_error: true
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: '{{ nest_volume_before | float(-1) >= 0 }}'
                          sequence:
                            - action: media_player.volume_set
                              target:
                                entity_id: '{{ speaker }}'
                              data:
                                volume_level: '{{ nest_volume_before }}'
                              continue_on_error: true
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.eco_home_ultimo_annuncio
                      data:
                        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
                      continue_on_error: true
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.eco_home_ultimo_esito
                      data:
                        value: 'Test inviato al Nest Hub: {{ test_profile | trim }}'
                      continue_on_error: true
              default:
                - action: input_text.set_value
                  target:
                    entity_id: input_text.eco_home_ultimo_esito
                  data:
                    value: Test non eseguito - Nest Hub non disponibile
                  continue_on_error: true
                - if:
                    - condition: template
                      value_template: '{{ debug }}'
                  then:
                    - action: logbook.log
                      data:
                        name: Eco Home
                        message: 'Test {{ test_profile | trim }} non eseguito: Nest Hub non disponibile.'
                        entity_id: '{{ speaker }}'
        - conditions:
            - condition: template
              value_template: "{{ eco_home_enabled\n   and trigger_type == 'dryer_finished_while_away'\n   and trigger_to_state\
                \ in dryer_finished_states\n   and trigger_from_state not in dryer_finished_states\n   and nobody_home }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.eco_home_asciugatrice_fine
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            - action: input_text.set_value
              target:
                entity_id: input_text.eco_home_ultimo_esito
              data:
                value: Promemoria asciugatrice salvato per il prossimo rientro
              continue_on_error: true
            - if:
                - condition: template
                  value_template: '{{ debug }}'
              then:
                - action: logbook.log
                  data:
                    name: Eco Home
                    message: Asciugatrice terminata mentre nessuno era in casa. Annuncio salvato.
                    entity_id: sensor.esterno_asciugatrice_machine_state
        - conditions:
            - condition: template
              value_template: "{% set last_ann_ts = as_timestamp(states('input_datetime.eco_home_ultimo_annuncio'), default=0)\
                \ %} {% set live_cooldown_ok = (as_timestamp(now()) - (last_ann_ts | float(0))) > welcome_cooldown_seconds\
                \ %} {{ eco_home_enabled\n   and trigger_type in ['door_opened', 'stefano_arrived', 'laura_arrived']\n   and\
                \ not eco_home_silent\n   and live_cooldown_ok\n   and has_new_arrival\n   and arrival_confirmed_by_person_and_door\n\
                \   and not is_state(speaker, 'playing') }}"
          sequence:
            - variables:
                indoor_temp_avg: "{% set sensors = indoor_temp_sensors | default([]) %} {% if sensors is string %}\n  {% set\
                  \ sensors = [sensors] %}\n{% endif %} {% set ns = namespace(values=[]) %} {% for s in sensors %}\n  {% if\
                  \ states(s) not in ['unknown', 'unavailable'] and states(s) | float(none) is not none %}\n    {% set ns.values\
                  \ = ns.values + [states(s) | float] %}\n  {% endif %}\n{% endfor %} {% if ns.values | length > 0 %}\n  {{\
                  \ (ns.values | sum / ns.values | length) | round(1) }}\n{% else %}\n  none\n{% endif %}"
                temp_announcement_text: "{% if indoor_temp_avg != 'none' %}\n  In casa ci sono {{ indoor_temp_avg | replace('.',\
                  \ ',') }} gradi.\n  {% if indoor_temp_avg | float > 26.0 %}\n    Ti ho inviato una notifica sul telefono\
                  \ se desideri accendere i condizionatori.\n  {% endif %}\n{% else %}\n  {{ '' }}\n{% endif %}"
                arrived_now_text: '{% if arrived_now_couple %}Stefano e Laura{% elif arrived_stefano %}Stefano{% elif arrived_laura
                  %}Laura{% else %}Casa{% endif %}'
                arrived_now_count: '{{ 2 if arrived_now_couple else (1 if (arrived_stefano or arrived_laura) else 0) }}'
                dryer_pending_minutes_ago: "{% set ts = as_timestamp(states('input_datetime.eco_home_asciugatrice_fine'),\
                  \ default=none) %} {% if ts is not none %}\n  {{ ((as_timestamp(now()) - ts) / 60) | int(0) }}\n{% else\
                  \ %}\n  999999\n{% endif %}"
                dryer_pending_should_announce: "{{\n  is_state('input_boolean.eco_home_asciugatrice_da_annunciare', 'on')\n\
                  \  and dryer_pending_minutes_ago | int(999999) >= 0\n  and dryer_pending_minutes_ago | int(999999) <= (dryer_announce_valid_hours\
                  \ * 60)\n}}"
                dryer_pending_expired: "{{\n  is_state('input_boolean.eco_home_asciugatrice_da_annunciare', 'on')\n  and dryer_pending_minutes_ago\
                  \ | int(999999) > (dryer_announce_valid_hours * 60)\n}}"
                dryer_finished_elapsed_text: "{% set m = dryer_pending_minutes_ago | int(0) %}\n{% if m < 2 %}\n  da circa\
                  \ un minuto\n{% elif m < 60 %}\n  da circa {{ m }} minuti\n{% elif m < 120 %}\n  da circa un'ora\n{% else\
                  \ %}\n  da circa {{ (m / 60) | round(0) | int }} ore\n{% endif %}"
                dryer_arrival_text_final: "{% if dryer_pending_should_announce %}\n  Ah, asciugatrice finita {{ dryer_finished_elapsed_text\
                  \ }}.\n{% elif dryer_running_and_has_remaining_time %}\n  Asciugatrice pronta tra {{ dryer_remaining_minutes\
                  \ }} minuti.\n{% else %}\n  {{ '' }}\n{% endif %}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ dryer_pending_expired }}'
                  sequence:
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
            - variables:
                welcome_body: "{% if is_night %}\n  {{ night_phrases | random }}\n{% elif arrived_now_couple %}\n  {% if is_friday_evening\
                  \ %}\n    {{ couple_friday_phrases | random }}\n  {% elif hour_now | int(0) >= 12 and hour_now | int(0)\
                  \ < 15 %}\n    {{ couple_lunch_phrases | random }}\n  {% elif is_weekend %}\n    {{ couple_weekend_phrases\
                  \ | random }}\n  {% else %}\n    {{ couple_phrases | random }}\n  {% endif %}\n{% elif arrived_stefano %}\n\
                  \  {% if is_friday_evening %}\n    {{ stefano_friday_phrases | random }}\n  {% elif hour_now | int(0) >=\
                  \ 12 and hour_now | int(0) < 15 %}\n    {{ stefano_lunch_phrases | random }}\n  {% elif is_weekend %}\n\
                  \    {{ stefano_weekend_phrases | random }}\n  {% else %}\n    {{ stefano_phrases | random }}\n  {% endif\
                  \ %}\n{% elif arrived_laura %}\n  {% if is_friday_evening %}\n    {{ laura_friday_phrases | random }}\n\
                  \  {% elif hour_now | int(0) >= 12 and hour_now | int(0) < 15 %}\n    {{ laura_lunch_phrases | random }}\n\
                  \  {% elif is_weekend %}\n    {{ laura_weekend_phrases | random }}\n  {% else %}\n    {{ laura_phrases |\
