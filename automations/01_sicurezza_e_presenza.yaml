                                data:
                                  actions:
                                    - action: TURN_ON_AC_{{ context.id }}
                                      title: Sì, raffredda
                                    - action: DISMISS_AC
                                      title: No, grazie
                              continue_on_error: true
                        - conditions:
                            - condition: template
