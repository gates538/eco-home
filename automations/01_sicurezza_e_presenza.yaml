    saluto_orario: "{% if hour_now | int(0) >= 6 and hour_now | int(0) < 12 %}\n  Buongiorno\n{% elif hour_now | int(0) >=\
      \ 12 and hour_now | int(0) < 18 %}\n  Buon pomeriggio\n{% elif hour_now | int(0) >= 18 and hour_now | int(0) < 23 %}\n\
      \  Buonasera\n{% else %}\n  Buonanotte\n{% endif %}"
    is_weekend: '{{ now().weekday() in [5, 6] }}'
