- id: eco_home_security_120
  alias: Eco Home Security & Guardiano
  description: Modulo per controlli all'uscita (Guardiano) e sistema anti-intrusione
  mode: parallel
  max: 10
  triggers:
    - trigger: numeric_state
      entity_id: zone.home
      below: 1
      id: everyone_left
    - trigger: state
      entity_id: binary_sensor.porta_contact
      to: 'on'
      id: door_opened_intrusion
    - trigger: state
      entity_id:
        - person.stefano
        - person.laura
        - person.simone_mancini
        - person.monica
      to: home
      id: someone_arrived_disarm
    - trigger: numeric_state
      entity_id: zone.home
      above: 0
      id: zone_home_disarm
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - someone_arrived_disarm
                - zone_home_disarm
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.eco_home_allarme_inserito
              continue_on_error: true
        - conditions:
            - condition: trigger
              id: everyone_left
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.eco_home_allarme_inserito
              continue_on_error: true
            - delay: 00:01:00
            - variables:
                light_is_on: '{{ is_state(light_entity, ''on'') }}'
                windows_open: '{% set open = expand(window_sensors) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''name'')
                  | list %} {{ open | join('', '') if open | length > 0 else ''none'' }}'
                dryer_is_on: '{{ is_state(''binary_sensor.asciugatrice_in_funzione'', ''on'') or states(dryer_state_sensor)
                  in [''run'', ''running'', ''drying'', ''cooling''] or (states(''sensor.esterno_asciugatrice_potenza'') |
                  float(0) > 10) }}'
            - if:
                - condition: template
                  value_template: '{{ light_is_on }}'
              then:
                - action: '{{ stefano_notification_service }}'
                  data:
                    title: Guardiano Eco Home
                    message: "{{ [\n  \"Tutti sono usciti ma la luce \" ~ state_attr(light_entity, 'friendly_name') ~ \" è\
                      \ rimasta accesa. Vuoi spegnerla?\",\n  \"Avviso Guardiano: luce \" ~ state_attr(light_entity, 'friendly_name')\
                      \ ~ \" ancora accesa a casa vuota. La spengo?\",\n  \"Qualcuno ha dimenticato accesa la luce \" ~ state_attr(light_entity,\
                      \ 'friendly_name') ~ \"! Premi per spegnerla subito.\"\n] | random }}"
                    data:
                      actions:
                        - action: TURN_OFF_LIGHT_{{ context.id }}
                          title: Sì, spegni
                        - action: DISMISS_SEC
                          title: Ignora
                  continue_on_error: true
                - action: '{{ laura_notification_service }}'
                  data:
                    title: Guardiano Eco Home
                    message: Tutti sono usciti ma la luce {{ state_attr(light_entity, 'friendly_name') }} è rimasta accesa.
                  continue_on_error: true
            - if:
                - condition: template
                  value_template: '{{ windows_open != ''none'' }}'
              then:
                - action: '{{ stefano_notification_service }}'
                  data:
                    title: Guardiano Eco Home
                    message: 'Attenzione: avete lasciato aperto: {{ windows_open }} mentre siete fuori casa!'
                  continue_on_error: true
                - action: '{{ laura_notification_service }}'
                  data:
                    title: Guardiano Eco Home
                    message: 'Attenzione: avete lasciato aperto: {{ windows_open }} mentre siete fuori casa!'
                  continue_on_error: true
            - if:
                - condition: template
                  value_template: '{{ dryer_is_on }}'
              then:
                - action: '{{ stefano_notification_service }}'
                  data:
                    title: Guardiano Eco Home
                    message: L'asciugatrice è ancora in funzione mentre siete fuori casa.
                  continue_on_error: true
                - action: '{{ laura_notification_service }}'
                  data:
                    title: Guardiano Eco Home
                    message: L'asciugatrice è ancora in funzione mentre siete fuori casa.
                  continue_on_error: true
        - conditions:
            - condition: trigger
              id: door_opened_intrusion
            - condition: state
              entity_id: input_boolean.eco_home_allarme_inserito
              state: 'on'
            - condition: template
              value_template: '{{ not (is_state(''person.stefano'', ''home'') or is_state(''person.laura'', ''home'') or is_state(''person.simone_mancini'',
                ''home'') or is_state(''person.monica'', ''home'') or (states(''zone.home'') | int(0) > 0)) }}'
          sequence:
            - delay:
                seconds: 7.5
            - action: camera.snapshot
              target:
                entity_id: '{{ camera_entity }}'
              data:
                filename: '{{ snapshot_file_path }}'
              continue_on_error: true
            - action: '{{ stefano_notification_service }}'
              data:
                title: ⚠️ Portone Aperto a Casa Vuota
                message: Il portone d'ingresso è stato aperto. Disarmo automatico o conferma entro 30 secondi!
                data:
                  image: '{{ snapshot_access_url }}'
                  attachment:
                    url: '{{ snapshot_access_url }}'
                    content-type: jpeg
                    hide-thumbnail: false
                  actions:
                    - action: DISARM_ALARM_{{ context.id }}
                      title: Disarma (Sono io)
              continue_on_error: true
            - action: '{{ laura_notification_service }}'
              data:
                title: ⚠️ Portone Aperto a Casa Vuota
                message: Il portone d'ingresso è stato aperto. Disarmo automatico o conferma entro 30 secondi!
                data:
                  image: '{{ snapshot_access_url }}'
                  attachment:
                    url: '{{ snapshot_access_url }}'
                    content-type: jpeg
                    hide-thumbnail: false
                  actions:
                    - action: DISARM_ALARM_{{ context.id }}
                      title: Disarma (Sono io)
              continue_on_error: true
            - delay: 00:00:30
            - if:
                - condition: state
                  entity_id: input_boolean.eco_home_allarme_inserito
                  state: 'on'
                - condition: template
                  value_template: '{{ not (is_state(''person.stefano'', ''home'') or is_state(''person.laura'', ''home'')
                    or is_state(''person.simone_mancini'', ''home'') or is_state(''person.monica'', ''home'') or (states(''zone.home'')
                    | int(0) > 0)) }}'
              then:
                - action: '{{ stefano_notification_service }}'
                  data:
                    title: 🚨 ALLARME INTRUSIONE CONFERMATO 🚨
                    message: 'Nessun disarmo registrato dopo 30 secondi: allarme sonoro attivo in casa!'
                  continue_on_error: true
                - action: '{{ laura_notification_service }}'
                  data:
                    title: 🚨 ALLARME INTRUSIONE CONFERMATO 🚨
                    message: 'Nessun disarmo registrato dopo 30 secondi: allarme sonoro attivo in casa!'
                  continue_on_error: true
                - action: media_player.volume_set
                  target:
                    entity_id: '{{ speaker }}'
                  data:
                    volume_level: 1.0
                  continue_on_error: true
                - action: tts.speak
                  target:
                    entity_id: '{{ tts_engine }}'
                  data:
                    media_player_entity_id: '{{ speaker }}'
                    language: it
                    options:
                      tld: it
                    message: Attenzione. Intrusione rilevata. Le forze dell'ordine sono state avvisate. Allontanarsi immediatamente.
                    cache: false
                  continue_on_error: true
  variables:
    speaker: media_player.nest_hub_sala
    tts_engine: tts.google_translate_it_lt
    light_entity: light.luceambiente
    dryer_state_sensor: sensor.esterno_asciugatrice_machine_state
    camera_entity: camera.sala_2
    stefano_notification_service: notify.mobile_app_samsung_s25_edge_di_stefano
    laura_notification_service: notify.mobile_app_samsung_s22_di_laura
    default_notification_service: notify.mobile_app_samsung_s25_edge_di_stefano
    snapshot_file_path: /config/www/cam_snapshots/sala_2.jpg
    snapshot_access_url: /local/cam_snapshots/sala_2.jpg?t={{ now().timestamp() | int }}
    window_sensors:
      - binary_sensor.finestrasala_contact
      - binary_sensor.finestracamera_contact
      - binary_sensor.finestracameretta_contact
      - binary_sensor.finestrabagno_contact
      - binary_sensor.finestrabagnetto_contact
      - binary_sensor.finestracucina_contact
- id: eco_home_check_silenzioso_buonanotte
  alias: Eco Home - Check Silenzioso Buonanotte (Ore 00:00)
  description: 'Controllo a mezzanotte a suoni spenti: silenzio totale se tutto è chiuso/spento, notifica discreta se qualcosa
    è rimasto aperto'
  triggers:
    - trigger: time
      at: 00:00:00
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: template
      value_template: '{{ is_state(''person.stefano'', ''home'') or is_state(''person.laura'', ''home'') }}'
  actions:
    - variables:
        portone_aperto: '{{ is_state(''binary_sensor.porta_contact'', ''on'') }}'
        finestre_aperte: '{% set open = expand([''binary_sensor.finestrasala_contact'', ''binary_sensor.finestracamera_contact'',
          ''binary_sensor.finestracameretta_contact'', ''binary_sensor.finestrabagno_contact'', ''binary_sensor.finestrabagnetto_contact'',
          ''binary_sensor.finestracucina_contact'']) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''name'') | list
          %} {{ open | join('', '') if open | length > 0 else '''' }}'
        luci_accese: '{% set on_lights = expand([''light.luceambiente'', ''light.faretti_cucina'']) | selectattr(''state'',
          ''eq'', ''on'') | map(attribute=''name'') | list %} {{ on_lights | join('', '') if on_lights | length > 0 else ''''
          }}'
        asciugatrice_attiva: '{{ is_state(''binary_sensor.asciugatrice_in_funzione'', ''on'') or states(''sensor.esterno_asciugatrice_machine_state'')
          in [''run'', ''running'', ''drying'', ''cooling''] or (states(''sensor.esterno_asciugatrice_potenza'') | float(0)
          > 10) }}'
        anomalie: "{% set lista = [] %} {% if portone_aperto %}\n  {% set lista = lista + ['Portone principale aperto'] %}\n\
          {% endif %} {% if finestre_aperte != '' %}\n  {% set lista = lista + [finestre_aperte] %}\n{% endif %} {% if luci_accese\
          \ != '' %}\n  {% set lista = lista + [luci_accese] %}\n{% endif %} {% if asciugatrice_attiva %}\n  {% set lista\
          \ = lista + ['Asciugatrice ancora in funzione'] %}\n{% endif %} {{ lista | join(' • ') }}"
    - if:
        - condition: template
          value_template: '{{ anomalie | trim != '''' }}'
      then:
        - action: notify.mobile_app_samsung_s25_edge_di_stefano
          data:
            title: 🌙 Check Notturno Eco Home
            message: 'Attenzione: prima di dormire risultano ancora aperti o accesi:

              • {{ anomalie }}'
          continue_on_error: true
        - action: notify.mobile_app_samsung_s22_di_laura
          data:
            title: 🌙 Check Notturno Eco Home
            message: 'Attenzione: prima di dormire risultano ancora aperti o accesi:

              • {{ anomalie }}'
          continue_on_error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.eco_home_ultimo_messaggio
          data:
            value: 'Check Buonanotte: Notificate anomalie aperte/accese'
  mode: single
- id: eco_home_allarme_portone_aperto_lungo_micie
  alias: Eco Home - Allarme Portone Aperto a Lungo (> 3 Minuti - Sicurezza Micie)
  description: Avviso vocale tempestivo o notifica silenziosa se il portone resta aperto per più di 3 minuti continui
  triggers:
    - trigger: state
      entity_id: binary_sensor.porta_contact
      to: 'on'
      for:
        minutes: 3
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: state
      entity_id: input_boolean.eco_home_silenzioso
      state: 'off'
    - condition: template
      value_template: '{{ is_state(''person.stefano'', ''home'') or is_state(''person.laura'', ''home'') }}'
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
        > 600 }}'
  actions:
    - variables:
        is_daytime: '{{ not (now().hour >= 23 or now().hour < 7) }}'
        portone_msg: "{{ [\n  \"Attenzione! Portone aperto da oltre tre minuti: controllate che sia ben chiuso per la sicurezza\
          \ delle micie!\",\n  \"Allarme portone: la porta principale è aperta da tre minuti! Verificate la chiusura per la\
          \ sicurezza di casa!\",\n  \"Attenzione Stefano e Laura: portone aperto da tre minuti, occhio alle micie e richiudete\
          \ la porta!\"\n] | random }}"
    - if:
        - condition: template
          value_template: '{{ is_daytime }}'
      then:
        - action: tts.speak
          target:
            entity_id: tts.google_translate_it_lt
          data:
            media_player_entity_id: media_player.nest_hub_sala
            language: it
            options:
              tld: it
            message: '{{ portone_msg }}'
      else:
        - action: notify.mobile_app_samsung_s25_edge_di_stefano
          data:
            title: 🚪 Portone Aperto
            message: Il portone principale è aperto da oltre 3 minuti!
          continue_on_error: true
        - action: notify.mobile_app_samsung_s22_di_laura
          data:
            title: 🚪 Portone Aperto
            message: Il portone principale è aperto da oltre 3 minuti!
          continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: Allarme Portone Aperto oltre 3 minuti
      continue_on_error: true
  mode: single
- id: eco_home_guardiano_dispositivi_offline
  alias: Eco Home - Guardiano Dispositivi Offline (Check Ore 11:00)
  description: Controllo silenzioso quotidiano alle 11:00 su nodi critici, sensori portone/finestre/batterie per avvisare
    di dispositivi offline o freeze
  triggers:
    - trigger: time
      at: '11:00:00'
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
  actions:
    - variables:
        critical_devices:
          - binary_sensor.porta_contact
          - binary_sensor.finestrasala_contact
          - binary_sensor.finestracamera_contact
          - binary_sensor.finestracameretta_contact
          - binary_sensor.finestrabagno_contact
          - binary_sensor.finestrabagnetto_contact
          - binary_sensor.finestracucina_contact
          - media_player.nest_hub_sala
        offline_list: "{% set ns = namespace(items=[]) %} {% for d in critical_devices %}\n  {% if states(d) in ['unavailable',\
          \ 'unknown', 'None'] %}\n    {% set ns.items = ns.items + [state_attr(d, 'friendly_name') | default(d, true)] %}\n\
          \  {% elif states[d] is defined and states[d].last_updated is not none %}\n    {% set diff_sec = as_timestamp(now())\
          \ - as_timestamp(states[d].last_updated) %}\n    {% if diff_sec > 86400 and d == 'binary_sensor.porta_contact' %}\n\
          \      {% set ns.items = ns.items + [(state_attr(d, 'friendly_name') | default(d, true)) ~ ' (Nessun segnale da\
          \ >24h)'] %}\n    {% endif %}\n  {% endif %}\n{% endfor %} {{ ns.items | join(', ') }}"
    - if:
        - condition: template
          value_template: '{{ offline_list | trim != '''' }}'
      then:
        - action: notify.mobile_app_samsung_s25_edge_di_stefano
          data:
            title: ⚠️ Guardiano Dispositivi Eco Home
            message: 'Attenzione, i seguenti dispositivi risultano offline o non rispondono da oltre 24 ore: {{ offline_list
              }}.'
          continue_on_error: true
        - action: notify.mobile_app_samsung_s22_di_laura
          data:
            title: ⚠️ Guardiano Dispositivi Eco Home
            message: 'Attenzione, i seguenti dispositivi risultano offline o non rispondono da oltre 24 ore: {{ offline_list
              }}.'
          continue_on_error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.eco_home_ultimo_messaggio
          data:
            value: 'Guardiano: Rilevati dispositivi offline ({{ offline_list | truncate(150) }})'
  mode: single
- id: simulazione_presenza_fuori_casa_sera
  alias: 💡 Sicurezza - Simulazione di Presenza Serale (Fuori Casa)
  description: Accende e spegne ciclicamente a rotazione luci soffuse SOLO quando Stefano e Laura sono entrambi fuori casa
  triggers:
    - trigger: time_pattern
      minutes: /25
  conditions:
    - condition: state
      entity_id: person.stefano
      state: not_home
    - condition: state
      entity_id: person.laura
      state: not_home
    - condition: template
      value_template: '{{ states(''input_text.scenario_casa_selezionato'') in [''🚪 Fuori Casa'', ''Fuori Casa''] }}'
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: time
      after: '19:30:00'
      before: '23:15:00'
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ now().minute < 30 }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.mensolecamino
              data:
                brightness_pct: 35
              continue_on_error: true
            - action: light.turn_off
              target:
                entity_id: light.cucina
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: '{{ now().minute >= 30 }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.cucina
              data:
                brightness_pct: 40
              continue_on_error: true
            - action: light.turn_off
              target:
                entity_id: light.mensolecamino
              continue_on_error: true
  mode: single
- id: simulazione_presenza_spegnimento_notte
  alias: 🌑 Sicurezza - Simulazione Presenza Spegnimento Notte
  description: Spegne tutte le luci della simulazione alle 23:30 se fuori casa
  triggers:
    - trigger: time
      at: '23:30:00'
  conditions:
    - condition: state
      entity_id: person.stefano
      state: not_home
    - condition: state
      entity_id: person.laura
      state: not_home
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.mensolecamino
          - light.luceambiente
          - light.cucina
          - light.sala
      continue_on_error: true
  mode: single
- id: notifica_finestre_aperte_fuori_casa
  alias: 🚪 Notifica Smart - Finestre Aperte Fuori Casa
  description: Avvisa se una o più finestre sono rimaste aperte all'attivazione dello scenario Fuori Casa o inserimento Allarme
    (copre tutte e 6 le finestre)
  triggers:
    - trigger: state
      entity_id: alarm_control_panel.centrale_allarme
      to:
        - armed_away
        - armed_home
        - armed_night
    - trigger: state
      entity_id: scene.fuori_casa
      not_to:
        - unavailable
        - unknown
      not_from:
        - unavailable
        - unknown
  conditions:
    - condition: template
      value_template: "{{ expand([\n  'binary_sensor.finestrasala_contact',\n  'binary_sensor.finestracamera_contact',\n \
        \ 'binary_sensor.finestracameretta_contact',\n  'binary_sensor.finestrabagno_contact',\n  'binary_sensor.finestrabagnetto_contact',\n\
        \  'binary_sensor.finestracucina_contact'\n]) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
  actions:
    - variables:
        finestre_aperte: "{% set open = expand([\n  'binary_sensor.finestrasala_contact',\n  'binary_sensor.finestracamera_contact',\n\
          \  'binary_sensor.finestracameretta_contact',\n  'binary_sensor.finestrabagno_contact',\n  'binary_sensor.finestrabagnetto_contact',\n\
          \  'binary_sensor.finestracucina_contact'\n]) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}\
          \ {{ open | join(', ') }}"
    - action: script.notifica_smart
      data:
        titolo: 🚪 Finestre Aperte — Casa Vuota!
        messaggio: 'Attenzione: avete lasciato aperto mentre siete fuori casa: {{ finestre_aperte }}. Verificate prima di
          inserire l''allarme!'
        categoria: sicurezza
        priorita: alta
        tag: infissi_aperti_fuori_casa
  mode: single
