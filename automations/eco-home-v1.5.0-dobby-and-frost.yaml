- id: 'eco_home_dobby_pulizia_completata'
  alias: 'Eco Home - Annuncio Dobby Pulizia Completata'
  description: 'Annuncio vocale sul Nest Hub quando Dobby completa la pulizia e torna alla base'
  triggers:
  - trigger: state
    entity_id:
    - vacuum.dreame_l40_pro
    - vacuum.dobby
    to:
    - docked
    - returning
    from: cleaning
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: input_boolean.eco_home_silenzioso
    state: 'off'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') or is_state('person.simone', 'home') or is_state('person.monica', 'home') }}"
  actions:
  - action: tts.speak
    target:
      entity_id: tts.google_translate_it_lt
    data:
      media_player_entity_id: media_player.nest_hub_sala
      language: "it"
      options:
        tld: "it"
      message: >-
        {{ [
          "Dobby ha completato la pulizia ed è tornato a riposare nella sua nicchia! La casa è splendente!",
          "Pulizia completata! Dobby ha finito il suo dovere ed è un elfo domestico libero... o quasi!",
          "Dobby ha terminato! I pavimenti di casa sono puliti, splendenti e tirati a lucido!",
          "Missione compiuta per Dobby! Polvere e peli di gatto sono stati sconfitti con successo!",
          "Dobby è tornato alla base di ricarica! Potete camminare a piedi scalzi senza timore!"
        ] | random }}
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Dobby: Pulizia completata e ritorno alla base"
  mode: single

- id: 'eco_home_allerta_gelo_parabrezza_auto'
  alias: 'Eco Home - Allerta Gelo Parabrezza Serale (Netatmo Esterna)'
  description: 'Notifica WhatsApp alle 22:00 se la temperatura esterna scende sotto i 3°C per preparare la Discovery al mattino'
  triggers:
  - trigger: time
    at: '22:00:00'
  conditions:
  - condition: numeric_state
    entity_id: sensor.temperatura_media_esterna
    below: 3
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  actions:
  - action: rest_command.whatsapp_group_notify
    data:
      message: >-
        {{ [
          "❄️ Attenzione! La temperatura esterna stasera è di " ~ states('sensor.temperatura_media_esterna') ~ "°C. Domani mattina la Discovery potrebbe avere il parabrezza ghiacciato!",
          "🥶 Allerta Gelo! Fuori ci sono " ~ states('sensor.temperatura_media_esterna') ~ "°C. Preparare il raschietto per il ghiaccio o anticipare la sveglia di 5 minuti!",
          "🧊 Notte glaciale in arrivo (" ~ states('sensor.temperatura_media_esterna') ~ "°C). Domani mattina vetri dell'auto probabilmente congelati!"
        ] | random }}
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Meteo Alert: Possibile gelo parabrezza auto"
  mode: single

- id: 'eco_home_dobby_rientro_su_presenza'
  alias: 'Eco Home - Dobby Rientro Immediato alla Base al Rientro Persone'
  description: 'Se Dobby sta pulendo e qualcuno apre il portone o rientra a casa, torna istantaneamente alla base'
  triggers:
  - trigger: state
    entity_id: binary_sensor.porta_contact
    to: 'on'
  - trigger: state
    entity_id:
    - person.stefano
    - person.laura
    to: 'home'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: template
    value_template: >-
      {% set s1 = states('vacuum.dreame_l40_pro') %}
      {% set s2 = states('vacuum.dobby') %}
      {{ s1 in ['cleaning', 'sweeping', 'mopping', 'cleaning_auto', 'zone_cleaning', 'spot_cleaning'] or
         s2 in ['cleaning', 'sweeping', 'mopping', 'cleaning_auto', 'zone_cleaning', 'spot_cleaning'] }}
  actions:
  - action: vacuum.return_to_base
    target:
      entity_id:
      - vacuum.dreame_l40_pro
      - vacuum.dobby
    continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Dobby: Rientro immediato alla base per rientro persone"
  mode: single
