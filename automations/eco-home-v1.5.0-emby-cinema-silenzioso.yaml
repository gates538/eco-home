- id: 'eco_home_cinema_silenzioso_avvio'
  alias: 'Eco Home - Modalità Cinema Soffusa & Silenzioso (Avvio Film Emby/TV)'
  description: 'Attiva modalità silenziosa e abbassa dolcemente la luce ambiente al 15% caldo all avvio del film dopo il tramonto'
  triggers:
  - trigger: state
    entity_id:
    - media_player.emby_edge_windows
    - media_player.emby_homeassistant
    - media_player.emby_homeassistant_2
    - media_player.sala_tv_sala
    to: 'playing'
    not_from:
    - 'paused'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.eco_home_silenzioso
  - if:
    - condition: state
      entity_id: sun.sun
      state: 'below_horizon'
    then:
    - action: light.turn_on
      target:
        entity_id: light.luceambiente
      data:
        brightness_pct: 15
        color_temp_kelvin: 2200
        transition: 3
      continue_on_error: true
    - action: light.turn_off
      target:
        entity_id: light.faretti_cucina
      data:
        transition: 2
      continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Scena Cinema: Avvio film, luce soffusa al 15% e silenzioso attivo"
  mode: single

- id: 'eco_home_cinema_pausa_luci'
  alias: 'Eco Home - Pausa Film: Luce Ambiente Media (Snack & Spostamenti)'
  description: 'Alza temporaneamente la luce al 45% durante la pausa del film per consentire spostamenti in sicurezza'
  triggers:
  - trigger: state
    entity_id:
    - media_player.emby_edge_windows
    - media_player.emby_homeassistant
    - media_player.emby_homeassistant_2
    - media_player.sala_tv_sala
    to: 'paused'
    for:
      seconds: 10
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: sun.sun
    state: 'below_horizon'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.luceambiente
    data:
      brightness_pct: 45
      color_temp_kelvin: 2700
      transition: 2
    continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Scena Cinema: Pausa film, luce al 45%"
  mode: single

- id: 'eco_home_cinema_ripresa_luci'
  alias: 'Eco Home - Ripresa Film: Ritorno a Luce Soffusa 15%'
  description: 'Riabbassa la luce ambiente al 15% quando si riprende la visione del film'
  triggers:
  - trigger: state
    entity_id:
    - media_player.emby_edge_windows
    - media_player.emby_homeassistant
    - media_player.emby_homeassistant_2
    - media_player.sala_tv_sala
    from: 'paused'
    to: 'playing'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: sun.sun
    state: 'below_horizon'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.luceambiente
    data:
      brightness_pct: 15
      color_temp_kelvin: 2200
      transition: 2
    continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Scena Cinema: Ripresa film, luce soffusa al 15%"
  mode: single

- id: 'eco_home_cinema_silenzioso_fine'
  alias: 'Eco Home - Fine Film: Ripristino Silenzioso & Luce Normale'
  description: 'Disattiva la modalità silenziosa e ripristina la luce quando la riproduzione del film termina'
  triggers:
  - trigger: state
    entity_id:
    - media_player.emby_edge_windows
    - media_player.emby_homeassistant
    - media_player.emby_homeassistant_2
    - media_player.sala_tv_sala
    to:
    - 'idle'
    - 'off'
    for:
      minutes: 2
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: input_boolean.eco_home_silenzioso
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.eco_home_silenzioso
  - if:
    - condition: state
      entity_id: sun.sun
      state: 'below_horizon'
    then:
    - action: light.turn_on
      target:
        entity_id: light.luceambiente
      data:
        brightness_pct: 60
        color_temp_kelvin: 2700
        transition: 3
      continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Scena Cinema: Fine film, silenzioso disattivato e luce ripristinata"
  mode: single
