# ==============================================================================
# 07 — INFRASTRUTTURA, RETE/VPN, DOCKER, ROUTINE AI, PILLOLE & MANUTENZIONE
# ==============================================================================

- id: 'buongiorno_feriale_nest_hub_camera'
  alias: 'Presenza: Buongiorno Feriale AI su Nest Hub Camera'
  description: >-
    Dal lunedì al venerdì alle 07:00, riproduce un annuncio di buongiorno sarcastico e personalizzato su Nest Hub Camera
    con meteo, pioggia notturna (da storico pluviometro), rischio ghiaccio/neve e traffico Google Maps per Utente 2 (Via Ufficio Centrale Roma).
    Gestibile e sospendibile da tab Impostazioni in plancia.
  mode: single
  trigger:
    - trigger: time
      at: '07:00:00'
      id: orario_fisso_7
    - trigger: time
      at: input_datetime.buongiorno_orario
      id: orario_helper
  condition:
    # 1. Solo giorni feriali (Lunedì - Venerdì)
    - condition: template
      value_template: >-
        {{ now().weekday() in [0, 1, 2, 3, 4] }}
    # 2. Controllo manuale abilitato
    - condition: state
      entity_id: input_boolean.buongiorno_attivo
      state: 'on'
    # 3. Modalità ferie / non svegliare disattivata
    - condition: state
      entity_id: input_boolean.buongiorno_modalita_ferie
      state: 'off'
    # 4. Controllo sospensione per tot giorni
    - condition: template
      value_template: >-
        {% set sospeso_str = states('input_datetime.buongiorno_sospeso_fino_al') %}
        {% if sospeso_str not in ['unknown', 'unavailable', '', '1970-01-01 00:00:00'] %}
          {% set dt_sospeso = as_datetime(sospeso_str) %}
          {{ dt_sospeso is none or now() >= dt_sospeso }}
        {% else %}
          true
        {% endif %}
    # 5. Presenza in casa: almeno uno presente per non svegliare stanza vuota
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.casa_occupata', 'on') }}
    # 6. Esecuzione al massimo una volta al giorno
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or (this.attributes.last_triggered.date() != now().date()) }}
  action:
    - action: script.annuncio_buongiorno_ai

- id: 'sveglia_cameretta_nest_hub'
  alias: 'Presenza: Sveglia Cameretta con Annuncio Meteo'
  description: >-
    Attiva all'orario impostato (default 07:30) la sveglia vocale generica su Nest Hub Cameretta
    con lettura della temperatura attuale e previsioni meteo, se abilitata dalla tab Impostazioni.
  mode: single
  trigger:
    - trigger: time
      at: input_datetime.sveglia_cameretta_orario
  condition:
    - condition: state
      entity_id: input_boolean.sveglia_cameretta_attiva
      state: 'on'
  action:
    - action: script.sveglia_cameretta_annuncio_meteo

- id: 'rifiuti_promemoria_sera_21'
  alias: 'Rifiuti: Promemoria Vocale Spazzatura Ore 21 AI'
  description: >-
    Ogni sera alle 21:00 ricorda su Nest Hub Sala quale bidone della spazzatura va portato fuori,
    avvisando se in quel momento sta piovendo, se tira molto vento e se fa freddo.
  mode: single
  trigger:
    - trigger: time
      at: '21:00:00'
      id: orario_fisso_21
    - trigger: time
      at: input_datetime.promemoria_rifiuti_orario
      id: orario_helper
  condition:
    # 1. Helper abilitato da interfaccia utente
    - condition: state
      entity_id: input_boolean.promemoria_rifiuti_attivo
      state: 'on'
    # 2. Esecuzione al massimo una volta al giorno
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or (this.attributes.last_triggered.date() != now().date()) }}
    # 3. Ci deve essere un bidone da esporre stasera (se non c'è raccolta, nessun annuncio)
    - condition: template
      value_template: >-
        {% set sensor_state = states('sensor.raccolta_rifiuti') | default('') %}
        {% set days_rem = state_attr('sensor.raccolta_rifiuti', 'days_remaining') | int(99) %}
        {{ (is_state('calendar.raccolta_rifiuti', 'on') and days_rem == 0) or (sensor_state not in ['unknown', 'unavailable', 'none', '', 'Nessun Ritiro', 'Nessuna raccolta programmata'] and days_rem == 0) }}
  action:
    - action: script.annuncio_rifiuti_ore_21_ai

- id: 'infrastruttura_watchdog_synology_nas'
  alias: "Infrastruttura: Watchdog Salute Synology NAS & Dischi"
  description: "Notifica anomalie hardware, settori danneggiati, vita minima dischi o saturazione volume del NAS."
  mode: queued
  max: 10
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.synologynas_drive_1_superato_il_numero_massimo_di_settori_danneggiati
        - binary_sensor.synologynas_drive_2_superato_il_numero_massimo_di_settori_danneggiati
        - binary_sensor.synologynas_drive_3_superato_il_numero_massimo_di_settori_danneggiati
        - binary_sensor.synologynas_drive_4_superato_il_numero_massimo_di_settori_danneggiati
        - binary_sensor.synologynas_drive_5_superato_il_numero_massimo_di_settori_danneggiati
        - binary_sensor.synologynas_m_2_drive_1_superato_il_numero_massimo_di_settori_danneggiati
        - binary_sensor.synologynas_m_2_drive_2_superato_il_numero_massimo_di_settori_danneggiati
      to: 'on'
      id: settori_danneggiati
    - trigger: state
      entity_id:
        - binary_sensor.synologynas_drive_1_al_di_sotto_della_vita_residua_minima
        - binary_sensor.synologynas_drive_2_al_di_sotto_della_vita_residua_minima
        - binary_sensor.synologynas_drive_3_al_di_sotto_della_vita_residua_minima
        - binary_sensor.synologynas_drive_4_al_di_sotto_della_vita_residua_minima
        - binary_sensor.synologynas_drive_5_al_di_sotto_della_vita_residua_minima
        - binary_sensor.synologynas_m_2_drive_1_al_di_sotto_della_vita_residua_minima
        - binary_sensor.synologynas_m_2_drive_2_al_di_sotto_della_vita_residua_minima
      to: 'on'
      id: vita_residua
    - trigger: numeric_state
      entity_id: sensor.synologynas_volume_1_volume_utilizzato
      above: 88
      id: volume_quasi_pieno
    - trigger: numeric_state
      entity_id: sensor.synologynas_temperatura
      above: 52
      id: temperatura_nas
  conditions:
    - condition: state
      entity_id: input_boolean.notifiche_synology_salute
      state: 'on'
  actions:
    - variables:
        dettaglio_nas: >-
          {% if trigger.id == 'settori_danneggiati' %}
            🚨 Errore SMART critico: superato numero massimo di settori danneggiati su {{ trigger.to_state.attributes.friendly_name }}. Sostituzione disco raccomandata!
          {% elif trigger.id == 'vita_residua' %}
            ⚠️ Allarme disco SSD/HDD: {{ trigger.to_state.attributes.friendly_name }} è sceso sotto la vita residua minima affidabile.
          {% elif trigger.id == 'volume_quasi_pieno' %}
            ⚠️ Spazio Volume 1 Synology in esaurimento: occupato {{ states('sensor.synologynas_volume_1_volume_utilizzato') }}%. Pulire vecchie registrazioni o snapshot.
          {% else %}
            ⚠️ Temperatura Synology NAS elevata: rilevati {{ states('sensor.synologynas_temperatura') }}°C. Verificare ventilazione e ventole.
          {% endif %}
    - action: script.notifica_smart
      data:
        titolo: "🖥️ Allerta Hardware Synology NAS"
        messaggio: "{{ dettaglio_nas }}"
        priorita: "alta"
        categoria: "sicurezza"
        tag: "synology_salute_{{ trigger.id }}"
        azioni:
          - action: "URI"
            title: "💻 Apri Tecnico"
            uri: "/eco-home/tecnico"

- id: 'infrastruttura_watchdog_batteria_scarica_immediata'
  alias: "Infrastruttura: Watchdog Batteria Sensore Scarica (< 15%)"
  description: "Notifica push immediata quando qualsiasi sensore fisso della casa scende al di sotto del 15% (esclusi smartphone e tablet)."
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.sensori_batteria_scarica_conteggio
      above: 0
  conditions:
    - condition: state
      entity_id: input_boolean.notifiche_batterie_watchdog
      state: 'on'
  actions:
    - action: script.notifica_smart
      data:
        titolo: "🪫 Watchdog: Batteria Sensore Scarica!"
        messaggio: "Attenzione: uno o più sensori fissi dell'impianto richiedono la sostituzione della batteria: {{ states('sensor.sensori_batteria_scarica_elenco') }}."
        priorita: "alta"
        categoria: "sicurezza"
        tag: "watchdog_batteria_scarica"
        azioni:
          - action: "URI"
            title: "⚙️ Pannello Tecnico"
            uri: "/eco-home/tecnico"

- id: 'infrastruttura_report_settimanale_batterie'
  alias: "Infrastruttura: Report Settimanale Batterie Impianto (Lunedì 09:00)"
  description: "Invia un promemoria il lunedì mattina se ci sono sensori con batteria inferiore al 25% (esclusi smartphone e tablet)."
  mode: single
  triggers:
    - trigger: time
      at: '09:00:00'
  conditions:
    - condition: time
      weekday:
        - mon
    - condition: state
      entity_id: input_boolean.notifiche_batterie_watchdog
      state: 'on'
    - condition: template
      value_template: >-
        {% set ns = namespace(found=false) %}
        {% for s in states.sensor if s.attributes.device_class == 'battery' and s.state | int(-1) >= 0 %}
          {% if not (s.entity_id | regex_search('samsung|tablet|telefono|phone|mobile_app|dispositivi_mobili', ignorecase=true)) %}
            {% if s.state | int(100) <= 25 %}
              {% set ns.found = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
  actions:
    - variables:
        elenco_25: >-
          {% set items = [] %}
          {% for s in states.sensor if s.attributes.device_class == 'battery' and s.state | int(-1) >= 0 %}
            {% if not (s.entity_id | regex_search('samsung|tablet|telefono|phone|mobile_app|dispositivi_mobili', ignorecase=true)) %}
              {% if s.state | int(100) <= 25 %}
                {% set items = items + [s.name ~ ' (' ~ s.state ~ '%)'] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ items | join(', ') }}
    - action: script.notifica_smart
      data:
        titolo: "🔋 Report Settimanale Batterie Sensori"
        messaggio: "Promemoria manutenzione: i seguenti sensori hanno batteria inferiore al 25%: {{ elenco_25 }}."
        priorita: "normale"
        categoria: "sicurezza"
        tag: "report_settimanale_batterie"

- id: 'infrastruttura_blackout_rilevamento_e_ripristino'
  alias: "Infrastruttura: Rilevamento Blackout e Notifica Ripristino Rete"
  description: "Traccia la caduta della rete 230V (La Nicchia in corridoio con FWA, RT6600ax, SLZB-06Mg24U, Hub SurePet e HDHomeRun è senza UPS e si spegne, mentre NAS Synology e Switch sotto scrivania in cameretta restano attivi su UPS), e notifica durata e ripristino al ritorno della corrente e della connettività FWA."
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.rete_elettrica_casa
      from: 'on'
      to: 'off'
      for:
        seconds: 45
      id: inizio_blackout
    - trigger: state
      entity_id: binary_sensor.rete_elettrica_casa
      from: 'off'
      to: 'on'
      for:
        seconds: 45
      id: fine_blackout
  conditions:
    - condition: state
      entity_id: input_boolean.notifiche_blackout_rete
      state: 'on'
  actions:
    - choose:
        # 1. Inizio Blackout Rete Domestica (confermato per 45 secondi; La Nicchia senza UPS è spenta, NAS e Switch cameretta attivi su UPS)
        - conditions:
            - condition: trigger
              id: inizio_blackout
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.ultimo_blackout_inizio
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.blackout_in_corso
            - action: logbook.log
              data:
                name: "Blackout Rete Elettrica"
                message: "Mancanza di rete 230V rilevata (Nicchia corridoio non alimentata). Synology NAS, switch cameretta e container Home Assistant operativi su alimentazione ausiliaria UPS."
            - action: script.notifica_smart
              data:
                titolo: "🔌 Allerta Blackout Rete Elettrica"
                messaggio: "Rilevata assenza di tensione 230V a casa. La Nicchia (FWA, RT6600ax, Zigbee) è senza rete, mentre NAS Synology e Home Assistant sono attivi su UPS in cameretta."
                priorita: "alta"
                categoria: "sicurezza"
                tag: "notifica_inizio_blackout"
              continue_on_error: true

        # 2. Ripristino Tensione di Rete (SOLO se c'era un blackout attivamente tracciato!)
        - conditions:
            - condition: trigger
              id: fine_blackout
            - condition: state
              entity_id: input_boolean.blackout_in_corso
              state: 'on'
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.blackout_in_corso
            - variables:
                start_str: "{{ states('input_datetime.ultimo_blackout_inizio') }}"
                minuti_blackout: >-
                  {% if start_str not in ['unknown', 'unavailable', ''] and as_timestamp(start_str, None) is not none %}
                    {{ [((now().timestamp() - as_timestamp(start_str, now().timestamp())) / 60) | round(0), 1] | max }}
                  {% else %}
                    1
                  {% endif %}
            - action: logbook.log
              data:
                name: "Ripristino Rete Elettrica"
                message: "Tensione 230V ripristinata dopo circa {{ minuti_blackout }} minuti. Nicchia corridoio (RT6600ax, FWA, SLZB-06Mg24U, Hub SurePet, HDHomeRun) nuovamente alimentata."
            - action: script.notifica_smart
              data:
                titolo: "🟢 Tensione Elettrica Ripristinata"
                messaggio: "La corrente 230V è tornata a casa dopo circa {{ minuti_blackout }} minuti di blackout (Nicchia corridoio riavviata). NAS Synology e Home Assistant sono rimasti sempre operativi grazie all'UPS in cameretta."
                priorita: "alta"
                categoria: "sicurezza"
                tag: "notifica_ripristino_blackout"
              continue_on_error: true
            # Attende ulteriori 45s per dare tempo all'antenna FWA e al router RT6600ax nella Nicchia di ristabilire il link WAN PPPoE, poi reinvia con lo stesso tag
            - delay:
                seconds: 45
            - action: script.notifica_smart
              data:
                titolo: "🟢 Tensione Elettrica Ripristinata"
                messaggio: "La corrente 230V è tornata a casa dopo circa {{ minuti_blackout }} minuti di blackout (Nicchia corridoio e linea FWA operative). NAS Synology e Home Assistant sono rimasti sempre attivi grazie all'UPS."
                priorita: "alta"
                categoria: "sicurezza"
                tag: "notifica_ripristino_blackout"
              continue_on_error: true
            # Sicurezza post-blackout: se non c'è nessuno a casa, spegne eventuali luci accese dal ritorno di tensione
            - condition: state
              entity_id: binary_sensor.casa_occupata
              state: 'off'
            - delay:
                seconds: 10
            - action: script.spegni_tutte_le_luci
              continue_on_error: true

- id: 'infrastruttura_watchdog_telecamere_offline'
  alias: "Infrastruttura: Watchdog Telecamere Offline (> 60m)"
  description: "Invia un avviso se una telecamera di sicurezza rimane irraggiungibile per oltre 60 minuti."
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - camera.scale
        - camera.sala
        - camera.sala_2
        - camera.camera
        - camera.cameretta
        - camera.balcone_camera
        - camera.balcone_sala
        - camera.terrazza
        - camera.terrazza_2
        - camera.terrazzo_3
      to: 'unavailable'
      for:
        minutes: 60
  actions:
    - action: script.notifica_smart
      data:
        titolo: "📹 Telecamera Non Raggiungibile"
        messaggio: "La telecamera {{ trigger.to_state.attributes.friendly_name }} risulta disconnessa da oltre 60 minuti. Verificare la connettività."
        priorita: "alta"
        categoria: "sicurezza"
        tag: "cam_offline_{{ trigger.entity_id.split('.')[1] }}"
        azioni:
          - action: "URI"
            title: "🛡️ Apri Sicurezza"
            uri: "/eco-home/sicurezza"

- id: zigbee2mqtt_watchdog_auto_ripristino
  alias: "Zigbee2MQTT - Watchdog Auto-Ripristino e Riconnessione SLZB-06"
  description: Rileva se il bridge Zigbee2MQTT perde la connessione o il container si arresta per più di 90 secondi (dopo i tentativi del watchdog interno Z2M), e avvia/riavvia automaticamente il container Docker su Synology NAS per ristabilire la rete radio senza interventi manuali.
  triggers:
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
      to: 'off'
      for:
        seconds: 90
      id: bridge_offline
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
      to:
        - 'unavailable'
        - 'unknown'
      for:
        seconds: 90
      id: bridge_unavailable
  conditions:
    - condition: template
      value_template: >-
        {{ states('sensor.uptime') not in ['unknown', 'unavailable', ''] and
           (now() - as_datetime(states('sensor.uptime'))).total_seconds() > 120 }}
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           (now() - this.attributes.last_triggered).total_seconds() > 180 }}
  actions:
    - action: logbook.log
      data:
        name: "Zigbee2MQTT Watchdog"
        message: "Rilevata disconnessione prolungata di Zigbee2MQTT (>90s). Avvio ripristino automatico container Docker e riconnessione a SLZB-06 (192.168.1.100)..."
        entity_id: automation.zigbee2mqtt_watchdog_auto_ripristino_e_riconnessione_slzb_06
      continue_on_error: true
    - action: shell_command.analizza_telecamera_gemini
      data:
        camera: "__docker__"
        question: "restart zigbee2mqtt"
      continue_on_error: true
    - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
          to: 'on'
      timeout: "00:00:45"
      continue_on_timeout: true
    - if:
        - condition: state
          entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
          state: 'on'
      then:
        - action: script.notifica_smart
          data:
            titolo: "✅ Zigbee2MQTT Ripristinato"
            messaggio: "Il watchdog ha riavviato e ricollegato con successo il container Zigbee2MQTT al coordinatore SLZB-06!"
            canale: utente_1
            priorita: normale
            categoria: generale
            tag: z2m_watchdog
          continue_on_error: true
      else:
        - action: script.notifica_smart
          data:
            titolo: "⚠️ Zigbee2MQTT Non Riconnesso"
            messaggio: "Il watchdog ha tentato il riavvio del container Zigbee2MQTT ma il bridge risulta ancora disconnesso. Verificare il coordinatore SLZB-06 (192.168.1.100)."
            canale: utente_1
            priorita: alta
            categoria: generale
            tag: z2m_watchdog
          continue_on_error: true
  mode: single

- id: eco_home_cloudflare_mail_ddns
  alias: "Dominio example-home.tld — DDNS Automatico Cloudflare per Server Mail"
  description: "Verifica ogni 15 minuti l'IP pubblico WAN e aggiorna automaticamente su Cloudflare il record A mail.example-home.tld (proxied=false) e il record TXT SPF del server di posta."
  triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
  actions:
    - action: shell_command.analizza_telecamera_gemini
      data:
        camera: "__domain__"
        question: "ddns"
  mode: single

- id: eco_home_wildcard_ssl_autorenew
  alias: "Dominio example-home.tld — Rinnovo Automatico Certificato SSL Wildcard Let's Encrypt"
  description: "Controlla ogni notte alle 03:30 la scadenza del certificato Let's Encrypt Wildcard (*.example-home.tld + example-home.tld) e, quando mancano meno di 30 giorni, lo rinnova via DNS-01 Cloudflare e lo importa automaticamente sul NAS Synology."
  triggers:
    - trigger: time
      at: "03:30:00"
    - trigger: homeassistant
      event: start
  actions:
    - action: shell_command.analizza_telecamera_gemini
      data:
        camera: "__domain__"
        question: "renew_cert"
  mode: single

- id: pillole_sarcastiche_random_nesthub
  alias: "Eco Home — Pillole Sarcastiche Random su Nest Hub (Voce Femminile)"
  description: "Interventi vocali random, spontanei e sarcastici sui Nest Hub (silenzio in sala da fonometro Netatmo, tutte le luci spente e tapparelle chiuse, TV accesa da tante ore, TV spenta da troppo tempo, ora di andare a letto alle 22:48). Esclusi tassativamente Scena Cinema, Sabato e Domenica prima delle 11:00 e qualsiasi sera dopo le 23:00."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.sala_stazione_meteo_sala_noise_2
      below: 42
      for:
        minutes: 50
      id: silenzio_sala
    - trigger: template
      value_template: >-
        {{ (states('sensor.numero_luci_accese') | int(0) == 0) and (states('sensor.numero_tapparelle_aperte') | int(0) == 0) }}
      for:
        minutes: 35
      id: buio_vampiri
    - trigger: state
      entity_id: media_player.tv_sala_principale
      to:
        - "on"
        - "playing"
      for:
        hours: 3
        minutes: 30
      id: tv_maratona
    - trigger: state
      entity_id: media_player.tv_sala_principale
      to: "off"
      for:
        hours: 4
        minutes: 30
      id: tv_spenta
    - trigger: time
      at: "22:48:00"
      id: ora_nanna_23
    - trigger: time_pattern
      minutes: 22
      id: random_tick
  conditions:
    - condition: state
      entity_id: input_boolean.pillole_sarcastiche_nesthub
      state: "on"
    - condition: state
      entity_id: input_boolean.modalita_cinema_attiva
      state: "off"
    - condition: state
      entity_id: input_boolean.audio_annuncio_in_corso
      state: "off"
    - condition: template
      alias: "Nessun altro annuncio vocale prioritario in esecuzione o finestra rifiuti ore 21:00"
      value_template: >-
        {{ is_state('script.annuncio_rifiuti_ore_21_ai', 'off') and
           is_state('script.annuncio_rientro_ai', 'off') and
           is_state('script.annuncio_cucina_ai', 'off') and
           is_state('script.annuncio_buongiorno_ai', 'off') and
           is_state('script.buongiorno_weekend_ai', 'off') and
           not (now().hour == 21 and now().minute < 5) }}
    - condition: template
      alias: "Esclusione Scena Cinema fisica (luci ambiente/mensole al 20% e sala spenta)"
      value_template: >-
        {{ not (
             is_state('light.luce_ambiente_sala', 'on') and
             is_state('light.luce_mensole_camino', 'on') and
             (state_attr('light.luce_ambiente_sala', 'brightness') | int(255) <= 65) and
             (state_attr('light.luce_mensole_camino', 'brightness') | int(255) <= 65) and
             is_state('light.luce_sala_2', 'off') and
             is_state('light.luce_cucina', 'off')
           ) }}
    - condition: template
      alias: "Almeno uno tra Utente 1 e Utente 2 è in casa"
      value_template: >-
        {{ is_state('binary_sensor.utente_1_a_casa', 'on') or is_state('binary_sensor.utente_2_a_casa', 'on') }}
    - condition: template
      alias: "Esclusi Sabato e Domenica fino alle 11:00, feriali prima delle 09:00, e MAI dopo le 23:00"
      value_template: >-
        {% set wd = now().weekday() %}
        {% set h = now().hour %}
        {% if h >= 23 %}
          false
        {% elif wd in [5, 6] and h < 11 %}
          false
        {% elif wd in [0, 1, 2, 3, 4] and h < 9 %}
          false
        {% else %}
          true
        {% endif %}
    - condition: template
      alias: "Filtro Random e Cooldown anti-ripetizione"
      value_template: >-
        {% set last_str = states('input_datetime.ultima_pillola_sarcastica') %}
        {% set last_dt = as_datetime(last_str) if last_str not in ['unknown', 'unavailable', 'none', ''] else none %}
        {% set elapsed = (now() - last_dt.astimezone(now().tzinfo)).total_seconds() if last_dt is not none else 99999 %}
        {% set roll = range(1, 101) | random %}
        {% if trigger.id == 'ora_nanna_23' %}
          {% set svegli = is_state('media_player.tv_sala_principale', 'on') or is_state('media_player.tv_sala_principale', 'playing') or (states('sensor.numero_luci_accese') | int(0) > 0) or (states('sensor.sala_stazione_meteo_sala_noise_2') | int(0) > 40) %}
          {{ svegli and elapsed >= 2700 and roll <= 80 }}
        {% elif trigger.id == 'random_tick' %}
          {{ elapsed >= 9000 and roll <= 28 }}
        {% else %}
          {{ elapsed >= 9000 and roll <= 70 }}
        {% endif %}
  actions:
    - action: script.pillola_sarcastica_nesthub
      data:
        tema: >-
          {{ 'auto' if trigger.id == 'random_tick' else trigger.id }}
  mode: single

- id: infrastruttura_protezione_prese_critiche_scrivania_e_terrazzo
  alias: "🛡️ Infrastruttura: Protezione Anti-Spegnimento Prese Critiche (Scrivania NAS/UPS & Lettiera Terrazzo)"
  description: >-
    Riattiva istantaneamente switch.presa_scrivania_cameretta (che alimenta Dockstation Dell, 2 monitor, alimentatori e l'UPS da cui dipendono il NAS Synology con tutti i container Docker e lo switch di rete) e switch.presa_terrazzo (che alimenta la lettiera automatica Petkit PuraMax 2 in terrazzo) qualora vengano disattivate per errore.
  triggers:
    - trigger: state
      entity_id: switch.presa_scrivania_cameretta
      to: "off"
      id: scrivania_off
    - trigger: state
      entity_id: switch.presa_terrazzo
      to: "off"
      id: terrazzo_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: scrivania_off
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.presa_scrivania_cameretta
            - action: script.notifica_smart
              data:
                titolo: "🚨 PROTEZIONE VITALE: Presa Scrivania Cameretta"
                messaggio: >-
                  La presa Scrivania Cameretta (che alimenta UPS, NAS Synology, Switch di rete e Dockstation Dell) era stata spenta ed è stata RIACCESA ISTANTANEAMENTE in automatico per evitare il down di tutta la domotica!
                categoria: generale
                priorita: critica
                canale: utente_1
                tag: protezione_presa_scrivania
        - conditions:
            - condition: trigger
              id: terrazzo_off
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.presa_terrazzo
            - action: script.notifica_smart
              data:
                titolo: "🐾 Protezione Lettiera: Presa Terrazzo Riattivata"
                messaggio: >-
                  La presa Terrazzo (che alimenta la lettiera automatica Petkit PuraMax 2 in terrazzo, a sinistra della porta terrazzo) era stata spenta ed è stata riaccesa automaticamente!
                categoria: pet
                priorita: alta
                canale: tutti_telefoni
                tag: protezione_presa_terrazzo
  mode: parallel
  max: 5

- id: 'infrastruttura_watchdog_vpn_sede_lavoro_e_casa_familiare'
  alias: "🌐 Infrastruttura: Watchdog Reti VPN (Negozio Sede Lavoro & Casa Mamma)"
  description: "Monitora h24 i tunnel VPN Site-to-Site e gli apparati sempre attivi (FRITZ!Box Sede Lavoro, DVR Hikvision, Telecamera EZVIZ Area Esterna / Corso d'Acqua Esterno e Router WRX560 Casa Mamma) avvisando Utente 1 in caso di caduta >15 min o ripristino."
  initial_state: true
  mode: queued
  max: 10
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.vpn_sede_lavoro_router
        - binary_sensor.vpn_sede_lavoro_dvr
        - binary_sensor.vpn_sede_lavoro_telecamera_esterna
        - binary_sensor.vpn_casa_familiare_router
      from: 'on'
      to: 'off'
      for:
        minutes: 15
      id: vpn_down
    - trigger: state
      entity_id:
        - binary_sensor.vpn_sede_lavoro_router
        - binary_sensor.vpn_sede_lavoro_dvr
        - binary_sensor.vpn_sede_lavoro_telecamera_esterna
        - binary_sensor.vpn_casa_familiare_router
      from: 'off'
      to: 'on'
      for:
        minutes: 2
      id: vpn_up
  conditions:
    - condition: state
      entity_id: input_boolean.notifiche_vpn_reti
      state: 'on'
  actions:
    - variables:
        nome_apparato: "{{ state_attr(trigger.entity_id, 'friendly_name') | default(trigger.entity_id) }}"
    - choose:
        - conditions:
            - condition: trigger
              id: vpn_down
          sequence:
            - action: script.notifica_smart
              data:
                titolo: "⚠️ Apparato / Tunnel VPN Offline"
                messaggio: "{{ nome_apparato }} non risponde da oltre 15 minuti sulla VPN Site-to-Site. Verifica connessione o alimentazione."
                canale: "utente_1"
                priorita: "alta"
                categoria: "vpn_reti"
                tag: "watchdog_{{ trigger.entity_id | replace('.', '_') }}"
        - conditions:
            - condition: trigger
              id: vpn_up
          sequence:
            - action: script.notifica_smart
              data:
                titolo: "🟢 Apparato / Tunnel VPN Ripristinato"
                messaggio: "{{ nome_apparato }} è tornato regolarmente online sulla VPN Site-to-Site."
                canale: "utente_1"
                priorita: "normale"
                categoria: "vpn_reti"
                tag: "watchdog_{{ trigger.entity_id | replace('.', '_') }}"

- id: 'ricorrenze_famiglia_notifica_mattutina'
  alias: "🎂 Famiglia: Promemoria Compleanni, Anniversari e Ricorrenze (Ore 09:00)"
  description: "Ogni mattina alle 09:00 controlla sensor.ricorrenze_e_compleanni_oggi e invia una notifica push su smartphone a Utente 1 e Utente 2 quando c'è un compleanno, anniversario o ricorrenza familiare oggi."
  mode: single
  triggers:
    - trigger: time
      at: "09:00:00"
  conditions:
    - condition: template
      value_template: "{{ is_state_attr('sensor.ricorrenze_e_compleanni_oggi', 'ha_ricorrenza_oggi', true) }}"
  actions:
    - variables:
        testo_oggi: "{{ states('sensor.ricorrenze_e_compleanni_oggi') }}"
        raw_7g: "{{ state_attr('sensor.ricorrenze_e_compleanni_oggi', 'prossimi_eventi_7_giorni') | default([], true) }}"
        prossimi_7g: "{{ (raw_7g | join(' • ')) if (raw_7g is iterable and raw_7g is not string) else (raw_7g | string) }}"
    - action: script.notifica_smart
      data:
        titolo: "🎂 Ricorrenza Speciale di Oggi!"
        messaggio: >-
          Oggi: {{ testo_oggi }}!
          {% if prossimi_7g not in ['', 'Nessuna ricorrenza nei prossimi 7 giorni'] %}
            Prossimi 7 giorni: {{ prossimi_7g }}.
          {% endif %}
        priorita: "normale"
        categoria: "sistema"
        tag: "ricorrenza_famiglia_giornaliera"

- id: 'docker_aggiornamento_automatico_settimanale'
  alias: "🐳 Sistema: Aggiornamento Automatico Settimanale Container Docker (Lun 03:30)"
  description: "Ogni notte tra domenica e lunedì alle 03:30 controlla se sono disponibili nuove immagini (:latest / :stable) per tutti i container Docker sul NAS Synology (Mosquitto, Zigbee2MQTT, Frigate, Jellyfin, Cloudflared, Home Assistant), aggiorna automaticamente quelli con nuove versioni ed elimina le vecchie immagini per liberare spazio."
  mode: single
  triggers:
    - trigger: time
      at: "03:30:00"
  conditions:
    - condition: time
      weekday:
        - mon
  actions:
    - action: logbook.log
      data:
        name: "Docker Auto-Update"
        message: "Avvio controllo settimanale e aggiornamento automatico immagini Docker su Synology Container Manager..."
      continue_on_error: true
    - action: shell_command.analizza_telecamera_gemini
      data:
        camera: "__docker__"
        question: "update auto"
      continue_on_error: true

- id: 'hacs_aggiornamento_automatico_integrazioni'
  alias: "🧩 Sistema: Aggiornamento Automatico Integrazioni HACS (Ogni Notte 03:15)"
  description: "Ogni notte alle 03:15 controlla e installa automaticamente gli aggiornamenti disponibili per le integrazioni custom, card Lovelace e temi HACS di Home Assistant, riavviando Home Assistant solo se è stato installato almeno un aggiornamento."
  mode: single
  triggers:
    - trigger: time
      at: "03:15:00"
  conditions: []
  actions:
    - action: script.aggiorna_integrazioni_home_assistant
      data:
        silenzioso_se_aggiornato: true
        riavvia_se_necessario: true
      continue_on_error: true

- id: 'rete_auto_heal_telecamere_nodo_mesh'
  alias: "Rete: Auto-Allineamento Telecamere ai Nodi Mesh Ottimali"
  description: "Controlla ogni 15 minuti che le telecamere Synology CC400W non siano rimaste agganciate a un nodo Mesh lontano dopo un riavvio del router principale, riavviandole automaticamente per riportarle sul nodo locale."
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  actions:
    - action: shell_command.docker_start_container
      data:
        container: "__heal_cameras_wifi__"

