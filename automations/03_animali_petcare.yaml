# ==============================================================================
# 03 — ANIMALI DOMESTICI (GATTI PETKIT & ACQUARIO TROPICALE FZONE/VSON)
# ==============================================================================

- id: 'acquario_luce_naturale_fotoperiodo_anti_alghe'
  alias: 'Acquario: Luce Naturale e Fotoperiodo Anti-Alghe'
  description: 'Gestisce il fotoperiodo biologico della plafoniera FZONE seguendo la luce solare naturale (12:00 - 21:30): alba calda graduale per non spaventare i 14 piccoli pesci, picco fotosintetico a spettro pieno per le piante vere calmierato al 75% (o al 50% se il TDS supera 420 ppm) per azzerare le alghe, tramonto dorato e luce lunare soffusa al 6% per l''attività dei 2 pulitori prima del buio notturno.'
  mode: queued
  max: 5
  trigger:
    - trigger: time
      at: '12:00:00'
      id: alba
    - trigger: time
      at: '13:30:00'
      id: picco_giorno
    - trigger: time
      at: '18:30:00'
      id: tramonto
    - trigger: time
      at: '20:30:00'
      id: luce_lunare
    - trigger: time
      at: '21:30:00'
      id: notte_buio
    - trigger: homeassistant
      event: start
      id: riallinea
  condition:
    - condition: state
      entity_id: input_boolean.acquario_buio_24h
      state: 'off'
  action:
    - choose:
        # --- FASE 1: ALBA GRADUALE (12:00 - 13:30) ---
        - conditions:
            - condition: template
              value_template: >-
                {{ (trigger.id is defined and trigger.id == 'alba') or ('12:00:00' <= now().strftime('%H:%M:%S') < '13:30:00') }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.fzone_acquario
              data:
                brightness_pct: 25
                rgbw_color: [255, 140, 40, 50]
                transition: 10

        # --- FASE 2: PICCO GIORNO FOTOSINTETICO ANTI-ALGHE (13:30 - 18:30) ---
        - conditions:
            - condition: template
              value_template: >-
                {{ (trigger.id is defined and trigger.id == 'picco_giorno') or ('13:30:00' <= now().strftime('%H:%M:%S') < '18:30:00') }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.fzone_acquario
              data:
                brightness_pct: >-
                  {{ 50 if (states('sensor.sensore_sonda_acquario_tds') | float(0) > 420) else 75 }}
                rgbw_color: [255, 235, 220, 255]
                transition: 10

        # --- FASE 3: TRAMONTO DORATO NATURALE (18:30 - 20:30) ---
        - conditions:
            - condition: template
              value_template: >-
                {{ (trigger.id is defined and trigger.id == 'tramonto') or ('18:30:00' <= now().strftime('%H:%M:%S') < '20:30:00') }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.fzone_acquario
              data:
                brightness_pct: 35
                rgbw_color: [255, 130, 35, 40]
                transition: 10

        # --- FASE 4: LUCE LUNARE SOFFUSA PER PULITORI (20:30 - 21:30) ---
        - conditions:
            - condition: template
              value_template: >-
                {{ (trigger.id is defined and trigger.id == 'luce_lunare') or ('20:30:00' <= now().strftime('%H:%M:%S') < '21:30:00') }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.fzone_acquario
              data:
                brightness_pct: 6
                rgbw_color: [20, 40, 255, 5]
                transition: 10

        # --- FASE 5: NOTTE / BUIO TOTALE (21:30 - 12:00) ---
        - conditions:
            - condition: template
              value_template: >-
                {{ (trigger.id is defined and trigger.id == 'notte_buio') or (now().strftime('%H:%M:%S') >= '21:30:00' or now().strftime('%H:%M:%S') < '12:00:00') }}
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.fzone_acquario
              data:
                transition: 5

- id: 'acquario_alimentazione_intelligente_pesci'
  alias: 'Acquario: Alimentazione Intelligente Pesci'
  description: 'Eroga il pasto quotidiano per i 7 neon, 7 rasbore e 2 pulitori alle ore 14:30 (momento biologico ottimale a fotoperiodo avviato). Verifica che la mangiatoia sia connessa al Wi-Fi prima di procedere: se offline invia subito un allarme, altrimenti spegne preventivamente l''ossigenatore per non disperdere il cibo nel filtro, imposta luce nitida per 10 minuti, eroga la porzione, invia notifica push con i parametri dell''acqua e controlla la sicurezza.'
  mode: single
  trigger:
    - trigger: time
      at: '14:30:00'
  action:
    - if:
        - condition: state
          entity_id: binary_sensor.mangiatoia_acquario_stato_connessione
          state: 'off'
      then:
        - action: script.notifica_acquario
          data:
            titolo: "⚠️ Acquario: Pasto NON Erogato (Mangiatoia Offline)"
            messaggio: >-
              Impossibile erogare il pasto delle 14:30 per i 16 pesci: la mangiatoia automatica VSON risulta disconnessa dal Wi-Fi (ultima erogazione registrata: {{ states('sensor.mangiatoia_acquario_ultima_erogazione') }}).
              Premere il tasto fisico sulla mangiatoia o scollegare/ricollegare il cavo USB per riconnetterla, ed erogare il pasto manualmente!
            priorita: alta
      else:
        - if:
            - condition: template
              value_template: >-
                {{ states('sensor.sensore_sonda_acquario_probe_temperature') | float(25) <= 29.5 
                   and states('sensor.sensore_sonda_acquario_probe_temperature') | float(25) >= 22.0 
                   and states('sensor.sensore_sonda_acquario_tds') | float(300) <= 550 }}
          then:
            # 1. Spegni preventivamente l'ossigenatore durante il pasto
            - action: switch.turn_off
              target:
                entity_id: switch.presa_ossigenatore_acquario
            # 2. Imposta luce diffusa e nitida pasto (70%)
            - action: light.turn_on
              target:
                entity_id: light.fzone_acquario
              data:
                brightness_pct: 70
                rgbw_color: [255, 240, 230, 255]
                transition: 3
            # 3. Eroga la porzione di cibo
            - action: button.press
              target:
                entity_id: button.mangiatoia_acquario_eroga_cibo
            # 4. Notifica push di avvenuta erogazione del pasto con parametri
            - action: script.notifica_acquario
              data:
                titolo: "🐟 Acquario: Pasto Erogato"
                messaggio: >-
                  Pasto erogato con successo alle 14:30 per i 16 pesci (7 neon, 7 rasbore, 2 pulitori).
                  Parametri attuali: Temp {{ states('sensor.sensore_sonda_acquario_probe_temperature') }}°C | TDS {{ states('sensor.sensore_sonda_acquario_tds') }} ppm. Ossigenatore in pausa 10 min.
                priorita: normale
            # 5. Attendi 10 minuti di tranquillità per consentire ai pesci di mangiare
            - delay: '00:10:00'
            # 6. Riaccendi l'ossigenatore al termine della pausa pasto
            - action: switch.turn_on
              target:
                entity_id: switch.presa_ossigenatore_acquario
              continue_on_error: true
            # 7. Ripristina l'intensità diurna corretta (picco fotosintetico anti-alghe)
            - action: light.turn_on
              target:
                entity_id: light.fzone_acquario
              data:
                brightness_pct: >-
                  {{ 50 if (states('sensor.sensore_sonda_acquario_tds') | float(0) > 420) else 75 }}
                rgbw_color: [255, 235, 220, 255]
                transition: 5
          else:
            # Notifica di allarme: pasto sospeso per parametri critici
            - action: script.notifica_acquario
              data:
                titolo: "⚠️ Acquario: Pasto Sospeso per Sicurezza"
                messaggio: >-
                  L'erogazione del cibo delle 14:30 è stata sospesa a tutela dei pesci.
                  Parametri fuori norma: Temp {{ states('sensor.sensore_sonda_acquario_probe_temperature') }}°C (soglia 22-29.5°C) | TDS {{ states('sensor.sensore_sonda_acquario_tds') }} ppm (soglia max 550).
                priorita: alta

- id: 'acquario_ossigenatore_gestione_anti_alghe'
  alias: 'Acquario: Ossigenatore (Buongiorno ON / Buonanotte OFF)'
  description: 'Spegne l''ossigenatore alla Buonanotte e lo riattiva automaticamente al Buongiorno (feriale, weekend o manuale). Include accensione di emergenza diurna se la temperatura reale supera 27.5°C, ignorando le riconnessioni Zigbee della sonda.'
  mode: queued
  max: 5
  trigger:
    - trigger: time
      at: input_datetime.buongiorno_orario
      id: buongiorno_feriale_orario
    - trigger: time
      at: input_datetime.sicurezza_disattivazione_weekend
      id: buongiorno_weekend_orario
    - trigger: event
      event_type: call_service
      event_data:
        domain: script
        service: annuncio_buongiorno_ai
      id: buongiorno_script
    - trigger: event
      event_type: call_service
      event_data:
        domain: script
        service: buongiorno_weekend_ai
      id: buongiorno_script
    - trigger: state
      entity_id:
        - scene.buonanotte
        - scene.scenario_notte
      not_from:
        - unavailable
        - unknown
      not_to:
        - unavailable
        - unknown
      id: buonanotte_scena
    - trigger: event
      event_type: call_service
      event_data:
        domain: script
        service: buonanotte_scenario_notte
      id: buonanotte_script
    - trigger: event
      event_type: call_service
      event_data:
        domain: script
        service: buonanotte_silenziosa
      id: buonanotte_script
    - trigger: numeric_state
      entity_id: sensor.sensore_sonda_acquario_probe_temperature
      above: 27.5
      id: emergenza_caldo
  action:
    - choose:
        # --- CASO 1: BUONANOTTE -> SPEGNI OSSIGENATORE ---
        - conditions:
            - condition: trigger
              id:
                - buonanotte_scena
                - buonanotte_script
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.presa_ossigenatore_acquario

        # --- CASO 2: BUONGIORNO FERIALE (LUN-VEN ALL'ORARIO BUONGIORNO) -> ACCENDI OSSIGENATORE ---
        - conditions:
            - condition: trigger
              id: buongiorno_feriale_orario
            - condition: template
              value_template: "{{ now().weekday() < 5 }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.presa_ossigenatore_acquario

        # --- CASO 3: BUONGIORNO WEEKEND (SAB-DOM ALL'ORARIO WEEKEND) -> ACCENDI OSSIGENATORE ---
        - conditions:
            - condition: trigger
              id: buongiorno_weekend_orario
            - condition: template
              value_template: "{{ now().weekday() in [5, 6] }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.presa_ossigenatore_acquario

        # --- CASO 4: BUONGIORNO DA SCRIPT O SCENA -> ACCENDI OSSIGENATORE ---
        - conditions:
            - condition: trigger
              id:
                - buongiorno_script
                - buongiorno_scena
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.presa_ossigenatore_acquario

        # --- CASO 5: EMERGENZA TEMPERATURA ELEVATA (> 27.5°C, SOLO SE NON PROVIENE DA UNAVAILABLE E NON È NOTTE) ---
        - conditions:
            - condition: trigger
              id: emergenza_caldo
            - condition: template
              value_template: >-
                {{ trigger.from_state is defined and trigger.from_state.state not in ['unavailable', 'unknown'] and
                   not is_state('alarm_control_panel.sicurezza_eco_home', 'armed_night') }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.presa_ossigenatore_acquario
            - action: script.notifica_acquario
              data:
                titolo: "🔥 Acquario: Emergenza Termica (Ossigenatore Attivo)"
                messaggio: >-
                  Temperatura dell'acqua elevata: {{ states('sensor.sensore_sonda_acquario_probe_temperature') }}°C (> 27.5°C).
                  L'ossigenatore è stato attivato d'urgenza per garantire l'ossigenazione dei 16 pesci.
                priorita: alta

- id: 'acquario_monitoraggio_allarmi_e_anomalie'
  alias: 'Acquario: Monitoraggio Allarmi e Anomalie Vasca'
  description: 'Monitora costantemente la salute dell''acquario notificando qualsiasi problema: temperatura critica (alta o bassa), accumulo inquinanti TDS, cibo in esaurimento, batteria sonda scarica o dispositivi offline.'
  mode: queued
  max: 10
  trigger:
    - trigger: numeric_state
      entity_id: sensor.sensore_sonda_acquario_probe_temperature
      above: 28.0
      id: temp_troppo_alta
    - trigger: numeric_state
      entity_id: sensor.sensore_sonda_acquario_probe_temperature
      below: 22.0
      id: temp_troppo_bassa
    - trigger: numeric_state
      entity_id: sensor.sensore_sonda_acquario_tds
      above: 480
      id: tds_troppo_alto
    - trigger: state
      entity_id: binary_sensor.mangiatoia_acquario_livello_cibo_basso
      to: 'on'
      id: cibo_in_esaurimento
    - trigger: numeric_state
      entity_id: sensor.sensore_sonda_acquario_battery
      below: 20
      id: batteria_sonda_bassa
    - trigger: state
      entity_id: switch.presa_ossigenatore_acquario
      to: 'unavailable'
      for: '00:05:00'
      id: ossigenatore_non_disponibile
    - trigger: state
      entity_id: light.fzone_acquario
      to: 'unavailable'
      for: '00:05:00'
      id: luce_non_disponibile
    - trigger: state
      entity_id: binary_sensor.mangiatoia_acquario_stato_connessione
      to: 'off'
      for: '00:15:00'
      id: mangiatoia_offline
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'temp_troppo_alta' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "🔥 Acquario: Allarme Temperatura Troppo Alta"
                messaggio: >-
                  La temperatura dell'acqua ha raggiunto {{ states('sensor.sensore_sonda_acquario_probe_temperature') }}°C (limite critico 28°C).
                  Verificare ventilazione o condizionatore ambiente per non stressare neon e rasbore.
                priorita: alta

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'temp_troppo_bassa' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "❄️ Acquario: Allarme Temperatura Troppo Bassa"
                messaggio: >-
                  La temperatura dell'acqua è scesa a {{ states('sensor.sensore_sonda_acquario_probe_temperature') }}°C (limite minimo 22°C).
                  Verificare urgentemente il funzionamento del riscaldatore!
                priorita: alta

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'tds_troppo_alto' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "🧪 Acquario: Allarme Qualità Acqua (TDS Alto)"
                messaggio: >-
                  Il valore TDS dell'acqua è salito a {{ states('sensor.sensore_sonda_acquario_tds') }} ppm (soglia 480 ppm).
                  Si consiglia un cambio parziale d'acqua per prevenire la proliferazione algale e salvaguardare i pesci.
                priorita: alta

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'cibo_in_esaurimento' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "🥣 Acquario: Mangime in Esaurimento"
                messaggio: >-
                  Il sensore della mangiatoia automatica segnala livello cibo basso. Ricaricare il serbatoio con il mangime dei pesci.
                priorita: normale

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'batteria_sonda_bassa' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "🪫 Acquario: Batteria Sonda Scarica"
                messaggio: >-
                  La batteria della sonda parametri acquario è al {{ states('sensor.sensore_sonda_acquario_battery') }}%. Sostituire le batterie per garantire il monitoraggio continuo.
                priorita: normale

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'ossigenatore_non_disponibile' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "⚠️ Acquario: Presa Ossigenatore Offline"
                messaggio: >-
                  La presa smart dell'ossigenatore risulta non raggiungibile da oltre 5 minuti. Controllare la connessione o l'alimentazione.
                priorita: alta

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'luce_non_disponibile' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "⚠️ Acquario: Plafoniera FZONE Offline"
                messaggio: >-
                  La plafoniera dell'acquario risulta non raggiungibile da oltre 5 minuti. Verificare il collegamento elettrico.
                priorita: alta

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'mangiatoia_offline' }}"
          sequence:
            - action: script.notifica_acquario
              data:
                titolo: "⚠️ Acquario: Mangiatoia VSON Disconnessa dal Wi-Fi"
                messaggio: >-
                  La mangiatoia automatica dell'acquario risulta disconnessa dal Wi-Fi da oltre 15 minuti.
                  Premere il tasto fisico sulla mangiatoia o scollegare/ricollegare il cavo USB per evitare che salti il pasto delle 14:30.
                priorita: alta

- id: 'dispenser_gatte_erogazione_pasti'
  alias: 'Dispenser Gatte: Erogazione Pasti Programmata'
  description: 'Eroga automaticamente i pasti per le gatte con il dispenser Petkit: Colazione alle 07:30 (1 pasto dal Dispenser 2), Pranzo alle 13:15 (1 pasto Dispenser 1 + 1 pasto Dispenser 2), Cena alle 20:15 (1 pasto Dispenser 1 + 1 pasto Dispenser 2). Suona il richiamo acustico e invia notifica push con conferma erogazione o allarme in caso di guasto.'
  mode: queued
  max: 5
  trigger:
    - trigger: time
      at: '07:30:00'
      id: colazione
    - trigger: time
      at: '13:15:00'
      id: pranzo
    - trigger: time
      at: '20:15:00'
      id: cena
  action:
    - if:
        - condition: template
          value_template: "{{ states('text.dispenser_crocchette_alimentazione_manuale_tramoggia_1') in ['unavailable', 'unknown'] }}"
      then:
        - action: script.notifica_gatte
          data:
            titolo: "🚨 Dispenser Gatte: Errore Erogazione Pasto"
            messaggio: >-
              Impossibile erogare il pasto programmato ({{ trigger.id | capitalize }}): il dispenser crocchette Petkit risulta non raggiungibile!
              Provvedere manualmente all'alimentazione delle gatte.
            priorita: alta
      else:
        - choose:
            # --- COLAZIONE ORE 07:30: 1 pasto da Dispenser 2 ---
            - conditions:
                - condition: template
                  value_template: "{{ trigger.id == 'colazione' }}"
              sequence:
                - action: text.set_value
                  target:
                    entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_2
                  data:
                    value: "1"
                  continue_on_error: true
                - action: button.press
                  target:
                    entity_id: button.dispenser_crocchette_play_sound
                  continue_on_error: true
                - action: script.notifica_gatte
                  data:
                    titolo: "🐱 Colazione Gatte Erogata"
                    messaggio: "Erogata 1 porzione dal Dispenser 2 per la colazione delle 07:30. Richiamo acustico suonato."
                    priorita: normale

            # --- PRANZO ORE 13:15: 1 pasto da Dispenser 1 + 1 pasto da Dispenser 2 ---
            - conditions:
                - condition: template
                  value_template: "{{ trigger.id == 'pranzo' }}"
              sequence:
                - action: text.set_value
                  target:
                    entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_1
                  data:
                    value: "1"
                  continue_on_error: true
                - delay: '00:00:12'
                - action: text.set_value
                  target:
                    entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_2
                  data:
                    value: "1"
                  continue_on_error: true
                - action: button.press
                  target:
                    entity_id: button.dispenser_crocchette_play_sound
                  continue_on_error: true
                - action: script.notifica_gatte
                  data:
                    titolo: "🐱 Pranzo Gatte Erogato"
                    messaggio: "Erogato il pranzo delle 13:15: 1 porzione da Dispenser 1 + 1 porzione da Dispenser 2."
                    priorita: normale

            # --- CENA ORE 20:15: 1 pasto da Dispenser 1 + 1 pasto da Dispenser 2 ---
            - conditions:
                - condition: template
                  value_template: "{{ trigger.id == 'cena' }}"
              sequence:
                - action: text.set_value
                  target:
                    entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_1
                  data:
                    value: "1"
                  continue_on_error: true
                - delay: '00:00:12'
                - action: text.set_value
                  target:
                    entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_2
                  data:
                    value: "1"
                  continue_on_error: true
                - action: button.press
                  target:
                    entity_id: button.dispenser_crocchette_play_sound
                  continue_on_error: true
                - action: script.notifica_gatte
                  data:
                    titolo: "🐱 Cena Gatte Erogata"
                    messaggio: "Erogata la cena delle 20:15: 1 porzione da Dispenser 1 + 1 porzione da Dispenser 2."
                    priorita: normale

- id: 'dispenser_gatte_monitoraggio_allarmi_e_anomalie'
  alias: 'Dispenser Gatte: Monitoraggio Allarmi e Anomalie'
  description: 'Vigila costantemente sul dispenser per gatte notificando livello cibo basso in tramoggia 1 o 2 e mancata connessione del dispositivo.'
  mode: queued
  max: 5
  trigger:
    - trigger: state
      entity_id: binary_sensor.dispenser_crocchette_livello_cibo_tramoggia_1
      to: 'on'
      id: cibo_basso_t1
    - trigger: state
      entity_id: binary_sensor.dispenser_crocchette_livello_cibo_tramoggia_2
      to: 'on'
      id: cibo_basso_t2
    - trigger: state
      entity_id: text.dispenser_crocchette_alimentazione_manuale_tramoggia_1
      to: 'unavailable'
      for: '00:05:00'
      id: dispenser_offline
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'cibo_basso_t1' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "⚠️ Dispenser Gatte: Cibo Basso Tramoggia 1"
                messaggio: "Il livello dei croccantini nella Tramoggia 1 è quasi esaurito. Ricaricare il serbatoio per non saltare i pasti."
                priorita: alta

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'cibo_basso_t2' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "⚠️ Dispenser Gatte: Cibo Basso Tramoggia 2"
                messaggio: "Il livello dei croccantini nella Tramoggia 2 è quasi esaurito. Ricaricare il serbatoio per non saltare i pasti."
                priorita: alta

        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'dispenser_offline' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "⚠️ Dispenser Gatte: Dispositivo Offline"
                messaggio: "Il dispenser crocchette Petkit risulta non raggiungibile da oltre 5 minuti. Verificare la connessione Wi-Fi o l'alimentazione."
                priorita: alta

- id: 'fontanella_gatte_monitoraggio_anomalie'
  alias: 'Fontanella Gatte: Monitoraggio Anomalie e Notifiche'
  description: 'Monitora la fontanella Petkit delle gatte h24 notificando tempestivamente qualsiasi problema: mancanza acqua nella vaschetta, errori operativi o pompa bloccata, filtro da sostituire, perdita di alimentazione AC, o batteria di backup scarica.'
  mode: queued
  max: 10
  trigger:
    - trigger: state
      entity_id: binary_sensor.fontanella_avviso_mancanza_acqua
      to: 'on'
      id: mancanza_acqua
    - trigger: template
      value_template: "{{ states('sensor.fontanella_errore') not in ['No error', 'none', 'unknown', 'unavailable', ''] }}"
      id: errore_operativo
    - trigger: state
      entity_id: binary_sensor.fontanella_sostituire_filtro
      to: 'on'
      id: filtro_da_sostituire
    - trigger: state
      entity_id: binary_sensor.fontanella_alimentazione_ac
      to: 'off'
      for: '00:02:00'
      id: alimentazione_staccata
    - trigger: state
      entity_id: binary_sensor.fontanella_batteria_scarica
      to: 'on'
      id: batteria_scarica
    - trigger: state
      entity_id: switch.fontanella_alimentazione
      to: 'unavailable'
      for: '00:10:00'
      id: fontanella_offline
  action:
    - choose:
        # 1. MANCANZA ACQUA (MASSIMA PRIORITÀ)
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'mancanza_acqua' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "🚨 Fontanella Gatte: Acqua Esaurita!"
                messaggio: >-
                  La fontanella segnala assenza di acqua nella vaschetta! Ricaricare immediatamente per consentire alle gatte di bere ed evitare surriscaldamenti della pompa.
                priorita: alta
                tag: fontanella_mancanza_acqua

        # 2. ERRORE OPERATIVO / POMPA BLOCCATA
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'errore_operativo' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "⚠️ Fontanella Gatte: Errore Operativo"
                messaggio: >-
                  Anomalia rilevata sulla fontanella: {{ states('sensor.fontanella_errore') }}. Controllare la pulizia della pompa e della girante.
                priorita: alta
                tag: fontanella_errore

        # 3. FILTRO DA SOSTITUIRE
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'filtro_da_sostituire' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "💧 Fontanella Gatte: Filtro da Sostituire"
                messaggio: >-
                  Il filtro della fontanella è esaurito (residuo: {{ states('sensor.fontanella_filtro_rimanente') }}). Sostituire il filtro e resettare il contatore per garantire acqua sempre pura.
                priorita: normale
                tag: fontanella_filtro

        # 4. ALIMENTAZIONE AC INTERROTTA
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'alimentazione_staccata' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "🔌 Fontanella Gatte: Corrente Scollegata"
                messaggio: >-
                  La fontanella ha perso l'alimentazione elettrica principale da oltre 2 minuti ed è attiva a batteria. Controllare cavo USB o presa.
                priorita: alta
                tag: fontanella_corrente

        # 5. BATTERIA SCARICA
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'batteria_scarica' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "🪫 Fontanella Gatte: Batteria Scarica"
                messaggio: >-
                  La batteria di riserva della fontanella è quasi esaurita ({{ states('sensor.fontanella_batteria') }}%). Ricollegare l'alimentazione per non farla spegnere.
                priorita: alta
                tag: fontanella_batteria

        # 6. FONTANELLA OFFLINE
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'fontanella_offline' }}"
          sequence:
            - action: script.notifica_gatte
              data:
                titolo: "⚠️ Fontanella Gatte: Dispositivo Offline"
                messaggio: >-
                  La fontanella Petkit non risponde da oltre 10 minuti. Verificare la vicinanza del bridge Bluetooth/Wi-Fi.
                priorita: alta
                tag: fontanella_offline

