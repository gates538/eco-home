    - trigger: state
      entity_id:
        - binary_sensor.41_933617_12_510125_idrogeologico_oggi
        - binary_sensor.41_933617_12_510125_temporali_oggi
        - binary_sensor.41_933617_12_510125_idraulico_oggi
      to: 'on'
      id: rischio_attivo_roma
  condition:
    - condition: template
      value_template: "{{ states('sensor.dipartimento_protezione_civile_protezione_civile_roma_lavoro_laura_protezione_civile_roma_lavoro_laura_alert') | int(0) >= 2 }}"
    - condition: template
      value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 3600 }}"
  action:
    - variables:
        lvl: "{{ states('sensor.dipartimento_protezione_civile_protezione_civile_roma_lavoro_laura_protezione_civile_roma_lavoro_laura_alert') | int(0) }}"
        lvl_nome: "{{ 'GIALLA' if lvl == 2 else ('ARANCIONE' if lvl == 3 else 'ROSSA') }}"
        rischi: >-
          {% set r = [] %}
          {% if is_state('binary_sensor.41_933617_12_510125_idrogeologico_oggi', 'on') %}{% set r = r + ['Idrogeologico'] %}{% endif %}
          {% if is_state('binary_sensor.41_933617_12_510125_temporali_oggi', 'on') %}{% set r = r + ['Temporali'] %}{% endif %}
          {% if is_state('binary_sensor.41_933617_12_510125_idraulico_oggi', 'on') %}{% set r = r + ['Idraulico'] %}{% endif %}
          {{ r | join(', ') if r | length > 0 else 'Ordinaria' }}
        zona: "{{ state_attr('sensor.dipartimento_protezione_civile_protezione_civile_roma_lavoro_laura_protezione_civile_roma_lavoro_laura_alert', 'zone_name') | default('Bacini di Roma') }}"
    - action: script.notifica_smart
      data:
        titolo: "⚠️ Allerta DPC {{ lvl_nome }}: Roma e Lavoro"
        messaggio: "Diramata ALLERTA {{ lvl_nome }} per {{ zona }}. Rischi per oggi: {{ rischi }}. Prestare massima attenzione negli spostamenti casa-lavoro e su strada."
        categoria: meteo
        priorita: "{{ 'critica' if lvl >= 3 else 'alta' }}"
        canale: tutti_telefoni
        tag: allerta_dpc_roma
        azioni:
          - action: URI
            title: "🌐 Apri Plancia Eventi"
            uri: /eco-home/meteo
            url: /eco-home/meteo

- id: 'meteo_allerta_dpc_bollettino_domani'
  alias: 'Allerte DPC: Bollettino Pomeridiano Previsione Domani (16:30)'
  description: 'Controlla alle 16:30 l avvenuta pubblicazione del bollettino DPC per domani e avvisa se sono previste allerte meteo per Casa o Roma.'
  mode: single
  trigger:
    - trigger: time
      at: '16:30:00'
  condition:
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.42_152875_12_678384_idrogeologico_domani', 'on')
           or is_state('binary_sensor.42_152875_12_678384_temporali_domani', 'on')
           or is_state('binary_sensor.42_152875_12_678384_idraulico_domani', 'on')
           or is_state('binary_sensor.41_933617_12_510125_idrogeologico_domani', 'on')
           or is_state('binary_sensor.41_933617_12_510125_temporali_domani', 'on')
           or is_state('binary_sensor.41_933617_12_510125_idraulico_domani', 'on') }}
  action:
    - variables:
        casa_alert: >-
          {% set r = [] %}
          {% if is_state('binary_sensor.42_152875_12_678384_idrogeologico_domani', 'on') %}{% set r = r + ['Idrogeologico'] %}{% endif %}
          {% if is_state('binary_sensor.42_152875_12_678384_temporali_domani', 'on') %}{% set r = r + ['Temporali'] %}{% endif %}
          {% if is_state('binary_sensor.42_152875_12_678384_idraulico_domani', 'on') %}{% set r = r + ['Idraulico'] %}{% endif %}
          {{ r | join(', ') }}
        roma_alert: >-
          {% set r = [] %}
          {% if is_state('binary_sensor.41_933617_12_510125_idrogeologico_domani', 'on') %}{% set r = r + ['Idrogeologico'] %}{% endif %}
          {% if is_state('binary_sensor.41_933617_12_510125_temporali_domani', 'on') %}{% set r = r + ['Temporali'] %}{% endif %}
          {% if is_state('binary_sensor.41_933617_12_510125_idraulico_domani', 'on') %}{% set r = r + ['Idraulico'] %}{% endif %}
          {{ r | join(', ') }}
    - action: script.notifica_smart
      data:
        titolo: "📋 Bollettino DPC: Allerta Meteo Prevista per Domani"
        messaggio: >-
          La Protezione Civile ha diramato un'allerta per domani:
          {% if casa_alert | length > 0 %}• Casa (Medio Tevere): Allerta {{ casa_alert }}.{% endif %}
          {% if roma_alert | length > 0 %}• Roma (Zona Lavoro): Allerta {{ roma_alert }}.{% endif %}
          Organizzare con anticipo uscite e spostamenti.
        categoria: meteo
        priorita: alta
        canale: tutti_telefoni
        tag: allerta_dpc_domani
        azioni:
          - action: URI
            title: "🌐 Apri Plancia Eventi"
            uri: /eco-home/meteo
            url: /eco-home/meteo

- id: 'meteo_allerta_dpc_arrivo_in_zona_allertata'
  alias: 'Allerte DPC: Avviso all Arrivo in Zona con Allerta Attiva'
  description: 'Quando Utente 1 o Utente 2 arrivano in una zona monitorata (es. Lavoro a Roma), se in quella zona è attiva un allerta meteo viene inviato un promemoria push mirato.'
  mode: queued
  trigger:
    - trigger: state
      entity_id:
        - person.utente_1
        - person.utente_2
      to:
        - Lavoro Utente 2
        - Casa Familiare 6
        - Casa Nonni Utente 2
        - Roma
      id: ingresso_zona_roma
  condition:
    - condition: template
      value_template: "{{ states('sensor.dipartimento_protezione_civile_protezione_civile_roma_lavoro_laura_protezione_civile_roma_lavoro_laura_alert') | int(0) >= 2 }}"
    - condition: template
      value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 7200 }}"
  action:
    - variables:
        lvl: "{{ states('sensor.dipartimento_protezione_civile_protezione_civile_roma_lavoro_laura_protezione_civile_roma_lavoro_laura_alert') | int(0) }}"
        lvl_nome: "{{ 'GIALLA' if lvl == 2 else ('ARANCIONE' if lvl == 3 else 'ROSSA') }}"
        persona_nome: "{{ 'Utente 1' if trigger.entity_id == 'person.utente_1' else 'Utente 2' }}"
        canale_dest: "{{ 'utente_1' if trigger.entity_id == 'person.utente_1' else 'utente_2' }}"
    - action: script.notifica_smart
      data:
        titolo: "⚠️ Attenzione: Sei arrivato in Zona in Allerta"
        messaggio: "{{ persona_nome }}, sei a {{ trigger.to_state.state }}. In questa zona è attualmente attiva un'Allerta {{ lvl_nome }} della Protezione Civile. Prestare prudenza negli spostamenti."
        categoria: meteo
        priorita: alta
        canale: "{{ canale_dest }}"
        tag: allerta_ingresso_zona

