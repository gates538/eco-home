          }} km).'
        categoria: generale
        priorita: normale
        tag: gomme_discovery
  mode: single
- id: manutenzione_gomme_punto
  alias: Automobili - Promemoria Inversione Gomme Punto
  description: Invia una notifica quando mancano meno di 500 km all'inversione gomme della Punto
  triggers:
    - trigger: state
      entity_id: binary_sensor.punto_allerta_inversione_gomme
