      to: 'on'
  actions:
    - action: script.notifica_smart
      data:
        titolo: 🛞 Inversione Gomme Fiat Punto
        messaggio: 'È tempo di invertire le gomme sulla Fiat Punto (Intervallo 10.000 km raggiunto - Km attuali: {{ states(''sensor.punto_odometer_value'')
          }} km).'
        categoria: generale
        priorita: normale
        tag: gomme_punto
  mode: single
- id: manutenzione_revisione_discovery
  alias: Automobili - Promemoria Revisione Discovery
  description: Invia una notifica quando mancano meno di 30 giorni alla revisione della Discovery
  triggers:
    - trigger: state
      entity_id: binary_sensor.discovery_allerta_revisione
      from: 'off'
      to: 'on'
  actions:
    - action: script.notifica_smart
      data:
        titolo: 📋 Revisione Discovery Sport
        messaggio: 'La revisione ministeriale biennale per Discovery Sport scade tra meno di 30 giorni! (Scadenza: {{ states(''input_datetime.discovery_scadenza_revisione'')
          }}).'
        categoria: generale
        priorita: normale
        tag: revisione_discovery
  mode: single
- id: manutenzione_revisione_punto
  alias: Automobili - Promemoria Revisione Punto
  description: Invia una notifica quando mancano meno di 30 giorni alla revisione della Punto
  triggers:
    - trigger: state
      entity_id: binary_sensor.punto_allerta_revisione
      from: 'off'
      to: 'on'
  actions:
    - action: script.notifica_smart
      data:
        titolo: 📋 Revisione Fiat Punto
        messaggio: 'La revisione ministeriale biennale per Fiat Punto scade tra meno di 30 giorni! (Scadenza: {{ states(''input_datetime.punto_scadenza_revisione'')
          }}).'
        categoria: generale
        priorita: normale
        tag: revisione_punto
  mode: single
- id: notifica_smart_terremoto_ingv
  alias: 🌍 Notifica Smart - Allerta Terremoto INGV
  description: Invia notifica push su smartphone per eventi sismici con Magnitudo >= 2.0 entro 50 km oppure Magnitudo >= 3.5
    entro 100 km da Casa Mancini
  triggers:
    - trigger: state
      entity_id: sensor.ingv_earthquakes_casa_status
  conditions:
    - condition: template
      value_template: "{% set status = states('sensor.ingv_earthquakes_casa_status') | int(0) %} {% set quakes = states.geo_location\
        \ | selectattr('attributes.source', 'defined') | selectattr('attributes.source', 'eq', 'ingv_centro_nazionale_terremoti')\
        \ | list %} {% set ns = namespace(found=false) %} {% for q in quakes %}\n  {% set dist = q.state | float(999) %}\n\
        \  {% set mag = q.attributes.magnitude | float(0) %}\n  {% if (dist <= 50 and mag >= 2.0) or (dist <= 100 and mag\
        \ >= 3.5) %}\n    {% set ns.found = true %}\n  {% endif %}\n{% endfor %} {{ status > 0 and (trigger.to_state.state\
        \ != trigger.from_state.state or trigger.from_state.state == '0') and ns.found }}\n"
  actions:
    - action: script.notifica_smart
      data:
        titolo: 🌍 Allerta Terremoto INGV
        messaggio: "{% set quakes = states.geo_location | selectattr('attributes.source', 'defined') | selectattr('attributes.source',\
          \ 'eq', 'ingv_centro_nazionale_terremoti') | list %} {% set details = [] %} {% for q in quakes %}\n  {% set dist\
          \ = q.state | float(999) %}\n  {% set mag = q.attributes.magnitude | float(0) %}\n  {% if (dist <= 50 and mag >=\
          \ 2.0) or (dist <= 100 and mag >= 3.5) %}\n    {% set item = \"Scossa Magnitudo \" ~ mag ~ \" a circa \" ~ (dist\
          \ | round(1)) ~ \" km da Casa Mancini (Zona: \" ~ q.attributes.region | default('N/D') ~ \", prof. \" ~ q.attributes.depth\
          \ | default('N/D') ~ \" km).\" %}\n    {% set details = details + [item] %}\n  {% endif %}\n{% endfor %} {% if details\
          \ | count > 0 %}\n  {{ details | join('\\n') }}\n{% else %}\n  Rilevata attività sismica nell'area monitorata da\
          \ Casa Mancini.\n{% endif %}\n"
        categoria: sicurezza
        priorita: alta
        canale: tutti_telefoni
        tag: allerta_sisma_ingv
  mode: queued
  max: 5
- id: notifica_smart_fulmini_ravvicinati_blitzortung
  alias: ⚡ Notifica Smart - Allerta Fulmini entro 15 km
  description: Invia notifica push su smartphone se Blitzortung rileva scariche elettriche entro 15 km da Casa Mancini con
    tasto rapido Protezione Temporale
  triggers:
    - trigger: numeric_state
      entity_id: sensor.casa_lightning_distance
      below: 15.1
      id: fulmine_vicino
    - trigger: state
      entity_id: sensor.casa_lightning_counter
      id: counter_scariche
  conditions:
    - condition: template
      value_template: '{% set counter = states(''sensor.casa_lightning_counter'') | int(0) %} {% set dist = states(''sensor.casa_lightning_distance'')
        %} {{ counter > 0 and dist not in [''unknown'', ''unavailable'', ''None'', ''''] and (dist | float(999)) <= 15.0 }}

        '
  actions:
    - action: script.notifica_smart
      data:
        titolo: '⚡ Allerta Temporale: Fulmini entro 15 km!'
        messaggio: 'Rilevata attività elettrica a circa {{ states(''sensor.casa_lightning_distance'') }} km da Casa Mancini
          (direzione {{ states(''sensor.casa_lightning_azimuth'') }}°, {{ states(''sensor.casa_lightning_counter'') }} scariche
          nell''ultima ora).

          '
        categoria: meteo
        priorita: alta
        canale: tutti_telefoni
        tag: allerta_fulmini_15km
        azioni:
          - action: ATTIVA_TEMPORALE
            title: ⛈️ Protezione Temporale
          - action: IGNORA
            title: Ignora
    - delay: 00:15:00
  mode: single
- id: notifica_meteo_vento_forte
  alias: 💨 Notifica Smart - Raffiche di Vento Forte
  description: Invia allerta con tasto abbassa tapparelle se il vento supera i 20 km/h (max 1 ogni 2h)
  triggers:
    - trigger: numeric_state
      entity_id: sensor.sala_anemometro_gust_strength
      above: 20
  conditions:
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
        > 7200 }}'
  actions:
    - action: script.notifica_smart
      data:
        titolo: 💨 Vento Forte Rilevato
        messaggio: Raffiche a {{ states('sensor.sala_anemometro_gust_strength') }} km/h registrate in terrazza. Verificare
          tende e balconi.
        categoria: meteo
        priorita: alta
        tag: meteo_vento
        azioni:
          - action: ABBASSA_TAPPARELLE
            title: 🪟 Abbassa Tapparelle
          - action: IGNORA
            title: Tutto a posto
  mode: single
- id: notifica_meteo_inizio_pioggia
  alias: 🌧️ Notifica Smart - Inizio Pioggia & Controllo Finestre
  description: Invia avviso quando il pluviometro in terrazza rileva la pioggia, verificando se ci sono finestre aperte e
    quali (max 1 ogni ora)
  triggers:
    - trigger: numeric_state
      entity_id: sensor.terrazza_pulvirometro_precipitazione
      above: 0.1
  conditions:
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
        > 3600 }}'
  actions:
    - variables:
        finestre_aperte: '{% set ns = namespace(doors=[]) %} {% if is_state(''binary_sensor.finestrasala_contact'', ''on'')
          %}{% set ns.doors = ns.doors + [''Finestra Sala''] %}{% endif %} {% if is_state(''binary_sensor.finestracamera_contact'',
          ''on'') %}{% set ns.doors = ns.doors + [''Finestra Camera''] %}{% endif %} {% if is_state(''binary_sensor.finestracameretta_contact'',
          ''on'') %}{% set ns.doors = ns.doors + [''Finestra Cameretta''] %}{% endif %} {% if is_state(''binary_sensor.finestrabagno_contact'',
          ''on'') %}{% set ns.doors = ns.doors + [''Finestra Bagno''] %}{% endif %} {% if is_state(''binary_sensor.finestrabagnetto_contact'',
          ''on'') %}{% set ns.doors = ns.doors + [''Finestra Bagnetto''] %}{% endif %} {% if is_state(''binary_sensor.finestracucina_contact'',
          ''on'') %}{% set ns.doors = ns.doors + [''Finestra Cucina''] %}{% endif %} {% if is_state(''binary_sensor.portaterrazzo_contact'',
          ''on'') %}{% set ns.doors = ns.doors + [''Porta Terrazzo''] %}{% endif %} {{ ns.doors }}'
        ci_sono_finestre_aperte: '{{ finestre_aperte | length > 0 }}'
    - if:
        - condition: template
          value_template: '{{ ci_sono_finestre_aperte }}'
      then:
        - action: script.notifica_smart
          data:
            titolo: 🌧️ Allerta Pioggia — Finestre Aperte!
            messaggio: 'Sta piovendo a Casa Mancini! Attenzione: ci sono infissi APERTI: {{ finestre_aperte | join('', '')
              }}. Chiudili subito per evitare infiltrazioni!'
            categoria: meteo
            priorita: alta
            tag: meteo_pioggia
            azioni:
              - action: ABBASSA_TAPPARELLE
                title: 🪟 Abbassa Tapparelle
      else:
        - action: script.notifica_smart
          data:
            titolo: 🌧️ Inizio Pioggia Rilevato
            messaggio: Sta iniziando a piovere a Casa Mancini. Tutte le finestre sono chiuse e sigillate, nessun rischio.
            categoria: meteo
            priorita: normale
            tag: meteo_pioggia
            azioni:
              - action: ABBASSA_TAPPARELLE
                title: 🪟 Abbassa Tapparelle
  mode: single
- id: notifica_meteo_gelo_auto
  alias: ❄️ Notifica Smart - Allerta Gelo Notturno Auto
  description: Avvisa alle 06:45 se la temperatura esterna è sotto i -1°C per riscaldamento auto/parabrezza
  triggers:
    - trigger: time
      at: 06:45:00
  conditions:
    - condition: numeric_state
      entity_id: sensor.temperatura_media_esterna
      below: 0
  actions:
    - action: script.notifica_smart
      data:
        titolo: ❄️ Allerta Gelo Parabrezza
        messaggio: Temperatura esterna a {{ states('sensor.temperatura_media_esterna') }}°C. Parabrezza delle auto (Discovery
          e Punto) probabilmente ghiacciati.
        categoria: meteo
        priorita: normale
        tag: meteo_gelo
  mode: single
- id: notifica_allerta_ghiaccio_parabrezza_auto
  alias: ❄️ Notifica Smart - Possibile Ghiaccio Parabrezza (07:00)
  description: Avvisa la mattina prima di partire se la temperatura notturna è scesa sotto 1°C
  triggers:
    - trigger: time
      at: 07:00:00
  conditions:
    - condition: template
      value_template: '{{ states(''sensor.temperatura_media_esterna'') | float(10) <= 1.0 }}

        '
  actions:
    - action: script.notifica_smart
      data:
        titolo: ❄️ Attenzione Ghiaccio Parabrezza
        messaggio: Temperatura notturna molto rigida ({{ states('sensor.temperatura_media_esterna') }}°C). Possibile presenza
          di brina o ghiaccio sui parabrezza di Discovery e Punto prima di partire.
        categoria: meteo
        priorita: normale
        canale: stefano
        tag: ghiaccio_auto_mattina
  mode: single
