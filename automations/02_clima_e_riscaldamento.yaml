        message: 'Zona: {{ room_label }} | Modalità: {{ mode_label }} | Temp: {{ temp_label }}. {{ avviso_finestre }}'
        data:
          actions:
            - action: ACCENDI_CLIMA_SLOT2
              title: ❄️ Sì, Accendi
            - action: ANNULLA_CLIMA_SLOT2
              title: ❌ No, Annulla
      continue_on_error: true
