- id: eco_home_comfort_termico_micie
  alias: Eco Home - Comfort Termico Micie nei Giorni Torridi (Piccola e Luna)
  description: Notifica interattiva agli smartphone se la casa è vuota e la temperatura interna supera 28.5°C in estate
  triggers:
    - trigger: numeric_state
      entity_id: sensor.temperatura_media
      above: 28.5
      for:
        minutes: 20
  conditions:
    - condition: template
      value_template: '{{ now().month in [6, 7, 8, 9] }}'
    - condition: time
      after: '10:00:00'
      before: '17:30:00'
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: template
      value_template: '{{ is_state(''person.stefano'', ''not_home'') and is_state(''person.laura'', ''not_home'') }}'
    - condition: state
      entity_id: climate.sala_condizionatore_sala
      state: 'off'
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
        > 14400 }}'
  actions:
    - action: notify.mobile_app_samsung_s25_edge_di_stefano
      data:
        title: 🐱 Comfort Termico Micie (Piccola e Luna)
        message: 'In casa ci sono {{ states(''sensor.temperatura_media'') }}°C: fa caldo per Piccola e Luna. Vuoi accendere
          il clima sala a 25°C in modalità eco?'
        data:
          actions:
            - action: ACCENDI_CLIMA_MICIE
              title: ❄️ Accendi Clima Sala
            - action: FINESTRE_APERTE_MICIE
              title: 🪟 No, Finestre già Aperte
      continue_on_error: true
    - action: notify.mobile_app_samsung_s22_di_laura
      data:
        title: 🐱 Comfort Termico Micie (Piccola e Luna)
        message: 'In casa ci sono {{ states(''sensor.temperatura_media'') }}°C: fa caldo per Piccola e Luna. Vuoi accendere
          il clima sala a 25°C in modalità eco?'
        data:
          actions:
            - action: ACCENDI_CLIMA_MICIE
              title: ❄️ Accendi Clima Sala
            - action: FINESTRE_APERTE_MICIE
              title: 🪟 No, Finestre già Aperte
      continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Pet Alert: Notifica comfort termico estivo per micie'
  mode: single
- id: eco_home_risposta_clima_micie
  alias: Eco Home - Esecuzione Clima Sala per Comfort Micie
  description: Accende il clima sala a 25°C quando si preme Accendi Clima Sala dalla notifica micie
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: ACCENDI_CLIMA_MICIE
  actions:
    - action: climate.turn_on
      target:
        entity_id: climate.sala_condizionatore_sala
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.sala_condizionatore_sala
      data:
        hvac_mode: cool
    - action: climate.set_temperature
      target:
        entity_id: climate.sala_condizionatore_sala
      data:
        temperature: 25
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Comfort Micie: Clima sala attivato a 25°C da notifica'
  mode: single
