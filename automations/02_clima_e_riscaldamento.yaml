- id: clima_conferma_accensione_slot_2
  alias: Clima - Conferma Accensione Slot 2 (da Notifica)
  description: Accende i condizionatori configurati nello Slot 2 solo dopo conferma da notifica
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: ACCENDI_CLIMA_SLOT2
  actions:
    - variables:
        target_entities: "{% set room = states('input_select.clima_stanze_programmate') %} {% if room == 'Solo Sala & Living'\
          \ %}\n  ['climate.sala_condizionatore_sala']\n{% elif room == 'Solo Camere da Letto' %}\n  ['climate.camera_condizionatore_camera',\
          \ 'climate.cameretta_condizionatore_cameretta']\n{% elif room == 'Solo Camera Padronale' %}\n  ['climate.camera_condizionatore_camera']\n\
          {% elif room == 'Solo Cameretta' %}\n  ['climate.cameretta_condizionatore_cameretta']\n{% else %}\n  ['climate.sala_condizionatore_sala',\
          \ 'climate.camera_condizionatore_camera', 'climate.cameretta_condizionatore_cameretta']\n{% endif %}\n"
        hvac_mode_val: "{% set sel = states('input_select.clima_modalita_programmata') %} {% if 'Heat' in sel %}\n  heat\n\
          {% elif 'Dry' in sel %}\n  dry\n{% elif 'Auto' in sel %}\n  auto\n{% else %}\n  cool\n{% endif %}\n"
        temp_val: '{{ states(''input_number.clima_temperatura_programmata'') | float(25) }}'
    - action: climate.set_hvac_mode
      target:
        entity_id: '{{ target_entities }}'
      data:
        hvac_mode: '{{ hvac_mode_val }}'
    - action: climate.set_temperature
      target:
        entity_id: '{{ target_entities }}'
      data:
        temperature: '{{ temp_val }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Clima Slot 2: Accensione confermata da notifica'
  mode: single
- id: clima_spegnimento_programmato_slot_2
  alias: Clima - Spegnimento Programmato Slot 2
  description: Spegne automaticamente i condizionatori selezionati nello Slot 2
