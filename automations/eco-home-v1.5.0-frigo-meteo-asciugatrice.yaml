- id: 'eco_home_meteo_vento_pioggia_terrazza'
  alias: 'Eco Home - Allerta Vento Forte e Pioggia (Netatmo Terrazza)'
  description: 'Annuncio vocale sarcastico quando scattano pioggia o vento forte in terrazza di giorno'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.sala_anemometro_gust_strength
    above: 15
    id: vento_forte
  - trigger: numeric_state
    entity_id: sensor.terrazza_pulvirometro_precipitazione
    above: 0.01
    id: inizio_pioggia
  conditions:
  - condition: template
    value_template: "{{ not (now().hour >= 23 or now().hour < 7) }}"
  - condition: template
    value_template: "{{ is_state('input_boolean.echo_home_attivo', 'on') or is_state('input_boolean.eco_home_attivo', 'on') or states('input_boolean.echo_home_attivo') in ['unknown', 'unavailable'] }}"
  - condition: template
    value_template: "{{ not is_state('input_boolean.echo_home_silenzioso', 'on') and not is_state('input_boolean.eco_home_silenzioso', 'on') }}"
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 3600 }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'vento_forte' }}"
      sequence:
      - action: tts.speak
        target:
          entity_id: tts.google_translate_it_lt
        data:
          media_player_entity_id: media_player.nest_hub_sala
          language: "it"
          options:
            tld: "it"
          message: >-
            {{ [
              "Attenzione! Vento sopra i quindici chilometri orari in terrazza: occhio a stendini e tende!",
              "Allarme raffiche in terrazza! Ritirate gli oggetti leggeri prima che volino in paese!",
              "Vento forte in terrazza! Controllate stendini e piante all'esterno!"
            ] | random }}
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'inizio_pioggia' }}"
      sequence:
      - action: tts.speak
        target:
          entity_id: tts.google_translate_it_lt
        data:
          media_player_entity_id: media_player.nest_hub_sala
          language: "it"
          options:
            tld: "it"
          message: >-
            {{ [
              "Allarme pioggia in terrazza! Ritirate subito lo stendibiancheria!",
              "Attenzione, pioggia rilevata dal pluviometro! Salvate il bucato steso!",
              "Doccia in arrivo in terrazza! Chiudete le finestre e ritirate i panni!"
            ] | random }}
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Meteo Alert: Vento/Pioggia in terrazza"
    continue_on_error: true
  mode: single

- id: 'eco_home_asciugatrice_ciclo_terminato'
  alias: 'Eco Home - Registrazione Fine Ciclo Asciugatrice'
  description: 'Registra la fine del ciclo asciugatrice e attiva il promemoria panni da ritirare'
  triggers:
  - trigger: state
    entity_id: sensor.esterno_asciugatrice_machine_state
    from:
    - run
    - running
    - drying
    - cooling
    to:
    - 'off'
    - idle
    - stop
    - complete
    - completed
    - finish
    - finished
  - trigger: state
    entity_id: binary_sensor.asciugatrice_in_funzione
    from: 'on'
    to: 'off'
  conditions:
  - condition: template
    value_template: "{{ is_state('input_boolean.eco_home_attivo', 'on') or is_state('input_boolean.echo_home_attivo', 'on') or states('input_boolean.eco_home_attivo') in ['unknown', 'unavailable'] }}"
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.eco_home_asciugatrice_fine
    data:
      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Asciugatrice: Ciclo terminato, panni in attesa di ritiro"
    continue_on_error: true
  mode: single

- id: 'eco_home_asciugatrice_svuotata_terrazza'
  alias: 'Eco Home - Rilevamento Svuotamento Asciugatrice da Porta Terrazza'
  description: 'Annulla automaticamente il promemoria quando si apre la porta della terrazza per ritirare i panni'
  triggers:
  - trigger: state
    entity_id: binary_sensor.portaterrazzo_contact
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Asciugatrice: Panni ritirati (porta terrazza aperta)"
    continue_on_error: true
  mode: single

- id: 'eco_home_asciugatrice_promemoria_svuotamento'
  alias: 'Eco Home - Promemoria Asciugatrice da Svuotare (Samsung Dryer)'
  description: 'Promemoria vocale 30 minuti dopo la fine del ciclo asciugatrice solo se i panni non sono ancora stati ritirati'
  triggers:
  - trigger: state
    entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
    to: 'on'
    for:
      minutes: 30
  conditions:
  - condition: template
    value_template: "{{ not (now().hour >= 23 or now().hour < 7) }}"
  - condition: template
    value_template: "{{ is_state('input_boolean.echo_home_attivo', 'on') or is_state('input_boolean.eco_home_attivo', 'on') or states('input_boolean.echo_home_attivo') in ['unknown', 'unavailable'] }}"
  - condition: template
    value_template: "{{ not is_state('input_boolean.echo_home_silenzioso', 'on') and not is_state('input_boolean.eco_home_silenzioso', 'on') }}"
  - condition: state
    entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
    state: 'on'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') }}"
  actions:
  - action: tts.speak
    target:
      entity_id: tts.google_translate_it_lt
    data:
      media_player_entity_id: media_player.nest_hub_sala
      language: "it"
      options:
        tld: "it"
      message: >-
        {{ [
          "Promemoria asciugatrice: ciclo finito da mezz'ora, panni pronti da ritirare!",
          "Attenzione asciugatrice: svuotatela prima che i vestiti diventino origami!",
          "Bucato asciutto e pronto! È ora di svuotare l'asciugatrice!",
          "I panni nell'asciugatrice vi aspettano al calduccio: andate a svuotarla!"
        ] | random }}
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.eco_home_asciugatrice_da_annunciare
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Promemoria Asciugatrice: Panni da svuotare annunciato"
    continue_on_error: true
  mode: single

- id: 'eco_home_salva_bucato_terrazza_vento_pioggia'
  alias: 'Eco Home - Salva-Bucato in Terrazza (Vento Forte & Pioggia con Asciugatrice Pronta)'
  description: 'Avviso vocale tempestivo se l asciugatrice ha finito e in terrazza scatta pioggia o vento forte prima che i panni volino via'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.sala_anemometro_gust_strength
    above: 25
  - trigger: numeric_state
    entity_id: sensor.terrazza_pulvirometro_precipitazione
    above: 0.01
  - trigger: state
    entity_id: weather.home
    to:
    - rainy
    - pouring
    - lightning
    - hail
  conditions:
  - condition: template
    value_template: "{{ not (now().hour >= 23 or now().hour < 7) }}"
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: input_boolean.eco_home_silenzioso
    state: 'off'
  - condition: template
    value_template: "{{ is_state('input_boolean.eco_home_asciugatrice_da_annunciare', 'on') or states('sensor.esterno_asciugatrice_machine_state') in ['complete', 'completed', 'finish', 'finished', 'end', 'ended'] }}"
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') }}"
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 3600 }}"
  actions:
  - action: tts.speak
    target:
      entity_id: tts.google_translate_it_lt
    data:
      media_player_entity_id: media_player.nest_hub_sala
      language: "it"
      options:
        tld: "it"
      message: >-
        {{ [
          "Allarme bucato in terrazza! Asciugatrice terminata e vento forte: ritirate i panni prima che decollino!",
          "Attenzione bucato! Prime gocce di pioggia in terrazza con asciugatrice terminata: salvate i vestiti!",
          "Allerta meteo terrazza: raffiche di vento con bucato fuori, andate a scaricare l'asciugatrice!"
        ] | random }}
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Asciugatrice Alert: Vento/Pioggia con bucato in terrazza"
  mode: single

- id: 'eco_home_allerta_raffiche_vento_porte_sbattute'
  alias: 'Eco Home - Allerta Raffiche Vento Forte & Porte Sbattute (> 30 km/h)'
  description: 'Avviso vocale su Nest Hub se l anemometro in terrazza rileva raffiche sopra 30 km/h per prevenire colpi d aria'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.sala_anemometro_gust_strength
    above: 30
  conditions:
  - condition: template
    value_template: "{{ not (now().hour >= 23 or now().hour < 7) }}"
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: input_boolean.eco_home_silenzioso
    state: 'off'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') }}"
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 7200 }}"
  actions:
  - action: tts.speak
    target:
      entity_id: tts.google_translate_it_lt
    data:
      media_player_entity_id: media_player.nest_hub_sala
      language: "it"
      options:
        tld: "it"
      message: >-
        {{ [
          "Attenzione: raffiche di vento sopra i trenta chilometri orari in terrazza! Occhio alle porte che sbattono!",
          "Allerta vento in paese! Raffiche sostenute: controllate porte e finestre per evitare correnti d'aria!",
          "Vento forte in terrazza! Verificate le aperture di casa per evitare colpi d'aria e spaventi alle micie!"
        ] | random }}
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Meteo Alert: Raffiche vento > 30 km/h in terrazza"
  mode: single
