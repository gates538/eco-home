- id: 'eco_home_frigo_porta_aperta'
  alias: 'Eco Home - Allerta Porta Frigorifero Aperta (Sensore Ufficiale)'
  description: 'Annuncio vocale sarcastico o notifica silenziosa se la porta del frigorifero rimane aperta per più di 60 secondi'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.cucina_frigorifero_cooler_door
    - binary_sensor.frigorifero_porta
    - binary_sensor.frigorifero_door
    - binary_sensor.cucina_frigorifero_porta
    - binary_sensor.frigo_door
    to: 'on'
    for:
      minutes: 1
      seconds: 0
  conditions:
  - condition: template
    value_template: "{{ is_state('input_boolean.echo_home_attivo', 'on') or is_state('input_boolean.eco_home_attivo', 'on') or states('input_boolean.echo_home_attivo') in ['unknown', 'unavailable'] }}"
  - condition: template
    value_template: "{{ not is_state('input_boolean.echo_home_silenzioso', 'on') and not is_state('input_boolean.eco_home_silenzioso', 'on') }}"
  actions:
  - variables:
      is_daytime: "{{ not (now().hour >= 23 or now().hour < 7) }}"
      frigo_msg: >-
        {{ [
          "Attenzione! Frigo aperto da oltre un minuto: chiudete lo sportello!",
          "Allarme frigo aperto! Chiudete subito, stiamo rinfrescando tutto il paese!",
          "Chiudere il frigorifero! I pinguini all'interno chiedono coperte!",
          "Sportello del frigo aperto da un minuto: decidete in fretta cosa mangiare!",
          "Attenzione! Frigorifero aperto: chiudete prima che il fresco scappi!"
        ] | random }}
  - if:
    - condition: template
      value_template: "{{ is_daytime }}"
    then:
    - action: media_player.volume_set
      target:
        entity_id: media_player.nest_hub_sala
      data:
        volume_level: 0.8
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id: media_player.nest_hub_sala
        language: "it"
        options:
          tld: "it"
        message: "{{ frigo_msg }}"
      continue_on_error: true
    else:
    - action: notify.samsung_s25_edge_di_stefano
      data:
        title: "❄️ Frigorifero Aperto"
        message: "Lo sportello del frigorifero è aperto da oltre 60 secondi!"
      continue_on_error: true
    - action: notify.samsung_s22_di_laura
      data:
        title: "❄️ Frigorifero Aperto"
        message: "Lo sportello del frigorifero è aperto da oltre 60 secondi!"
      continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Allarme Frigo: Porta aperta oltre 60s"
    continue_on_error: true
  mode: single

