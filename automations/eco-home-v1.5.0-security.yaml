- id: 'eco_home_security_120'
  alias: Eco Home Security & Guardiano
  description: Modulo per controlli all'uscita (Guardiano) e sistema anti-intrusione
  mode: parallel
  max: 10
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    id: everyone_left
  - trigger: state
    entity_id: binary_sensor.porta_contact
    to: 'on'
    id: door_opened_intrusion
  - trigger: state
    entity_id:
    - person.stefano
    - person.laura
    - person.simone
    - person.monica
    to: home
    id: someone_arrived_disarm
  - trigger: numeric_state
    entity_id: zone.home
    above: 0
    id: zone_home_disarm
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - someone_arrived_disarm
        - zone_home_disarm
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.eco_home_allarme_inserito
        continue_on_error: true

    - conditions:
      - condition: trigger
        id: everyone_left
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.eco_home_allarme_inserito
        continue_on_error: true
      - delay: 00:01:00
      - variables:
          light_is_on: '{{ is_state(light_entity, ''on'') }}'
          windows_open: >-
            {% set open = expand(window_sensors) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
            {{ open | join(', ') if open | length > 0 else 'none' }}
          dryer_is_on: '{{ states(dryer_state_sensor) not in [''off'', ''idle'', ''stop'', ''stopped'', ''complete'', ''completed'', ''finish'', ''finished'', ''end'', ''ended'', ''none'', ''standby'', ''unknown'', ''unavailable''] }}'
      - if:
        - condition: template
          value_template: '{{ light_is_on }}'
        then:
        - action: '{{ stefano_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: >-
              {{ [
                "Tutti sono usciti ma la luce " ~ state_attr(light_entity, 'friendly_name') ~ " è rimasta accesa. Vuoi spegnerla?",
                "Avviso Guardiano: luce " ~ state_attr(light_entity, 'friendly_name') ~ " ancora accesa a casa vuota. La spengo?",
                "Qualcuno ha dimenticato accesa la luce " ~ state_attr(light_entity, 'friendly_name') ~ "! Premi per spegnerla subito."
              ] | random }}
            data:
              actions:
                - action: "TURN_OFF_LIGHT_{{ context.id }}"
                  title: "Sì, spegni"
                - action: "DISMISS_SEC"
                  title: "Ignora"
          continue_on_error: true
        - action: '{{ laura_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: "Tutti sono usciti ma la luce {{ state_attr(light_entity, 'friendly_name') }} è rimasta accesa."
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ windows_open != ''none'' }}'
        then:
        - action: '{{ stefano_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: "Attenzione: avete lasciato aperto: {{ windows_open }} mentre siete fuori casa!"
          continue_on_error: true
        - action: '{{ laura_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: "Attenzione: avete lasciato aperto: {{ windows_open }} mentre siete fuori casa!"
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ dryer_is_on }}'
        then:
        - action: '{{ stefano_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: "L'asciugatrice è ancora in funzione mentre siete fuori casa."
          continue_on_error: true
        - action: '{{ laura_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: "L'asciugatrice è ancora in funzione mentre siete fuori casa."
          continue_on_error: true

    - conditions:
      - condition: trigger
        id: door_opened_intrusion
      - condition: state
        entity_id: input_boolean.eco_home_allarme_inserito
        state: 'on'
      - condition: template
        value_template: "{{ not (is_state('person.stefano', 'home') or is_state('person.laura', 'home') or is_state('person.simone', 'home') or is_state('person.monica', 'home') or (states('zone.home') | int(0) > 0)) }}"
      sequence:
      - delay:
          seconds: 7.5
      - action: camera.snapshot
        target:
          entity_id: '{{ camera_entity }}'
        data:
          filename: '{{ snapshot_file_path }}'
        continue_on_error: true
      - action: '{{ stefano_notification_service }}'
        data:
          title: "⚠️ Portone Aperto a Casa Vuota"
          message: "Il portone d'ingresso è stato aperto. Disarmo automatico o conferma entro 30 secondi!"
          data:
            image: '{{ snapshot_access_url }}'
            attachment:
              url: '{{ snapshot_access_url }}'
              content-type: jpeg
              hide-thumbnail: false
            actions:
              - action: "DISARM_ALARM_{{ context.id }}"
                title: "Disarma (Sono io)"
        continue_on_error: true
      - action: '{{ laura_notification_service }}'
        data:
          title: "⚠️ Portone Aperto a Casa Vuota"
          message: "Il portone d'ingresso è stato aperto. Disarmo automatico o conferma entro 30 secondi!"
          data:
            image: '{{ snapshot_access_url }}'
            attachment:
              url: '{{ snapshot_access_url }}'
              content-type: jpeg
              hide-thumbnail: false
            actions:
              - action: "DISARM_ALARM_{{ context.id }}"
                title: "Disarma (Sono io)"
        continue_on_error: true
      - delay: 00:00:30
      - if:
        - condition: state
          entity_id: input_boolean.eco_home_allarme_inserito
          state: 'on'
        - condition: template
          value_template: "{{ not (is_state('person.stefano', 'home') or is_state('person.laura', 'home') or is_state('person.simone', 'home') or is_state('person.monica', 'home') or (states('zone.home') | int(0) > 0)) }}"
        then:
        - action: '{{ stefano_notification_service }}'
          data:
            title: "🚨 ALLARME INTRUSIONE CONFERMATO 🚨"
            message: "Nessun disarmo registrato dopo 30 secondi: allarme sonoro attivo in casa!"
          continue_on_error: true
        - action: '{{ laura_notification_service }}'
          data:
            title: "🚨 ALLARME INTRUSIONE CONFERMATO 🚨"
            message: "Nessun disarmo registrato dopo 30 secondi: allarme sonoro attivo in casa!"
          continue_on_error: true
        - action: media_player.volume_set
          target:
            entity_id: '{{ speaker }}'
          data:
            volume_level: 1.0
          continue_on_error: true
        - action: tts.speak
          target:
            entity_id: '{{ tts_engine }}'
          data:
            media_player_entity_id: '{{ speaker }}'
            language: "it"
            options:
              tld: "it"
            message: "Attenzione. Intrusione rilevata. Le forze dell'ordine sono state avvisate. Allontanarsi immediatamente."
            cache: false
          continue_on_error: true

  variables:
    speaker: media_player.nest_hub_sala
    tts_engine: tts.google_translate_it_lt
    light_entity: light.luceambiente
    dryer_state_sensor: sensor.esterno_asciugatrice_machine_state
    camera_entity: camera.sala_2
    stefano_notification_service: notify.samsung_s25_edge_di_stefano
    laura_notification_service: notify.samsung_s22_di_laura
    default_notification_service: notify.samsung_s25_edge_di_stefano
    snapshot_file_path: /media/eco_home/eco_home_sala_2.jpg
    snapshot_access_url: "/media/local/eco_home/eco_home_sala_2.jpg?time={{ now().timestamp() | int }}"
    window_sensors:
    - binary_sensor.finestra_sala
    - binary_sensor.finestra_camera

- id: 'eco_home_check_silenzioso_buonanotte'
  alias: 'Eco Home - Check Silenzioso Buonanotte (Ore 00:00)'
  description: 'Controllo a mezzanotte a suoni spenti: silenzio totale se tutto è chiuso/spento, notifica discreta se qualcosa è rimasto aperto'
  triggers:
  - trigger: time
    at: '00:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') }}"
  actions:
  - variables:
      portone_aperto: "{{ is_state('binary_sensor.porta_contact', 'on') }}"
      finestre_aperte: >-
        {% set open = expand(['binary_sensor.finestra_sala', 'binary_sensor.finestra_camera']) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
        {{ open | join(', ') if open | length > 0 else '' }}
      luci_accese: >-
        {% set on_lights = expand(['light.luceambiente', 'light.faretti_cucina']) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
        {{ on_lights | join(', ') if on_lights | length > 0 else '' }}
      asciugatrice_attiva: >-
        {{ states('sensor.esterno_asciugatrice_machine_state') not in ['off', 'idle', 'stop', 'stopped', 'complete', 'completed', 'finish', 'finished', 'end', 'ended', 'none', 'standby', 'unknown', 'unavailable'] }}
      anomalie: >-
        {% set lista = [] %}
        {% if portone_aperto %}
          {% set lista = lista + ['Portone principale aperto'] %}
        {% endif %}
        {% if finestre_aperte != '' %}
          {% set lista = lista + [finestre_aperte] %}
        {% endif %}
        {% if luci_accese != '' %}
          {% set lista = lista + [luci_accese] %}
        {% endif %}
        {% if asciugatrice_attiva %}
          {% set lista = lista + ['Asciugatrice ancora in funzione'] %}
        {% endif %}
        {{ lista | join(' • ') }}
  - if:
    - condition: template
      value_template: "{{ anomalie | trim != '' }}"
    then:
    - action: notify.samsung_s25_edge_di_stefano
      data:
        title: "🌙 Check Notturno Eco Home"
        message: "Attenzione: prima di dormire risultano ancora aperti o accesi:\n• {{ anomalie }}"
      continue_on_error: true
    - action: notify.samsung_s22_di_laura
      data:
        title: "🌙 Check Notturno Eco Home"
        message: "Attenzione: prima di dormire risultano ancora aperti o accesi:\n• {{ anomalie }}"
      continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: "Check Buonanotte: Notificate anomalie aperte/accese"
  mode: single

- id: 'eco_home_allarme_portone_aperto_lungo_micie'
  alias: 'Eco Home - Allarme Portone Aperto a Lungo (> 3 Minuti - Sicurezza Micie)'
  description: 'Avviso vocale tempestivo o notifica silenziosa se il portone resta aperto per più di 3 minuti continui'
  triggers:
  - trigger: state
    entity_id: binary_sensor.porta_contact
    to: 'on'
    for:
      minutes: 3
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: input_boolean.eco_home_silenzioso
    state: 'off'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') }}"
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 600 }}"
  actions:
  - variables:
      is_daytime: "{{ not (now().hour >= 23 or now().hour < 7) }}"
      portone_msg: >-
        {{ [
          "Attenzione! Portone aperto da oltre tre minuti: controllate che sia ben chiuso per la sicurezza delle micie!",
          "Allarme portone: la porta principale è aperta da tre minuti! Verificate la chiusura per la sicurezza di casa!",
          "Attenzione Stefano e Laura: portone aperto da tre minuti, occhio alle micie e richiudete la porta!"
        ] | random }}
  - if:
    - condition: template
      value_template: "{{ is_daytime }}"
    then:
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id: media_player.nest_hub_sala
        language: "it"
        options:
          tld: "it"
        message: "{{ portone_msg }}"
    else:
    - action: notify.samsung_s25_edge_di_stefano
      data:
        title: "🚪 Portone Aperto"
        message: "Il portone principale è aperto da oltre 3 minuti!"
      continue_on_error: true
    - action: notify.samsung_s22_di_laura
      data:
        title: "🚪 Portone Aperto"
        message: "Il portone principale è aperto da oltre 3 minuti!"
      continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Allarme Portone Aperto oltre 3 minuti"
  mode: single

- id: 'eco_home_guardiano_dispositivi_offline'
  alias: 'Eco Home - Guardiano Dispositivi Offline (Check Ore 11:00)'
  description: 'Controllo silenzioso quotidiano alle 11:00 su nodi critici, sensori portone/finestre/batterie per avvisare di dispositivi offline o freeze'
  triggers:
  - trigger: time
    at: '11:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  actions:
  - variables:
      critical_devices:
      - binary_sensor.porta_contact
      - binary_sensor.finestra_sala
      - binary_sensor.finestra_camera
      - media_player.nest_hub_sala
      offline_list: >-
        {% set ns = namespace(items=[]) %}
        {% for d in critical_devices %}
          {% if states(d) in ['unavailable', 'unknown', 'None'] %}
            {% set ns.items = ns.items + [state_attr(d, 'friendly_name') | default(d, true)] %}
          {% elif states[d] is defined and states[d].last_updated is not none %}
            {% set diff_sec = as_timestamp(now()) - as_timestamp(states[d].last_updated) %}
            {% if diff_sec > 86400 and d == 'binary_sensor.porta_contact' %}
              {% set ns.items = ns.items + [(state_attr(d, 'friendly_name') | default(d, true)) ~ ' (Nessun segnale da >24h)'] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items | join(', ') }}
  - if:
    - condition: template
      value_template: "{{ offline_list | trim != '' }}"
    then:
    - action: notify.samsung_s25_edge_di_stefano
      data:
        title: "⚠️ Guardiano Dispositivi Eco Home"
        message: "Attenzione, i seguenti dispositivi risultano offline o non rispondono da oltre 24 ore: {{ offline_list }}."
      continue_on_error: true
    - action: notify.samsung_s22_di_laura
      data:
        title: "⚠️ Guardiano Dispositivi Eco Home"
        message: "Attenzione, i seguenti dispositivi risultano offline o non rispondono da oltre 24 ore: {{ offline_list }}."
      continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: "Guardiano: Rilevati dispositivi offline ({{ offline_list | truncate(150) }})"
  mode: single
