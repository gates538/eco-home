- id: 'eco_home_security_120'
  alias: Eco Home Security & Guardiano
  description: Modulo per controlli all'uscita (Guardiano) e sistema anti-intrusione
  mode: parallel
  max: 10
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    id: everyone_left
  - trigger: state
    entity_id: binary_sensor.porta_contact
    to: 'on'
    id: door_opened_intrusion
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: everyone_left
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.eco_home_allarme_inserito
        continue_on_error: true
      - delay: 00:01:00
      - variables:
          light_is_on: '{{ is_state(light_entity, ''on'') }}'
          windows_open: >-
            {% set open = expand(window_sensors) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
            {{ open | join(', ') if open | length > 0 else 'none' }}
          dryer_is_on: '{{ states(dryer_state_sensor) not in [''off'', ''idle'', ''stop'', ''stopped'', ''complete'', ''completed'', ''finish'', ''finished'', ''end'', ''ended'', ''none'', ''standby'', ''unknown'', ''unavailable''] }}'
      - if:
        - condition: template
          value_template: '{{ light_is_on }}'
        then:
        - action: '{{ default_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: >-
              {{ [
                "Tutti sono usciti ma la luce " ~ state_attr(light_entity, 'friendly_name') ~ " è rimasta accesa. Vuoi spegnerla?",
                "Avviso Guardiano: luce " ~ state_attr(light_entity, 'friendly_name') ~ " ancora accesa a casa vuota. La spengo?",
                "Qualcuno ha dimenticato accesa la luce " ~ state_attr(light_entity, 'friendly_name') ~ "! Premi per spegnerla subito."
              ] | random }}
            data:
              actions:
                - action: "TURN_OFF_LIGHT_{{ context.id }}"
                  title: "Sì, spegni"
                - action: "DISMISS_SEC"
                  title: "Ignora"
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ windows_open != ''none'' }}'
        then:
        - action: '{{ default_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: >-
              {{ [
                "Attenzione: avete lasciato aperto: " ~ windows_open ~ " mentre siete fuori casa!",
                "Allarme finestre: risulta aperto: " ~ windows_open ~ "! Occhio a pioggia e correnti d'aria!",
                "Guardiano casa: non dimenticate che " ~ windows_open ~ " è ancora aperto!"
              ] | random }}
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ dryer_is_on }}'
        then:
        - action: '{{ default_notification_service }}'
          data:
            title: "Guardiano Eco Home"
            message: >-
              {{ [
                "L'asciugatrice è ancora in funzione mentre siete fuori casa.",
                "Promemoria Guardiano: il ciclo asciugatrice sta proseguendo in vostra assenza.",
                "Bucato in corso: l'asciugatrice sta terminando mentre la casa è vuota."
              ] | random }}
          continue_on_error: true

    - conditions:
      - condition: trigger
        id: door_opened_intrusion
      - condition: state
        entity_id: input_boolean.eco_home_allarme_inserito
        state: 'on'
      - condition: numeric_state
        entity_id: zone.home
        below: 1
      sequence:
      - action: camera.snapshot
        target:
          entity_id: '{{ camera_entity }}'
        data:
          filename: '{{ snapshot_file_path }}'
        continue_on_error: true
      - action: '{{ default_notification_service }}'
        data:
          title: "🚨 ALLARME INTRUSIONE 🚨"
          message: "Il portone è stato aperto mentre la casa è vuota!"
          data:
            image: '{{ snapshot_access_url }}'
            attachment:
              url: '{{ snapshot_access_url }}'
              content-type: jpeg
              hide-thumbnail: false
            actions:
              - action: "DISARM_ALARM_{{ context.id }}"
                title: "È un falso allarme"
        continue_on_error: true
      - action: media_player.volume_set
        target:
          entity_id: '{{ speaker }}'
        data:
          volume_level: 1.0
        continue_on_error: true
      - action: tts.speak
        target:
          entity_id: '{{ tts_engine }}'
        data:
          media_player_entity_id: '{{ speaker }}'
          message: "Attenzione. Intrusione rilevata. Le forze dell'ordine sono state avvisate. Allontanarsi immediatamente."
          cache: false
        continue_on_error: true

  variables:
    speaker: media_player.nest_hub_sala
    tts_engine: tts.google_translate_it_lt
    light_entity: light.luceambiente
    dryer_state_sensor: sensor.esterno_asciugatrice_machine_state
    camera_entity: camera.sala_2
    default_notification_service: notify.notify
    snapshot_file_path: /media/eco_home/eco_home_sala_2.jpg
    snapshot_access_url: "/media/local/eco_home/eco_home_sala_2.jpg?time={{ now().timestamp() | int }}"
    window_sensors:
    - binary_sensor.finestra_sala
    - binary_sensor.finestra_camera

- id: 'eco_home_check_silenzioso_buonanotte'
  alias: 'Eco Home - Check Silenzioso Buonanotte (Ore 00:00)'
  description: 'Controllo a mezzanotte a suoni spenti: silenzio totale se tutto è chiuso/spento, notifica discreta se qualcosa è rimasto aperto'
  triggers:
  - trigger: time
    at: '00:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') }}"
  actions:
  - variables:
      portone_aperto: "{{ is_state('binary_sensor.porta_contact', 'on') }}"
      finestre_aperte: >-
        {% set open = expand(['binary_sensor.finestra_sala', 'binary_sensor.finestra_camera']) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
        {{ open | join(', ') if open | length > 0 else '' }}
      luci_accese: >-
        {% set on_lights = expand(['light.luceambiente', 'light.faretti_cucina']) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
        {{ on_lights | join(', ') if on_lights | length > 0 else '' }}
      asciugatrice_attiva: >-
        {{ states('sensor.esterno_asciugatrice_machine_state') not in ['off', 'idle', 'stop', 'stopped', 'complete', 'completed', 'finish', 'finished', 'end', 'ended', 'none', 'standby', 'unknown', 'unavailable'] }}
      anomalie: >-
        {% set lista = [] %}
        {% if portone_aperto %}
          {% set lista = lista + ['Portone principale aperto'] %}
        {% endif %}
        {% if finestre_aperte != '' %}
          {% set lista = lista + [finestre_aperte] %}
        {% endif %}
        {% if luci_accese != '' %}
          {% set lista = lista + [luci_accese] %}
        {% endif %}
        {% if asciugatrice_attiva %}
          {% set lista = lista + ['Asciugatrice ancora in funzione'] %}
        {% endif %}
        {{ lista | join(' • ') }}
  - if:
    - condition: template
      value_template: "{{ anomalie | trim != '' }}"
    then:
    - action: notify.notify
      data:
        title: "🌙 Check Notturno Eco Home"
        message: "Attenzione: prima di dormire risultano ancora aperti o accesi:\n• {{ anomalie }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: "Check Buonanotte: Notificate anomalie aperte/accese"
  mode: single

- id: 'eco_home_allarme_portone_aperto_lungo_micie'
  alias: 'Eco Home - Allarme Portone Aperto a Lungo (> 3 Minuti - Sicurezza Micie)'
  description: 'Avviso vocale tempestivo se il portone resta aperto per più di 3 minuti continui per non far scappare Piccola e Luna'
  triggers:
  - trigger: state
    entity_id: binary_sensor.porta_contact
    to: 'on'
    for:
      minutes: 3
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: state
    entity_id: input_boolean.eco_home_silenzioso
    state: 'off'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') }}"
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 600 }}"
  actions:
  - action: tts.speak
    target:
      entity_id: tts.google_translate_it_lt
    data:
      media_player_entity_id: media_player.nest_hub_sala
      language: "it"
      options:
        tld: "it"
      message: >-
        {{ [
          "Attenzione! Il portone d'ingresso è rimasto aperto da oltre tre minuti: controllate che sia ben chiuso per non far scappare Piccola e Luna!",
          "Allarme portone: la porta principale è aperta da tre minuti! Verificate che sia chiusa per la sicurezza della casa e delle gatte!",
          "Promemoria sicurezza: portone principale aperto da oltre tre minuti, occhio agli spifferi e alle micie!",
          "Attenzione Stefano e Laura: portone aperto da più di tre minuti! Verificate che le gatte siano al sicuro e richiudete la porta!"
        ] | random }}
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Sicurezza Alert: Portone aperto oltre 3 minuti"
  mode: single

- id: 'eco_home_guardiano_dispositivi_offline'
  alias: 'Eco Home - Guardiano Dispositivi Offline (Check Giornaliero Ore 11:00)'
  description: 'Controllo silenzioso quotidiano delle entità critiche per segnalare su smartphone eventuali sensori offline o con batterie scariche'
  triggers:
  - trigger: time
    at: '11:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  actions:
  - variables:
      dispositivi_critici:
      - binary_sensor.porta_contact
      - sensor.sala_anemometro_gust_strength
      - sensor.terrazza_pulvirometro_precipitazione
      - sensor.temperatura_media
      - sensor.temperatura_media_esterna
      - climate.condizionatore_sala
      - climate.condizionatore_camera
      offline_list: >-
        {% set lista = [] %}
        {% for d in dispositivi_critici %}
          {% if states(d) in ['unavailable', 'unknown'] %}
            {% set lista = lista + [state_attr(d, 'friendly_name') | default(d)] %}
          {% endif %}
        {% endfor %}
        {{ lista | join(', ') }}
  - if:
    - condition: template
      value_template: "{{ offline_list | trim != '' }}"
    then:
    - action: notify.notify
      data:
        title: "⚠️ Eco Home Manutenzione Dispositivi"
        message: "I seguenti dispositivi risultano offline o non raggiungibili: {{ offline_list }}. Verificare Wi-Fi o batterie!"
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: "Manutenzione: Segnalati dispositivi offline"
  mode: single
