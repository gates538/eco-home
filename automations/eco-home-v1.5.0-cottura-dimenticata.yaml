- id: 'eco_home_allerta_cottura_dimenticata'
  alias: 'Eco Home - Allerta Cottura Dimenticata (60 Minuti)'
  description: 'Notifica WhatsApp e avviso vocale se il piano ad induzione o il forno rimangono accesi per più di 60 minuti'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.cucina_piano_cottura_potenza
    above: 15
    for:
      minutes: 60
    id: induzione_dimenticata
  - trigger: state
    entity_id: sensor.cucina_piano_cottura_stato_di_funzionamento
    to:
    - 'In funzione'
    - 'Preriscaldamento'
    for:
      minutes: 60
    id: piano_dimenticato
  - trigger: state
    entity_id: sensor.cucina_forno_machine_state
    to:
    - 'running'
    - 'cooking'
    for:
      minutes: 60
    id: forno_dimenticato
  conditions:
  - condition: state
    entity_id: input_boolean.eco_home_attivo
    state: 'on'
  - condition: template
    value_template: "{{ is_state('person.stefano', 'home') or is_state('person.laura', 'home') or is_state('person.simone', 'home') or is_state('person.monica', 'home') }}"
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 3600 }}"
  actions:
  - action: rest_command.whatsapp_group_notify
    data:
      message: >-
        {{ [
          "⚠️ Attenzione! Cottura o forno attivi da oltre 60 minuti: verificate le pentole!",
          "🔥 Allarme Cucina! Fornelli accesi da oltre un'ora: controllate la cottura!"
        ] | random }}
  - if:
    - condition: state
      entity_id: input_boolean.eco_home_silenzioso
      state: 'off'
    - condition: template
      value_template: "{{ not (now().hour >= 23 or now().hour < 7) }}"
    then:
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id: media_player.nest_hub_sala
        language: "it"
        options:
          tld: "it"
        message: >-
          {{ [
            "Attenzione Stefano e Laura! Cottura attiva da oltre un'ora: controllate pentole e forno!",
            "Allarme cucina! Fornelli accesi da sessanta minuti: verificate la cottura prima che bruci tutto!",
            "Avviso fornelli: è passata un'ora dall'accensione, controllate che l'acqua non sia evaporata!"
          ] | random }}
  - action: input_text.set_value
    target:
      entity_id: input_text.eco_home_ultimo_messaggio
    data:
      value: "Allarme Cucina: Cottura attiva da oltre 60 min"
  mode: single
