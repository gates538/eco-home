      'ceil') | int(0) }}\n{% else %}\n  0\n{% endif %}"
    dryer_running_and_has_remaining_time: "{{\n  dryer_active_running\n  and not dryer_is_finished_now\n  and dryer_state not in ['unknown', 'unavailable', 'none', 'ready', 'idle', 'off', 'stop', 'stopped', 'standby', 'complete', 'completed', 'finish', 'finished']\n  and dryer_remaining_minutes | int(0) > 1\n  and dryer_remaining_minutes | int(0) < 360\n}}"
