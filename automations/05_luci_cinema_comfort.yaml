# ==============================================================================
# ILLUMINAZIONE, CINEMA & SCENARI QUOTIDIANI — CASA MANCINI
# ==============================================================================
# Controllo luci ambiente/cucina, modalità cinema con Emby TV, telecomando divano Zigbee, scenari Buongiorno e Buonanotte.
# Automazioni incluse in questo modulo: 15
# ==============================================================================

- id: '1781725137553'
  alias: Comando lampada ambiente
  description: 'Controllo rotellina Zigbee: - Rotazione lenta: ±2% - Rotazione veloce: ±10% - Pulsanti 1/2/3/4: Toggle On
    (4000K, 100%) / Off

    '
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/ComandoLuceAmbiente/action
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload in [''dial_rotate_right_fast'', ''brightness_step_up''] }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.luceambiente
              data:
                brightness_step_pct: 10
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload in [''dial_rotate_left_fast'', ''brightness_step_down''] }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.luceambiente
              data:
                brightness_step_pct: -10
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''dial_rotate_right'' }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.luceambiente
              data:
                brightness_step_pct: 2
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''dial_rotate_left'' }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.luceambiente
              data:
                brightness_step_pct: -2
        - conditions:
            - condition: template
              value_template: "{{ trigger.payload in [\n  'button_1_press', 'button_1_press_release',\n  'button_2_press',\
                \ 'button_2_press_release',\n  'button_3_press', 'button_3_press_release',\n  'button_4_press', 'button_4_press_release'\n\
                ] }}\n"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.luceambiente
                      state: 'on'
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: light.luceambiente
                - conditions:
                    - condition: state
                      entity_id: light.luceambiente
                      state: 'off'
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.luceambiente
                      data:
                        brightness_pct: 100
                        color_temp_kelvin: 4000
  mode: single
- id: '1781874601142'
  alias: Comando Faretti cucina
  description: Controllo rotellina e pulsanti 4 scene faretti cucina
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/ComandoFaretti/action
  variables:
    entity: light.faretti_cucina
    current_brightness: '{{ state_attr(entity, ''brightness'') | int(1) }}'
    current_pct: '{{ (current_brightness / 2.55) | round(0) }}'
    slow_up: '{{ [current_pct + 2, 100] | min }}'
    fast_up: '{{ [current_pct + 10, 100] | min }}'
    slow_down: '{{ [current_pct - 2, 1] | max }}'
    fast_down: '{{ [current_pct - 10, 1] | max }}'
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''dial_rotate_right_step'' }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ entity }}'
              data:
                brightness: '{{ (slow_up * 2.55) | int }}'
                transition: 0.12
                color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''brightness_step_up'' }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ entity }}'
              data:
                brightness: '{{ (fast_up * 2.55) | int }}'
                transition: 0.12
                color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''dial_rotate_left_slow'' }}'
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ current_pct <= 2 }}'
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: '{{ entity }}'
              default:
                - action: light.turn_on
                  target:
                    entity_id: '{{ entity }}'
                  data:
                    brightness: '{{ (slow_down * 2.55) | int }}'
                    transition: 0.12
                    color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''brightness_step_down'' }}'
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ current_pct <= 10 }}'
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: '{{ entity }}'
              default:
                - action: light.turn_on
                  target:
                    entity_id: '{{ entity }}'
                  data:
                    brightness: '{{ (fast_down * 2.55) | int }}'
                    transition: 0.12
                    color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload in [''button_1_press'', ''button_1_press_release''] }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ entity }}'
              data:
                brightness_pct: 100
                transition: 0.2
                color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload in [''button_2_press'', ''button_2_press_release''] }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ entity }}'
              data:
                brightness_pct: 75
                transition: 0.2
                color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload in [''button_3_press'', ''button_3_press_release''] }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ entity }}'
              data:
                brightness_pct: 50
                transition: 0.2
                color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload in [''button_4_press'', ''button_4_press_release''] }}'
          sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ entity }}'
              data:
                brightness_pct: 25
                transition: 0.2
                color_temp_kelvin: 4000
        - conditions:
            - condition: template
              value_template: '{{ ''hold'' in trigger.payload }}'
          sequence:
            - action: light.turn_off
              target:
                entity_id: '{{ entity }}'
  mode: restart
- id: eco_home_zero_sprechi_spegnimento_luci
  alias: Eco Home - Zero Sprechi Spegnimento Luci all Uscita
  description: Spegne automaticamente tutte le luci della casa quando tutti i membri escono di casa
  triggers:
    - trigger: state
      entity_id:
        - person.stefano
        - person.laura
        - person.simone_mancini
        - person.monica
      to: not_home
      id: persona_uscita
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: template
      value_template: '{{ states(''person.stefano'') not in [''home'', ''casa''] and states(''person.laura'') not in [''home'',
        ''casa''] and states(''person.simone_mancini'') not in [''home'', ''casa''] and states(''person.monica'') not in [''home'',
        ''casa''] }}'
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.luceambiente
          - light.faretti_cucina
      continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Zero Sprechi: Luci spente all''uscita di tutti'
  mode: single
- id: eco_home_luci_accese_pieno_giorno
  alias: 'Eco Home - Zero Sprechi: Luci Accese in Pieno Giorno (> 1 Ora)'
  description: Suggerimento vocale discreto se la luce ambiente o i faretti restano accesi per oltre 60 minuti con pieno sole
  triggers:
    - trigger: state
      entity_id:
        - light.luceambiente
        - light.faretti_cucina
      to: 'on'
      for:
        minutes: 60
  conditions:
    - condition: template
      value_template: '{{ not (now().hour >= 23 or now().hour < 7) }}'
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: state
      entity_id: input_boolean.eco_home_silenzioso
      state: 'off'
    - condition: state
      entity_id: sun.sun
      state: above_horizon
    - condition: template
      value_template: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) > 15 }}'
    - condition: template
      value_template: '{{ is_state(''person.stefano'', ''home'') or is_state(''person.laura'', ''home'') }}'
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
        > 7200 }}'
  actions:
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id: media_player.nest_hub_sala
        language: it
        options:
          tld: it
        message: "{{ [\n  \"Promemoria risparmio: le luci sono accese da un'ora con pieno sole fuori! Volete spegnerle?\"\
          ,\n  \"Avviso zero sprechi: c'è una bella luce naturale all'esterno, verificate se le luci interne servono ancora!\"\
          ,\n  \"Consiglio eco: splendida giornata di sole fuori, possiamo spegnere le luci e risparmiare corrente!\"\n] |\
          \ random }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Zero Sprechi: Luci accese oltre 1h di giorno'
  mode: single
- id: cinema_tv_sala_avvio_film
  alias: 🍿 Cinema - Avvio Visione Film TV Sala
  description: Abbassa le luci e la tapparella quando si avvia un contenuto multimediale di sera
  triggers:
    - trigger: state
      entity_id: media_player.sala_tv_sala
      to: playing
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: light.turn_off
      target:
        entity_id: light.sala
      continue_on_error: true
    - action: light.turn_on
      target:
        entity_id: light.mensolecamino
      data:
        brightness_pct: 15
      continue_on_error: true
    - action: light.turn_on
      target:
        entity_id: light.luceambiente
      data:
        brightness_pct: 10
      continue_on_error: true
    - if:
        - condition: numeric_state
          entity_id: cover.tapparella_sala_homekit
          attribute: current_position
          above: 10
      then:
        - action: cover.set_cover_position
          target:
            entity_id: cover.tapparella_sala_homekit
          data:
            position: 5
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.eco_home_silenzioso
      continue_on_error: true
    - action: light.turn_off
      target:
        entity_id: light.faretti_cucina
      continue_on_error: true
    - action: script.standby_tablet
      continue_on_error: true
  mode: single
- id: cinema_tv_sala_pausa_stop
  alias: 🍿 Cinema - Pausa o Stop Film TV Sala
  description: Rialza dolcemente le luci soffuse quando si mette in pausa o si arresta il film
  triggers:
    - trigger: state
      entity_id: media_player.sala_tv_sala
      from: playing
      to:
        - paused
        - idle
        - 'off'
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: light.turn_on
      target:
        entity_id: light.mensolecamino
      data:
        brightness_pct: 40
      continue_on_error: true
    - action: light.turn_on
      target:
        entity_id: light.luceambiente
      data:
        brightness_pct: 35
      continue_on_error: true
    - if:
        - condition: template
          value_template: '{{ trigger.to_state.state in [''idle'', ''off''] }}'
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.eco_home_silenzioso
          continue_on_error: true
  mode: single
- id: cinema_telecomando_divano_controllo
  alias: 🛋️ Telecomando Divano - Cinema, TV & Tapparella Sala
  description: 'Controllo da divano con telecomando IKEA Rodret: Scena Cinema, Pausa TV & Luce Sala, e Tapparella Sala'
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/0x287681fffe496d70/action
    - trigger: mqtt
      topic: zigbee2mqtt/TelecomandoDivano/action
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''on'' }}'
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.cinema_relax
            - action: script.standby_tablet
              continue_on_error: true
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''off'' }}'
          sequence:
            - action: media_player.media_pause
              target:
                entity_id:
                  - media_player.sala_tv_sala
                  - media_player.tv_sala_ue85du7170uxzt
              continue_on_error: true
            - if:
                - condition: state
                  entity_id: sun.sun
                  state: below_horizon
              then:
                - action: light.turn_on
                  target:
                    entity_id: light.sala
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''brightness_move_up'' }}'
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.tapparella_sala_homekit
              data:
                position: 100
        - conditions:
            - condition: template
              value_template: '{{ trigger.payload == ''brightness_move_down'' }}'
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.tapparella_sala_homekit
              data:
                position: 5
  mode: restart
- id: eco_home_cinema_silenzioso_avvio
  alias: Eco Home - Modalità Cinema Soffusa & Silenzioso (Avvio Film Emby/TV)
  description: Attiva modalità silenziosa e abbassa dolcemente la luce ambiente al 15% caldo all avvio del film dopo il tramonto
  triggers:
    - trigger: state
      entity_id:
        - media_player.emby_edge_windows
        - media_player.emby_homeassistant
        - media_player.emby_homeassistant_2
      to: playing
      not_from:
        - paused
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.eco_home_silenzioso
    - if:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
      then:
        - action: light.turn_on
          target:
            entity_id: light.luceambiente
          data:
            brightness_pct: 15
            color_temp_kelvin: 2200
            transition: 3
          continue_on_error: true
        - action: light.turn_off
          target:
            entity_id: light.faretti_cucina
          data:
            transition: 2
          continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Scena Cinema: Avvio film, luce soffusa al 15% e silenzioso attivo'
  mode: single
- id: eco_home_cinema_pausa_luci
  alias: 'Eco Home - Pausa Film: Luce Ambiente Media (Snack & Spostamenti)'
  description: Alza temporaneamente la luce al 45% durante la pausa del film per consentire spostamenti in sicurezza
  triggers:
    - trigger: state
      entity_id:
        - media_player.emby_edge_windows
        - media_player.emby_homeassistant
        - media_player.emby_homeassistant_2
      to: paused
      for:
        seconds: 10
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: light.turn_on
      target:
        entity_id: light.luceambiente
      data:
        brightness_pct: 45
        color_temp_kelvin: 2700
        transition: 2
      continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Scena Cinema: Pausa film, luce al 45%'
  mode: single
- id: eco_home_cinema_ripresa_luci
  alias: 'Eco Home - Ripresa Film: Ritorno a Luce Soffusa 15%'
  description: Riabbassa la luce ambiente al 15% quando si riprende la visione del film
  triggers:
    - trigger: state
      entity_id:
        - media_player.emby_edge_windows
        - media_player.emby_homeassistant
        - media_player.emby_homeassistant_2
      from: paused
      to: playing
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: light.turn_on
      target:
        entity_id: light.luceambiente
      data:
        brightness_pct: 15
        color_temp_kelvin: 2200
        transition: 2
      continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Scena Cinema: Ripresa film, luce soffusa al 15%'
  mode: single
- id: eco_home_cinema_silenzioso_fine
  alias: 'Eco Home - Fine Film: Ripristino Silenzioso & Luce Normale'
  description: Disattiva la modalità silenziosa e ripristina la luce quando la riproduzione del film termina
  triggers:
    - trigger: state
      entity_id:
        - media_player.emby_edge_windows
        - media_player.emby_homeassistant
        - media_player.emby_homeassistant_2
      to:
        - idle
        - 'off'
      for:
        minutes: 2
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: state
      entity_id: input_boolean.eco_home_silenzioso
      state: 'on'
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.eco_home_silenzioso
    - if:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
      then:
        - action: light.turn_on
          target:
            entity_id: light.luceambiente
          data:
            brightness_pct: 60
            color_temp_kelvin: 2700
            transition: 3
          continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Scena Cinema: Fine film, silenzioso disattivato e luce ripristinata'
  mode: single
- id: eco_home_momenti_relax_silenzio_coppia
  alias: Eco Home - Momenti di Relax & Sorrisi di Coppia (Silenzio in Sala)
  description: Riproduce una battuta carina e rilassante sul Nest Hub quando Stefano e Laura sono entrambi a casa, è giorno
    e c'è silenzio prolungato in sala, con filtri avanzati anti-falsi positivi (sonno/riposino)
  triggers:
    - trigger: numeric_state
      entity_id: sensor.sala_stazione_meteo_sala_noise_2
      below: 42
      for:
        minutes: 45
        seconds: 0
  conditions:
    - condition: state
      entity_id: person.stefano
      state: home
    - condition: state
      entity_id: person.laura
      state: home
    - condition: state
      entity_id: sun.sun
      state: above_horizon
    - condition: template
      value_template: '{% set h = now().hour + (now().minute / 60) %} {{ (h >= 10.5 and h < 13.5) or (h >= 16.5 and h < 19.5)
        }}'
    - condition: template
      value_template: "{{ is_state('cover.tapparella_camera_homekit', 'open') or\n   (state_attr('cover.tapparella_camera_homekit',\
        \ 'current_position') | int(100) > 50) }}"
    - condition: template
      value_template: '{{ states(''sensor.samsung_s25_edge_di_stefano_do_not_disturb_sensor'') not in [''total_silence'',
        ''alarms_only''] }}'
    - condition: template
      value_template: "{{ states('media_player.sala_tv_sala') != 'playing' and\n   states('media_player.tv_sala_ue85du7170uxzt')\
        \ != 'playing' and\n   states('media_player.tv_sala') != 'playing' and\n   states('media_player.emby_edge_windows')\
        \ != 'playing' }}"
    - condition: state
      entity_id: input_boolean.eco_home_attivo
      state: 'on'
    - condition: state
      entity_id: input_boolean.eco_home_silenzioso
      state: 'off'
    - condition: state
      entity_id: input_boolean.eco_home_annunci_relax
      state: 'on'
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
        > 28800 }}'
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.nest_hub_sala
      data:
        volume_level: 0.6
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id: media_player.nest_hub_sala
        language: it
        options:
          tld: it
        message: "{{ [\n  \"Tutto tace a Casa Mancini... Cù, Là, o vi siete addormentati sul divano o state tramando qualcosa!\"\
          ,\n  \"Che pace! Cù e Là in modalità relax assoluto. Godetevi questo momento prima che le micie chiedano la pappa!\"\
          ,\n  \"Silenzio perfetto in sala! O state leggendo, o Luna e Piccola vi hanno ipnotizzati per le coccole!\",\n \
          \ \"Interrompo il silenzio solo per dirvi: ottimo lavoro di relax a voi due. Meritato!\",\n  \"Nessuna lite per\
          \ il telecomando: regna la pace perfetta tra Cù e Là.\",\n  \"Troppo silenzio... le micie dormono, Cù e Pì si riposano.\
          \ Godetevi la pace!\"\n] | random }}"
      continue_on_error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.eco_home_ultimo_messaggio
      data:
        value: 'Relax di Coppia: Annuncio di quiete e sorrisi'
      continue_on_error: true
    - action: logbook.log
      data:
        name: Eco Home - Relax Coppia
        message: Battuta e momento di relax in sala annunciati su Nest Hub
        entity_id: automation.eco_home_momenti_di_relax_sorrisi_di_coppia_silenzio_in_sala
      continue_on_error: true
  mode: single
- id: standby_tablet_scenari_casa
  alias: 📱 Tablet - Standby per Cinema, Buonanotte & Fuori Casa
  description: Mette in standby lo schermo del tablet quando si attiva Cinema & Relax, Buonanotte o Fuori Casa
  triggers:
    - trigger: state
      entity_id: scene.cinema_relax
      not_to:
        - unavailable
        - unknown
      not_from:
        - unavailable
        - unknown
    - trigger: state
      entity_id: scene.buonanotte
      not_to:
        - unavailable
        - unknown
      not_from:
        - unavailable
        - unknown
    - trigger: state
      entity_id: switch.buonanotte
      to: 'on'
    - trigger: state
      entity_id: scene.fuori_casa
