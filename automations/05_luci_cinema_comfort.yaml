                  timeout: 00:01:30
                  continue_on_timeout: true
                - action: media_player.turn_off
                  target:
                    entity_id: media_player.nest_hub_cameretta
                  continue_on_error: true
            - sequence:
                - delay: 00:00:20
                - wait_for_trigger:
                    - trigger: state
                      entity_id: media_player.nest_hub_sala
                      to:
                        - idle
                        - 'off'
                      for:
                        seconds: 6
                  timeout: 00:01:30
                  continue_on_timeout: true
                - action: media_player.turn_off
                  target:
                    entity_id: media_player.nest_hub_sala
                  continue_on_error: true
        - sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.tutte_le_luci
                  - light.fzone_acquario
              continue_on_error: true
            - action: switch.turn_off
              target:
                entity_id: switch.ossigenatoreacquario
              continue_on_error: true
        - sequence:
            - action: script.standby_tablet
              continue_on_error: true
        - sequence:
            - action: script.chiusura_standard_tapparelle
              continue_on_error: true
        - sequence:
            - if:
                - condition: state
                  entity_id: media_player.sala_tv_sala
                  state: 'on'
              then:
                - action: media_player.turn_off
                  target:
                    entity_id: media_player.sala_tv_sala
                  continue_on_error: true
            - if:
                - condition: state
                  entity_id: media_player.tv_cameretta
                  state: 'on'
              then:
                - action: media_player.turn_off
                  target:
                    entity_id: media_player.tv_cameretta
                  continue_on_error: true
  mode: single
- id: buongiorno_sveglia_meteo_sarcastico
  alias: ☀️ Buongiorno - Sveglia Lavoro, Meteo Sarcastico & Allerte (Tutti i Dispositivi)
  description: Alle 07:00 dal lunedì al venerdì (o all'attivazione manuale dello scenario/switch Buongiorno), annuncia la
    sveglia breve e coincisa all'80% di volume su tutti i 3 Nest Hub (Camera, Cameretta, Sala) con giorno della settimana,
    meteo di oggi, orario di eventuale pioggia prevista nella giornata (solo se positiva), allerte asfalto bagnato o rischio
    ghiaccio (solo se positivi), ripristinando l'orologio sui Nest Hub al termine.
  triggers:
    - trigger: time
      at: 07:00:00
      id: orario_lavorativo
    - trigger: state
      entity_id: switch.buongiorno
      to: 'on'
      id: manuale
    - trigger: state
      entity_id: scene.buongiorno
      id: manuale
      not_to:
        - unavailable
        - unknown
      not_from:
        - unavailable
        - unknown
  conditions:
    - condition: state
      entity_id: input_boolean.eco_home_silenzioso
      state: 'off'
    - condition: or
      conditions:
        - condition: trigger
          id: manuale
        - condition: and
          conditions:
            - condition: trigger
              id: orario_lavorativo
            - condition: time
              weekday:
                - mon
                - tue
                - wed
                - thu
                - fri
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.ossigenatoreacquario
      continue_on_error: true
    - action: weather.get_forecasts
      target:
        entity_id:
          - weather.meteoam_home
          - weather.casa
      data:
        type: daily
      response_variable: meteo_daily
    - action: weather.get_forecasts
      target:
        entity_id:
          - weather.meteoam_home
          - weather.casa
      data:
        type: hourly
      response_variable: meteo_hourly
    - action: media_player.turn_on
      target:
        entity_id:
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
          - media_player.nest_hub_sala
      continue_on_error: true
    - action: media_player.volume_set
      target:
        entity_id:
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
          - media_player.nest_hub_sala
      data:
        volume_level: 0.8
      continue_on_error: true
    - delay:
        milliseconds: 800
    - action: tts.speak
      target:
        entity_id: tts.google_translate_it_lt
      data:
        media_player_entity_id:
          - media_player.nest_hub_camera
          - media_player.nest_hub_cameretta
          - media_player.nest_hub_sala
        language: it
        options:
          tld: it
        message: "... ... {% set giorni = [\"Lunedì\", \"Martedì\", \"Mercoledì\", \"Giovedì\", \"Venerdì\", \"Sabato\", \"\
          Domenica\"] %} {% set w = now().weekday() %} {% set giorno_settimana = giorni[w] %}\n{% set sveglia_intro = [\n\
          \  \"Buongiorno ragazzi, buon \" ~ giorno_settimana ~ \"!\",\n  \"Buongiorno Pì e Cù! Buon \" ~ giorno_settimana\
          \ ~ \".\",\n  \"Sveglia! Buon \" ~ giorno_settimana ~ \".\",\n  \"Buongiorno Pì e Cù. È \" ~ giorno_settimana ~\
          \ \".\",\n  giorno_settimana ~ \". Si parte.\",\n  \"Buongiorno Pì e Cù. Buon \" ~ giorno_settimana ~ \"!\",\n \
          \ \"Su su, buon \" ~ giorno_settimana ~ \"!\",\n  \"Buongiorno Tesoro e Ste. Buon \" ~ giorno_settimana ~ \".\"\n\
          ] | random %}\n{# --- NOTA SUL LAVORO/PROGRAMMA GIORNALIERO --- #} {% set nota_giorno = \"\" %} {% if w == 3 %}\n\
          \  {% set nota_giorno = [\n    \"Promemoria giovedì: per Cù mezza giornata lavorativa! Pomeriggio negozio chiuso\
          \ e riposo.\",\n    \"Ricordatevi che oggi è giovedì: Ste stacca all'una ed ha il pomeriggio libero. Pì tieni duro!\"\
          ,\n    \"Buon giovedì: Ste, oggi pomeriggio relax e ricarica batterie in vista di venerdì e sabato.\",\n    \"Oggi\
          \ è giovedì: turno mattutino per Cù, poi pomeriggio di riposo per chiusura negozio.\"\n  ] | random %}\n{% elif\
          \ w == 4 %}\n  {% set nota_giorno = [\n    \"Venerdì arrivato! Pì da stasera sei libera per tutto il weekend. Ste,\
          \ tieni duro che per te c'è il sabato.\",\n    \"È venerdì: ultimo sforzo per Pì prima del meritato weekend. Cù,\
          \ domani ti tocca il sabato ma il traguardo è vicino.\",\n    \"Venerdì! Pì pregusta il sabato libero, Cù fai il\
          \ pieno di caffè anche per domani.\",\n    \"Venerdì mattina: Pì vede già il traguardo del fine settimana, Ste prepara\
          \ le energie per il sabato.\"\n  ] | random %}\n{% elif w == 5 %}\n  {% set nota_giorno = [\n    \"È sabato! Pì\
          \ dormi beata che non lavori. Cù, a te tocca lavorare: coraggio e buona produzione!\",\n    \"Buon sabato: Pì relax\
          \ e divano, Ste al lavoro. A ciascuno il suo!\",\n    \"Sabato mattina: Pì in vacanza e riposo, Cù in trincea a\
          \ lavorare. Forza Ste!\",\n    \"Sabato arrivato: Pì giornata tutta per te senza lavoro, Ste ultimo turno della\
          \ settimana!\"\n  ] | random %}\n{% elif w == 0 %}\n  {% set nota_giorno = [\n    \"Lunedì mattina: si ricomincia\
          \ la settimana. Coraggio Pì e Cù!\",\n    \"È lunedì: riattivare i neuroni e caffè doppio. Buona ripartenza a tutti\
          \ e due!\",\n    \"Nuova settimana al via: pronti alla carica ragazzi!\"\n  ] | random %}\n{% elif w == 1 %}\n \
          \ {% set nota_giorno = [\n    \"Martedì: la settimana è entrata nel vivo, buona giornata a entrambi!\",\n    \"\
          Buon martedì ragazzi, pedalare con grinta!\"\n  ] | random %}\n{% elif w == 2 %}\n  {% set nota_giorno = [\n   \
          \ \"Mercoledì: siamo a metà settimana, il weekend comincia a intravedersi!\",\n    \"Giro di boa del mercoledì:\
          \ coraggio ragazzi, la discesa si avvicina!\"\n  ] | random %}\n{% endif %}\n{# --- PREVISIONI: 1. Google Weather\
          \ (weather.casa), 2. Open-Meteo se presente, 3. MeteoAM, 4. Altri --- #} {% set fc_daily = (meteo_daily['weather.casa'].forecast\
          \ if 'weather.casa' in meteo_daily and meteo_daily['weather.casa'].forecast | length > 0\n  else (meteo_daily['weather.open_meteo'].forecast\
          \ if 'weather.open_meteo' in meteo_daily and meteo_daily['weather.open_meteo'].forecast | length > 0\n  else (meteo_daily['weather.meteoam_home'].forecast\
          \ if 'weather.meteoam_home' in meteo_daily and meteo_daily['weather.meteoam_home'].forecast | length > 0\n  else\
          \ (meteo_daily.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([])))))\
          \ %}\n\n{% set fc_hourly = (meteo_hourly['weather.casa'].forecast if 'weather.casa' in meteo_hourly and meteo_hourly['weather.casa'].forecast\
          \ | length > 0\n  else (meteo_hourly['weather.open_meteo'].forecast if 'weather.open_meteo' in meteo_hourly and\
          \ meteo_hourly['weather.open_meteo'].forecast | length > 0\n  else (meteo_hourly['weather.meteoam_home'].forecast\
          \ if 'weather.meteoam_home' in meteo_hourly and meteo_hourly['weather.meteoam_home'].forecast | length > 0\n  else\
          \ (meteo_hourly.values() | selectattr('forecast', 'defined') | map(attribute='forecast') | first | default([])))))\
          \ %}\n\n{% set today = fc_daily[0] if fc_daily | length > 0 else {} %} {% set t_max = (today.temperature | default(20))\
          \ | round(0) %} {% set cond = today.condition | default('sunny') %}\n{# --- TEMPERATURA ATTUALE ESTERNA: 1. Sensori\
          \ locali, 2. Google, 3. Open-Meteo, 4. MeteoAM --- #} {% set t_est = (states('sensor.eco_home_temperatura_esterna_prioritaria')\
          \ | float(states('sensor.casa_temperatura') | float(20))) | round(1) %}\n{# --- CONDIZIONE ATTUALE: 1. Sensori locali\
          \ (se pioggia), 2. Google, 3. Altri --- #} {% set is_raining_now = is_state('binary_sensor.eco_home_pioggia_rilevata',\
          \ 'on') %}\n{% set commento_meteo = \"\" %} {% if cond in ['sunny', 'clear-night'] %}\n  {% if t_max >= 28 %}\n\
          \    {% set commento_meteo = [\n      \"Oggi sole a picco e caldo estivo con massima di \" ~ t_max ~ \" gradi.\"\
          ,\n      \"Giornata caldissima e soleggiata: picco di \" ~ t_max ~ \" gradi.\",\n      \"Sole pieno oggi, massima\
          \ di \" ~ t_max ~ \" gradi. Preparatevi al caldo!\"\n    ] | random %}\n  {% else %}\n    {% set commento_meteo\
          \ = [\n      \"Oggi bel tempo con cielo sereno e massima di \" ~ t_max ~ \" gradi.\",\n      \"Giornata luminosa\
          \ e piacevole: sole e massima di \" ~ t_max ~ \" gradi.\",\n      \"Cielo limpido e sole: prevista massima di \"\
          \ ~ t_max ~ \" gradi.\"\n    ] | random %}\n  {% endif %}\n{% elif cond in ['partlycloudy', 'cloudy'] %}\n  {% set\
          \ commento_meteo = [\n    \"Oggi nuvoloso con massima di \" ~ t_max ~ \" gradi.\",\n    \"Cielo con nuvole sparse\
          \ e schiarite, temperatura fino a \" ~ t_max ~ \" gradi.\",\n    \"Tempo un po' coperto oggi, massima prevista di\
          \ \" ~ t_max ~ \" gradi.\"\n  ] | random %}\n{% elif cond in ['rainy', 'pouring', 'lightning', 'lightning-rainy']\
          \ %}\n  {% set commento_meteo = [\n    \"Oggi è prevista pioggia con massima di \" ~ t_max ~ \" gradi. Ricordatevi\
          \ l'ombrello!\",\n    \"Giornata bagnata oggi: precipitazioni e massima di \" ~ t_max ~ \" gradi.\",\n    \"Tempo\
          \ piovoso in arrivo oggi: massima di \" ~ t_max ~ \" gradi, occhio alla strada.\"\n  ] | random %}\n{% elif cond\
          \ in ['snowy', 'snowy-rainy'] %}\n  {% set commento_meteo = [\n    \"Oggi freddo pungente con fiocchi di neve e\
          \ massima di \" ~ t_max ~ \" gradi.\",\n    \"Attenzione alla neve oggi, massima di appena \" ~ t_max ~ \" gradi.\"\
          \n  ] | random %}\n{% else %}\n  {% set commento_meteo = [\n    \"Oggi tempo variabile con massima di \" ~ t_max\
          \ ~ \" gradi.\",\n    \"Previsioni variabili per oggi, termometro fino a \" ~ t_max ~ \" gradi.\"\n  ] | random\
          \ %}\n{% endif %}\n{# --- ORA PIOGGIA PREVISTA (soglia consistente: pioggia, rovesci o probabilità >=60% o mm >\
          \ 0.8) --- #} {% set ns_pioggia = namespace(ora=none, in_corso=is_raining_now) %} {% for h in fc_hourly %}\n  {%\
          \ set dt = as_local(as_datetime(h.datetime)) %}\n  {% if dt.date() == now().date() and dt >= now() - timedelta(minutes=30)\
          \ and ns_pioggia.ora is none %}\n    {% set is_rain = h.condition in ['pouring', 'lightning', 'lightning-rainy']\n\
          \       or (h.condition == 'rainy' and ((h.precipitation is defined and h.precipitation | float(0) >= 0.8) or (h.precipitation_probability\
          \ is defined and h.precipitation_probability | int(0) >= 60)))\n       or (h.precipitation is defined and h.precipitation\
          \ | float(0) >= 1.0)\n       or (h.precipitation_probability is defined and h.precipitation_probability | int(0)\
          \ >= 65) %}\n    {% if is_rain %}\n      {% set ns_pioggia.ora = dt.strftime('%H:%M') %}\n    {% endif %}\n  {%\
          \ endif %}\n{% endfor %}\n{% set commento_pioggia_oggi = \"\" %} {% if ns_pioggia.in_corso %}\n  {% set commento_pioggia_oggi\
          \ = [\n    \"Pioggia già in corso questa mattina.\",\n    \"Fuori sta già piovendo questa mattina.\",\n    \"Ombrelli\
          \ a portata di mano: sta già piovendo.\"\n  ] | random %}\n{% elif ns_pioggia.ora is not none %}\n  {% set commento_pioggia_oggi\
          \ = [\n    \"Possibile pioggia a partire dalle \" ~ ns_pioggia.ora ~ \".\",\n    \"Attenzione a possibili precipitazioni\
          \ verso le \" ~ ns_pioggia.ora ~ \".\",\n    \"Portate l'ombrello: pioggia prevista attorno alle \" ~ ns_pioggia.ora\
          \ ~ \".\"\n  ] | random %}\n{% endif %}\n{# --- PIOGGIA NOTTURNA DAI SENSORI LOCALI --- #} {% set pioggia_oggi_mm\
          \ = states('sensor.terrazza_pulvirometro_precipitazioni_oggi') %} {% set ha_piovuto_notte = pioggia_oggi_mm not\
          \ in ['unavailable', 'unknown', ''] and pioggia_oggi_mm | float(0) > 0.2 %} {% set commento_pioggia_notte = \"\"\
          \ %} {% if ha_piovuto_notte and not ns_pioggia.in_corso %}\n  {% set commento_pioggia_notte = [\n    \"Attenzione\
          \ all'asfalto bagnato per la pioggia caduta stanotte.\",\n    \"Ha piovuto durante la notte: asfalto bagnato per\
          \ strada, guidate con prudenza.\",\n    \"Strade bagnate stamattina per le precipitazioni notturne.\"\n  ] | random\
          \ %}\n{% endif %}\n{# --- RISCHIO GHIACCIO (solo se positivo) --- #} {% set t_min = (today.templow if today.templow\
          \ is defined else today.temperature | default(10)) | round(0) %} {% set rischio_ghiaccio = t_est <= 3.0 or t_min\
          \ <= 1.0 %} {% set commento_ghiaccio = \"\" %} {% if rischio_ghiaccio %}\n  {% set commento_ghiaccio = [\n    \"\
          Possibile ghiaccio sui parabrezza: fuori ci sono \" ~ t_est ~ \" gradi.\",\n    \"Attenzione al ghiaccio su strada\
          \ e vetri auto: temperatura esterna di \" ~ t_est ~ \" gradi.\",\n    \"Freddo intenso stamattina: \" ~ t_est ~\
          \ \" gradi fuori, occhio a possibili lastre di ghiaccio.\"\n  ] | random %}\n{% endif %}\n{% set saluto_finale =\
          \ [\n  \"Buona giornata!\",\n  \"Buona giornata a tutti e due!\",\n  \"Forza e coraggio, buona giornata!\",\n  \"\
          Buona giornata Pì, buona giornata Cù!\",\n  \"In bocca al lupo per la giornata ragazzi!\"\n] | random %} {% if w\
          \ == 5 %}\n  {% set saluto_finale = [\n    \"Buon lavoro a Ste, buon riposo a Pì!\",\n    \"Buon sabato a tutti\
          \ e due, chi a lavoro e chi a casa!\",\n    \"Pì goditi il sabato, Ste buona giornata di lavoro!\",\n    \"Buon\
          \ fine settimana a Pì e buon turno a Ste!\"\n  ] | random %}\n{% elif w == 3 %}\n  {% set saluto_finale = [\n  \
          \  \"Buon giovedì! Ste, ci vediamo a pranzo per il pomeriggio di riposo.\",\n    \"Buona giornata ragazzi, e buon\
          \ pomeriggio di riposo a Cù!\",\n    \"Buon giovedì a entrambi, con mezza giornata per Ste!\"\n  ] | random %}\n\
          {% endif %}\n{% set msg_parts = [sveglia_intro, nota_giorno, commento_meteo, commento_pioggia_oggi, commento_pioggia_notte,\
          \ commento_ghiaccio, saluto_finale] | select() | list %} {{ msg_parts | join(' ') }}"
    - parallel:
        - sequence:
            - delay: 00:00:15
            - wait_for_trigger:
                - trigger: state
                  entity_id: media_player.nest_hub_camera
                  to:
                    - idle
                    - 'off'
                  for:
                    seconds: 6
              timeout: 00:01:30
              continue_on_timeout: true
            - action: media_player.turn_off
              target:
                entity_id: media_player.nest_hub_camera
              continue_on_error: true
        - sequence:
            - delay: 00:00:15
            - wait_for_trigger:
                - trigger: state
                  entity_id: media_player.nest_hub_cameretta
                  to:
                    - idle
                    - 'off'
                  for:
                    seconds: 6
              timeout: 00:01:30
              continue_on_timeout: true
            - action: media_player.turn_off
              target:
                entity_id: media_player.nest_hub_cameretta
              continue_on_error: true
        - sequence:
            - delay: 00:00:15
            - wait_for_trigger:
                - trigger: state
                  entity_id: media_player.nest_hub_sala
                  to:
                    - idle
                    - 'off'
                  for:
                    seconds: 6
              timeout: 00:01:30
              continue_on_timeout: true
            - action: media_player.turn_off
              target:
                entity_id: media_player.nest_hub_sala
              continue_on_error: true
  mode: single
